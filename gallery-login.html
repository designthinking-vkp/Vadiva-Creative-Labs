<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin Login | Vadiva Creative Labs</title>
  <meta name="description" content="Secure internal administration sign-in for managing and publishing Vadiva event media, albums, and categories.">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/css/gallery-admin.css">
</head>
<body class="admin-body not-logged-in" style="background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;">

  <div class="admin-login-screen" id="adminLoginScreen" style="display:flex;">
    <div class="admin-login-card">
      <div class="login-header">
        <a href="gallery.html">
          <img src="assets/logo.png" alt="Vadiva Creative Labs Logo" class="login-brand-logo">
        </a>
        <span class="login-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Authorized Access Only
        </span>
        <h2 class="login-title">Admin Login</h2>
        <p class="login-subtitle">Sign in with your authorized credentials to manage events, media, and publishing.</p>
      </div>

      <!-- Error Alert -->
      <div class="login-error-alert" id="loginErrorAlert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="loginErrorMessage">Invalid User ID or Password.</span>
      </div>

      <!-- Login Form -->
      <form id="standaloneLoginForm">
        <div class="form-group">
          <label class="form-label" for="loginUserId">User ID or Email</label>
          <input type="text" id="loginUserId" name="username" class="form-control" placeholder="admin or admin@vadivacreativelabs.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-password-wrap">
            <input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" title="Show / Hide Password" aria-label="Toggle password visibility">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-options-row">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
            <input type="checkbox" id="loginRememberMe" checked style="width: 16px; height: 16px; accent-color: var(--admin-primary);">
            <span style="color: #475569; font-size: 0.82rem;">Remember Session</span>
          </label>
        </div>

        <button type="submit" class="btn-login-submit" id="btnAdminLoginSubmit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In to Admin Panel
        </button>
      </form>

      <!-- Credentials Helper Box -->
      <div class="login-credentials-helper">
        <div style="font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: #64748b; margin-bottom: 0.5rem; letter-spacing: 0.05em;">
          Authorized Team Credentials:
        </div>
        <div class="login-cred-row">
          <span>Super Admin:</span>
          <span><code>admin</code> / <code>VadivaAdmin@2026</code></span>
        </div>
        <div class="login-cred-row">
          <span>Editor:</span>
          <span><code>editor</code> / <code>VadivaEditor@2026</code></span>
        </div>
        
        <div class="quick-fill-btn-group">
          <button type="button" class="quick-fill-btn" onclick="fillStandaloneLogin('admin', 'VadivaAdmin@2026')">
            ⚡ Fill Super Admin
          </button>
          <button type="button" class="quick-fill-btn" onclick="fillStandaloneLogin('editor', 'VadivaEditor@2026')">
            ⚡ Fill Editor
          </button>
        </div>
      </div>

      <div class="login-footer-links">
        <a href="gallery.html">&larr; Return to Public Gallery</a>
      </div>
    </div>
  </div>

  <script src="assets/js/gallery-store.js"></script>
  <script>
    // If already logged in, redirect straight to gallery-admin.html
    const user = VadivaGalleryStore.getCurrentUser();
    if (user) {
      window.location.replace('gallery-admin.html');
    }

    const form = document.getElementById('standaloneLoginForm');
    const userIn = document.getElementById('loginUserId');
    const passIn = document.getElementById('loginPassword');
    const rememberMeIn = document.getElementById('loginRememberMe');
    const alertBox = document.getElementById('loginErrorAlert');
    const alertMsg = document.getElementById('loginErrorMessage');
    const togglePassBtn = document.getElementById('togglePasswordBtn');

    togglePassBtn.addEventListener('click', () => {
      const isPass = passIn.getAttribute('type') === 'password';
      passIn.setAttribute('type', isPass ? 'text' : 'password');
      togglePassBtn.style.color = isPass ? 'var(--admin-primary)' : '#94a3b8';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      alertBox.classList.remove('shake');

      const ident = userIn.value.trim();
      const pass = passIn.value.trim();
      const remember = rememberMeIn.checked;

      const res = VadivaGalleryStore.login(ident, pass, remember);
      if (res.success) {
        window.location.replace('gallery-admin.html');
      } else {
        alertMsg.textContent = res.message || 'Invalid User ID or Password.';
        alertBox.style.display = 'flex';
        alertBox.classList.add('shake');
      }
    });

    function fillStandaloneLogin(user, pass) {
      userIn.value = user;
      passIn.value = pass;
      alertBox.style.display = 'none';
    }
  </script>
</body>
</html>
