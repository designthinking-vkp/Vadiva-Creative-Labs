<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Vadiva Tech Fest 3.0</title>
  <meta name="description" content="Sign in to your Vadiva Tech Fest 3.0 participant account using your User ID and Password.">
  <link rel="icon" type="image/png" href="../../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../assets/techfest-theme.css">
  <style>
    /* ── Login Page Styles (prefix: lgn-) ── */
    .lgn-page {
      background: transparent !important;
      min-height: 80vh;
      padding: 4rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }
    .lgn-card {
      background: rgba(255, 255, 255, 0.82) !important;
      backdrop-filter: blur(24px) !important;
      -webkit-backdrop-filter: blur(24px) !important;
      border: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: var(--glass-radius-lg, 20px) !important;
      box-shadow: 0 16px 48px 0 rgba(7, 25, 33, 0.14) !important;
      padding: 3rem 2.25rem;
      width: 100%;
      max-width: 440px;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .lgn-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .lgn-brand img {
      height: 56px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(12, 60, 76, 0.15));
      margin-bottom: 0.5rem;
    }
    .lgn-brand h1 {
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--tf-deep, #0c3c4c);
      margin: 0.25rem 0;
    }
    .lgn-brand p {
      color: var(--tf-muted, #64748b);
      font-size: 0.88rem;
      margin: 0;
    }
    .lgn-form-group {
      margin-bottom: 1.35rem;
    }
    .lgn-form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--tf-text, #1e293b);
      margin-bottom: 0.45rem;
    }
    .lgn-input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid rgba(12, 184, 192, 0.22) !important;
      border-radius: 10px;
      font-size: 0.95rem;
      color: var(--tf-text, #1e293b);
      font-family: var(--font-body, 'Inter', sans-serif);
      background: rgba(255, 255, 255, 0.9) !important;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
    }
    .lgn-input:focus {
      border-color: var(--tf-teal, #0cb8c0) !important;
      box-shadow: 0 0 0 3px rgba(12, 184, 192, 0.15) !important;
      background: #ffffff !important;
    }
    .lgn-pwd-wrapper {
      position: relative;
    }
    .lgn-toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--tf-muted, #64748b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .lgn-btn {
      width: 100%;
      height: 48px;
      background: var(--tf-coral, #ef4444) !important;
      color: #fff !important;
      border: none;
      font-family: var(--font-heading, 'Outfit', sans-serif);
      font-size: 1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.25) !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 0.75rem;
    }
    .lgn-btn:hover {
      background: #d63d3d !important;
      transform: translateY(-1.5px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35) !important;
    }
    .lgn-btn:disabled {
      background: #94a3b8 !important;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .lgn-alert {
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      display: none;
    }
    .lgn-alert.show { display: block; }
    .lgn-alert.success { background: rgba(16, 185, 129, 0.1) !important; color: #059669 !important; border: 1.5px solid rgba(16, 185, 129, 0.3) !important; }
    .lgn-alert.error   { background: rgba(239, 68, 68, 0.1) !important; color: #dc2626 !important; border: 1.5px solid rgba(239, 68, 68, 0.3) !important; }
    .lgn-footer-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.86rem;
      color: var(--tf-muted, #64748b);
    }
    .lgn-footer-link a { color: var(--tf-teal, #0cb8c0); font-weight: 700; text-decoration: none; }
    .lgn-footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body class="techfest-theme bg-dark-atmosphere">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-container">
      <div class="logo">
        <a href="../../index.html">
          <img src="../../assets/Vadiva-Tech-Fest-Logo.png" alt="Vadiva Tech &amp; Design Fest Logo" style="height: 38px; width: auto; display: block;" onerror="this.onerror=null; this.src='../assets/Vadiva-Tech-Fest-Logo.png';">
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="../../index.html">Home</a></li>
          <li><a href="../workshops/index.html">Workshops</a></li>
          <li><a href="../dashboard/index.html">Dashboard</a></li>
          <li><a href="../register/index.html">Register</a></li>
        </ul>
      </nav>
      <div class="header-action">
        <a href="../register/index.html" class="btn btn-sm btn-primary header-cta">Register Now</a>
      </div>
    </div>
  </header>

  <!-- Login Card -->
  <div class="lgn-page">
    <div class="lgn-card">
      <div class="lgn-brand">
        <img src="../../assets/Vadiva-Tech-Fest-Logo.png" alt="Vadiva Tech Fest Logo" onerror="this.onerror=null; this.src='../assets/Vadiva-Tech-Fest-Logo.png';">
        <h1>Participant Sign In</h1>
        <p>Log in using your User ID and Password</p>
      </div>

      <div class="lgn-alert" id="lgn-alert"></div>

      <form id="lgn-form" novalidate>
        <div class="lgn-form-group">
          <label for="login_id">User ID / Mobile / Email</label>
          <input type="text" id="login_id" class="lgn-input" placeholder="Enter your User ID" required autocomplete="username">
        </div>

        <div class="lgn-form-group">
          <label for="password">Password</label>
          <div class="lgn-pwd-wrapper">
            <input type="password" id="password" class="lgn-input" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="lgn-toggle-pwd" id="toggle-pwd" aria-label="Show/Hide Password">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="lgn-btn" id="btn-login">
          <span>Log In &rarr;</span>
        </button>
      </form>

      <div class="lgn-footer-link">
        New participant? <a href="../register/index.html">Create Participant Account &rarr;</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Vadiva Creative Labs. All rights reserved. &middot; Vadiva Tech Fest 3.0</p>
      </div>
    </div>
  </footer>

  <script src="../../main.js"></script>
  <script src="../../assets/techfest-core.js"></script>
  <script>
    const API = '../../techfest-api/auth.php';

    function showAlert(msg, type) {
      const el = document.getElementById('lgn-alert');
      el.textContent = msg;
      el.className = 'lgn-alert show ' + type;
    }
    function hideAlert() {
      document.getElementById('lgn-alert').className = 'lgn-alert';
    }

    // Toggle password visibility
    document.getElementById('toggle-pwd').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
      } else {
        pwd.type = 'password';
        icon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    });

    document.getElementById('lgn-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideAlert();

      const loginId  = document.getElementById('login_id').value.trim();
      const password = document.getElementById('password').value;

      if (!loginId || !password) {
        showAlert('Please enter both User ID and Password.', 'error');
        return;
      }

      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = 'Logging in…';

      try {
        const res = await fetch(API + '?action=login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: loginId, password: password })
        });
        const data = await res.json();

        if (data.success) {
          showAlert('Login successful! Redirecting…', 'success');
          
          localStorage.setItem('tf_user_id', data.data.user_id);
          localStorage.setItem('tf_token', data.data.token);
          localStorage.setItem('tf_participant_id', data.data.participant_id);
          localStorage.setItem('tf_user_name', data.data.name);
          localStorage.setItem('tf_tier', data.data.tier || 'OTHER');
          localStorage.setItem('tf_band', data.data.band || 'JUNIOR');
          localStorage.setItem('tf_entry_paid', (data.data.entry_status === 'PAID') ? 'true' : 'false');

          setTimeout(() => {
            if (!data.data.has_participant_profile) {
              window.location.href = '../register/index.html';
            } else if (data.data.entry_status !== 'PAID') {
              window.location.href = '../register/index.html';
            } else {
              window.location.href = '../dashboard/index.html';
            }
          }, 800);
        } else {
          showAlert(data.message || 'Invalid User ID or Password.', 'error');
          btn.disabled = false;
          btn.innerHTML = '<span>Log In &rarr;</span>';
        }
      } catch (err) {
        showAlert('Network error during login. Please try again.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Log In &rarr;</span>';
      }
    });
  </script>
</body>
</html>
