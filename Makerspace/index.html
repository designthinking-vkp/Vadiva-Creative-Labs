ng connections: B right edge → C left, C right → D left, D right → A left (closing the square).","Step 4 (6 min): Assemble all 4 panels into a closed square. Test: can it be assembled and disassembled 3 times without the joints loosening?","Facilitator: are the dovetails actually wider at the tip? Many students cut them as regular rectangles — check before the test."]},{"n":"Test — The Racking Test","m":7,"t":"test","s":["With the 4-panel square assembled on the table, push the top edge sideways. Does the square resist racking?","Turn it upside down. Does the structure hold together with gravity pulling the tabs away from the slots?","Disassemble and reassemble 3 times. Does the joint quality degrade?","Ask: 'In the Tamil fort, which walls would need the strongest connections? The outer wall corners? The gate opening? The tower bases?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Students disassemble their square and store the 4 panels together, tab-slot matched pairs clearly identified.","Facilitator: 'You designed a joint today. Not a pre-designed joint from a kit — your own dovetail geometry. That is what a structural engineer does. In Grade 6 you'll move from card to wood and use these same joint principles with real tools. Today was the first step.'"]}],"diff":{"sup":"Use simpler T-tab (rectangular, not dovetail) instead of dovetail. Still provides interlocking but is easier to cut accurately.","ext":"Design a 3D interlocking joint — a connection that locks in two perpendicular directions simultaneously."},"ass":"Does the dovetail tab actually widen toward the tip? Does the 4-panel square assemble and hold without glue? Does the racking test pass?","note":"The dovetail cut requires genuine precision — both angled cuts must converge toward the correct width at the tip. If many students struggle, slow down and do a second demo focusing specifically on the angle of the cuts."},{"w":3,"f":"Fort Wall Sections with Laser CNC Battlements","bi":"A battlement requires identical, evenly-spaced crenels cut to an exact depth. Mark one by hand — you get one. Cut 13 by hand — you get 13 slightly different crenels. Tell the laser cutter the dimensions once — you get 13 identical crenels in 90 seconds. Precision at scale is what machines are for.","obj":"Groups build a 60 cm fort wall section with laser CNC-cut crenellations — achieving perfectly even merlon and crenel spacing that a hand-cut wall cannot guarantee — plumb and standing without support.","dur":"60 minutes","grp":"Groups of 3","mat":["A2 cardboard (6 sheets per group)","Corrugated sheets (A2, 2 per group)","Laptop with LightBurn/xTool software","Laser CNC machine (school shared)","Hot-glue station","Ruler","Pencil","Scissors","Set square"],"voc":[["Battlement","The alternating raised (merlon) and lowered (crenel) top of a defensive wall"],["Merlon","The raised solid section of a battlement — a defender hides behind this"],["Crenel","The gap between two merlons — a defender shoots through this"],["Repeat pattern","A design element that appears multiple times at equal intervals — battlements, columns, and window rows are all repeat patterns. Machines produce repeat patterns without accumulated error; hand-cutting does not"]],"ph":[{"n":"Warm-Up — The Battlement as Engineering and the Problem of Repetition","m":7,"t":"intro","s":["Sketch a battlemented wall. Label merlon and crenel. Show a defender shooting through a crenel while protected by the merlon.","Ask: 'What is the structural weakness of a battlement compared to a plain wall?' (The crenels remove material at the top.)","Now show two physical examples side by side: a wall section with hand-cut crenels (uneven spacing, slightly different depths) and a laser-cut crenellated strip (perfectly even). Ask: 'Which fort wall looks more powerful? Which would a commander trust more?'","Guide: 'Battlements are a repeat pattern. Every merlon and crenel is supposed to be identical. When they are not, it signals careless construction — and in a fort, careless construction costs lives. The laser cutter produces perfect repeat patterns because it follows a digital in…","Today: groups design the battlement profile on the laptop, cut it on the laser, then build the wall section."]},{"n":"Laser CNC — Battlement Strip Design and Cut","m":12,"t":"demo","s":["Open the laser software. Create a rectangle: 60 cm wide × 8 cm tall (this is the battlement strip that will sit on top of the main wall).","Battlement dimensions: merlon = 5 cm wide, crenel = 3 cm wide. Pattern: merlon → crenel → merlon → ... Starting and ending with a half-merlon (2.5 cm) on each end for clean joins. Total: 7 full merlons + 6 crenels = 53 cm + 2 × 2.5 cm ends = 58 cm (close enough for a 60 cm wall).","In the laser software: create one merlon-crenel unit (5 cm + 3 cm = 8 cm wide, 8 cm tall, with a 3 cm wide × 4 cm deep rectangular cutout for the crenel). Array it 6 times across the 60 cm strip.","One designated student as Laser Operator. Ventilation fan confirmed running. All others 0.5 m back.","Laser cuts the 60 cm battlement strip from corrugated card in approximately 90 seconds.","After cut: remove strip. Confirm all 6 crenel cuts are clean and equal. Compare directly to a hand-cut example — the difference in consistency is immediately visible."]},{"n":"Build Challenge — 60 cm Battlemented Wall","m":26,"t":"build","s":["Step 1 (8 min): cut and glue the double-layer main wall body (60 × 20 cm) from A2 cardboard — two layers glued face-to-face for rigidity. Press flat and hold 60 seconds.","Step 2 (4 min): score and fold a 3 cm base tab along the bottom edge. Fold to 90° — this is how the wall stands.","Step 3 (6 min): glue the laser-cut battlement strip along the top edge of the main wall body. The strip adds the upper 8 cm of wall height including the crenellations. Align flush with the wall face. Clamp or hold for 60 seconds.","Step 4 (4 min): add internal triangular buttresses (small card triangles) at 20 cm intervals inside the wall to stiffen the base — a technique used in real Tamil fort walls.","Step 5 (4 min): stand the wall. Check plumb with set square.","Facilitator: compare this wall's battlement quality to a hand-cut attempt. The laser-cut version should show perfectly even merlons at a glance."]},{"n":"Test — Plumb, Spacing, and Structural Integrity","m":7,"t":"test","s":["Set square plumb test: is the wall vertical within 3°?","Spacing consistency test: measure 3 random merlons with a ruler. Because they were laser-cut, all should be exactly 5.0 cm ± 0.1 mm — not ± 3 mm as with hand cutting. Verify this.","Push test: push the wall gently from one end. Does it hold shape?","Peer comparison: hold this wall next to a hand-cut example (if available). Which is more consistent? By how much?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Wall sections stored flat.","Facilitator: 'The walls of Vellore Fort, Gingee Fort, and Dhanauskodi Fort were built by masons who cut each merlon and crenel by hand — and they were remarkably consistent because they worked from a stone template. Your laser cutter is today's template: a digital instruction tha…"]}],"diff":{"sup":"Facilitator pre-prepares the laser file. Student runs the cut (Laser Operator role), then focuses on wall assembly and the plumb check.","ext":"Modify the battlement design in the laser software: add arrow slits (narrow vertical rectangles cut into the merlon face below the crenel depth). Explain what this adds functionally and structurally."},"ass":"Are all laser-cut merlons within ±0.1 mm of target width (ruler measure)? Is the wall plumb within 3°? Does the double-layer wall resist lateral push?","note":"The laser file for the battlement strip should be prepared and test-cut on a scrap before the session. Corrugated card cuts cleanly at low power (35–45%) and medium speed (25–35 mm/s) — this avoids scorching the surface. The arrayed pattern approach (one unit × 6 repetitions) is the key lesson: show…"},{"w":4,"f":"Corner Tower Structure","bi":"A tower at a corner does two things: it strengthens the most vulnerable point of the wall (where two panels meet) and it gives defenders an angle of view along both walls simultaneously.","obj":"Each student builds a cylindrical corner tower that connects cleanly to two wall sections and stands 35 cm tall.","dur":"60 minutes","grp":"Individual","mat":["Corrugated sheets (A2, 2 per student)","Paper tubes (2 per student, 30 cm each)","A4 cardboard","Hot-glue station","Ruler, scissors, pencil","Compass or circular template"],"voc":[["Bastion","A tower or angled projection from a fort wall — creates overlapping fields of fire along the wall face"],["Cylinder","The most efficient cross-section for a tower — equal stiffness in all directions, no weak corners"],["Connection plate","A flat flange or plate on the base of a tower that attaches it to the wall and distributes the connection force over a larger area"]],"ph":[{"n":"Warm-Up — Why Cylinders for Towers?","m":7,"t":"intro","s":["Ask: 'Why are most fort towers cylindrical rather than rectangular?' Let students brainstorm.","Key answers: (1) A cylinder has no corners — corners are structurally weak, they concentrate stress. (2) A cylinder is equally strong in every direction — a rectangular tower has a weak axis. (3) Projectiles (arrows, stones) ricochet off a curved surface more than a flat one.","Show sketches of cylindrical towers at Gingee Fort (Tamil Nadu). The towers are tall, circular, and placed exactly at wall corners.","Today's challenge: a cylindrical tower 35 cm tall that connects to 2 wall sections at 90° to each other."]},{"n":"Skill Demo — Building a Corrugated Cylinder","m":10,"t":"demo","s":["Take an A2 corrugated sheet. Roll it along the CORRUGATION direction (perpendicular to the flutes) — this gives a cylinder with natural stiffness from the corrugation.","Target diameter: 8–10 cm. Roll the sheet into a cylinder and tape the overlap to hold the shape temporarily.","Check roundness: look down from the top — is it a circle, or oval? Adjust pressure to make it circular before gluing the seam.","Glue the seam with a line of hot glue along the inside of the overlap. Hold for 60 seconds.","Connection plates: cut 2 rectangular flat tabs from cardboard. Glue to the outside of the tower, 180° apart (at the front and back). These are the surfaces that attach to the wall sections.","Top cap: cut a circle, score radial lines from the centre, fold up the tabs to glue onto the inside rim of the top."]},{"n":"Build Challenge — Corner Tower","m":26,"t":"build","s":["Step 1 (8 min): Roll the corrugated cylinder to 8–10 cm diameter. Tape temporarily. Check roundness. Glue seam.","Step 2 (6 min): Cut and glue the top cap. Press firmly and hold.","Step 3 (6 min): Mark and glue 2 connection plates (3 × 8 cm flat tabs) at 90° to each other on the outside of the tower — these will align with the incoming wall sections.","Step 4 (6 min): Test the tower standing upright. Does it stand without rolling? If it rolls, add a flat base disc.","Facilitator: check that the two connection plates are genuinely at 90° to each other (set square check)."]},{"n":"Test — The Connection Test","m":9,"t":"test","s":["Students bring a wall section from Week 3. Place it against one connection plate — does it sit flat?","Test the second connection plate — does a second wall section sit flat at 90° to the first?","Push test: with both wall sections leaning against the tower, push the assembly gently. Does the tower brace the wall joint?","Ask: 'A real fort has 4 corners. How many towers does it need?' (4.) 'How many wall sections?' (4.) 'How many gates?' (At least 1.) — preview of Week 5."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers stored upright. Wall sections stored flat.","Facilitator: 'You built a bastion today. Medieval Tamil forts had bastions that housed cannon, archers, and sentinels. The cylinder gave the bastion its strength, the connection plates gave it its integration with the wall. Next week: the gate — the most complex and most importan…"]}],"diff":{"sup":"Use a pre-formed paper tube as the tower body. Student adds connection plates and top cap only.","ext":"Add internal spiral staircase rungs to the tower interior (small card shelves glued in a spiral pattern inside the cylinder)."},"ass":"Is the cylinder circular (not oval) in cross-section? Are the 2 connection plates at 90° to each other? Does the tower stand upright without support?","note":"Getting the cylinder truly round is the hardest part of this session. Before gluing, have students compare their cylinder top-down view with a circular template (traced from a tin or bottle cap). An oval tower won't look right and won't connect the walls cleanly."},{"w":5,"f":"Gate Arch and Frame","bi":"The gate is the most complex element of any fort — it must be strong (the walls converge here, creating maximum force), beautiful (it announces the fort's power), and functional (it must open).","obj":"Groups build an arched fort gateway: a structural arch, flanking gateposts, and a frame wall with the arch opening centred and clear for passage.","dur":"60 minutes","grp":"Groups of 3","mat":["A2 cardboard (4 sheets per group)","Corrugated sheet (A2, 2 per group)","Foam board (for arch former)","Hot-glue station","Ruler, pencil, scissors","Set square"],"voc":[["Gateway","The entrance structure of a fort — combines a wall section with an arch opening and flanking towers"],["Abutment","The mass of material on each side of an arch that resists its outward thrust"],["Flanking tower","A tower immediately beside the gate — defenders in the tower can cover the entrance arch with fire from above"]],"ph":[{"n":"Warm-Up — The Gate as Engineering Problem","m":7,"t":"intro","s":["Pose the problem: 'You must open a hole in a fort wall large enough for a cart to pass through. But the wall above the hole must continue to stand. How?'","Discuss student responses: lintel (a horizontal beam), arch (a curved self-supporting form), or corbelled lintel (projecting stones).","Show that the arch solves this problem most elegantly — it transfers load around the opening rather than spanning it.","Tamil fort gates: sketch the Arcot Fort main gateway — a pointed arch flanked by two circular bastions. Widely considered one of the finest Tamil fort gates."]},{"n":"Skill Demo — Gate Construction Method","m":10,"t":"demo","s":["Show the gate as 3 components: (1) left gatepost, (2) right gatepost, (3) arch panel spanning between them.","Gateposts: two wall sections (from Week 3) stood upright and parallel, 20 cm apart.","Arch panel: cut a panel the same width as the gate opening (20 cm + 2 × gatepost thickness). Score and cut a pointed arch opening (not round — Tamil fort gates typically use a pointed arch).","How to cut a pointed arch: mark the centre of the opening. Draw a vertical line. Mark two radii from each side of the base. The arch peaks at the centre mark.","Connect: attach the arch panel to the top of both gateposts using Makedo screws or hot glue."]},{"n":"Build Challenge — Arched Fort Gateway","m":26,"t":"build","s":["Groups build the complete gate assembly.","Step 1 (6 min): Set the two gatepost wall sections parallel, 20 cm apart. Confirm parallel using a ruler across both at top and bottom.","Step 2 (8 min): Cut the arch panel (full wall width including posts). Mark and cut the pointed arch opening. Clean edges.","Step 3 (6 min): Attach the arch panel to the top of both gateposts. Check the arch panel is level (ruler check) before gluing.","Step 4 (6 min): Reinforce the gatepost-to-arch connection with Makedo screws at each post corner.","Facilitator: is the arch opening centred? Is it tall enough for a 10 cm cardboard figure to pass through?"]},{"n":"Test — The Passage Test","m":9,"t":"test","s":["Test the gate opening: stand a 10 cm cardboard figure and walk it through the arch. Clear passage?","Load test: place 300 g on the arch panel. Does the arch span hold without sagging?","Structural check: are the gateposts parallel? (Measure top and bottom gap — should be equal.)","Ask: 'Which part of this gateway is under the most compressive stress?' (The arch keystone.) 'Which under the most tensile stress?' (The gatepost-to-arch connection joints.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Gateway stored as an assembly. Do not disassemble.","Facilitator: 'Every fort in Tamil Nadu that still stands today has a gate that is still open — stone arches built 600 years ago that are still carrying the weight above them. Compression-locked, as you know from Grade 3. The arch you built today uses the same principle.'"]}],"diff":{"sup":"Pre-mark the arch opening on the panel. Group cuts and assembles only.","ext":"Add flanking mini-towers (cylinders from Week 4 technique) on each side of the gateway."},"ass":"Is the arch opening centred? Do gateposts remain parallel? Does the arch panel hold 300 g? Can a figure pass through without obstruction?","note":"The pointed arch is harder to cut cleanly than a round arch — guide students to mark the peak point first, then each curve from the peak to the base corner. Cutting from the peak downward gives better control than cutting from the base up."},{"w":6,"f":"Drawbridge Mechanism with 3D-Printed Pivot Housing","bi":"A drawbridge is a moving structure — and moving structures must be designed for repeated use, not just one perfect position. The pivot is the most critical part: if it binds, the bridge jams. A 3D-printed housing holds the axle position exactly, giving the mechanism the reliability it needs.","obj":"Each pair builds a hinged drawbridge using a 3D-printed pivot housing as the rotation joint — achieving a smoother, more reliable mechanism than the Makedo screw pivot, raising and lowering cleanly 5 consecutive times.","dur":"60 minutes","grp":"Pairs","mat":["Gateway from Week 5","Cardboard (A3)","3D-printed pivot housing (PLA, printed before session — 2 per group: one per side of the drawbridge; small rectangular block with a 4 mm axle bore and 2 mounting holes)","M4 bolt (4 mm, 20 mm long) — the axle (2 per group)","String (1 m)","Paper clips","Ruler","Scissors","Pencil","Hot-glue station","Laptop showing Tinkercad design (reference)"],"voc":[["Drawbridge","A bridge across a moat or defensive gap that can be raised to deny access"],["Pivot housing","A component that holds the axle of a rotating joint in the correct position — prevents the axle from drifting sideways and keeps the rotation axis stable"],["Counterweight","A weight on the opposite side of a pivot from the load — reduces the force needed to lift the load. The heavier the counterweight, the less effort to raise the bridge"]],"ph":[{"n":"Warm-Up — The Pivot Problem and the 3D Solution","m":7,"t":"intro","s":["Show the gateway from Week 5 and last year's Makedo screw drawbridge. Demonstrate the problem: push the Makedo screw pivot hard — the screw can work loose, the deck wobbles off-axis, the mechanism jams.","Show the 3D-printed pivot housing on the laptop: a small block with a precisely located 4 mm bore. 'The bore is in exactly the right position — it never drifts. The bolt axle sits in it and rotates freely but stays exactly on the rotation axis.'","Ask: 'Why can't we drill a 4 mm hole in a cardboard block to do the same job?' (Card compresses when drilled, the hole enlarges, the axle wobbles.)","Today: the 3D-printed pivot housing replaces the Makedo screws. The mechanism becomes more reliable. This is the same principle used in every modern bridge hinge, every gate hinge, and the Grade 8 Pamban bascule pivot."]},{"n":"Skill Demo — Drawbridge with 3D-Printed Pivot","m":10,"t":"demo","s":["Mount the pivot housing: hot-glue one printed housing to the inner face of each gatepost at the gateway floor level. Position each housing flush with the inner face of the gateway opening — the axle bore faces inward.","Drawbridge deck: cut a cardboard panel to fit the gateway opening (20 cm wide × 15 cm long). Punch a 4.5 mm hole at each inner corner of the deck (slightly larger than the 4 mm bolt for clearance).","Install axle: thread the M4 bolt through the deck hole and into the pivot housing bore. The bolt head sits against the outer face of the deck. The bolt extends into the housing — this is the pivot axle.","Test rotation: does the deck rotate freely around the bolt axle from 0° (flat/bridge position) to 90° (raised/wall position)?","Raise mechanism: tie strings to the two outer corners of the deck. Thread upward through small holes in the arch panel. Pull → deck rises. Release → gravity lowers it.","Counterweight: fold a small card weight and tape to the inner end of the deck. Compare raise force with and without counterweight."]},{"n":"Build Challenge — The Drawbridge System","m":26,"t":"build","s":["Step 1 (5 min): hot-glue both 3D-printed pivot housings to the gateway gateposts at floor level. Hold each for 60 seconds — this joint carries the full load of the bridge deck.","Step 2 (5 min): cut the drawbridge deck (20 × 15 cm). Punch axle holes at both inner corners.","Step 3 (6 min): thread M4 bolt axles through the deck holes into the pivot housing bores. Check that the deck rotates freely without binding.","Step 4 (6 min): thread strings from outer deck corners through arch holes above. Tie off with enough length to fully raise the deck to 90°.","Step 5 (4 min): add counterweight to the inner end. Test full raise-lower cycle.","Facilitator: confirm both pivot housings are at the same height — a height difference means the deck tilts sideways when raised."]},{"n":"Test — The Raise and Lower Test","m":9,"t":"test","s":["Test 5 raise-and-lower cycles. Does the mechanism work consistently each time?","Load test: with drawbridge flat, place a 200 g weight on the deck. Does it hold without sagging?","Pivot quality test: push the deck sideways while it is flat — does the bolt axle stay in the pivot housing bore? (It should not wobble.)","Counterweight test: add and remove the counterweight. Is the raise noticeably easier with it? Record the difference in subjective effort.","Ask: 'If this were a real fort bridge, which part would wear out first?' (The pivot housing — the axle rubs against the bore. In a real bridge, this is a lubricated steel bearing.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Drawbridge left in the lowered position for storage. Bolt axles left in the housings.","Facilitator: 'You built a mechanism today with a 3D-printed pivot housing. The housing was designed in a computer, printed in plastic, and does one job: hold the axle in the correct position so the drawbridge can rotate reliably every time. In Grade 8 you will build a full Pamban…"]}],"diff":{"sup":"Pre-glue the pivot housings to the gateposts. Pair focuses on deck cutting, axle threading, string installation, and testing.","ext":"Open Tinkercad and redesign the pivot housing — add a top flange (a lip around the bore entrance) to prevent the bolt head from pulling through under load. Print the redesign if time allows."},"ass":"Does the drawbridge raise and lower 5 times without jamming? Does the bolt axle stay in the housing bore during the sideways push test? Does it hold 200 g when flat?","note":"Print 2 pivot housings per group (one per gatepost side) plus 2 spares for the class. PLA at standard settings is sufficient — the load is small. Housing dimensions: approximately 20 × 15 × 12 mm, 4.2 mm bore (0.2 mm clearance on the M4 bolt). The mounting face should be flat so it hot-glues cleanly…"},{"w":7,"f":"mBlock Basic Motion","bi":"Adding motion to a static structure is the beginning of mechanical engineering. The fort doesn't just stand — it acts.","obj":"Groups assemble and program an mBot to travel a straight line and activate the drawbridge opening sequence.","dur":"60 minutes","grp":"Groups of 4","mat":["mBot kit (1 per group)","USB cable / wireless dongle","Laptop or tablet with mBlock software","Fort gateway from Weeks 5–6","String for drawbridge connection"],"voc":[["Actuator","A component that creates motion — in mBot, the motors are the actuators"],["Trigger","A signal or event that starts a sequence — pressing a button triggers the drawbridge to open"],["Straight-line motion","Movement without turning — requires both motors to run at the same speed in the same direction"]],"ph":[{"n":"Warm-Up — What Can mBot Do?","m":7,"t":"intro","s":["Show a fully assembled mBot. Ask: 'What does this robot do well?' (Moves forward/backward, turns, senses distance.) 'What does it do poorly?' (Precise positioning, delicate tasks.)","Explain today's limited goal: 'We are NOT building an autonomous robot. We are using mBot to push a lever that activates our drawbridge. mBot is a support tool — the fort is the main project.'","Show the planned system: mBot moves forward → pushes a lever arm → lever arm pulls the drawbridge string → drawbridge rises.","This is a chain of mechanisms: motor → wheels → lever → string → drawbridge. One force triggers the next."]},{"n":"Skill Demo — mBot Assembly and Straight-Line Code","m":12,"t":"demo","s":["Show the mBot kit components. Assemble on the demo table (groups mirror the assembly).","Open mBlock on the laptop. Navigate to the block-based programming interface.","Build a simple straight-line program: [When green flag clicked] → [Set motor A speed 50] → [Set motor B speed 50] → [Wait 2 seconds] → [Stop all motors].","Test: does the mBot go straight? If it curves, adjust one motor speed slightly.","Show how to add a trigger: replace 'when green flag clicked' with 'when button pressed' — the mBot only moves when you press the onboard button."]},{"n":"Build Challenge — mBot Drawbridge Activator","m":26,"t":"build","s":["Groups assemble their mBot and program the straight-line motion.","Step 1 (8 min): Assemble mBot. Verify all connections. Test basic motion (forward, stop).","Step 2 (8 min): Build the lever arm: a cardboard lever attached to the fort gate structure, with one end in the path of the mBot and the other connected to the drawbridge string.","Step 3 (6 min): Program mBot: button pressed → move forward 20 cm at speed 40 → stop. Adjust speed until it consistently moves 20 cm.","Step 4 (4 min): Integrate: position mBot in front of the lever. Press button. Does the mBot push the lever and raise the drawbridge?","Facilitator: keep the coding to the bare minimum. If a group is stuck on code, help them. The mechanism is the learning, not the coding."]},{"n":"Test — The Activation Test","m":7,"t":"test","s":["Test 3 full cycles: press button → mBot moves → lever pushed → drawbridge rises.","Observe: is the mBot consistent? Does the drawbridge rise completely or only partially?","If inconsistent: is the problem in the mBot (inconsistent motor speed) or the lever (too stiff)?","Ask: 'If this was a real fort, would you trust this mechanism to open the gate in an emergency? What would you improve?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["mBots turned off, USB cables stored. Drawbridge returned to lowered position.","Facilitator: 'Today you connected the physical world (a drawbridge) to the programmed world (a robot). The joint between those two worlds is the lever — a purely mechanical object. In engineering, the smartest solution is almost always the mechanical one: fewer parts, fewer failu…"]}],"diff":{"sup":"Provide pre-written mBlock code. Group focuses on mechanical integration only (lever arm and string connection).","ext":"Add a second motion: after the drawbridge rises, mBot reverses and the drawbridge lowers. A full open/close cycle."},"ass":"Does mBot move in a straight line consistently? Does the lever arm connect mBot motion to drawbridge motion? Does the drawbridge rise during the activation test?","note":"The mBlock coding is intentionally minimal — resist the urge to teach full programming here. The lesson is about mechanical integration, not programming. If a group's code isn't working after 5 minutes, give them a working code snippet and move on."},{"w":8,"f":"Inner Fort Buildings","bi":"A fort is not just a wall — it is a small city inside a defensive perimeter. Everything inside must fit within the spatial constraints the walls create.","obj":"Groups design and build barracks and an armoury that fit inside the perimeter walls of the Tamil Fort.","dur":"60 minutes","grp":"Groups of 3","mat":["All fort components built so far","A2 cardboard (3 sheets per group)","Hot-glue station","Ruler, pencil, scissors","Floor plan sketch paper"],"voc":[["Spatial constraint","The limitation imposed by available space — the inner buildings must fit within the fort perimeter"],["Barracks","A building where soldiers sleep — long, narrow, with many small rooms"],["Armoury","A building where weapons and armour are stored — typically the most strongly built inner building"]],"ph":[{"n":"Warm-Up — Fort Interior Planning","m":8,"t":"intro","s":["Ask students to imagine they command the Tamil fort: 'Where do you put the barracks? (Near the walls — soldiers must reach the battlements quickly.) Where is the armoury? (Central — protected from attack from any direction.) Where is the well? (Centre — accessible to all.)'","Groups sketch a top-down floor plan of their fort interior on paper. They have 4 minutes to agree on a layout and sketch it.","Review: does the layout account for the gateway position? The watchtower position (Week 11)? Leave space for a central courtyard."]},{"n":"Skill Demo — Compact Interior Building","m":8,"t":"demo","s":["Interior buildings must be compact (they fit inside the fort). Build a barracks using the box-net technique from Grade 2 — but now at a larger scale.","Barracks: 20 × 8 cm footprint, 12 cm tall, pitched corrugated roof.","Armoury: 12 × 12 cm footprint, 14 cm tall, flat reinforced roof (the armoury stores heavy items — its roof must be the strongest).","Key principle: interior buildings do NOT need to be as structurally complex as the perimeter walls. They are sheltered within the fort. But the armoury roof must hold at least 500 g (it is the most load-critical interior building)."]},{"n":"Build Challenge — Barracks and Armoury","m":28,"t":"build","s":["Groups build their 2 inner buildings to fit the agreed floor plan layout.","Barracks (15 min): 3-room layout (long panel divided by 2 internal walls). Corrugated pitched roof. 4 windows per side.","Armoury (13 min): square plan. Reinforced flat roof (ribbed sandwich method). Heavy door (double-layer with Makedo hinges).","Facilitator: check the buildings against the floor plan sketch — do they fit in the agreed position without overlapping each other or the perimeter wall?"]},{"n":"Test — The Fit Test","m":8,"t":"test","s":["Place the barracks and armoury inside the fort perimeter wall layout (even if the full perimeter isn't built yet — lay out the wall sections around the buildings to check fit).","Armoury roof load test: place 500 g on the armoury roof. Does it hold?","Access test: can a cardboard figure reach the armoury door from the gateway? Is the access path clear?","Ask: 'Is there enough courtyard space remaining for the watchtower we'll build in Week 11?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Inner buildings stored inside the fort perimeter for transport.","Facilitator: 'Today you were architects, not just engineers — you designed a space for people to live and work in. Architecture asks: who uses this space, and what do they need? Engineering asks: will it stand? Great builders ask both questions simultaneously. You just did.'"]}],"diff":{"sup":"Reduce to one inner building (armoury only). Pre-cut all wall panels.","ext":"Add a third inner building: the fort commander's quarters (the largest and most ornate building inside a Tamil fort)."},"ass":"Do the barracks and armoury fit inside the fort perimeter without conflict? Does the armoury roof hold 500 g? Are inner buildings appropriately scaled to the fort?","note":"Students often build the inner buildings too large. Before building starts, have them cut a paper footprint of each building and place it inside the fort layout to check — then build."},{"w":9,"f":"Fort Wall Assembly Part 1","bi":"Assembly is the moment when individual parts become a system. It reveals every small error that individual building hid.","obj":"The class assembles the North and East perimeter walls of the Tamil Fort, connecting wall sections, towers, and the gateway into a continuous structure.","dur":"60 minutes","grp":"Whole class","mat":["All wall sections from Week 3","Corner towers from Week 4","Gateway from Weeks 5–6","Base board (large sheet of MDF or thick A0 cardboard)","Makedo kits","Hot-glue station","String line for alignment"],"voc":[["Perimeter","The outer boundary of the fort — the full length of all 4 walls combined"],["Assembly sequence","The order in which components are connected — wrong order can make later connections impossible"],["String line","A taut string used as a straight reference for aligning a row of panels"]],"ph":[{"n":"Warm-Up — Assembly Strategy","m":8,"t":"intro","s":["Lay all components on the floor or a large table: wall sections, corner towers, gateway.","Ask: 'In what order do we assemble these? Should we start with the towers or the walls?' Guide students to the correct answer: towers first (they set the corners), then walls fill in between.","Set the string line: stretch a string across the table to mark the North wall alignment. All North wall components will align to this line.","Divide the class: Team 1 — North wall, Team 2 — East wall. Each team has a tower at each end of their wall."]},{"n":"Assembly Phase 1 — Corner Towers and Wall Sections","m":32,"t":"build","s":["Step 1 (6 min): Place the 2 corner towers for the North wall at the two North corners. Glue base to baseboard.","Step 2 (10 min): Connect wall sections between the two North towers. Check alignment against the string line — all wall fronts should be on the line.","Step 3 (6 min): Place the 2 corner towers for the East wall. Ensure the shared corner tower (NE corner) is shared between both teams' walls.","Step 4 (10 min): Connect East wall sections between the NE and SE towers.","Facilitator: the shared NE corner tower is the critical element — it must be positioned exactly correctly for both walls to align."]},{"n":"Test — The Alignment Walk","m":8,"t":"test","s":["Walk along the outside of the assembled North wall. Is it straight? Any sections out of alignment?","Corner check: does the NE corner tower connect both the North and East walls cleanly?","Height consistency: are all wall sections the same height? Any gaps above or below the connection to the towers?","Document with a top-down photo."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Fort base stored carefully (it is now a large, heavy assembly).","Facilitator: 'Half the fort is standing. Two walls, two towers, all connected. Next week we close the fort — South and West walls — and then the gateway goes in. After that, we add the watchtower. You are building a Tamil fort. You are close.'"]}],"diff":{"sup":"Assign clear single-task roles: 'your job is to hold the tower while it is glued', 'your job is to check the string line alignment'.","ext":"Write a construction sequence card for the assembly — what order, what to check, what could go wrong."},"ass":"Are the North and East walls aligned to the string line? Is the NE corner tower shared correctly? Is the overall assembly level on the baseboard?","note":"This is a logistically complex session — multiple teams working simultaneously on adjacent walls. Position yourself at the NE corner where the two teams' work must connect. This is the most likely failure point."},{"w":10,"f":"Fort Wall Assembly Part 2","bi":"Closing the perimeter is the moment a collection of walls becomes a fort. The geometry locks together. Everything that was separate becomes one.","obj":"The class completes the South and West perimeter walls, installs the gateway in the front wall, and encloses the fort.","dur":"60 minutes","grp":"Whole class","mat":["Partial fort from Week 9","Remaining wall sections","Gateway assembly from Week 5","Inner buildings from Week 8","Makedo kits","Hot-glue station"],"voc":[["Perimeter closure","The moment when the outer wall forms a complete loop — no gaps, no open ends"],["Integration","Placing inner elements (buildings, towers) in final position within the completed perimeter"],["Datum","The reference point from which all final adjustments are measured"]],"ph":[{"n":"Warm-Up — The Closing Strategy","m":6,"t":"intro","s":["Review the fort plan on the whiteboard: North and East walls are built. Now we need South and West walls, and the gateway.","Key question: 'The gateway goes in the South wall. Where exactly? Centred? Offset to one side?' Let students decide — record the decision.","Divide the class: Team 1 — South wall (including gateway position), Team 2 — West wall, Team 3 — gateway installation, Team 4 — inner building placement."]},{"n":"Assembly Phase 2 — South, West Walls and Gateway","m":34,"t":"build","s":["Team 1 (South wall): place wall sections and the SW corner tower. Leave the gateway-width gap for Team 3.","Team 2 (West wall): place wall sections between the SW corner tower (shared with Team 1) and the NW corner tower (shared with North wall).","Team 3 (Gateway): install the gateway assembly in the South wall gap. Check: (a) same wall height as adjacent sections, (b) gateposts plumb, (c) drawbridge in lowered position.","Team 4 (Inner buildings): place barracks and armoury in their agreed floor plan positions inside the now-closing perimeter.","Facilitator: position at the SW corner — the joining point of South and West walls is the critical junction for this session."]},{"n":"Test — The Perimeter Walk","m":10,"t":"test","s":["Walk the full outer perimeter — all 4 sides. Is the wall continuous? Any gaps?","Can a card figure enter and exit only through the gateway? (No gaps in the walls that would allow bypassing the gate.)","Inner placement check: do the barracks and armoury sit correctly in their planned positions without obstructing access to any wall?","Full aerial view photo: take a top-down photograph of the complete fort layout."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["The fort is now fully enclosed. Treat it with great care from this point.","Facilitator: 'The fort is closed. The perimeter is complete. There are only two sessions remaining — the watchtower and the final presentation. The Tamil fort you have built is based directly on the design principles of Gingee Fort, Vellore Fort, and Thanjavur Fort. You have engi…"]}],"diff":{"sup":"Assign simpler connection tasks. The gateway installation is given to the most precise group.","ext":"Add a moat representation — a corrugated strip around the outer perimeter at ground level, painted blue."},"ass":"Is the perimeter fully closed? Is the gateway correctly installed (same height as walls, drawbridge operational)? Are inner buildings placed correctly?","note":"By this session, students are deeply invested in their fort. Manage energy carefully — excitement can lead to accidental damage to the assembled structure. Enforce the 'slow down around the fort' rule."},{"w":11,"f":"Watchtower Addition","bi":"The watchtower has a single purpose: see everything, be seen from everywhere. Its position, height, and structural integrity are all expressions of that one purpose.","obj":"Groups design and build a central watchtower 50 cm tall that is visible from all sides of the fort and stands in the centre of the courtyard.","dur":"60 minutes","grp":"Groups of 3","mat":["Completed fort from Week 10","A2 cardboard (2 sheets per group)","Paper tubes (2 per group)","Bamboo sticks (6 per group)","String","Hot-glue station","Ruler, scissors, pencil"],"voc":[["Watchtower","A tall structure designed to give defenders a high vantage point over the surrounding area"],["Slender ratio","The ratio of height to base width — a high slender ratio means the tower is tall and thin, requiring careful bracing"],["Observation platform","The floor platform at the top of the watchtower where sentinels stand"]],"ph":[{"n":"Warm-Up — The Watchtower Engineering Challenge","m":7,"t":"intro","s":["Ask: 'The watchtower must be 50 cm tall. The fort walls are 25 cm tall. How much of the watchtower is above the wall line?' (25 cm.)","Calculate the slender ratio: if the tower base is 10 × 10 cm and its height is 50 cm, the slender ratio is 5. 'What have you learned about tall, slender structures?' (They need bracing.)","Reference Grade 3: 'In Grade 3 you built a Gopuram using column-and-platform stacking. Today you apply the same principle — but taller and with more bracing.'","Key constraints: must be 50 cm tall, must stand in the centre of the courtyard, must have an observation platform at the top large enough for a 5 cm cardboard figure to stand on."]},{"n":"Skill Demo — Braced Watchtower Construction","m":10,"t":"demo","s":["Core structure: a central bamboo spine (50 cm tall) glued into a base disc. This is the primary vertical element.","Floors: 3 platform discs at heights 15 cm, 30 cm, and 50 cm. Each disc has a hole in the centre for the bamboo spine to pass through.","Outer frame: 4 bamboo columns from the base disc up to the 30 cm platform. These are the outer structural members.","Diagonal bracing: string or card diagonals between the outer columns and the bamboo spine at each level.","Observation platform: the top disc (50 cm level), reinforced with a circular card rail.","Show the completed demo tower: it is tall, slender, and remarkably stiff due to the spine + bracing combination."]},{"n":"Build Challenge — 50 cm Watchtower","m":26,"t":"build","s":["Groups build using the bamboo-spine-and-platform method.","Step 1 (6 min): Cut base disc (12 cm diameter). Cut bamboo spine to 52 cm. Glue spine into centre of base disc. Brace with 3 shorter bamboo struts.","Step 2 (8 min): Cut 3 platform discs. Thread onto bamboo spine at 15, 30, and 50 cm. Glue at each level.","Step 3 (8 min): Add 4 outer bamboo columns (cut to 32 cm — they reach from the base to the 30 cm platform). Glue at top and bottom.","Step 4 (4 min): Add string diagonal bracing between outer columns and central spine at each level.","Facilitator: check the central spine is truly vertical before any platforms are glued — lean at the base amplifies to 5× at the top."]},{"n":"Test — The Height and Stability Test","m":9,"t":"test","s":["Measure the tower. Does it reach 50 cm?","Stability test: push the top of the tower sideways with one finger. Does it spring back to vertical?","Platform test: place a small cardboard figure on the top platform. Does it stay without falling?","Place the watchtower inside the fort courtyard. Can it be seen from all 4 sides of the fort? Does it rise above the fort walls?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Watchtower placed inside the fort in its permanent position.","Facilitator: 'The watchtower is the most important military building inside a fort — and the most structurally demanding. 50 cm tall. 10 cm base. A slender ratio of 5. Braced with bamboo and string, the same materials Tamil soldiers used for scaffolding and defensive structures. …"]}],"diff":{"sup":"Pre-cut bamboo spine and outer column pieces. Group assembles the tower from prepared pieces.","ext":"Add a signal lamp (foil-wrapped paper tube) to the top of the watchtower — a beacon visible to the surrounding countryside."},"ass":"Does the tower reach 50 cm? Does it spring back after sideways push? Is it visible above the fort walls from all sides? Can a figure stand on the observation platform?","note":"The bamboo spine must be dead vertical before any further construction — everything else is built from it. Spend 2 minutes at the start of the build phase checking every group's spine with a ruler vertical check."},{"w":12,"f":"Surface Detailing","bi":"A finished structure has a surface. The surface tells you what material it is, how old it is, and who built it. Finishing is not cosmetic — it is communication.","obj":"Students apply stone-texture paint and surface details to all wall faces, adding visual coherence to the fort.","dur":"60 minutes","grp":"Individual (working on shared fort)","mat":["Completed fort from Week 11","Acrylic paint (stone grey, sandstone, terracotta)","Broad and fine brushes","Sponge scraps for texture","Black pen for mortar lines","Craft flags (cut from coloured paper and toothpicks)"],"voc":[["Texture","The surface quality of a material — rough stone, smooth plaster, rough brick all have distinct textures"],["Mortar line","The joint line between stone or brick blocks — usually painted a slightly lighter or darker tone than the blocks"],["Visual coherence","When all parts of a structure look as though they belong together — same colour palette, same texture treatment"]],"ph":[{"n":"Warm-Up — Reading Fort Surfaces","m":6,"t":"intro","s":["Show sketches of Tamil fort wall textures: roughly cut granite blocks with thin mortar lines, slightly uneven surface tone from weathering.","Ask: 'What paint technique could create the look of rough stone on smooth cardboard?'","Introduce sponge texturing: a torn sponge dipped in slightly diluted paint and dabbed onto the surface creates a mottled, stone-like texture instantly.","Introduce mortar lines: once the base coat is dry, draw horizontal and vertical lines with a fine black pen to represent mortar joints."]},{"n":"Skill Demo — Three Finishing Techniques","m":8,"t":"demo","s":["Technique 1 — Base coat: broad brush, light grey or sandstone. Cover all outer wall faces. Let dry 5 minutes.","Technique 2 — Sponge texture: dip torn sponge lightly in a slightly darker grey. Dab (not brush) across the surface. This creates depth and variation — no two sponge touches are identical.","Technique 3 — Mortar lines: use a fine-tip black pen and ruler. Draw horizontal lines every 3 cm. Draw vertical lines every 4 cm, offset every other row (running bond pattern). The result looks like stone masonry.","Show the flag: cut a small triangle from coloured paper. Glue to a toothpick. Press into the top of a merlon. 'Tamil forts flew banners on every merlon during ceremonies.'"]},{"n":"Build Challenge — Fort Surface Finishing","m":30,"t":"build","s":["Each student takes responsibility for one section of the fort exterior.","Step 1 (8 min): Apply base coat to their section. Work quickly — broad brushstrokes, full coverage.","Step 2 (10 min): Sponge texture over the base coat.","Step 3 (8 min): Mortar lines with pen and ruler. Focus on the wall face — do not add mortar lines to battlements (they would be too small).","Step 4 (4 min): Add flags to merlons in their section (one flag per merlon).","Facilitator: walk around the fort checking colour consistency — all sections should use the same colour palette."]},{"n":"Test — The Visual Coherence Check","m":8,"t":"test","s":["Stand back 2 metres. Does the fort look like one unified structure, or a patchwork of different styles?","Check: do the mortar lines align across the full wall section (not just within one student's area)?","Check: are the flags consistently placed (1 per merlon, same side of each merlon)?","Final preview: 'Next week is the last session — refinement and the fort presentation. Your Tamil fort is almost complete.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Brushes cleaned thoroughly. Sponges discarded.","Paint jars sealed. Fort left to dry — do not move until paint is fully dry.","Facilitator: 'The walls of Gingee Fort are made of granite. They have exactly the texture and mortar-line pattern you painted today — except they are real stone and 600 years old. You understood the visual logic of Tamil fort construction and applied it. That is architectural lit…"]}],"diff":{"sup":"Pre-apply the base coat. Student does sponge texture and flags only.","ext":"Paint the gateposts in a contrasting darker tone (in real Tamil forts, the gateway was often built from harder, darker stone — a structural and visual statement)."},"ass":"Is the colour palette consistent across all sections? Are mortar lines present and aligned? Are flags attached to merlons? Does the fort look visually unified?","note":"Mortar lines that are too frequent (every 1–2 cm) make the fort look like brick, not stone. Tamil fort stonework uses large irregular blocks — tell students that less frequent, slightly irregular lines look better."},{"w":13,"f":"Refinement","bi":"A fort is never finished by the builder — it is finished by the general who must rely on it in battle. Today the general inspects the fort.","obj":"The class performs a complete structural and aesthetic audit of the fort, addresses all weak points, and ensures every interactive element works reliably.","dur":"60 minutes","grp":"Whole class","mat":["Completed fort","Craft glue","Masking tape","Spare cardboard","Bamboo sticks","Spare paint","Flags"],"voc":[["Audit","A systematic, thorough inspection of a structure, system, or organisation"],["Snag list","A list of minor items that need fixing before a structure is considered complete — used in professional construction"],["Reliability","Whether a mechanism performs correctly every time it is operated — a drawbridge that works 8 times out of 10 is not reliable"]],"ph":[{"n":"Warm-Up — The General's Inspection","m":8,"t":"intro","s":["Role-play: 'Today I am the General who must defend this fort. I am inspecting it before the garrison moves in.' Adopt a formal, serious tone.","Walk around the fort with a clipboard (or piece of paper). Note: any wall not plumb, any tower leaning, any merlon missing, any inner building not standing, any surface unpainted.","Invite students to be your inspectors. Walk together. Call out issues. Write them on the board.","This becomes the class's snag list. Groups are assigned sections of the list to fix."]},{"n":"Refinement Phase — Fix Everything","m":30,"t":"build","s":["Divide the snag list into groups. Each group addresses their assigned items.","Structural fixes (glue, reinforce, plumb): address all leaning or loose elements.","Mechanism test (drawbridge + mBot): test 5 full cycles. Fix any string that has slipped or lever that is misaligned.","Surface fixes (missing paint, flags, mortar lines): address all visual gaps.","Watchtower check: plumb? Visible above walls? Figure on platform?","Facilitator: walk the snag list. Cross off items as they are completed. Keep momentum — every item must be addressed."]},{"n":"Test — The Snag-Clear Test","m":8,"t":"test","s":["Go through the complete snag list on the board. Is every item crossed off?","Final interactive test: drawbridge + mBot system — 5 full cycles without failure.","Walk the full perimeter one more time: no gaps, no leaning, no missing flags.","Measure the watchtower. Does it still reach 50 cm (it may have settled slightly)?"]},{"n":"Presentation Rehearsal","m":6,"t":"close","s":["Each group prepares their 90-second presentation for next week:","Group presents: (1) which part of the fort they built, (2) one engineering challenge they solved, (3) one connection to Tamil fort history.","Run one rehearsal round. Facilitator gives one piece of feedback to each group.","Preview: 'Next week: the Tamil Fort opens to the public. You will be its guides, its builders, and its engineers.'"]}],"diff":{"sup":"Assign 2–3 specific, achievable snag items. Student addresses those items only.","ext":"Write the full snag list in the format of a professional construction completion report, with each item, its fault description, the repair action taken, and a sign-off."},"ass":"Is the snag list fully addressed? Does the drawbridge mechanism work 5 consecutive times? Is the fort structurally and aesthetically complete?","note":"The snag list approach is a genuine professional technique — use the real terminology. Students should understand that every real construction project ends with a snag list, and no structure is considered complete until the list is empty."},{"w":14,"f":"Final Fort Presentation","bi":"A fort built in secrecy has no impact. A fort presented to an audience — examined, questioned, tested — becomes part of the community's story. That is its purpose.","obj":"Groups present the Tamil Fort to an invited audience, demonstrating engineering knowledge, heritage connection, and operational capability of all moving parts.","dur":"60 minutes","grp":"Groups of 3 + whole class","mat":["Completed Tamil Fort","Label cards for each structure","Load certificate cards","mBot and charging cable","Camera/phone for documentation","Presentation role cards"],"voc":[["Demonstration","Showing how something works in front of an audience — not just describing it, but activating it"],["Engineering heritage","The tradition of knowledge and craft that connects one generation of builders to the next"],["Commissioning","The formal testing and handover of a completed structure — the final professional milestone"]],"ph":[{"n":"Preparation — Final Labels and mBot Check","m":10,"t":"intro","s":["Students add label cards to all fort elements: Gate (name in Tamil and English), Watchtower, Barracks, Armoury, Corner Bastions.","mBot test: run 2 complete drawbridge activation cycles before the audience arrives. If any issue: fix now.","Rehearsal: each group runs through their 90-second presentation once more.","Audience invited to enter."]},{"n":"The Presentation — Fort Commissioning","m":22,"t":"build","s":["Facilitator opens: 'The Tamil fort before you was built over 14 weeks by [class name]. It is modelled on the defensive architecture of the Tamil Chola and Pandya kingdoms. Each group will now present the element of the fort they were responsible for.'","Group presentations in order: gateway group first (they begin with a live drawbridge demonstration), then East wall, North wall, West wall, inner buildings, watchtower.","After presentations: mBot activation demonstration — the full drawbridge open/close cycle in front of the audience."]},{"n":"Audience Interaction","m":10,"t":"test","s":["Audience members are invited to enter the fort through the gateway (by lowering the drawbridge).","Audience asks the class 3 questions. Class answers as a group — any student can contribute.","Audience nominates the most impressive engineering feature of the fort. Brief class discussion: do they agree?"]},{"n":"Reflection — The Builder's Circle","m":10,"t":"close","s":["Students stand in a circle around the fort (not in it).","Each student completes: 'In Grade 4 I learned that engineering means ___.'","Facilitator closes: 'You built a Tamil fort this year. You built modular walls, cylindrical towers, a working drawbridge, an mBot activation system, inner buildings, a watchtower, and a fully painted, flag-flying defensive perimeter. You are ready for Grade 5 — where everything y…"]}],"diff":{"sup":"Pre-write the student's line for the Builder's Circle. Student reads it.","ext":"Deliver a full 5-minute guided tour of the fort, comparing specific elements to their real counterparts in Tamil Nadu's historic forts with accurate historical details."},"ass":"Can each student explain their engineering contribution? Does the drawbridge mechanism work in front of the audience? Does the fort appear complete, stable, and presentable?","note":"The mBot activation demonstration in front of an audience is the highlight of the year — make it dramatic. Count down, announce it, and let the moment land. If it doesn't work first time, troubleshoot calmly — don't panic. Engineering includes public problem-solving."}],"g5lessons":[{"w":1,"f":"Foundation Systems","bi":"A tower is only as strong as the ground it stands on. Every failure that ever happened to a tall structure started at the foundation.","obj":"Groups build and compare three different foundation types under equal load and record which distributes weight most effectively.","dur":"60 minutes","grp":"Groups of 3","mat":["A3 cardboard (6 sheets per group)","Foam board scraps","Corrugated sheet","Steel ruler","Pencil","Safety scissors","500 g test weight","Soft modelling clay (small slab per group — simulates soft ground)"],"voc":[["Foundation","The lowest part of a structure — its job is to spread the load from the structure over the largest possible area of ground"],["Bearing pressure","The force per unit area that a foundation exerts on the ground — lower is better, because ground can only support a limited pressure before it yields"],["Spread footing","A wide flat foundation that distributes load over a large area — the most common foundation type for light structures"]],"ph":[{"n":"Warm-Up — The Soft Ground Problem","m":7,"t":"intro","s":["Press a pencil tip into a slab of modelling clay — it sinks easily. Now press your entire palm on the same clay — much less sinking.","Ask: 'What changed? The force from your hand is larger than the pencil — yet it sinks less. Why?' Guide students: the hand spreads the force over a much larger area. Less force per cm² = less sinking.","Introduce bearing pressure: force ÷ area = bearing pressure. Smaller area = higher pressure. Higher pressure = more sinking.","Connect to Tamil watch towers: 'Ancient Tamil watchtowers on the Deccan plateau stood on laterite rock — a hard, stable base. But watchtowers near rivers stood on soft alluvial soil. Those builders used wide stone spread footings to lower the bearing pressure. Some of those found…","Today's challenge: test 3 different foundation designs and identify which keeps a 500 g tower most stable."]},{"n":"Skill Demo — Three Foundation Types","m":10,"t":"demo","s":["Foundation A — Point footing: a single small square (5 × 5 cm) at the base of a tube. Small area, high bearing pressure.","Foundation B — Spread footing: a large flat plate (15 × 15 cm) attached to the base of the same tube. Large area, low bearing pressure.","Foundation C — Ribbed spread footing: same large plate as B, but with cardboard ribs glued underneath in a grid pattern — this stiffens the plate so it doesn't flex and concentrate load back to the centre.","Show all three on the clay slab. Ask students to predict which will sink least under 500 g before testing."]},{"n":"Build Challenge — Three Foundation Prototypes","m":26,"t":"build","s":["Each group of 3 builds all three foundation types — one student per foundation.","All three use the same tower tube (a 30 cm cardboard cylinder, pre-made or quickly rolled). Only the base changes.","Foundation A (8 min): cut a 5 × 5 cm base square. Glue tube to centre.","Foundation B (8 min): cut a 15 × 15 cm base plate. Glue tube to centre.","Foundation C (10 min): cut a 15 × 15 cm base plate. Glue 4 cardboard ribs underneath in a 2×2 grid pattern. Glue tube to centre.","Facilitator: ensure all 3 towers have the same tube length — any height difference invalidates the comparison."]},{"n":"Test — Sinking Comparison on Clay","m":9,"t":"test","s":["Place the soft clay slab on the table. Press it flat with a book.","Stand each tower on the clay and place 500 g on top. Measure the depth of sinking after 30 seconds.","Record: Foundation A sinking = ___ mm, Foundation B = ___ mm, Foundation C = ___ mm.","Calculate bearing pressure for A and B: 500 g ÷ base area (cm²). Which has the highest bearing pressure?","Discussion: 'Why did Foundation C sink less than B even though they have the same base area? What did the ribs do?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Foundation prototypes stored — they will be referenced during Week 7 watchtower base design.","Clay slab reformed and stored in a sealed bag.","Facilitator: 'The engineers who designed modern high-rise buildings in Chennai and Mumbai spend more money on foundations than on any other single building element. You just discovered why: the ground is the hardest engineering problem of all. Your watchtower will use the widest,…"]}],"diff":{"sup":"Reduce to 2 foundation types (B and C only). Pre-cut the base plates.","ext":"Design a 4th foundation type — a pile foundation (multiple narrow legs spread in a cluster rather than one wide plate). Test and compare."},"ass":"Are all 3 towers the same tube height? Is sinking depth measured accurately? Can the student explain why Foundation C performs better than B despite the same area?","note":"The clay slab must be consistently soft across all 3 tests — reform it to the same depth between tests. If the clay hardens over the session, add a few drops of water and knead it. The comparison is only valid if the ground condition is identical each time."},{"w":2,"f":"Triangulation Principles","bi":"Every structure you will ever build should contain as many triangles as possible. This is not a preference — it is physics.","obj":"Students build triangulated and non-triangulated panels, test their rigidity under side load, and articulate why triangles resist deformation.","dur":"60 minutes","grp":"Individual","mat":["Ice cream sticks (30 per student)","Craft glue","Ruler","Pencil","Cardboard base mat","200 g test weight","Paper clips"],"voc":[["Triangulation","Adding diagonal members to a rectangular frame to form triangles — the triangles resist shape change and make the structure rigid"],["Warren truss","A triangulated frame where triangles alternate pointing up and down — one of the most efficient structural forms per unit of material"],["Node","The point where structural members meet — the most critical point in any truss because all forces are transferred here"]],"ph":[{"n":"Warm-Up — The Racking Demonstration","m":7,"t":"intro","s":["Build a quick rectangle from 4 ice cream sticks, connected at corners with blobs of clay (not glue — so it racks freely). Push one corner sideways — it racks into a parallelogram instantly.","Ask students: 'If I can only add ONE stick, where do I add it to stop this racking?' Let students point to the diagonal.","Add the diagonal. Push again — rigid. Ask: 'Why does one diagonal stick make such a large difference?'","Guide: 'The diagonal converts two triangles from the rectangle. A triangle cannot change shape without changing the length of its sides. You cannot change the length of a stick. Therefore a triangulated frame cannot rack.'","Connect to Tamil watchtowers: 'The timber scaffolding used to build Tamil watchtowers was always triangulated. Any square frame section had a diagonal member — the builders knew empirically what you are about to prove mathematically.'"]},{"n":"Skill Demo — Building a Warren Truss Panel","m":10,"t":"demo","s":["Build a 6-panel Warren truss live: lay 2 parallel horizontal sticks (top and bottom chord), then alternate diagonal sticks between them forming a zigzag of triangles.","Show a clean node: glue joint at every intersection. Let each joint set for 5 seconds before moving to the next.","Compare: build a 6-panel rectangular frame (same length, no diagonals). Both are the same overall size.","Test side-by-side: press on the top chord of the rectangular frame — it racks. Press on the Warren truss — rigid.","Ask: 'How many triangles are in a 6-panel Warren truss?' (12 — alternating up and down.)"]},{"n":"Build Challenge — Comparison Set","m":26,"t":"build","s":["Each student builds 3 panels from ice cream sticks (all the same 20 cm × 6 cm overall size):","Panel A (7 min): Plain rectangular frame — 2 horizontal sticks, 3 vertical sticks. No diagonals.","Panel B (7 min): Single diagonal brace — same as A, but with one diagonal stick corner to corner.","Panel C (12 min): Full Warren truss — top chord, bottom chord, 6 alternating diagonal sticks. All nodes glued.","Wait for glue to set (use the waiting time to label each panel and sketch which triangles are in Panel C).","Facilitator: check that Warren truss nodes are all glued. A missing node glue joint means the truss isn't fully triangulated."]},{"n":"Test — Rigidity and Load","m":9,"t":"test","s":["Rigidity test: hold each panel at one end and push the free end sideways. Rate deformation: 1 (collapses easily) → 5 (no movement).","Load test: stand each panel upright on the cardboard mat. Place 200 g on the top chord. Which panel holds best?","Record in a table: Panel A, B, C — rigidity rating, load held (yes/no).","Ask: 'What would happen to a watchtower that had no triangulation in its frame? Which part would fail first?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["All 3 panels kept — they are evidence of the progression from unbraced to fully triangulated.","Facilitator: 'The Warren truss you built today is one of the most important structural inventions in history. It was first patented in 1848, but Tamil builders used triangulated timber frames at least 1,000 years earlier. The principle is not modern — it is ancient, and it is eve…"]}],"diff":{"sup":"Pre-glue the horizontal chords. Student adds only the diagonal members.","ext":"Calculate the theoretical load a Warren truss should carry vs the rectangular frame using the force diagram method (sketch force arrows at each node)."},"ass":"Are all 3 panels built to the same overall dimensions? Are all Warren truss nodes glued? Can the student explain in their own words why Panel C is strongest?","note":"Ice cream stick glue joints take 30–60 seconds to set properly. Students who rush past the setting time will have panels that fall apart during testing. Enforce the '5 second hold' rule at every joint. For faster working, white glue works but needs 2 minutes to set — hot glue at a station is faster …"},{"w":3,"f":"Bamboo Lashing","bi":"Before metal fasteners, every structure in the world was built with rope. Lashing is not a primitive technique — it is a highly engineered connection that is still used in scaffolding worldwide today.","obj":"Each group lashes 3 bamboo tripod structures and tests that each holds a 2 kg load for one minute.","dur":"60 minutes","grp":"Groups of 3","mat":["Bamboo sticks 30 cm (12 per group)","Natural twine or jute string (3 m per group)","Scissors","2 kg test weight (filled water bottle or bag of sand)","Ruler"],"voc":[["Lashing","A rope-based connection method that binds structural members together using a series of wrapping and frapping turns"],["Tripod","A 3-legged structure — the minimum number of legs needed to make a freestanding structure stable in all directions"],["Frapping turn","Wrapping the rope between the structural members (not around them) to tighten the entire lashing — the step that makes lashing rigid"]],"ph":[{"n":"Warm-Up — The Tripod Principle","m":7,"t":"intro","s":["Stand 2 bamboo sticks against each other like an inverted V — they fall sideways immediately.","Add a 3rd stick to form a tripod. They now stand unaided. Ask: 'Why does the 3rd stick make this work?'","Guide: 'A tripod distributes load in 3 directions. Any lateral force finds resistance in at least 2 of the 3 legs. With only 2 legs, there is no resistance to sideways forces — it can only fall toward the open side.'","Tamil watchtowers on the Deccan plateau were braced with bamboo tripod scaffolding structures during construction — and some smaller permanent watchtowers used bamboo tripod frames as their primary structure.","Today: build 3 lashed bamboo tripods that each hold 2 kg."]},{"n":"Skill Demo — The Square Lashing and the Shear Lashing","m":12,"t":"demo","s":["Square lashing (for crossing members at 90°): hold 2 sticks in a cross. Begin with a clove hitch on one stick. Wrap around both sticks in a square pattern (over-under alternating) 4 times. Take 3 frapping turns between the sticks. Finish with a clove hitch.","Show the untightened version vs the frapped version — the difference in rigidity is dramatic.","Shear lashing (for parallel members): wrap both sticks together in the same direction 6 times. Add 2 frapping turns between them. Finish with clove hitch.","Tripod lashing: lash 3 sticks together at the top using shear lashing. Spread the base ends apart — the lashing allows rotation at the top which lets the base legs spread to form the tripod.","Test the demo tripod: place 2 kg on the apex. Does it hold?"]},{"n":"Build Challenge — Three Lashed Tripods","m":26,"t":"build","s":["Groups build 3 tripods — each student is responsible for one.","Tripod 1 (8 min): basic tripod with shear lashing at the apex. Legs spread to 20 cm base diameter.","Tripod 2 (8 min): tripod with an additional cross-brace (a 4th stick lashed horizontally between 2 legs at mid-height — adds resistance to leg-spreading).","Tripod 3 (10 min): tripod with 2 cross-braces (at 1/3 and 2/3 height) — creates a proper braced column.","Facilitator circulates — check frapping turns are present. A lashing without frapping turns will slip under load."]},{"n":"Test — The 2 kg / 1 Minute Test","m":7,"t":"test","s":["Each tripod is tested with the 2 kg weight balanced on the apex for one minute.","Record: did it hold? Did any lashing slip? Did any leg splay outward?","Compare: which tripod was most stable — 1, 2 or 3? Does the cross-bracing make a measurable difference?","Ask: 'Which of these tripod types would you use as a leg of your watchtower? Why?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Tripods disassembled — bamboo and string returned to the materials store for reuse.","Facilitator: 'Bamboo lashing is still used in construction scaffolding in Hong Kong, Singapore, and across South and Southeast Asia — including Tamil Nadu. Modern engineers have calculated that well-lashed bamboo scaffolding can carry loads equivalent to welded steel scaffolding …"]}],"diff":{"sup":"Pre-make the first lashing and demonstrate the frapping turns slowly. Student repeats the sequence with guidance.","ext":"Research and demonstrate the diagonal lashing technique (for non-perpendicular crossing members). Compare its strength to square lashing at the same crossing angle."},"ass":"Does each tripod hold 2 kg for one minute? Are frapping turns present in every lashing? Can the student identify and correct a lashing that is slipping?","note":"The frapping turn is the critical step that nearly every student will skip the first time. Have students check each other's lashings before the load test — a missing frapping turn is immediately obvious when you look for it. Consider a peer-check rule: no tripod goes on test without a partner verify…"},{"w":4,"f":"Column Loading and Buckling","bi":"A column doesn't break — it buckles. Understanding buckling tells you exactly where to add material for maximum effect.","obj":"Students build card columns of varying thickness and systematically test their crushing load, recording results and explaining the relationship between cross-section and buckling resistance.","dur":"60 minutes","grp":"Individual","mat":["A4 card (8 sheets per student)","Ruler","Pencil","Scissors","Hot-glue station","Test weights (incremental: 100 g, 200 g, 500 g, 1 kg, 2 kg)","Graph paper for results"],"voc":[["Buckling","The sudden sideways failure of a slender column under compressive load — the column doesn't crush, it bends away to the side"],["Slenderness ratio","The height of a column divided by the smallest dimension of its cross-section — higher ratio = more likely to buckle"],["Second moment of area","A measure of how efficiently a cross-section resists bending — material far from the centre contributes much more than material near the centre"]],"ph":[{"n":"Warm-Up — Buckling Demonstration","m":7,"t":"intro","s":["Take a single A4 card. Roll it into a slim tube (2 cm diameter). Press from both ends — it buckles sideways dramatically at a low load.","Roll another A4 card into a thick tube (4 cm diameter). Press from both ends — it takes much more force before buckling.","Key question: 'Both tubes are made from the same sheet of card — the same amount of material. Why does the thick one resist buckling so much more?'","Guide: 'The thick tube has more material far from the centre. Material far from the centre resists bending much more effectively than the same material near the centre.'","Introduce slenderness ratio: 'The taller a column is relative to its thickness, the more likely it is to buckle. A slender column buckles at a much lower load than a stubby column of the same cross-section.'"]},{"n":"Skill Demo — Building Comparable Columns","m":8,"t":"demo","s":["Demonstrate how to make each column type from the same amount of card material (one A4 sheet per column). All columns are the same height (25 cm). Only the cross-section changes.","Column 1 — single tube: roll the full A4 sheet into a 2 cm diameter tube. Tape the seam.","Column 2 — double-wall tube: roll to 3 cm diameter, then insert a second card sleeve inside. Same material used, more efficiently arranged.","Column 3 — square tube: fold an A4 into a square cross-section (equal sides). The corners add stiffness in the axis-aligned directions.","Column 4 — circular thick tube: roll to 4 cm diameter with overlapping layers. Heavier but maximum cross-section.","Test protocol: place on flat surface, put a flat plate on top, add weights in order. Record load at first buckle."]},{"n":"Build Challenge — Four Column Types","m":26,"t":"build","s":["Each student builds all 4 column types — one A4 card per column, all 25 cm tall.","Column 1 (5 min): single roll, 2 cm diameter, tape seam.","Column 2 (6 min): double-wall — roll to 3 cm, insert inner sleeve, glue.","Column 3 (6 min): square tube — score and fold at 5 cm intervals across the A4 width, close the seam.","Column 4 (5 min): thick roll — roll to 4 cm diameter with a double wrap.","Facilitator: check all columns are 25 cm tall (±3 mm). Height consistency is essential for valid comparison.","While waiting for glue to set, students set up their results table on graph paper."]},{"n":"Test — Incremental Load to Failure","m":11,"t":"test","s":["Test each column in turn: add weights in 100 g increments. Record the load at first visible buckle.","Results table: Column 1, 2, 3, 4 — first buckle load (g), failure mode (buckle direction, crush, seam failure).","Plot results on graph: column type (x-axis) vs. first buckle load (y-axis).","Discussion: 'Which column type is best? Which is most efficient (best load per gram of material used)?'","Ask: 'What column type would you use for the legs of your watchtower? What slenderness ratio will you aim for?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Results graphs kept in student folders.","Columns (post-failure) can be disassembled and material reused.","Facilitator: 'Euler's buckling formula — the equation that predicts exactly when a column will buckle based on its height, cross-section, and material — was published in 1744. It is still used in every structural calculation for every steel column in every building today. You jus…"]}],"diff":{"sup":"Build 2 column types only (1 and 3). Focus on recording results and plotting the graph.","ext":"Calculate the theoretical slenderness ratio for each column and check whether it correlates with the measured buckling load."},"ass":"Are all 4 columns the same height (±3 mm)? Is the results table complete and accurate? Can the student explain which column type is most efficient and why?","note":"Load application must be careful — a sudden drop of the weight can cause dynamic loading that buckles a column prematurely. Teach students to place weights very gently, releasing slowly. A cardboard plate on top of the column distributes the load evenly across the end — without it, point loading wil…"},{"w":5,"f":"Cross-Bracing","bi":"A frame that can sway is not a tower — it is a hazard. Cross-bracing converts a flexible frame into a rigid structural system.","obj":"Groups apply cross-bracing to a 50 cm cardboard tower and demonstrate that the braced tower holds 500 g at the top without measurable sway.","dur":"60 minutes","grp":"Groups of 3","mat":["Pre-built 50 cm card towers from Week 4 (or new builds)","Bamboo sticks (10 per group)","String","A3 cardboard strips","Hot-glue station","Ruler","500 g test weight","Protractor"],"voc":[["Lateral load","A horizontal force acting on a structure — wind, earthquakes, and impact forces are all lateral loads"],["Sway","The horizontal displacement of the top of a structure under lateral load — minimised by bracing"],["Stiffness","The resistance of a structure to deformation under load — a stiff structure sways less than a flexible one under the same load"]],"ph":[{"n":"Warm-Up — The Sway Problem","m":7,"t":"intro","s":["Hold a pre-built 50 cm card tube tower upright. Push the top sideways gently with one finger. Measure the sway at the top.","Ask: 'A watchtower sentinel standing at the top of this tower would feel this sway every time the wind blew. How would you fix it?'","Discussion: students suggest braces, guy wires, widening the base.","Introduce: 'All of those work. Today we test which works best — and by how much — by measuring sway before and after.',","Tamil watchtowers: show a sketch of a watchtower with visible diagonal wooden bracing members. 'The diagonal members didn't just look strong — they solved the sway problem exactly.'"]},{"n":"Skill Demo — Three Bracing Methods","m":10,"t":"demo","s":["Method 1 — Card cross-brace: cut two cardboard strips and glue them in an X across one face of the tower.","Method 2 — Bamboo diagonal brace: a single bamboo stick glued from one bottom corner to the opposite top corner.","Method 3 — String guy wires: 4 strings from the top of the tower, angled out at 45° to anchor points at the base — like a tent.","Measure sway of the unbraced tower with a ruler at the top. Record.","Add Method 1 to one face. Re-measure sway. Record.","Add Method 2 to another face. Re-measure. Record.","Add Method 3. Re-measure. Record.","Which method reduced sway the most?"]},{"n":"Build Challenge — Brace a 50 cm Tower","m":26,"t":"build","s":["Groups build or retrieve their 50 cm tower.","Step 1 (5 min): Measure initial sway at the top of the tower using a ruler and gentle 1-finger push. Record as baseline.","Step 2 (8 min): Apply Method 2 (bamboo diagonal brace) to 2 opposite faces of the tower. Re-measure sway.","Step 3 (8 min): Apply Method 1 (card X-brace) to the remaining 2 faces. Re-measure sway.","Step 4 (5 min): Add string guy wires from the top if sway is still measurable after steps 2 and 3.","All measurements recorded in a table.","Facilitator: ensure braces are genuinely load-carrying (glued at both ends, under tension/compression). A brace glued only at one end adds nothing."]},{"n":"Test — The 500 g Top-Load Sway Test","m":9,"t":"test","s":["Place 500 g on top of the braced tower. Measure top sway.","Compare: unbraced sway vs fully braced sway under the same 500 g top load.","Calculate the % improvement: (unbraced sway − braced sway) ÷ unbraced sway × 100.","Class comparison: which group achieved the greatest % reduction in sway?","Ask: 'Is there a bracing method that would be even more effective? What would you add next?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers stored upright in the project area.","Facilitator: 'You just reduced a structure's sway by measuring, adding material, measuring again, and calculating the improvement. That is the complete engineering design loop: measure, change, measure, improve. Every civil engineer in the world works exactly that way. You worked…"]}],"diff":{"sup":"Pre-build the 50 cm tower. Group focuses on measuring, adding bracing, and recording results.","ext":"Calculate the theoretical stiffness improvement for each bracing method using the force-displacement equation (F = k × d, solving for stiffness k)."},"ass":"Are sway measurements taken at 3 stages (unbraced, partially braced, fully braced)? Is the % improvement calculated? Are all braces glued at both ends?","note":"Sway measurement requires a consistent method — mark the top of the tower with a pencil, hold a ruler beside it,
