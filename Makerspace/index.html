<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vadiva Creative Labs — Makerspace Pathway</title>
<style>
:root{--brand:#1A3A5C;--accent:#E8821A;--teal:#1B7A6E;--gold:#C9A227;--green:#1E8449;--purple:#6C3483;--ocean:#1A5276;--bg:#F2F4F7;--surface:#fff;--border:#DEE2E6;--text:#212529;--muted:#6C757D;--r:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5}
.hdr{background:var(--brand);color:#fff;padding:0 20px;display:flex;align-items:center;gap:14px;height:52px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.hdr h1{font-size:16px;font-weight:600}
.hdr .sub{font-size:11px;opacity:.65}
.nav-tabs{margin-left:auto;display:flex;gap:6px}
.ntab{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:16px;cursor:pointer;font-size:12px;transition:.15s}
.ntab:hover,.ntab.on{background:rgba(255,255,255,.25)}
.layout{display:flex;min-height:calc(100vh - 52px)}
.side{width:188px;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0;position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto}
.shead{padding:6px 14px 3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.gbtn{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:12px;color:var(--text);transition:.1s}
.gbtn:hover{background:var(--bg)}
.gbtn.on{background:#EBF2FA;color:var(--brand);font-weight:600;border-right:3px solid var(--brand)}
.gdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sdiv{height:1px;background:var(--border);margin:6px 14px}
.main{flex:1;padding:20px;overflow-x:hidden;min-width:0}
.hidden{display:none!important}

/* OVERVIEW */
.hero{background:var(--brand);color:#fff;border-radius:var(--r);padding:24px 28px;margin-bottom:18px}
.hero h2{font-size:20px;font-weight:600;margin-bottom:4px}
.hero p{opacity:.8;font-size:13px;max-width:580px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center}
.scard .n{font-size:26px;font-weight:700;color:var(--brand)}
.scard .l{font-size:11px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.4px}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.fcard{border-radius:var(--r);padding:12px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.fcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.fcard .gl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.fcard .gt{font-size:11px;font-weight:600;margin-bottom:2px}
.fcard .gs{font-size:10px;opacity:.75}
.mpills{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.mpill{font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600}
.stitle{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--brand);display:flex;align-items:center;gap:8px}
.stitle::after{content:'';flex:1;height:1px;background:var(--border)}

/* GRADE PAGE */
.ghdr{border-radius:var(--r);padding:18px 22px;margin-bottom:18px;color:#fff}
.ghdr h2{font-size:19px;font-weight:700;margin-bottom:3px}
.ghdr .meta{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.ghdr .mi{font-size:11px;opacity:.8}
.wgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
.wbtn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 5px;cursor:pointer;text-align:center;transition:.15s}
.wbtn:hover{border-color:var(--accent)}
.wbtn.on{color:#fff;border-color:transparent}
.wbtn .wn{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.wbtn .wt{font-size:9px;margin-top:2px;line-height:1.3}

/* LESSON PANEL */
.lpanel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.lhdr{padding:14px 18px;border-bottom:1px solid var(--border)}
.lhdr h3{font-size:15px;font-weight:600;margin-bottom:3px}
.bigidea{font-size:12px;color:#555;font-style:italic;margin:4px 0 8px;line-height:1.5;padding:8px 12px;background:#F8F9FA;border-left:3px solid var(--accent);border-radius:0 4px 4px 0}
.lmeta{display:flex;gap:8px;flex-wrap:wrap}
.mbadge{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.ltabs{display:flex;gap:0;border-bottom:1px solid var(--border);background:#F8F9FA;overflow-x:auto}
.ltab{padding:8px 14px;cursor:pointer;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:.15s}
.ltab:hover{color:var(--text)}
.ltab.on{color:var(--brand);border-bottom-color:var(--brand);background:var(--surface)}
.lbody{padding:16px 18px}

/* PHASES */
.phase-block{margin-bottom:12px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.phase-hdr{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;user-select:none;transition:.1s}
.phase-hdr:hover{background:#F8F9FA}
.phase-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.phase-name{font-weight:600;font-size:13px;flex:1}
.phase-mins{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:10px}
.phase-chev{font-size:11px;color:var(--muted);transition:.2s}
.phase-chev.open{transform:rotate(180deg)}
.phase-steps{padding:0 12px 10px 32px;display:none}
.phase-steps.open{display:block}
.step-item{padding:5px 0;border-bottom:1px solid #F0F0F0;font-size:12px;line-height:1.55;display:flex;gap:8px}
.step-item:last-child{border-bottom:none}
.step-num{font-size:10px;font-weight:700;color:var(--muted);min-width:16px;margin-top:2px}
.step-txt{flex:1;color:var(--text)}

/* VOCAB / MATERIALS */
.vtable{width:100%;border-collapse:collapse;font-size:12px}
.vtable th{text-align:left;padding:6px 8px;background:var(--bg);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.vtable td{padding:6px 8px;border-top:1px solid var(--border);vertical-align:top}
.vterm{font-weight:600;color:var(--purple)}
.mlist{columns:2;font-size:12px;list-style:none}
.mlist li{padding:2px 0 2px 12px;position:relative}
.mlist li::before{content:'•';position:absolute;left:0;color:var(--accent)}
.mlist li.dig{color:var(--purple)}
.mlist li.dig::before{color:var(--purple)}
.dbox{padding:10px 12px;border-radius:6px;font-size:12px;line-height:1.55}
.dlbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.nbox{background:#FEF9E7;border-left:3px solid var(--gold);padding:10px 13px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.6}
.assbox{background:#EBF2FA;border-left:3px solid var(--brand);padding:10px 13px;border-radius:0 6px 6px 0;font-size:12px;line-height:1.6;margin-bottom:10px}

/* PROCUREMENT */
.ptabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.ptab{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;transition:.15s}
.ptab:hover{border-color:var(--brand)}
.ptab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ptable{width:100%;border-collapse:collapse;font-size:12px}
.ptable th{background:var(--brand);color:#fff;padding:7px 11px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ptable td{padding:6px 11px;border-bottom:1px solid var(--border)}
.ptable tr:hover td{background:#F8F9FA}
.ptable .dig td{background:#F8F0FF}
.ptot{font-weight:700;color:var(--brand)}
.sbar{background:var(--brand);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:18px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.si .sv{font-size:20px;font-weight:700}
.si .sl{font-size:10px;opacity:.75;margin-top:1px}

/* CAPEX */
.cxcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.cxname{font-weight:600;font-size:13px;margin-bottom:3px}
.cxnote{font-size:11px;color:var(--muted);line-height:1.5}
.cxprice{font-size:19px;font-weight:700;color:var(--purple);white-space:nowrap}
</style>
</head>

</div>

minutes. Any measurement error at this stage will compound through the assembly.","Halfway check: is the component meeting the objective? Any group that is behind gets direct facilitator support.","Groups test their component before the session ends."]},{"n":"Test and Peer Review","m":7,"t":"test","s":["Test the component against the session objective.","One group demonstrates to another. Peer feedback: one specific positive, one specific suggestion.","Record test result."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Tools returned. Bench cleared. Stall components stored in group folders.","Facilitator closes: connect to the Tamil market heritage theme and preview next week."]}],"diff":{"sup":"Pre-cut modular panel blanks. Student assembles and adds detail.","ext":"Research a specific type of Tamil market vendor and make their stall historically accurate."},"ass":"Is the component at the correct scale? Does it connect to the stall frame? Can the student name the structural principle used?","note":"Grade 2 introduces formal measurement for the first time. Spend extra time on ruler technique in Week 1 — the ±2 mm standard must be established clearly before students build their first panel."}],"g3lessons":[{"w":1,"f":"Structural Balance Basics","bi":"A tower doesn't fall because it's strong — it stands because its weight is balanced over its base.","obj":"Students build a 3-storey card tower 30 cm tall and discover the role of centre of gravity in keeping it standing.","dur":"60 minutes","grp":"Individual","mat":["A4 cardboard (6 sheets per student)","30 cm ruler","Pencil","Safety scissors","Craft glue or masking tape","3 identical books as test weights"],"voc":[["Centre of gravity","The single point where all of an object's weight is balanced — if it falls outside the base, the structure topples"],["Base","The bottom surface of a structure — a wide base is more stable than a narrow one"],["Storey","One level of a structure — a 3-storey tower has three stacked levels"]],"ph":[{"n":"Warm-Up — The Topple Test","m":7,"t":"intro","s":["Stand a single A4 card upright on the table. Give it a gentle push — it topples easily.","Now fold the card into a square tube (4 equal faces, open top and bottom). Stand it up. Push it. Much harder to topple.","Ask: 'Why is the tube harder to push over than the flat card? What changed?' Guide students to notice the wider, more stable base.","Introduce Tamil temple Gopurams: 'These towers stand over 60 metres tall because their builders understood exactly what you just observed — a wide base and balanced weight keep everything upright.'","Today's challenge: build a 3-storey tower at least 30 cm tall that doesn't lean."]},{"n":"Skill Demo — Building a Stable Card Storey","m":10,"t":"demo","s":["Show how to make one storey: roll an A4 card into a square tube (approx 6 × 6 cm cross-section), secure with a small strip of tape.","Key rule: the tube must be the SAME cross-section at top and bottom so the next storey sits level.","Demonstrate stacking: place storey 2 directly on top of storey 1 — does it balance? Now nudge it to one side — it wobbles when off-centre.","Show how to add a cardboard 'platform disc' between storeys: a square slightly larger than the tube, which gives a flat landing for the next level.","Demonstrate 3 storeys stacked: show how the top storey creates the greatest risk of topple — the taller the stack, the more critical the alignment."]},{"n":"Build Challenge — 3-Storey Tower","m":26,"t":"build","s":["Each student makes 3 identical square card tubes for their 3 storeys (each approx 10 cm tall).","Step 1 (8 min): Roll and secure all 3 tubes. Check each tube is the same size by stacking them — no wobble.","Step 2 (6 min): Cut 2 platform discs (slightly larger than tube cross-section) from spare card to place between storeys.","Step 3 (8 min): Stack: storey 1 → platform disc → storey 2 → platform disc → storey 3. Centre each storey carefully.","Step 4 (4 min): Check alignment — sight down from above. Are all storeys centred on the same vertical line?","Facilitator circulates — use a ruler held vertically beside each tower to show lean. Ask: 'Which direction is your tower leaning? Which storey caused it?'"]},{"n":"Test — The Book Load","m":9,"t":"test","s":["Students place 1 small book (approx 100 g) on top of their tower. Does it hold?","Try adding a second book. Record: at which book does it topple?","Identify the failure: did it crush (compression failure) or tip sideways (balance failure)?","Discuss as a class: 'How would making the base wider help? How would making the tube walls thicker help?'","Preview: 'Next week we learn the single technique that prevents the toppling problem — triangular bracing.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers kept intact and stored upright in a safe spot (they'll be referenced in Week 2).","Facilitator: 'Every Gopuram, every skyscraper, every bridge tower ever built had an engineer whose first question was: where is the centre of gravity? You answered that question today — with cardboard.'"]}],"diff":{"sup":"Reduce to 2 storeys. Pre-cut all tubes to the same length for the student.","ext":"Build a 5-storey tower with each storey progressively narrower — a tapered Gopuram profile."},"ass":"Does the tower reach 30 cm? Does it stand without leaning more than 5°? Can the student identify which storey caused any imbalance?","note":"Many students build tubes that aren't square — one face longer than another creates an uneven platform. Before stacking, have students check all 4 faces are the same width by measuring."},{"w":2,"f":"Triangular Bracing","bi":"A triangle is the only shape that cannot change its angles without breaking its sides. This is why every strong structure uses triangles.","obj":"Students compare braced and unbraced panels and explain why triangular bracing prevents flex and racking.","dur":"60 minutes","grp":"Individual","mat":["Cardboard strips (2 cm wide, 20 cm long — 20 per student)","Safety scissors","Hot-glue gun station (supervised)","Ruler","Pencil","Small weights (books or filled water bottle)"],"voc":[["Triangular bracing","Adding a diagonal member across a rectangular frame — converts it from a racking shape into a rigid triangle"],["Racking","When a rectangular frame distorts into a parallelogram under a sideways force — the failure triangular bracing prevents"],["Rigid","A structure that holds its shape when forces are applied to it"]],"ph":[{"n":"Warm-Up — The Racking Demo","m":7,"t":"intro","s":["Build a quick rectangular frame from 4 cardboard strips pinned at the corners with tape — do NOT brace it.","Push the top corner sideways. The rectangle racks into a parallelogram — collapses easily.","Ask: 'What shape would stop this from happening?' Let students suggest.","Add a diagonal strip across the rectangle. Push again — it's rigid. Ask: 'Why? What did the diagonal do?'","Introduce: 'Every column in a Tamil temple Gopuram has hidden diagonal bracing holding it upright. Ancient builders understood this 2,000 years ago.'"]},{"n":"Skill Demo — Building a Braced Panel","m":10,"t":"demo","s":["Build a 15 × 15 cm rectangular frame from 4 cardboard strips at a hot-glue station.","Test without brace: push corner sideways — racks easily.","Add a single diagonal brace (corner to corner). Re-test — rigid in one direction.","Show the limitation: one diagonal braces one direction but the frame can still rack the other way.","Add the second diagonal (X-brace). Re-test — now rigid in both directions.","Explain: 'The X-brace turns the square into 4 triangles. Triangles cannot change shape without breaking.'"]},{"n":"Build Challenge — Brace Comparison Set","m":26,"t":"build","s":["Each student builds 3 identical 15 × 15 cm rectangular frames from cardboard strips and hot glue.","Frame A (8 min): No bracing at all. Label it 'A — Unbraced'.","Frame B (8 min): One diagonal brace (corner to corner). Label 'B — Single Brace'.","Frame C (10 min): Full X-brace (both diagonals). Label 'C — X-Brace'.","Facilitator supervision at glue station: 1 student at a time. Students queue, collect their glued joint, return to seat to hold while it sets."]},{"n":"Test — The Push & Load Test","m":9,"t":"test","s":["Students test each frame by pushing one corner sideways with a consistent finger force.","Record deformation: did it rack noticeably, slightly, or not at all?","Stack a small book (200 g) on top of each frame. Which holds best?","Class discussion: 'Frame A vs C — what is the difference in resistance? Can you feel it?'","Key question: 'Where will you put bracing in your Gopuram? Which joints need it most?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["All 3 frames kept — they are evidence for the student's portfolio.","Glue guns unplugged, returned to station.","Facilitator: 'You just discovered the principle behind every stable structure ever built — from ancient Tamil temples to modern skyscrapers. The triangle is not just a shape. It is the fundamental unit of structural engineering.'"]}],"diff":{"sup":"Pre-build the rectangular frames. Student adds only the bracing strips.","ext":"Build a 3D braced cube — 12 edges, 4 diagonal braces across the 6 faces. Test how many books it holds."},"ass":"Can the student explain in their own words why Frame C is strongest? Do all 3 frames have clean glue joints? Is the distinction between racking and crushing identified?","note":"Hot-glue sessions need strict queue management — maximum 2 students at the glue station at any time. Brief students: hold the joint for 30 seconds before releasing. Don't rush this."},{"w":3,"f":"Column Construction","bi":"A column's strength comes not from how much material it contains, but from how that material is arranged around its centre.","obj":"Students build 4 hollow cardboard columns 40 cm tall that each support a 500 g load without buckling.","dur":"60 minutes","grp":"Individual","mat":["A3 cardboard (4 sheets per student)","Paper tubes (4 per student)","Ruler","Pencil","Safety scissors","Hot-glue gun station","500 g test weight (bag of sand or filled bottle)"],"voc":[["Column","A vertical structural member that carries compressive load from above to the foundation below"],["Buckling","When a column suddenly bends sideways under compressive load — the main way columns fail"],["Hollow section","A tube shape — uses less material than a solid rod but has similar stiffness because the material is distributed away from the centre"]],"ph":[{"n":"Warm-Up — Solid vs Hollow","m":7,"t":"intro","s":["Show two cardboard rolls: one densely wound solid roll, one hollow paper tube of similar outer diameter.","Ask students to guess which is stronger as a column before testing.","Press both from above with your palm — they feel similarly stiff. Now press from the side — the hollow tube resists bending better per gram of material.","Introduce the engineering insight: 'Material far from the centre resists bending best. That is why a hollow tube or an I-beam uses less material than a solid rod but achieves the same or greater stiffness.'","Tamil temple columns: 'Gopuram pillars are thick hollow stone tubes. Ancient Tamil builders discovered this independently thousands of years ago.'"]},{"n":"Skill Demo — Making a Load-Bearing Card Column","m":10,"t":"demo","s":["Method 1 — Wrapped paper tube: Take an A3 card, roll it tightly around a pencil to start the curve, then continue rolling to 5 cm diameter. Secure with hot glue along the seam. Cap one end with a cardboard disc.","Method 2 — Square tube: Score and fold an A3 card into a square cross-section tube (fold at 3, 6, and 9 cm marks). Glue the seam. Add a square cap at each end.","Show both methods side by side. Ask: 'Which cross-section do you think is stronger for the same amount of card?'","Test both with a palm press from above — both hold well. Push from the side — the circular one resists better in all directions; the square one has weak corners.","Recommend: circular column for maximum load, square column for easier construction — students choose."]},{"n":"Build Challenge — 4 Matching Columns","m":26,"t":"build","s":["Students build 4 columns, all the same height (40 cm) and same cross-section.","Critical point: columns must be the same height — if one is shorter, the platform will tilt and load will shift to that column, causing premature failure.","Step 1 (6 min): Choose method (circular or square). Cut all 4 cards to the same width.","Step 2 (12 min): Roll or fold all 4 columns. Glue seams at station. Cut end caps and glue on.","Step 3 (8 min): Measure all 4 columns with ruler. Any over 40 cm: trim. Any under: adjust end cap or add a small card ring at the base.","Facilitator checks: hold all 4 columns next to each other — are they the same height (within 3 mm)?"]},{"n":"Test — The 500 g Load Test","m":9,"t":"test","s":["Students place a flat cardboard platform on top of all 4 columns. Check it sits level.","Gently place the 500 g test weight in the centre of the platform.","Observe: any columns buckling? Any tilting? Note which column is under greatest stress.","Record: did the 4-column set hold? At what weight did it fail (if it did)?","Discussion: 'If one column buckled first, why? Was it slightly shorter? Was the seam weak?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Columns stored upright (tie in a bundle of 4 with a rubber band — easier to store without crushing).","Facilitator: 'Tamil Gopuram pillars support thousands of tonnes of carved stone above them. Your paper columns just supported 500 grams. The principle is identical: material at the outside of a circular cross-section, equal heights, seams glued tight. Scale it up — and you have a…"]}],"diff":{"sup":"Provide pre-rolled paper tubes (from the materials kit). Student only cuts to length and adds end caps.","ext":"Build one column using a triangular cross-section. Compare its buckling load to the circular column."},"ass":"Are all 4 columns within 3 mm of the same height? Did the column set hold 500 g? Can the student identify which part of the column failed and explain why?","note":"The most common failure is the seam popping open before the column buckles — insufficient glue contact. Emphasise: hold the glued seam for a slow count of 30 before moving to the next step."},{"w":4,"f":"Stacking Levels","bi":"A Gopuram shrinks as it rises — each level is smaller than the one below. This is not just decoration — it is structural mathematics.","obj":"Students stack 3 decreasing-size platforms on their column sets to create a stable 3-level tiered structure.","dur":"60 minutes","grp":"Individual","mat":["Columns from Week 3","A3 cardboard (3 sheets per student)","Ruler","Pencil","Scissors","Hot-glue gun station","Small weights"],"voc":[["Tiered","Having multiple levels, each one smaller or higher than the previous — like a wedding cake"],["Setback","The amount each tier is inset from the tier below — creates the tapering profile"],["Load path","The route that a load travels through a structure from the top to the ground"]],"ph":[{"n":"Warm-Up — The Pyramid Principle","m":7,"t":"intro","s":["Stack 3 books of decreasing size (large at bottom, small at top). Ask: 'Why is this stable?'","Now reverse them (small at bottom, large at top). They fall. Ask: 'Why does the order matter?'","Introduce: 'Every Gopuram follows the pyramid principle — wider at the base, narrower at the top. This keeps the centre of gravity low and over the base.'","Show a reference sketch of a 5-tier Gopuram: each tier is set back from the one below. The setback is consistent — engineering precision in ancient Tamil architecture."]},{"n":"Skill Demo — Cutting Platforms and Stacking","m":10,"t":"demo","s":["Cut 3 platform squares: Level 1 = 20 × 20 cm, Level 2 = 15 × 15 cm, Level 3 = 10 × 10 cm.","Reinforce each platform: score the underside in a grid pattern (5 × 5 cm grid) — this stiffens the platform against sagging.","Show how to place 4 columns (from Week 3) at the corners of Level 1 platform.","The columns don't need to be glued to the platform — the weight from above holds them in place during building. Glue only after checking they are plumb.","Stack Level 2 on top of the 4 columns. Centre it carefully — measure from each side of Level 1 to confirm Level 2 is centred.","Sight down from above: all 3 platforms should appear to share the same centre point."]},{"n":"Build Challenge — 3-Level Tiered Structure","m":26,"t":"build","s":["Step 1 (8 min): Cut 3 platform squares at the 3 specified sizes. Score the grid reinforcement on the underside of each.","Step 2 (8 min): Position columns at the corners of Level 1 platform. Check all 4 columns are plumb (ruler vertical check). Glue column bases to platform.","Step 3 (6 min): Place Level 2 platform on top of columns. Measure: is it centred? (From each edge of Level 1 to the edge of Level 2 — should be equal on all 4 sides.)","Step 4 (4 min): Add the 4 Level 2 columns (shorter, if possible — cut paper tube sections approx 20 cm). Place Level 3 on top.","Facilitator circulates — check vertical alignment by sighting from the side. Any lean? Identify which column is shorter."]},{"n":"Test — The Plumb and Level Test","m":9,"t":"test","s":["Hold a ruler vertically against the side of the structure. Is the stack truly vertical?","Place a small ruler or coin on each platform. Does it sit level without rolling?","Place 200 g weight on the topmost platform. Does the structure hold?","Ask: 'Is the centre of gravity of your structure above the base? How can you tell?'","Preview: 'Next week we add tapered walls to each tier — and the Gopuram really begins to look like itself.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Structures carefully stored upright or laid flat — do NOT stack them (the columns will crush).","Facilitator: 'Today you built a structure with a load path. Every gram placed on Level 3 travels through the Level 2 columns, through Level 1 platform, through the Level 1 columns, and into the table. That chain of force transfer is structural engineering.'"]}],"diff":{"sup":"Pre-cut platforms to correct sizes. Student positions columns and checks centring.","ext":"Add a 4th tier using toothpicks as mini-columns — extend the structure to full Gopuram proportions."},"ass":"Are platforms centred on each other (within 5 mm)? Does the structure hold 200 g on the top platform without toppling? Is the load path clear — columns directly above columns?","note":"The centring step is the most critical and most skipped. Make it non-negotiable: measure before gluing every time. A 1 cm off-centre at Level 1 becomes a 2 cm lean at Level 3."},{"w":5,"f":"Tapering Walls","bi":"A tapered wall is both beautiful and structurally clever — it puts the most material where the loads are greatest (the base) and reduces weight where loads are least (the top).","obj":"Students build a wall panel that narrows toward the top and stands upright without leaning.","dur":"60 minutes","grp":"Individual","mat":["Corrugated cardboard (A2, 1 sheet per student)","Ruler","Pencil","Safety scissors","Scoring tool","Craft glue","Bamboo stick (1 per student, for internal stiffener)"],"voc":[["Taper","A gradual narrowing from a wider base to a narrower top"],["Trapezoidal","A four-sided shape where the top is narrower than the bottom — the cross-section profile of a tapered wall"],["Stiffener","An internal element added to a panel to prevent it from bending or buckling under load"]],"ph":[{"n":"Warm-Up — Reading the Gopuram Profile","m":7,"t":"intro","s":["Show a side-profile sketch of a Gopuram: wide base, tapering as it rises. Mark the base width and the top width.","Ask: 'Why does the base need to be wider? What forces are greatest at the base?' (Compression from the full weight above, plus the horizontal force from the widening.)","Show a rectangular wall vs a tapered wall: 'Which looks more like a Gopuram? Which is structurally smarter?'","Introduce trapezoidal: 'A trapezoid is a four-sided shape where the two horizontal sides are parallel but different lengths. That is the shape of every wall panel on a Gopuram.'"]},{"n":"Skill Demo — Cutting and Standing a Tapered Wall","m":10,"t":"demo","s":["Mark the trapezoid on corrugated sheet: bottom = 20 cm wide, top = 12 cm wide, height = 25 cm.","How to mark the taper: mark the bottom edge at full width, then measure in 4 cm from each side at the top — connect those marks to the bottom corners with a straight line.","Cut the trapezoid: 4 cuts (2 angled sides + top + it's already connected at the bottom).","Score vertical lines at 2 cm intervals on the face of the panel — this allows a slight curve, making the panel more resistant to side-load.","Add a bamboo stick stiffener glued vertically to the back of the panel at its centre line.","Stand the panel: fold a 2 cm base tab out along the bottom edge. Does it stand without leaning?"]},{"n":"Build Challenge — Tapered Wall Panel","m":26,"t":"build","s":["Each student marks and cuts a tapered wall panel from corrugated sheet.","Step 1 (6 min): Mark the trapezoid on the corrugated sheet. Check measurements with ruler before cutting.","Step 2 (8 min): Cut the panel. Score the vertical stiffening lines (every 2 cm).","Step 3 (6 min): Glue a bamboo stick vertically along the back of the panel at centre. Hold for 60 seconds.","Step 4 (6 min): Fold the base tab and stand the panel. Check for lean: hold a ruler vertically alongside. Adjust the tab fold angle to correct lean.","Facilitator checks: is the taper symmetric? Is the panel plumb when standing?"]},{"n":"Test — The Lean & Load Test","m":9,"t":"test","s":["Students pair up and check each other's panels with a vertical ruler. Is it within 5° of vertical?","Place a 200 g book on top of the panel. Does it hold without buckling?","Horizontal push: push on the wide base of the panel vs the narrow top. Which direction is it easier to topple it?","Discussion: 'Why is the panel harder to topple from the base direction? Is this why Gopuram bases are so wide?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Panels stored flat (stacking face-to-face to avoid the bamboo stiffener being bent).","Facilitator: 'You just built the most important panel in the Gopuram — the outer wall. Next week we learn to curve that wall further into an arch — and then the Gopuram will really begin to look like the towers of Madurai and Thanjavur.'"]}],"diff":{"sup":"Provide a pre-marked trapezoid template. Student cuts and assembles only.","ext":"Build two tapered panels and connect them at the corners — a 2-wall tapered corner that could be the base of a Gopuram tier."},"ass":"Is the taper symmetric? Does the panel stand plumb within 5°? Is the bamboo stiffener attached at centre? Does it hold 200 g?","note":"Students often mark the taper from the centre outward rather than measuring in from the sides — this creates an asymmetric trapezoid. Demonstrate the 'measure in from each side equally' method specifically."},{"w":6,"f":"Arch Construction","bi":"An arch has no glue — it is held together by compression alone. Each piece pushes against its neighbour, and the harder you press from above, the tighter the arch becomes.","obj":"Pairs build a cardboard arch from wedge-shaped voussoir pieces that supports 200 g at the keystone.","dur":"60 minutes","grp":"Pairs","mat":["Thick cardboard (corrugated, 1 A2 sheet per pair)","Ruler","Pencil","Safety scissors","Scoring tool","Temporary arch former (half-circle cut from foam board, 1 per pair)","Test weight 200 g"],"voc":[["Arch","A curved structural form that transfers vertical load outward and downward to its supports (abutments)"],["Voussoir","One of the wedge-shaped blocks that make up an arch"],["Keystone","The central wedge at the top of the arch — the last piece inserted, which locks the arch together"],["Abutment","The end support of an arch — it resists the outward thrust the arch exerts"]],"ph":[{"n":"Warm-Up — The Arch That Holds Itself","m":8,"t":"intro","s":["Show a line of students holding hands in a circle. Ask one to let go — the circle breaks. Say: 'An arch is like this circle — the group holds together as long as everyone is there.'","Show a pre-made cardboard arch (without glue). Press from above — it gets tighter, not looser. Ask: 'Why?'","Introduce compression: 'When you press from above, you push the voussoirs into each other. The harder you push, the more friction between them — the stronger the arch.'","Show a Tamil temple gateway (Gopura entrance arch) sketch. 'Every gateway in a Tamil temple uses this exact principle — carved stone voussoirs held by compression alone, no mortar at the arch ring.'"]},{"n":"Skill Demo — Building the Arch","m":12,"t":"demo","s":["Show the arch former: a half-circle cut from foam board, 15 cm radius. 'This is the temporary support — we build the arch over it, then remove it.'","Cut voussoirs: each is a trapezoid — narrow at the inner face (intrados), wider at the outer face (extrados). For a 15 cm radius arch, cut 7 voussoirs: 6 equal side ones and 1 keystone at the top.","Build the arch: place the former on the table. Stack voussoirs on each side simultaneously — left piece, right piece, left, right — meeting at the keystone.","Insert the keystone last: slide it in from above. The arch becomes instantly rigid.","Remove the former carefully — does the arch stand alone? (It should — it is compression-locked.)","Test: place 200 g weight on the keystone. Does it hold?"]},{"n":"Build Challenge — Pairs Build an Arch","m":24,"t":"build","s":["Pairs cut their arch former from foam board (half-circle, 15 cm radius). Set aside.","Cut voussoirs: 7 wedge-shaped pieces from corrugated card. Each approx 4 cm tall, 3 cm inner width, 5 cm outer width.","Step 1 (8 min): Cut the former. Cut 7 voussoirs. Check all voussoirs are similar in size.","Step 2 (10 min): Build the arch over the former. Alternate sides. Don't glue — compression only.","Step 3 (6 min): Insert keystone. Slowly remove the former. Does the arch hold?","If it collapses: check voussoir angle consistency — mismatched angles cause gaps that break the compression lock.","Facilitator circulates — do NOT allow glue. The point is to experience compression-only structure."]},{"n":"Test — Load and Former Removal","m":8,"t":"test","s":["Each pair removes their former and tests: does the arch stand alone?","Place 200 g weight at keystone: does the arch hold? Does it splay (spread at the abutments)?","Simulate abutment failure: slowly pull the two base ends apart. At what point does the arch collapse?","Ask: 'Why does Tamil temple arch construction need thick walls on either side of the arch? What are those walls doing?' (Resisting the outward thrust.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Arches carefully disassembled and voussoirs stored in a small bag (marked with student names).","Facilitator: 'You just built one of the oldest structural forms in the world — unchanged for 4,000 years. Roman aqueducts, Tamil temple gateways, medieval cathedrals, and modern tunnels all use the same compression-locked arch. You held it in your hands today.'"]}],"diff":{"sup":"Reduce voussoir count to 5. Pre-cut the arch former. Student assembles.","ext":"Build a pointed arch (ogee arch) as found in Tamil temples — a more complex voussoir geometry."},"ass":"Did the arch stand without glue after former removal? Did it hold 200 g at the keystone? Can the student explain compression-locking in their own words?","note":"The most common failure is voussoirs that are not consistently wedge-shaped — if some are nearly rectangular, the arch won't lock. Spend time on the cutting demo and check every pair's voussoirs before building begins."},{"w":7,"f":"Gopuram Base Platform","bi":"The quality of every floor you add is entirely determined by the quality of the floor below it. Get the base right, and everything above becomes easier.","obj":"Each group constructs the rectangular base platform of their Gopuram — level, plumb, and strong enough to support all tiers above.","dur":"60 minutes","grp":"Groups of 3","mat":["A2 cardboard (4 sheets per group)","Foam board (A3, 2 sheets per group)","Ruler","Pencil","Safety scissors","Hot-glue gun station","Corrugated sheet for wall faces"],"voc":[["Plinth","The projecting base of a column or structure — the widest part at the very bottom that everything sits on"],["Level","Perfectly horizontal — the most important quality of a platform that will carry stacked weight"],["Datum","A reference point or surface from which all measurements are taken"]],"ph":[{"n":"Warm-Up — Why the Base Matters Most","m":7,"t":"intro","s":["Show a tower built on a slightly tilted base (prop one edge up 5 mm). Even 5 mm tilt at the base makes the top lean noticeably.","Ask: 'If the base is 1° off level, and the tower is 60 cm tall, how far out of plumb is the top?' (Roughly 1 cm.)","Introduce: 'Temple builders in Tamil Nadu laid their foundation stones with incredible precision — using water levels to ensure absolute flatness. Today you are doing the same.'","Groups receive their materials. Today's goal: build a base platform that a ruler can sit on from any direction without rocking."]},{"n":"Skill Demo — Building a Flat Platform","m":10,"t":"demo","s":["Base construction method: sandwich structure. Two layers of cardboard, separated by internal ribs (cardboard strips on edge), glued together.","Step 1: Cut 2 identical rectangles (30 × 20 cm) from A2 card — these are the top and bottom skins.","Step 2: Cut internal rib strips (3 cm wide, 30 cm long). Stand them on edge. Glue at 5 cm intervals between the two skin layers.","Step 3: Glue the top skin on. Press flat for 60 seconds.","Test: place a ruler diagonally across the platform — does it rock? If yes, the ribs are uneven. Sand or trim to level.","Key insight: the ribbed sandwich is 5× stiffer than a single layer with the same amount of card."]},{"n":"Build Challenge — Gopuram Base Platform","m":26,"t":"build","s":["Groups divide roles: 2 students cut and assemble the base sandwich, 1 student prepares the 4 side walls.","Step 1 (8 min): Cut 2 platform skins (30 × 20 cm) and 6 rib strips. Assemble sandwich at glue station.","Step 2 (8 min): Cut 4 side wall panels (tapered from 20 cm base to 18 cm top, 8 cm tall — using Week 5 technique).","Step 3 (6 min): Attach the 4 side walls to the perimeter of the base platform. Check all corners are 90° using set square.","Step 4 (4 min): Check the whole base is level (ruler test from multiple directions).","Facilitator: check that groups have correctly oriented the corrugation in the stiff direction for the walls."]},{"n":"Test — The Level and Plumb Test","m":9,"t":"test","s":["Ruler level test: place a ruler across the top of the base in 4 directions. Does it sit flat each time?","Set square test: check each corner of the side walls — are they 90°?","Load test: place a 500 g weight on the centre of the base. Does the base sag? Any rib failure?","Groups compare bases: whose is the flattest? The squarest?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bases stored flat, clearly labelled with group names.","Facilitator: 'Today you made the datum — the reference from which every tier of your Gopuram will rise. Ancient Tamil temple builders called the foundation the Adhishthana, meaning the seat or throne of the structure. Your Adhishthana is ready.'"]}],"diff":{"sup":"Reduce rib count to 3. Pre-cut the platform skins. Group focuses on assembly and checking.","ext":"Add a perimeter step around the base (a second, slightly smaller plinth above the main base) — as seen in the multi-stepped base of real Gopurams."},"ass":"Does the ruler sit flat across the base in all 4 directions? Are all wall corners at 90° (set square check)? Does it hold 500 g without sagging?","note":"Groups naturally want to rush past the level-checking step. Enforce it: no group proceeds to adding walls until the base passes the ruler test. An unlevel base will ruin every tier above it."},{"w":8,"f":"Gopuram Level 1 — Wide Tier","bi":"The first tier is the most important tier — it sets the proportions for everything above. Make it right and the rest follows.","obj":"Groups construct the first (widest) tier of the Gopuram: 4 tapered wall panels, 4 columns, an arch gateway, and a flat roof platform.","dur":"60 minutes","grp":"Groups of 3","mat":["Gopuram base from Week 7","A2 cardboard (4 sheets per group)","Corrugated sheets (2 per group)","Paper tubes (4 per group)","Bamboo sticks (4 per group)","Hot-glue gun station","Ruler, pencil, scissors"],"voc":[["Tier","One complete level of the Gopuram — walls, columns, arch, and roof"],["Proportional","When the dimensions of each level relate to those of the level below by a consistent ratio"],["Gateway","The arched entrance opening in the base of each Gopuram tier — the most sacred point of passage"]],"ph":[{"n":"Warm-Up — The Tier System","m":7,"t":"intro","s":["Show a sketch of a 5-tier Gopuram with dimensions labelled. Each tier is approximately 80% of the width and 75% of the height of the tier below.","Ask: 'If our Level 1 is 30 × 20 cm and 20 cm tall, what should Level 2 be?' (24 × 16 cm, 15 cm tall.)","Introduce proportional scaling: 'Tamil architects used a strict ratio system called Tala Mana — a module-based measurement system that kept all proportions consistent. Today we use 80% as our Tala Mana.'","Review the Level 1 target dimensions for each group (based on their base platform)."]},{"n":"Skill Demo — Assembling a Complete Tier","m":10,"t":"demo","s":["Show the 4 components of a tier on the demo table: 4 tapered walls, 4 corner columns, 1 arch panel, 1 roof platform.","Assembly order: (1) attach corner columns to base corners, (2) attach tapered walls between columns, (3) insert arch gateway in one wall, (4) lay roof platform on top.","Arch gateway integration: cut the gateway opening in one tapered wall panel before attaching it. Use Week 6 voussoir technique for the arch, or a simplified scored-card arch for speed.","Roof platform: use the ribbed sandwich technique from Week 7 — same size as the top face of the tier."]},{"n":"Build Challenge — Level 1 Construction","m":28,"t":"build","s":["Groups work on their Gopuram base from Week 7.","Step 1 (6 min): Cut 4 corner columns (paper tube sections, all same height = 20 cm). Glue to base corners.","Step 2 (8 min): Cut 4 tapered wall panels. Mark gateway opening on front wall panel before cutting.","Step 3 (6 min): Cut arch gateway opening. Add voussoir arch around opening (simplified version: score a curved line and fold).","Step 4 (6 min): Attach all 4 wall panels between the columns.","Step 5 (2 min): Lay the Level 1 roof platform on top. Check level with ruler.","Facilitator circulates — all groups at different stages; assist the group most behind."]},{"n":"Test — The Tier Integrity Test","m":7,"t":"test","s":["Load test: place 500 g on the Level 1 roof platform. Does it hold?","Level check: ruler across the roof platform — flat?","Gateway check: can a small cardboard figure pass through the arch gateway?","Preview: 'Next week we calculate Level 2 dimensions (80% rule) and build it directly on top of Level 1.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Gopurams stored upright (each group's structure is now 30+ cm tall — needs careful storage).","Facilitator: 'Level 1 is your widest, heaviest, most structurally important tier. Everything above it will be lighter and smaller. You have just passed the hardest engineering test of the project — getting the first tier right.'"]}],"diff":{"sup":"Pre-cut the 4 tapered walls to the correct dimensions. Group assembles only.","ext":"Add low-relief decorative patterns to the outer faces of the tapered walls (using air-dry clay strips) before attaching."},"ass":"Does Level 1 hold 500 g? Is the roof platform level? Is the gateway arch correctly formed? Are all 4 wall panels attached?","note":"This is the longest and most complex build session so far — time management is critical. Set a timer for each step and announce it. Groups that fall behind should prioritise structure over decoration."},{"w":9,"f":"Gopuram Level 2 — Second Tier","bi":"Repeatability is the engineer's superpower — the same system, scaled down, stacked up.","obj":"Groups build Level 2 at 80% of Level 1 dimensions and successfully stack it centred on Level 1.","dur":"60 minutes","grp":"Groups of 3","mat":["Gopurams from Week 8","A2 cardboard (3 sheets per group)","Corrugated sheets","Paper tubes","Hot-glue gun station","Ruler, pencil, scissors, set square"],"voc":[["Scale factor","The ratio by which you multiply dimensions to get the next size — 0.8 means each dimension is 80% of the previous"],["Centring","Aligning a new tier so it is equally set back from all 4 sides of the tier below"],["Cumulative error","When small errors in each tier add up to a large lean or misalignment at the top"]],"ph":[{"n":"Warm-Up — The 80% Rule Calculation","m":8,"t":"intro","s":["Each group measures their Level 1 roof platform dimensions (should be approx 24 × 14 cm after the setback from the base).","Calculate Level 2: multiply both dimensions by 0.8. Write the numbers down.","Calculate Level 2 height: Level 1 height × 0.75.","Ask: 'Why does the height reduce by a different ratio than the width?' (Gopurams taper more in width than in height — they are tall and slender, not short and fat.)","Groups check their calculations with the facilitator before starting to cut."]},{"n":"Skill Demo — Centring a New Tier","m":8,"t":"demo","s":["Place Level 1 demo on the table. Measure its roof platform from all 4 sides.","Place Level 2 demo on top. Use a ruler to measure the setback on all 4 sides — it must be equal (e.g. 2 cm on each side if Level 2 is 4 cm narrower on each axis).","Mark the centred position with a light pencil line on the Level 1 roof surface before gluing.","Common error: centring only by eye — it looks right but isn't. Always measure the setback on all 4 sides.","After centring: sight from the side at eye level. Are the two tiers visually balanced? Check all 4 sides."]},{"n":"Build Challenge — Level 2 Construction & Stacking","m":28,"t":"build","s":["Using the calculated Level 2 dimensions, groups build a complete second tier.","Step 1 (6 min): Cut the Level 2 roof platform (approx 80% of Level 1 roof).","Step 2 (8 min): Cut and assemble Level 2 columns (paper tube sections, 75% of Level 1 column height).","Step 3 (8 min): Cut Level 2 tapered walls (same taper angle as Level 1 but smaller dimensions).","Step 4 (6 min): Assemble Level 2 as a complete tier. Check level and integrity before placing on Level 1.","Stacking: mark the centred position on Level 1 roof. Place Level 2. Measure all 4 setbacks. Glue when satisfied.","Facilitator: check each group's Level 2 is centred before they glue."]},{"n":"Test — The Two-Tier Stability Test","m":8,"t":"test","s":["Sight from all 4 sides at eye level: is Level 2 centred on Level 1?","Plumb check: vertical ruler alongside — is the full structure plumb (within 5°)?","Load test: place 300 g on Level 2 roof. Does Level 1 absorb the load without deforming?","Measure the structure's total height. Is it on track for the Week 13 completion (target: 70+ cm)?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Structures now 50+ cm tall — extremely careful storage needed. Suggest storing against a wall, not freestanding.","Facilitator: 'Your Gopuram is now 2 tiers. Real Tamil temple Gopurams typically have 5–13 tiers. The principle is identical at any scale: 80% rule, centred stacking, level platforms. You are using the same mathematics the Chola and Pandya architects used.'"]}],"diff":{"sup":"Provide pre-cut Level 2 components sized by the facilitator. Group assembles and centres.","ext":"Add a miniature arch gateway to Level 2 as well (each tier has its own gateway in a real Gopuram)."},"ass":"Is Level 2 centred (all 4 setbacks equal)? Is the structure plumb within 5°? Does the two-tier structure hold 300 g on Level 2?","note":"The cumulative error issue becomes visible at this stage — groups whose Level 1 was slightly off-centre will find Level 2 amplifies the lean. Encourage them to shim (wedge a thin card piece) rather than rebuild."},{"w":10,"f":"Gopuram Level 3 — Third Tier","bi":"By the third tier, the tower's silhouette begins to emerge. Engineering and aesthetics converge — a structure that looks right, is right.","obj":"Groups build and stack Level 3 at 80% of Level 2, bringing the Gopuram to 3 complete tiers and 60+ cm height.","dur":"60 minutes","grp":"Groups of 3","mat":["Gopurams from Week 9","A2 cardboard (2 sheets per group)","Corrugated sheets","Paper tubes","Hot-glue station","Ruler, pencil, scissors","Decorative materials (foil card, coloured paper)"],"voc":[["Silhouette","The outline shape of a structure seen from the side — the Gopuram silhouette is its most recognisable feature"],["Ornament","Decorative elements added to a structure — in Gopurams, these are sculptures representing gods, guardians, and stories"],["Structural decoration","When a decorative element also serves a structural function — like a corbel (projecting stone) that is both decorative and supports the tier above"]],"ph":[{"n":"Warm-Up — The Third Tier Calculation","m":7,"t":"intro","s":["Groups measure their Level 2 roof dimensions and calculate Level 3 (80% rule again).","At this point Level 3 is quite small — typically 12–16 cm base width. Ask: 'How do we maintain structural integrity when the pieces get this small?'","Introduce: 'When columns get very short and narrow, we switch from paper tubes to bamboo sticks — stronger at small scale.'","Show a bamboo stick column vs a paper tube at 10 cm height — bamboo is dramatically stiffer for the same size."]},{"n":"Skill Demo — Small-Scale Tier with Bamboo Columns","m":8,"t":"demo","s":["Demonstrate using bamboo sticks as mini-columns at 10–15 cm height. Glue them to the Level 2 roof platform at the 4 corners.","Cut small tapered walls for Level 3 — at this scale, the walls are approx 10 cm wide and 12 cm tall.","Add a decorative panel to the Level 3 walls: score a diamond or chevron pattern into the card face (traditional Gopuram surface decoration).","Roof platform at Level 3: a small, stiff piece of foam board (stiffer than card at this small size)."]},{"n":"Build Challenge — Level 3 Construction & Stacking","m":28,"t":"build","s":["Groups calculate and cut Level 3 components.","Step 1 (6 min): Cut Level 3 roof platform from foam board. Cut bamboo stick columns to height.","Step 2 (8 min): Cut Level 3 tapered walls. Score decorative patterns onto the outer faces.","Step 3 (8 min): Assemble Level 3 on a separate flat surface. Check level and stability.","Step 4 (6 min): Mark centred position on Level 2 roof. Place Level 3. Verify all 4 setbacks are equal. Glue.","Facilitator: sight from the side at eye level — does the 3-tier Gopuram have a clean tapered silhouette?"]},{"n":"Test — The Full Silhouette Test","m":9,"t":"test","s":["Stand the Gopuram at one end of the table. Walk to the other end and look at the silhouette.","Does it taper consistently from base to top on all 4 sides?","Does it look like a Gopuram? (This is a genuine aesthetic test — the engineering produces the aesthetic.)","Height measurement: total height target is 60 cm at end of Week 10. On track?","Plumb check: vertical ruler from front — is the structure vertical?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Structures stored against the wall or in a dedicated project area.","Facilitator: 'Three tiers. Three times the same system, three times the same precision. Week 11 adds the finial — the sacred pointed top of the Gopuram. Week 12 adds the surface decorations. Week 13 brings everything together. You are two sessions away from one of the most impres…"]}],"diff":{"sup":"Pre-assemble Level 3. Group's task is to centre and glue it to Level 2 correctly.","ext":"Add a Level 4 (64% of Level 1 — another 80% reduction). The Gopuram becomes more slender and dramatic."},"ass":"Is Level 3 centred on Level 2? Is the 3-tier silhouette consistently tapered? Total height 60+ cm? Structure plumb within 5°?","note":"At this stage, some groups will be significantly ahead of others. Pair faster groups with slower ones for peer support — the peer explaining reinforces learning for both parties."},{"w":11,"f":"Finial & Kalasam — 3D Printed","bi":"The Kalasam is not just the top of the tower — it is the symbolic point where the earth reaches toward the sky. Its bulbous, pot-like shape is almost impossible to make accurately from card. The 3D printer produces this exact form in minutes — freeing the builder to focus on proportion, assembly, and attachment.","obj":"Groups build the finial (Kalasam) — the pointed crown of the Gopuram — using a 3D-printed Kalasam pot body as the centrepiece, assembled with handmade stepped rings and a Stupi tip, and attached securely to the top of Level 3.","dur":"60 minutes","grp":"Groups of 3","mat":["Gopurams from Week 10","3D-printed Kalasam pot body (printed before session — PLA, gold or terracotta filament, ~6 cm tall, hollow cylinder with bulge profile; one per group)","Bamboo stick (1 per group, 30 cm)","Foil card (gold/silver)","Corrugated card (for stepped rings)","Hot-glue station","Ruler, scissors, pencil","Laptop showing Tinkercad design (for reference)"],"voc":[["Finial","The ornamental feature at the very top of a spire, tower, or Gopuram"],["Kalasam","The Tamil term for the sacred pot-shaped or bulbous finial at the top of a Gopuram — literally meaning 'vessel'. Its precise bulbous shape is one of the defining visual features of Tamil temple architecture"],["Prototype","A first physical version of a design — the 3D-printed Kalasam is a prototype that can be refined if the proportions are not right before the final session"]],"ph":[{"n":"Warm-Up — The Kalasam Shape and Why It Is Hard to Make by Hand","m":7,"t":"intro","s":["Show the class a real Kalasam photograph and the 3D-printed version. Ask: 'What makes this shape difficult to make from card or paper tubes?' (The smooth bulge — you cannot get a clean, symmetrical curve from flat material.)","Show the Tinkercad screenshot on the laptop: the Kalasam design is a cylinder with a sphere merged in at the upper third — a 5-minute CAD task. 'Anyone in this class can design this shape in Tinkercad in a lunch break. The printer makes it real in 40 minutes.'","Discuss: structurally, the finial must be light (maximum toppling moment at the top) and firmly attached (most exposed to wind). The 3D-printed PLA Kalasam is hollow — lighter than a solid card version.","Today's challenge: assemble the complete finial using the printed Kalasam as the centrepiece, then attach it firmly to the Gopuram top."]},{"n":"Skill Demo — Finial Assembly with 3D-Printed Kalasam","m":10,"t":"demo","s":["Finial spine: bamboo stick (30 cm). The 3D-printed Kalasam has a 5 mm central bore — the bamboo passes through it.","Stupi tip: roll a small cone from foil card. Slip over the top of the bamboo above the Kalasam. Glue.","Stepped rings: cut 3 rings from corrugated card, each slightly larger than the one above. These sit below the Kalasam on the bamboo spine.","Finial assembly from bottom: stepped rings (largest first) → slide onto bamboo → Kalasam (thread bamboo through its bore) → lock Kalasam with a ring of hot glue at its base → Stupi cone at tip.","Attach to Gopuram: glue the bamboo spine base firmly into the centre of Level 3's roof platform. The spine is the anchor.","Show proportions: the finial should be approximately 15–20 cm tall. The Kalasam should sit at approximately 60% of the finial height from the base — as it does on real Gopurams."]},{"n":"Build Challenge — The Finial","m":26,"t":"build","s":["Groups assemble their finial separately first, then attach to the Gopuram.","Step 1 (4 min): cut bamboo spine to length. Test-fit the 3D-printed Kalasam on the bamboo — does the bore fit? If too tight, sand the bamboo at the Kalasam position.","Step 2 (8 min): cut 3 stepped rings from corrugated card. Largest: diameter = Kalasam base width + 2 cm. Middle: + 1 cm. Smallest: same as Kalasam base. Slide all 3 onto the bamboo spine below the Kalasam position.","Step 3 (6 min): thread the Kalasam onto the bamboo. Position at the 60% height mark. Secure with hot glue at the base and top of the Kalasam bore.","Step 4 (4 min): roll the foil card Stupi cone. Glue to the bamboo tip above the Kalasam.","Step 5 (4 min): glue bamboo spine base firmly into the Level 3 roof centre. Hold 60 seconds. Check plumb from all 4 sides.","Facilitator: the 3D-printed Kalasam should not move on the bamboo after gluing. Press gently from the side — if it rotates, add more glue before it sets."]},{"n":"Test — Finial Stability and Proportion","m":9,"t":"test","s":["Plumb test: is the finial vertical from all 4 viewing angles?","Shake test: tap the table gently. Does the finial stay attached? Does the Kalasam stay on the spine?","Pull test: gently grip the Kalasam and try to slide it upward along the bamboo. It should resist (glue bond test).","Proportion check: stand back 2 metres. Does the finial crown the Gopuram proportionally? The 3D-printed Kalasam gives a precise bulge that the card version could not achieve — does this improve the visual quality?","Group photo: side-profile photograph of each Gopuram at this stage."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Gopurams stored very carefully — the finial is the most vulnerable point.","Facilitator: 'In 1987, restoration workers at the Brihadeeswarar temple in Thanjavur lowered a granite finial weighing 80 tonnes onto the 63-metre tower. That finial — like yours — is a Kalasam. Its shape has been the same for over a thousand years. The 3D printer made yours in 4…"]}],"diff":{"sup":"Pre-thread the Kalasam onto the bamboo and secure. Group adds stepped rings, Stupi tip, and attaches to Gopuram.","ext":"Open Tinkercad and redesign the Kalasam — modify the bulge position or add a ribbed texture (found on Amalaka-style finials from North Indian temples). Save the file and explain what would need to cha…"},"ass":"Is the finial plumb from all 4 angles? Does the Kalasam resist the pull test? Is the proportion visually correct (Kalasam at approximately 60% of finial height)?","note":"Print the Kalasam the day before the session. PLA in gold or terracotta filament is ideal — these are the traditional colours of Gopuram finials. Design parameters: approximately 40 mm diameter at widest point, 55–60 mm tall, 5.5 mm central bore (bamboo is typically 4–5 mm diameter; the 0.5 mm clear…"},{"w":12,"f":"Surface Decoration","bi":"Gopuram decoration is not separate from engineering — it is engineering applied to storytelling. Every raised surface also stiffens the wall behind it.","obj":"Students add bas-relief surface decoration to the outer walls of their Gopuram using air-dry clay strips and scored card patterns.","dur":"60 minutes","grp":"Individual (working on group Gopuram)","mat":["Gopurams from Week 11","Air-dry clay (small packets)","Coloured card strips","Craft glue","Toothpicks (for clay work)","Acrylic paint (terracotta/stone tones)","Paint brushes"],"voc":[["Bas-relief","Sculpture where figures or patterns are raised slightly from a flat background — the dominant decorative form of Gopuram walls"],["Motif","A repeated decorative pattern or symbol"],["Frieze","A horizontal band of decoration running across a wall"]],"ph":[{"n":"Warm-Up — Reading Gopuram Decoration","m":7,"t":"intro","s":["Show sketches of Gopuram wall decoration: rows of gods (Devas), mythical animals (Yalis), geometric friezes, lotus motifs.","Point out that the decoration is organised: horizontal bands (friezes) with figures in niches above and below.","Ask: 'What pattern do you see repeated most often?' (Typically: lotus, chevron, and niche frame patterns.)","Today's challenge: each student decorates one face of their group's Gopuram with at least 2 friezes and 3 motifs.","Rule: no stickers, no drawing only. Everything must be either scored card, added clay, or cut-card relief."]},{"n":"Skill Demo — Three Decoration Techniques","m":10,"t":"demo","s":["Technique 1 — Scored frieze: Use scoring tool and ruler to press horizontal lines across the card face at 2 cm intervals. Creates a layered stone effect.","Technique 2 — Clay relief: Roll a small clay snake. Press onto the wall surface. Use a toothpick to shape into a lotus petal or geometric motif. Let dry.","Technique 3 — Cut card appliqué: Cut thin strips of card into chevron or diamond shapes. Glue onto the wall surface, slightly raised (fold a small tab underneath to create 3D relief).","Show the painting step: once decoration is dry, paint the entire wall face in terracotta or stone grey. The raised decoration catches light and reads clearly."]},{"n":"Build Challenge — Decorating the Gopuram","m":28,"t":"build","s":["Each student takes responsibility for 1 face of the Gopuram (group divides 3 faces among 3 students — the back face is optional if time is short).","Step 1 (6 min): Score the stone-layer friezes onto the face using ruler and scoring tool.","Step 2 (12 min): Add clay relief motifs in 3 locations on the face (one at mid-height, two near the base).","Step 3 (6 min): Cut and apply card appliqué chevron or diamond strips between the clay motifs.","Step 4 (4 min): Apply a base coat of terracotta paint. Do not paint the clay motifs yet — wait for them to dry fully.","Facilitator circulates — check that decoration is on all faces, not just the front."]},{"n":"Test — The Decoration Consistency Check","m":7,"t":"test","s":["Groups walk around the full Gopuram. Is decoration applied to all visible faces?","Aesthetic coherence: does the decoration look like it belongs to one building, or does each face look different? (Aim for coherence — same colour palette, similar motif scale.)","Structural check: has the decoration weakened any walls? Push gently — are the walls still rigid?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Clay must be left undisturbed to dry overnight. Do not move Gopurams until clay is dry.","Paint brushes cleaned thoroughly.","Facilitator: 'Tamil sculptors who decorated Gopurams spent their entire lives on a single tower. You had 28 minutes. The principle is the same: every decoration tells a story, and every story is structural — it ties the wall to the community it serves.'"]}],"diff":{"sup":"Provide a template of motifs to copy. Student scores and applies pre-drawn shapes.","ext":"Paint a complete second coat with colour differentiation (gold for deities, blue for sky elements, red for base friezes — as on painted Gopurams)."},"ass":"Are all 3 primary faces decorated? Are at least 2 friezes and 3 motifs present? Is decoration in bas-relief (raised), not flat drawing?","note":"Allow students genuine creative freedom in this session — the constraint is technique (relief, not drawing), not content. Students who choose personal or contemporary motifs should be encouraged, not redirected to 'traditional' patterns."},{"w":13,"f":"Structural Refinement","bi":"A structure is not finished when it is complete — it is finished when it has been tested and improved.","obj":"Groups identify and repair all structural weaknesses in their Gopuram, add internal bamboo reinforcements, and verify a 1 kg load capacity.","dur":"60 minutes","grp":"Groups of 3","mat":["Gopurams from Week 12","Bamboo sticks (10 per group)","String","Craft glue","Masking tape","Test weight 1 kg"],"voc":[["Structural audit","A systematic inspection of a structure to identify all weaknesses before they become failures"],["Internal reinforcement","Support added inside a structure — hidden from view but critical to performance"],["Load certification","Confirming through a test that a structure can safely carry a specified load"]],"ph":[{"n":"Warm-Up — The Structural Audit","m":8,"t":"intro","s":["Ask: 'Before we test the Gopuram with 1 kg, we need to find every weak point. How do a professional engineer find weak points without breaking the structure?'","Introduce the structural audit: a systematic check of every joint, every column, every platform, and the finial.","Give each group a checklist to work through (write on board): (1) All columns plumb? (2) All platforms level? (3) All joints fully glued? (4) Any cracks or separations? (5) Finial secure? (6) Decoration not covering a structural weakness?","Groups spend 5 minutes performing the audit and marking problem areas with a small sticker."]},{"n":"Skill Demo — Internal Bamboo Reinforcement","m":8,"t":"demo","s":["Show how to add internal bamboo cross-bracing: insert bamboo sticks diagonally inside each tier (from one corner column to the opposite), glued at both ends.","This is invisible from the outside but massively increases resistance to racking loads.","Show how to lash bamboo joints: wrap string tightly around a corner where two bamboos cross. This prevents the glue joint from failing before the bamboo does.","Also show: adding a bamboo spine through all 3 tiers (a central vertical bamboo glued through the centres of all roof platforms) — dramatically increases overall stiffness."]},{"n":"Build Challenge — Audit, Repair, Reinforce","m":28,"t":"build","s":["Groups address every flagged issue from their audit:","Repair step (10 min): re-glue all loose joints. Add tape where glue alone is insufficient. Shim any short columns.","Internal reinforcement (12 min): insert diagonal bamboo cross-braces inside each of the 3 tiers. Lash with string at crossing points.","Central spine (6 min): if the structure still shows any lean, insert a long bamboo through all 3 roof platform centres and glue firmly.","Facilitator: check every group's bamboo reinforcement is actually glued and not just resting loosely."]},{"n":"Test — The 1 kg Load Certification","m":8,"t":"test","s":["Place the 1 kg test weight on the base platform of the Gopuram. Observe for 60 seconds.","Record: did any joint fail? Any column buckle? Any tier shift?","Incremental test: if 1 kg holds, try 1.5 kg — what is the maximum load before first failure?","Issue each group a 'Load Certificate' card with the maximum tested load recorded on it."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Gopurams returned to storage — they must survive overnight in storage and be presentable for Week 14.","Facilitator: 'Every real structure goes through a process exactly like today: structural audit, repair, reinforcement, and load certification. Bridges are load-certified before they open. Aircraft are load-certified before their first flight. Your Gopuram has now been load-certif…"]}],"diff":{"sup":"Provide a completed audit checklist with specific items pre-identified. Student addresses those items.","ext":"Write a 1-page structural audit report with sketches identifying each weak point found and the repair method used."},"ass":"Did the Gopuram hold 1 kg? Were all audit items addressed? Is bamboo reinforcement present inside at least 2 tiers? Does the structure appear structurally sound and presentable?","note":"The load certification moment is highly motivating — make it formal and celebratory. Announce the load, count down, and congratulate each group when their structure passes. Issue the certificate physically if possible."},{"w":14,"f":"Final Gopuram Presentation","bi":"A temple tower is completed not when the last stone is placed, but when it is consecrated — witnessed, blessed, and received by the community. Your Gopuram is completed when it is seen and understood by others.","obj":"Groups present their completed Gopuram to an invited audience, demonstrating structural understanding, heritage connection, and maker pride.","dur":"60 minutes","grp":"Groups of 3 + whole class","mat":["Completed Gopurams","Label cards (group names, tier names, key features)","Load certificate (from Week 13)","Camera for documentation"],"voc":[["Consecration","The ceremony marking the completion and dedication of a temple or sacred structure"],["Presentation","Sharing a creation with an audience — explaining what was made, how, and why"],["Structural narrative","The story of how a structure was engineered — the problems encountered, the solutions found, the choices made"]],"ph":[{"n":"Preparation — Labels and Presentation Rehearsal","m":12,"t":"intro","s":["Groups spend 10 minutes labelling their Gopuram: Adhishthana (base), Level 1–3 tier names, Kalasam, gateway arch.","Each group prepares a 90-second group presentation. Structure: (1) Name and description of your Gopuram, (2) One engineering challenge you faced and solved, (3) One heritage element you included.","Assign presenter roles: one student opens, one explains the engineering, one describes the heritage.","Practise once through while the facilitator listens."]},{"n":"The Presentation — Group Presentations","m":22,"t":"build","s":["All Gopurams displayed on a long table, side by side.","Audience invited (other class, parents, principal, or facilitator panel).","Each group presents for 90 seconds to the full audience.","After all groups have presented: facilitator asks 3 audience questions (e.g. 'Which Gopuram would be most likely to survive a strong wind and why?', 'Which gateway arch is most structurally accurate?')."]},{"n":"Load Test Performance","m":10,"t":"test","s":["Each group presents their Load Certificate from Week 13.","Audience nominates one Gopuram for a 'public load test'. That group repeats the 1 kg test in front of the audience.","Class discussion: 'What makes this Gopuram strong? What would you change if you built it again?'"]},{"n":"Reflection — The Maker Circle","m":8,"t":"close","s":["Students stand in a circle.","Round 1: each student completes the sentence 'The hardest part of building the Gopuram was...'","Round 2: each student completes 'Next year in Grade 4, I will use what I learned about ___.'","Facilitator closes: 'You came into Grade 3 knowing how to cut and join flat cardboard. You leave Grade 3 knowing how to build a tiered tower 70 cm tall that holds 1 kg — using columns, arches, platforms, bracing, and a finial. Grade 4 takes everything you know and scales it up to…"]}],"diff":{"sup":"Pre-write the presentation script for the student. They read from it.","ext":"Deliver an extended structural explanation, comparing the group Gopuram to a real Tamil temple Gopuram using specific measurements and ratios."},"ass":"Can each student explain one engineering decision they made? Does the Gopuram appear complete and presentable? Does it hold 1 kg (verified by Load Certificate)?","note":"This session is the culminating celebration of the year. Prioritise joy, pride, and community. Document everything — photos, video of the load test, audience reactions. Share with parents."}],"g4lessons":[{"w":1,"f":"Modular Panel System","bi":"Modular construction is one of the most powerful ideas in engineering history — identical parts, endlessly combined, create infinite variety.","obj":"Students cut 8 identical wall panel modules and verify they are interchangeable within ±5 mm tolerance.","dur":"60 minutes","grp":"Individual","mat":["A2 cardboard (4 sheets per student)","Steel ruler (30 cm)","Pencil","Safety scissors","Cutting mat","Template card (1 per student — pre-cut A2 to set size by facilitator)"],"voc":[["Module","A standard-sized unit used repeatedly to build a larger structure — identical modules are interchangeable"],["Interchangeable","Parts that are the same size and can replace each other in any position without adjustment"],["Tolerance","The maximum acceptable variation from the target dimension — in this case ±5 mm"]],"ph":[{"n":"Warm-Up — The Power of the Module","m":7,"t":"intro","s":["Show 8 identical pre-cut cardboard panels stacked in a neat stack. Ask: 'Why is it useful that these are all the same size?'","Demonstrate: swap any panel from any position to any other. Each fits perfectly. 'That is interchangeability.'","Connect to Tamil forts: 'Chola and Pandya fort walls were built from stone blocks of a standard size — cut at one location, transported, and assembled by different builders who never met. The modules made that possible.'","Introduce the tolerance concept: '±5 mm means each panel can be up to 5 mm larger or smaller than the target and still work. If your panels are out by 6 mm, the fort wall won't line up.'"]},{"n":"Skill Demo — Template-Based Cutting","m":8,"t":"demo","s":["Show the template card (20 × 15 cm). Explain: 'Every panel is cut by tracing this template — the template guarantees consistency.'","Step 1: Place template on cardboard. Hold firmly with one hand. Trace all 4 edges with a sharp pencil.","Step 2: Remove template. Double-check the tracing — ruler check on each side.","Step 3: Cut along the traced lines. Keep the scissors on the INSIDE of the pencil line (not outside — that adds width).","Step 4: After cutting, place the new panel on top of the template. Overhang = panel is too big. Gap = panel is too small. Maximum 5 mm in any direction."]},{"n":"Build Challenge — 8 Identical Panels","m":28,"t":"build","s":["Each student uses the template to cut 8 wall panels.","Process: trace → check → cut → verify against template → next panel.","Panel 1 (4 min): Take extra care. This panel sets the quality standard for all others.","Panels 2–8 (3 min each): maintain the same process. Speed increases with practice but don't sacrifice accuracy.","After Panel 4: stack all 4 made so far. Sight along the edge — is the stack even?","After Panel 8: full stack test (see below).","Facilitator circulates — offer the template verification check after panels 2, 4, and 8."]},{"n":"Test — The Stack and Rotate Test","m":9,"t":"test","s":["Students stack all 8 panels and hold the stack at eye level. Looking along the long edge: is the stack perfectly even, or does it stagger?","Rotate test: take any 2 panels, swap their positions, and check that the swap doesn't create a gap or overhang when placed next to each other.","Measure the widest and narrowest panel in the stack. Is the difference within 5 mm?","Class discussion: 'Whose 8 panels are the most consistent? What was the trickiest part of the cutting process?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Students bundle their 8 panels with a rubber band. Write their name on the top panel.","Facilitator: 'Eight identical panels. In Grade 2 you cut 5 panels within 3 mm. Now you cut 8 within 5 mm — more panels, tighter system. The Tamil fort has 4 walls, 4 corner towers, a gate, and inner buildings. Every one of them starts with a panel like these. Let's build the wall…"]}],"diff":{"sup":"Reduce to 6 panels. Pre-trace the first 2 panels to give the student a starting point.","ext":"Cut a second set of 8 panels at a different size (the inner-fort buildings are smaller). Label each set clearly."},"ass":"Are all 8 panels within ±5 mm of the template? Does the rotate-and-swap test pass? Can the student explain why interchangeability matters?","note":"The most common error is tracing on the OUTSIDE of the template (making panels 10 mm too large). Demonstrate explicitly: pencil tip touches the template edge, not outside it."},{"w":2,"f":"Interlocking Connections","bi":"The strongest joints in engineering are those that cannot pull apart — because the structure itself prevents it.","obj":"Students design and cut interlocking tab-and-slot connections that allow 4 panels to form a rigid closed square without any tools or adhesive.","dur":"60 minutes","grp":"Individual","mat":["Panels from Week 1 (4 panels)","Steel ruler","Pencil","Safety scissors","Cutting mat"],"voc":[["Interlocking","A connection where parts grip each other mechanically — the geometry prevents separation"],["Shear resistance","A joint's ability to resist sliding forces applied parallel to its face"],["Dovetail","A trapezoidal tab shape that is wider at the tip than at the root — making it impossible to pull straight out once inserted"]],"ph":[{"n":"Warm-Up — Why Glue Fails","m":7,"t":"intro","s":["Show two cardboard pieces glued together. Peel them apart — glue fails suddenly.","Show two cardboard pieces with a tab-and-slot connection. Try to pull them apart — they resist.","Ask: 'Why is the mechanical connection stronger than glue in this case?' (Glue fails in peel; mechanical interlocks resist peel because you'd have to destroy the material.)","Introduce dovetail: 'Ancient Tamil stone-cutters used dovetail joints where stones locked each other — no mortar. The wider tip of the tab means it literally cannot pull out in the direction you'd try to separate the wall.'"]},{"n":"Skill Demo — Cutting a Dovetail Tab & Slot","m":12,"t":"demo","s":["Show the dovetail profile: at the edge of a panel, mark a tab that is 1.5 cm wide at the root (where it meets the panel edge) and 2.5 cm wide at the tip — a trapezoid pointing outward.","Cut the dovetail tab: 3 cuts (two angled sides and across the tip). It's tricky — both angled cuts must be accurate or the dovetail won't lock.","Now cut the matching slot in the receiving panel: trace the dovetail tab onto the receiving edge and cut the slot to match exactly.","Insert: push the tab into the slot. The wider tip passes through the slot opening, then catches. It cannot be pulled back through.","Show the upgrade: a round-end tab (slot with a small circle at the end) prevents the slot from tearing under load."]},{"n":"Build Challenge — 4-Panel Interlocking Square","m":26,"t":"build","s":["Students take 4 panels from Week 1.","Step 1 (8 min): On Panel A, cut a dovetail tab on the RIGHT edge. On Panel B, cut the matching slot on its LEFT edge.","Step 2 (4 min): Test the A-B connection. Does the dovetail lock? If not, adjust the slot width.","Step 3 (8 min): Cut tabs and slots on all remaini
