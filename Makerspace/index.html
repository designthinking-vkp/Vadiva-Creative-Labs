ata: key results from load tests, mBot monitoring, and qualification test.","Page 2, Section 4 — Critical Evaluation: 2 engineering decisions that were correct and 2 that could have been improved, with technical justification for each.","Page 2, Section 5 — Grade 9 Readiness: 3 engineering principles from Grade 8 that will directly apply to Grade 9 maritime construction.","Facilitator: model the executive summary live — 'The bridge is 150 cm long with 2 fixed spans and a central movable section inspired by the Pamban Rail Bridge. It was designed for 3 adults simultaneously and qualified at that load.' 3 sentences. Non-technical. Complete."]},{"n":"Portfolio Construction","m":30,"t":"build","s":["Students write and draw their portfolios individually.","Section 1: 10 min. Draft, check, finalise.","Section 2: 5 min. Numbers only — no prose required.","Section 3: 5 min. Include 1 graph (load vs deflection from Week 12).","Section 4: 8 min. This is the most important section. 'Could have been improved' requires a specific, technical justification.","Section 5: 2 min. Direct and specific.","Facilitator: the critical evaluation section is the most valuable and most often written too vaguely. Intervene with any student who writes 'I would make it stronger' — ask specifically: which member, by how much, and why?"]},{"n":"Portfolio Sharing","m":10,"t":"test","s":["Groups of 3. Each student reads their Section 4 to the group.","Group feedback: is the evaluation specific and technically justified? Is it honest?","Group selects the best Section 5 among them: which member's Grade 9 predictions are most thoughtful?"]},{"n":"Close — The Engineering Archive","m":12,"t":"close","s":["Portfolios collected and archived with the engineering records.","Facilitator reads aloud — without naming the author — the best executive summary and the best critical evaluation from the class. Asks the class to identify what makes each one excellent.","Preview of Grade 9: 'Grade 9 is maritime engineering. The structure you build will not stand on solid ground — it will float on water. The loads are different (buoyancy, wave action), the materials are different (marine plywood, waterproofing compounds), and the failure modes are…","Final words: 'Grade 1 to Grade 8. A cardboard name tag to a Pamban-inspired bridge with a movable span, structural health monitoring, and a qualification certificate signed by the people who built it. That is the Vadiva Creative Labs Makerspace Pathway. Welcome to the end of the …"]}],"diff":{"sup":"Provide the portfolio template with section headings and word count guidance. Student fills in each section.","ext":"Produce a full 4-page engineering portfolio including as-built drawings, a complete maintenance schedule, and a forward specification for a Grade 9 student who will build the next version of the bridg…"},"ass":"Does Section 1 explain the bridge in non-technical language? Does Section 4 contain specific, technically justified evaluations (not vague generalisations)? Does Section 5 identify genuine Grade 9 app…","note":"The Grade 8 engineering portfolio is the most important single document students produce in the Makerspace programme. It travels to Grade 9, Grade 11, and beyond. Treat it accordingly — it deserves facilitator feedback, not just marking."},{"w":14,"f":"Grade 8 Showcase and Programme Reflection","bi":"A bridge built in secret connects nowhere. A bridge built in public — designed, tested, qualified, and opened in full view — becomes part of the community's story. That is what the Pamban Bridge did in 1914. That is what your bridge does today.","obj":"Students present their complete Grade 8 year to the widest possible audience — demonstrating the bridge, the monitoring system, and the engineering record — and formally close the Grade 8 chapter of the Makerspace Pathway.","dur":"60 minutes","grp":"Whole class + widest possible audience","mat":["Complete bridge on display","Engineering records","Portfolios","mBot active","Qualification Certificate displayed","School trustees and parents invited","Crossing register"],"voc":[["Programme","A series of connected projects building toward a long-term goal — the Vadiva Makerspace Pathway is a programme spanning Grades 1–11"],["Milestone","A significant achievement within a programme — Grade 8 is the milestone where structural and mechanical engineering converge in a human-load bridge with a moving span"],["Transition","Moving from one phase of learning to the next — from land-based structures to maritime engineering in Grade 9"]],"ph":[{"n":"Exhibition Setup and Distinguished Guests","m":10,"t":"intro","s":["Widest possible audience: school trustees, all parents, all staff, all grades, and invited professional engineers if available.","Bridge on display with full documentation visible: plan, engineering record, qualification certificate, portfolio samples.","mBot active and monitoring.","Facilitator opens: 'The Vadiva Creative Labs Makerspace Pathway began in Grade 1 with a cardboard name tag stand. It ends today — for this year — with a Pamban-inspired bridge carrying the weight of three adults, with a movable span that opens and closes on command, and a structu…"]},{"n":"Grade 8 Final Presentation","m":22,"t":"build","s":["Each group presents for 90 seconds. The full presentation is followed by a 5-minute movable span demonstration.","mBot frequency is read live during the demonstration: 'The bridge's structural health frequency right now is ___ Hz. When we first measured it 8 weeks ago, it was ___ Hz. It has [not changed / changed by ___ Hz]. This means [the bridge is in the same structural condition / the br…","Audience questions: 3 questions to the full class."]},{"n":"The Crossing Register Ceremony","m":10,"t":"test","s":["School trustees, principal, and parents are invited to cross the bridge.","Each crossing is called out by name: 'The bridge is now carrying ___ kg.'","mBot readings called live during each crossing.","After all crossings: the crossing register is sealed and presented to the school archive.","The facilitator reads aloud the names on the register: 'These are the people who trusted the engineering of Grade 8 today.'"]},{"n":"The Pathway Reflection — Grade 1 to Grade 8","m":10,"t":"close","s":["Show a photograph of a Grade 1 cardboard Tamil village. Then show the Grade 8 Pamban bridge. Ask: 'What is the connection between these two things?'","Students answer. Guide toward: 'Both are made. Both are joined. Both are tested by whether they serve the people who use them. The scale is different. The material is different. The complexity is different. The engineering is different. But the maker is the same person — grown up…","Each student completes: 'I am ready for Grade 9 because I know how to ___.'","Facilitator final close: 'Grade 9 is the waterline. Everything changes. Nothing is lost. See you there.'"]}],"diff":{"sup":"Student's role: movable span operator during the demonstration. Clear, visible, achievable.","ext":"Deliver a 3-minute technical keynote to the trustees on what the Makerspace Pathway has taught them about engineering thinking — not just what they built, but how they learned to think."},"ass":"Did the group present all required sections? Was the mBot demonstration successful? Did the full audience understand what the bridge represents?","note":"This session is not primarily about assessment — it is about celebration and transition. Document everything. The contrast between the beginning and the end of the programme is the most powerful teaching tool available, and it can only be shown, not described."}],"g9lessons":[{"w":1,"f":"Buoyancy Fundamentals — Displacement and Hull Form","bi":"A vessel does not float because it is light. It floats because it displaces enough water to equal its own weight. Understanding this completely changes how you design a hull.","obj":"Groups test 5 hull-form prototypes in a water tray and produce a measured buoyancy curve showing how hull shape affects displacement and stability.","dur":"60 minutes","grp":"Groups of 3","mat":["Water tray (1 per group, 60×40 cm minimum)","Foam blocks A5 (5 per group)","Modelling clay (200 g per group)","Ruler","Test weights (50 g increments to 500 g)","Graph paper","Pencil","Waterproof marker","Small spirit level"],"voc":[["Displacement","The weight of water pushed aside by a floating object — equal to the weight of the vessel (Archimedes' Principle)"],["Waterline","The line on the hull where the water surface meets the hull when the vessel is floating at rest with its normal load"],["Metacentre","The point above the centre of gravity through which the buoyancy force acts when a vessel is tilted — if the metacentre is above the centre of gravity, the vessel is stable"]],"ph":[{"n":"Warm-Up — The Chola Maritime Tradition","m":7,"t":"intro","s":["Introduce the Chola Empire's maritime reach: 9th–13th century, trade routes to Southeast Asia, Sri Lanka, and the Arabian Peninsula. The Chola navy was the first in world history to project power across open ocean.","Show a sketch of a Chola trade vessel: wide beam, shallow draft, lateen sail. Ask: 'Why is the beam (width) of a trade vessel wider than a warship?' (Cargo capacity and stability vs speed.)","Key transition: 'You are moving from building bridges to building vessels. The fundamental challenge changes: a bridge must not move. A vessel must move — and must not sink while doing so. Every engineering decision from now serves those two goals.'","Introduce Archimedes: the buoyancy principle applies to every vessel ever built. Today you measure it directly."]},{"n":"Skill Demo — Testing Hull Forms","m":10,"t":"demo","s":["Build 5 foam hull prototypes: (A) flat plank, (B) V-section, (C) U-section (round bottom), (D) wide shallow barge, (E) narrow deep hull.","Float each in the water tray. Place 100 g weight incrementally. Observe: (1) waterline position, (2) stability (does it tip?), (3) maximum load before swamping.","Measure the waterline with a ruler at the hull side. Mark it with a waterproof marker.","Show that hull D (wide shallow barge) carries the most weight before swamping but tips easily under off-centre load. Hull B (V-section) is the most stable against tipping but has less cargo volume.","Connect to Chola trade vessel: 'The Chola builders used a wide U-section hull — optimised for cargo volume AND stability. You will use the same form.'"]},{"n":"Build Challenge — 5 Form Comparison Tests","m":26,"t":"build","s":["Groups test all 5 hull forms systematically.","For each form: (1) float unloaded — mark waterline, measure freeboard (distance from waterline to deck edge), (2) load to 200 g — measure new waterline and check stability using spirit level, (3) load to maximum before water enters — record maximum load.","Record all data in a comparison table.","After all 5 tests: plot a bar chart of maximum load vs hull form. Which is best for a cargo vessel?","Also assess stability: which forms remain level under off-centre loading?"]},{"n":"Test — The Stability Decision","m":9,"t":"test","s":["Each group presents their data: 'Our optimal hull form for the Chola trade vessel is ___ because it holds ___ g and remained level under off-centre loading of ___ g.'","Class consensus: which hull form will be used for the Grade 9 vessel? Record the decision.","Ask: 'What would happen if we made the hull deeper without changing the width? What would happen if we made it wider without changing the depth?' (Students predict — they will verify during build.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Foam prototypes stored. Water trays emptied and dried.","Facilitator: 'The Chola shipbuilders did not have Archimedes' equations — but they had centuries of empirical observation. They arrived at the same hull form through trial and observation that you just identified through measurement. The principle predates the mathematics by 2,00…"]}],"diff":{"sup":"Reduce to 3 hull forms (B, C, D). Pre-score the foam to the hull shape.","ext":"Calculate the theoretical buoyancy force for each hull form at the measured waterline using ρ × g × V, and compare to the actual load carried."},"ass":"Are all 5 hull forms tested and data recorded? Is the bar chart plotted? Does the group's hull form recommendation include both a load and a stability justification?","note":"Water containment is critical — the tray must be deep enough that waves from adding weights do not slosh over the edge. Use trays with at least 15 cm depth and fill to only 10 cm. Have towels available. An accidental full water tray emptying on the floor is a safety risk."},{"w":2,"f":"Marine Material Selection and Waterproofing Test","bi":"A vessel's hull material must do three things simultaneously that on land are separate problems: it must be stiff, it must be light, and it must be watertight. No single material does all three perfectly — so the hull engineer must choose the best compromise.","obj":"Groups test 4 material combinations for weight, stiffness, and waterproofness, and select the optimal hull skin material for the Chola vessel.","dur":"60 minutes","grp":"Groups of 3","mat":["Marine plywood 6 mm (A4 pieces, 4 per group)","Standard plywood 6 mm (A4 pieces, 2 per group)","PVC sheet 3 mm (A4 pieces, 2 per group)","Foam board 6 mm (A4 pieces, 2 per group)","Water tray","Marine sealant (sample)","Waterproof adhesive (sample)","Test weights","Ruler","Stopwatch"],"voc":[["Marine plywood","Plywood manufactured with waterproof resin between all plies and without interior voids — rated for permanent water contact"],["Delamination","The separation of plywood layers when water penetrates the glue line — the primary failure mode of standard plywood in wet conditions"],["Caulking","The process of sealing the seams between planks with a waterproof compound — equivalent to what the Chola shipwrights did with coconut fibre and fish oil"]],"ph":[{"n":"Warm-Up — Why Material Choice Decides Everything","m":7,"t":"intro","s":["Show a piece of standard plywood that has been soaked for 24 hours: the layers are delaminating, the surface is swollen. Show marine plywood that has been soaked for the same period: essentially unchanged.","Ask: 'These two pieces look identical when dry. How are they different inside?' (Marine plywood: waterproof glue between plies, no voids. Standard: interior-grade glue, possible voids.)","Historical context: 'Chola shipbuilders used teak and other tropical hardwoods — naturally oily and waterproof. They caulked the seams with coconut fibre (coir) pounded in and then sealed with fish oil or tree resin. The caulking was inspected and renewed before every long voyage…"]},{"n":"Skill Demo — The Four Tests","m":10,"t":"demo","s":["Test 1 — Weight: weigh each A4 sheet. Record g/dm². Lighter = more cargo capacity.","Test 2 — Stiffness: span each sheet 30 cm between supports. Place 200 g at centre. Measure deflection. Less deflection = stiffer hull = less flex under wave loading.","Test 3 — Waterproofness (immediate): float each sheet in the water tray for 10 minutes. Check for water absorption by weighing before and after.","Test 4 — Sealed waterproofness: apply marine sealant to the cut edges of the marine plywood sample. Re-soak for 10 minutes. Compare weight gain to unsealed sample.","Show: even marine plywood absorbs water at the cut edge — sealing is essential."]},{"n":"Build Challenge — Material Comparison","m":26,"t":"build","s":["Groups test all 4 materials through all 4 tests.","Test 1 (6 min): weigh all A4 samples. Record.","Test 2 (8 min): stiffness test for all materials. Record deflection.","Test 3 (8 min): soak all materials for 10 min. Weigh after. Calculate % weight gain.","Test 4 (4 min): seal marine plywood edge with sealant. Re-soak 5 min. Compare.","Scoring matrix: rank each material 1–4 for each test (1=best). Sum the ranks. Lowest total = best overall material."]},{"n":"Test — Material Selection Decision","m":9,"t":"test","s":["Each group presents their scoring matrix and recommended material.","Class consensus: marine plywood for the hull skin, with sealed edges. Why?","Discuss the sealing protocol: every cut edge and every fastener hole in the final vessel must be sealed. Unsealed penetrations are the most common cause of hull leaking.","Record the decision and the sealing protocol for use throughout the build."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Water trays emptied. Materials labelled and stored.","Facilitator: 'You have chosen marine plywood. It is the same material used to build the hulls of traditional fishing boats across Tamil Nadu's coast today. The Chola shipbuilders used teak — also naturally waterproof. Different material, identical principle: the hull must resist …"]}],"diff":{"sup":"Pre-complete tests 1 and 2. Group focuses on waterproofness tests and the scoring matrix.","ext":"Research the teak wood properties (density, oil content, natural durability rating) and compare them to marine plywood. Which would be better for the Chola vessel if cost were no object?"},"ass":"Are all 4 materials tested through all 4 tests? Is the scoring matrix completed and used to reach a justified decision? Does the group understand why sealed edges are critical?","note":"Marine sealant fumes — even low-VOC products — require ventilation. Open all windows before applying. Brief students: sealant on skin is non-toxic but hard to remove; sealant on clothing is permanent. Have gloves available."},{"w":3,"f":"Hull Template Design — Full Scale Lofting and Laser CNC Rib Preparation","bi":"The template is the bridge between the idea and the material. Before computers, shipbuilders lofted full-scale on the floor. Today the same template becomes a digital file sent to the laser cutter — and the rib comes back cut to within 0.5 mm of the line.","obj":"Groups produce a full-scale (1:1) hull template on craft paper, verified for symmetry; then translate the rib cross-section into a digital file for laser CNC cutting — producing precision marine ply ribs to the exact lofted profile.","dur":"60 minutes","grp":"Groups of 4","mat":["Craft/brown paper rolls (2 m per group)","Pencil","Steel ruler 1 m","Flexible batten (80 cm)","Set square","String (symmetry check)","Scissors","Laptop with laser CNC software (LightBurn or xTool)","Marine plywood 4 mm (1 sheet — for laser-cut ribs)"],"voc":[["Lofting","Drawing a vessel's hull lines at full scale (1:1) — the master pattern from which all hull pieces are cut"],["Sheer line","The curve of the deck edge from bow to stern — one of the most important hull lines defining the vessel's character"],["Symmetry","The hull must be exactly the same on port (left) and starboard (right) sides — asymmetry causes the vessel to track sideways in the water"]],"ph":[{"n":"Warm-Up — The Vessel Specification","m":8,"t":"intro","s":["Reveal the Grade 9 Chola trade vessel specification: (1) length overall (LOA) = 120 cm, (2) beam (maximum width) = 50 cm, (3) depth (amidships) = 20 cm, (4) hull form: wide U-section (from Week 1 decision), (5) cargo deck: flat area amidships, (6) must float, carry 3 kg cargo, an…","Show a simplified lines drawing: top view (plan), side view (profile/sheer), and end view (cross-section amidships).","Introduce the three key lines: (1) centreline — the hull's axis of symmetry, (2) sheer line — the deck edge curve, (3) keel line — the bottom of the hull. All hull geometry derives from these.","Today: loft the full-scale outline and cross-section onto craft paper, then convert the rib cross-section to a laser CNC file."]},{"n":"Skill Demo — Lofting the Hull","m":10,"t":"demo","s":["Roll out 130 cm of craft paper. Draw the centreline along the length.","Mark the LOA: 120 cm from bow to stern along the centreline.","Sheer line: mark the deck edge height at bow (25 cm above base), amidships (22 cm), and stern (28 cm). Connect with a flexible batten — the batten creates a fair (smooth) curve.","Keel line: mark the keel points at bow (0 cm), amidships (0 cm — flat keel amidships), stern (5 cm — slight rise). Connect with batten.","Beam template: draw the amidships cross-section on a separate sheet. Width = 50 cm, depth = 20 cm. U-shape from Week 1. This is the mould for cutting the hull ribs.","Symmetry check: fold the lofted profile along the centreline. Does the port side exactly mirror the starboard side?"]},{"n":"Build Challenge — Template Set + Digital File","m":25,"t":"build","s":["Step 1 (10 min): loft the side profile, plan view, and amidships cross-section on craft paper. Symmetry check on all three.","Step 2 — Laser CNC file preparation (12 min): open the laser CNC software (LightBurn or xTool Creative Space) on the laptop. Import or draw the amidships rib cross-section at 1:1 scale — exactly matching the lofted paper template. Include the keel notch (a 10×10 mm slot at the bo…","Step 3 (3 min): send the file to the laser CNC machine. The facilitator supervises the cut run. Students watch from the safety distance (0.5 m from machine during cutting).","After cutting: remove the 6 laser-cut ribs. Compare each to the paper template. Tolerance check: any edge should be within ±0.5 mm of the template profile.","Facilitator note on laser CNC: (1) eye protection during any laser operation, (2) ventilation fan must be running, (3) students never reach into the machine during a cut, (4) facilitator opens the lid only after the head has fully stopped."]},{"n":"Test — Template + Rib Review","m":8,"t":"test","s":["Paper template review: are all 3 views present, dimensioned, and symmetric?","Laser-cut rib review: lay all 6 ribs on the paper cross-section template — do they match? Stack all 6: are they identical (no rib should protrude beyond another when stacked)?","Keel notch test: slip the keel strip (cut from scrap) into each rib's notch — does it fit snugly without forcing?","Issue 'Approved for Build' on templates that pass. Groups whose digital file produced out-of-tolerance ribs must identify the source of the error (scaling? wrong line selected?) and correct before Week 4."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Laser-cut ribs labelled (1–6) and stored flat. Paper templates rolled and stored.","Facilitator: 'You lofted a hull by hand — the same way the Chola shipbuilders did. Then you converted that lofted line into a laser file and cut six ribs to ±0.5 mm. Both skills belong to you. The laser cutter is not a shortcut — it is a different tool. It required you to know th…"]}],"diff":{"sup":"Provide a pre-drawn centreline and LOA. Group adds sheer line, keel line, and manages the laser CNC file preparation.","ext":"Loft a full body plan (cross-sections at every 20 cm) and produce a complete set of 7 laser-cut ribs — including a tapered bow rib."},"ass":"Are all 3 paper template views present and symmetric? Do laser-cut ribs match the template within ±0.5 mm? Does the keel notch accept the keel strip without forcing?","note":"The laser CNC file preparation step requires one laptop per group. If only one laptop is available, groups rotate through Steps 2–3 while others complete the paper lofting. The laser cut itself takes approximately 4–6 minutes per sheet. Pre-test the machine at the start of the session with a small t…"},{"w":4,"f":"Hull Frame Cutting — Keel and Jig Saw Cuts","bi":"The keel is the spine. The ribs are the bones. The laser cut the ribs to precision — now the keel needs to be shaped and joined to them. Two cutting methods, one skeleton.","obj":"Groups cut the keel and any remaining hull pieces (keel, bow/stern posts) using the jig saw; the laser-cut ribs from Week 3 are fitted and verified.","dur":"60 minutes","grp":"Groups of 4","mat":["Marine plywood 9 mm (2 sheets per group)","Laser-cut ribs from Week 3","Jig saw (facilitator-operated only)","Clamps","Pencil","Steel ruler","Eye protection","Work gloves","Sandpaper 80 grit"],"voc":[["Keel","The longitudinal structural backbone of a vessel — the lowest member, running from bow to stern"],["Rib (frame)","A transverse structural member — defines the cross-sectional shape of the hull at its position. Multiple ribs at regular intervals create the hull form"],["Notch","A cut-out in a rib where the keel passes through — ensures both keel and rib are at the same level without one sitting on top of the other"]],"ph":[{"n":"Jig Saw Safety — Critical Introduction","m":8,"t":"intro","s":["MANDATORY: jig saw rules for Grade 9. (1) The jig saw is NEVER operated by a student — the facilitator makes all jig saw cuts. Students mark, clamp, and hold; the facilitator cuts. (2) All bystanders stand back 1 m during any cut. (3) Workpiece always clamped to the bench — never…","Show the jig saw: demonstrate how the blade moves (up-down reciprocating motion), how to start a cut, and how the base plate guides the cut depth.","Students' role: (a) trace templates onto plywood, (b) mark all cut lines, (c) clamp workpiece to bench, (d) stand clear, (e) the facilitator cuts, (f) students deburr and sand after cutting."]},{"n":"Skill Demo — Tracing and Preparing for Cuts","m":10,"t":"demo","s":["Trace the keel template onto marine plywood. Show how to hold the template firmly while tracing — any movement creates an inaccurate line.","Mark all rib positions on the keel: 6 ribs at 20 cm intervals along the 120 cm keel. Mark the notch positions on the keel (where each rib will slot in).","Trace 2 rib templates. Label each with its position number.","Clamp protocol: 2 clamps minimum per cut — one at each end of the cut line. Test the clamp: workpiece must not move when pushed firmly.","Facilitator then cuts the demo keel and 2 ribs while students observe."]},{"n":"Build Challenge — Cut All Hull Frame Pieces","m":28,"t":"build","s":["Groups trace all hull frame pieces onto marine plywood: 1 keel + 6 ribs.","Step 1 (8 min): trace keel template onto plywood. Mark all 6 rib notch positions.","Step 2 (6 min): trace all 6 rib templates.","Step 3 (14 min): facilitator cuts all pieces (students queue with their clamped workpieces). While waiting: students prepare the next piece for tracing.","After all cuts: students sand all cut edges with 80 grit. Remove all splinters.","Facilitator: after each cut, student compares cut piece to its template. Any deviation > 3 mm must be noted and assessed for impact on fit."]},{"n":"Test — Frame Fit Check","m":7,"t":"test","s":["Assemble the dry fit: slip all 6 ribs into their keel notches. Does each rib sit squarely in its notch? Is any rib leaning?","Check: are all rib tops at consistent heights? (Place a straight edge across all rib tops — they should all be at the same level.)","Any rib that doesn't fit: identify whether the notch is too narrow or the rib tab is too wide. Pare with sandpaper to fit."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Hull frame pieces labelled (keel, rib 1–6) and stored flat.","Facilitator: 'You now have the skeleton of a Chola trade vessel. Six ribs on a keel — exactly as the ancient Tamil shipwrights assembled their teak-frame vessels. Next week: the planks. The hull begins to close.'"]}],"diff":{"sup":"Facilitator pre-traces the keel and first 2 ribs. Students trace the remaining 4 ribs.","ext":"Cut a seventh rib at the bow position with the more extreme curve of the bow cross-section — this is the hardest cut in the hull frame."},"ass":"Do all 6 ribs sit in their notches without leaning? Are all rib tops at consistent height (straight edge test)? Are all cut edges sanded smooth?","note":"The jig saw exclusively operated by the facilitator rule is absolute. This is the most dangerous tool in the entire programme. Students should understand that this is not a confidence issue — jig saw injury rates are high even among trained woodworkers, and in a classroom context the risk is unaccep…"},{"w":5,"f":"Hull Frame Assembly","bi":"The hull skeleton assembly is the moment the vessel's three-dimensional form becomes real. What was 2D on a template is now 3D in wood.","obj":"Groups assemble the keel and all ribs into a rigid, symmetric hull skeleton using waterproof adhesive and clamps.","dur":"60 minutes","grp":"Groups of 4","mat":["Keel and ribs from Week 4","Waterproof adhesive (epoxy or PVA marine grade)","C-clamps (8 per group)","Set square","Steel ruler","Sandpaper","Spirit level","Flat work surface"],"voc":[["Square to keel","When a rib is installed exactly perpendicular to the keel — essential for a symmetrical hull"],["Fair hull","A hull with smooth, continuous curves from bow to stern — no kinks or flat spots. Fairness is both aesthetic and hydrodynamic"],["Dry fit","Assembling all pieces without adhesive first — checks that all joints fit before the irreversible step of gluing"]],"ph":[{"n":"Warm-Up — Symmetry and Squareness","m":7,"t":"intro","s":["Hold a completed rib in the keel notch without glue. Ask: 'How do we know this rib is square to the keel? It looks right — is looking enough?'","Show the set square test: place the set square against the keel face and the rib face. Any gap = not square.","Introduce the spirit level test: place the spirit level across the tops of 2 opposite ribs. Are they level with each other?","Explain: 'An asymmetric hull will always tend to turn in the water. The vessel will not track straight. The paddler will fight the hull rather than directing it. Squareness is not a cosmetic standard — it is a performance standard.'"]},{"n":"Skill Demo — Assembly Sequence","m":10,"t":"demo","s":["Dry fit all ribs into the keel notches. Check: do all fit? Are all square? Mark any that need adjustment.","Assembly order: (1) amidships rib first (rib 3 or 4 — the widest), (2) bow ribs, (3) stern ribs. Working from the widest rib outward maintains the fair curve.","Gluing: apply waterproof adhesive to both faces of each rib notch and to the mating rib tab. Insert rib. Set square check. Clamp. Hold 5 minutes before moving to the next rib.","Spirit level check after every 2 ribs: are all rib tops at the same height? If not — which rib is low or high? Adjust before glue sets."]},{"n":"Build Challenge — Full Frame Assembly","m":28,"t":"build","s":["Groups assemble their hull frames following the demo sequence.","Dry fit all 6 ribs first. Correct any that don't fit squarely.","Glue and clamp amidships rib (5 min).","Add bow ribs 2 and 1 (5 min each).","Add stern ribs 5 and 6 (5 min each).","Spirit level check after each pair. Set square check on every rib.","Facilitator: the spirit level check is mandatory before each new rib. A rib installed while previous ribs are still adjustable can correct for accumulated error — but only if checked."]},{"n":"Test — Skeleton Symmetry Assessment","m":7,"t":"test","s":["Measure the beam (width) at every rib: is it consistent with the template? (Should match the cross-section template from Week 3.)","Spirit level across rib tops: are all within 3 mm of each other?","Sighting test: crouch down and look along the keel from bow. Does the hull form a fair curve, or are there kinks where ribs are misaligned?","Fair assessment: if kinks are present, identify the rib causing them and adjust before glue fully sets."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Hull skeletons stored on flat surfaces — NOT standing on edge or sitting on the keel. The rib-and-keel assembly is fragile until planked.","Facilitator: 'The skeleton stands. It has symmetry, squareness, and a fair hull form — the three properties that determine whether this vessel will float, track, and carry its cargo. Next week: planking. The hull closes.'"]}],"diff":{"sup":"Pre-dry-fit all ribs and mark which need adjustment. Group focuses on the gluing, clamping, and squareness checking.","ext":"Make a photographic record of the assembly sequence — documenting the order, the squareness checks, and the spirit level readings. This becomes part of the vessel's build record."},"ass":"Are all 6 ribs square to the keel (set square check)? Are all rib tops within 3 mm of each other (spirit level check)? Is the hull form fair when sighted from bow?","note":"The clamp queue creates a pacing challenge — only 8 clamps available, each needing 5 minutes minimum. Brief groups to plan the gluing sequence before starting. If a rib is glued out of sequence, it may be impossible to clamp correctly. The amidships-first rule exists precisely to manage this."},{"w":6,"f":"Hull Planking Phase 1 — Lower Hull","bi":"Planking transforms a skeleton into a shell. Each plank must follow the curve of the hull, be pressed flush against every rib it crosses, and leave no gap at the seam — because every gap is a potential leak.","obj":"Groups apply marine plywood planks to the lower half of the hull skeleton, achieving a flush, gap-free lower hull skin that holds water in a 10-minute tray test.","dur":"60 minutes","grp":"Groups of 4","mat":["Hull skeleton from Week 5","Marine plywood 4 mm (1 sheet per group)","Waterproof adhesive","Jig saw (facilitator only)","Clamps and spring clips (12 per group)","Masking tape (temporary clamping)","Waterproof marker","Sandpaper"],"voc":[["Plank","A longitudinal hull skin panel — cut to follow the curve of the hull from rib to rib"],["Steaming","Heating wood with steam to temporarily make it flexible enough to bend around the hull curve — not needed for thin plywood, which bends cold"],["Garboard strake","The plank immediately adjacent to the keel — the lowest plank on each side, and the one most exposed to water pressure"]],"ph":[{"n":"Warm-Up — Planking Strategy","m":7,"t":"intro","s":["Show the hull skeleton. Ask: 'The hull has a curve. The plywood sheet is flat. How do we make a flat sheet follow a curved surface?'","Guide: 'Thin plywood (4 mm) can be bent cold — curved by hand — enough to follow the gentle curves of a small boat hull. Thicker ply requires steaming or scoring. 4 mm is our limit without special treatment.'","Planking sequence: always start from the keel (garboard strake) and work upward. The lowest plank defines the angle for all planks above it.","Key rule: every plank must touch every rib it crosses. Any gap between plank and rib = a flex point = a future crack. Clamp at every rib — not just at the ends."]},{"n":"Skill Demo — Planking Technique","m":10,"t":"demo","s":["Place a 4 mm plywood strip against the hull from keel to rib top level. Mark where it naturally wants to lie — this is the first plank width.","Mark the plank boundary with waterproof marker directly on the hull skeleton. Remove plank.","Facilitator cuts the plank with jig saw to the marked width.","Apply waterproof adhesive to all rib faces that the plank will cross. Press plank against ribs. Clamp with spring clips at every rib. Masking tape at the keel edge.","Check: no gap between plank and any rib. No gap at the keel seam.","While the first plank sets: mark the second plank (directly above the first, same technique)."]},{"n":"Build Challenge — Lower Hull Planking","m":28,"t":"build","s":["Groups plank the lower half of the hull (from keel to the widest point of each rib).","Port side planking (14 min): 3–4 planks from keel upward. Each plank marked, cut by facilitator, glued, clamped.","Starboard side (14 min): mirror of port side. Critical: port and starboard planks must be placed at matching heights — uneven planking creates asymmetry.","Clamp density: every rib gets a spring clip. The keel seam gets masking tape overlay.","Facilitator: manage the jig saw queue — only 1 cut in progress at a time."]},{"n":"Test — 10-Minute Water Test","m":7,"t":"test","s":["With lower hull planked and adhesive set: place hull skeleton (lower half) in the water tray, planked side down.","Fill with water to the planking height. Wait 10 minutes.","Inspect: any drips from the outside of the hull? Any water ingress at seams?","Mark any leak points with a dry-erase marker. These will be addressed in the sealing sessions."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Hulls stored planked-side-down on a flat surface. Clamps and spring clips left on overnight.","Facilitator: 'Half the hull is planked and water-tested. The lower hull sets the standard for the upper hull — and then comes the waterproofing. If the garboard strake is well fitted, the vessel will be tight at its most critical waterline zone. Check the strake before the upper …"]}],"diff":{"sup":"Pre-mark the first 2 plank boundaries. Group applies adhesive, positions, and clamps.","ext":"Develop a plank-expansion table — calculate the exact width of each plank at bow, amidships, and stern, and determine how the plank width must taper to follow the hull curve. This is a professional bo…"},"ass":"Is every plank flush against every rib it crosses (no visible gap)? Does the hull pass a 10-minute water test without visible leak at the planked section?","note":"Spring clips are the most important consumable in this session — they need to be strong enough to hold thin plywood tight against curved ribs. Test the clips before the session. Weak clips allow the plank to spring away from the rib while the adhesive sets, creating a permanent gap."},{"w":7,"f":"Hull Planking Phase 2 — Upper Hull and Waterproofing Layer 1","bi":"A vessel with a complete hull and no waterproofing is not a vessel — it is a sieve. Waterproofing is not the last detail. It is the fundamental requirement without which nothing else matters.","obj":"Groups complete upper hull planking and apply the first waterproofing layer to all seams and surfaces, passing a 30-minute immersion test.","dur":"60 minutes","grp":"Groups of 4","mat":["Hulls from Week 6","Marine plywood 4 mm (remaining from previous session)","Marine sealant (caulking compound — 2 tubes per group)","Caulking gun (1 per group)","Waterproof adhesive","Jig saw (facilitator only)","Clamps and spring clips","Sandpaper 80 and 120 grit","Spatula","Gloves","Water tray"],"voc":[["Marine sealant","A flexible waterproof compound applied to seams — it remains flexible after curing, allowing the hull to flex slightly without cracking the seal"],["Seam","The join between two adjacent planks — the primary location of water ingress if not properly sealed"],["Below waterline","The portion of the hull below the waterline — must have the highest waterproofing standard because it is under permanent water pressure"]],"ph":[{"n":"Warm-Up — Sealant Safety and Technique","m":7,"t":"intro","s":["Marine sealant safety: (1) gloves mandatory, (2) ventilation required — open all windows, (3) sealant on skin: wash off immediately. (4) Sealant sets hard in approximately 24 hours — once applied, it cannot be removed cleanly.","Show the caulking gun operation: cut the nozzle at 45°, pierce the inner membrane, load the cartridge, test bead on scrap.","Introduce the below/above waterline distinction: 'The hull planks below the waterline will be permanently submerged. Every seam below the waterline gets a double seal — sealant into the seam gap + waterproof adhesive coat over the plank surface.'"]},{"n":"Build Challenge — Upper Planking + Sealing","m":35,"t":"build","s":["Phase A — Upper planking (15 min): complete the upper hull planking using the same technique as Week 6. Upper planks extend from the widest rib point to the sheer line (deck edge).","Phase B — Below waterline sealing (10 min): apply marine sealant into every plank-to-plank seam below the waterline. Smooth with spatula. Wipe excess with a damp cloth.","Phase C — Full hull surface coat (10 min): apply a thin coat of waterproof adhesive over all plank surfaces below the waterline. Brush or roller application. Smooth, no drips.","Facilitator: monitor sealant application — the bead must fill the seam gap fully. A surface-only bead that bridges the gap without entering it is not waterproofing."]},{"n":"Test — 30-Minute Immersion","m":8,"t":"test","s":["Place the fully planked and sealant-applied hull in the water tray. Fill with water to near the sheer line.","Wait 30 minutes without touching the hull.","After 30 minutes: remove hull. Inspect the inside surface. Any damp patches? Any visible water ingress?","Leak mapping: mark every leak location. These must be re-sealed before the next session.","Accept: up to 2 minor drips in 30 minutes. Fail: any running water or significant damp patch."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Hulls stored upright (not upside down — the sealant is still curing). Do not move for 4 hours.","Caulking guns cleaned. Gloves disposed of.","Facilitator: 'The Chola shipwrights caulked their vessels with coir and fish oil — a process that took days and was renewed before every major voyage. You applied synthetic marine sealant in 10 minutes. The principle is identical: fill every gap between the planks with a flexible…"]}],"diff":{"sup":"Pre-mark the upper plank positions. Group focuses on caulking and waterproofing application.","ext":"Apply fibreglass cloth over the entire hull exterior below the waterline — a modern boatbuilding technique that provides the ultimate waterproof coating."},"ass":"Is the upper hull fully planked? Does the 30-minute immersion test show ≤ 2 minor drips? Are all seam gaps filled (not just surface-coated)?","note":"The 30-minute immersion test should run while students are doing other tasks — it does not require 30 minutes of watching. Set a timer and use the time to address sealant application quality issues on the hulls that are not yet being tested."},{"w":8,"f":"Waterproofing Layer 2 and Buoyancy Trial 1","bi":"The first time a vessel touches the water is the most honest moment in the build. The water will find every flaw that the build process missed.","obj":"Groups apply a second complete waterproofing coat to all surfaces, then conduct the first full buoyancy trial: empty hull, waterline marked, freeboard measured.","dur":"60 minutes","grp":"Groups of 4","mat":["Hulls from Week 7","Marine paint or second waterproof coat (2 tins per group)","Paintbrushes","Water test tank or large tray (big enough to float the hull)","Waterproof marker","Ruler","Spirit level","Scale"],"voc":[["Freeboard","The height of the hull side above the waterline — the margin between water level and the deck edge"],["Trim","The longitudinal balance of a vessel — a vessel in good trim sits level fore and aft (bow and stern at the same waterline height)"],["List","A permanent sideways tilt of a vessel — indicates that weight is unevenly distributed port to starboard"]],"ph":[{"n":"Warm-Up — What the Water Tells You","m":7,"t":"intro","s":["Ask: 'When we put this hull in the water for the first time, what will the water tell us?'","Guide: '(1) Does it float? (2) Which side does it list to? (3) Where is the waterline? (4) How much freeboard (space above the waterline) do we have for cargo?'","Each of these questions gives actionable engineering data. Today we gather all four.","Introduce the concept of trim: 'A vessel is trimmed when its waterline is parallel to the water surface — it is floating level, not bow-up or stern-down. Poor trim reduces cargo capacity and increases drag.'"]},{"n":"Build Challenge — Second Waterproofing Coat","m":20,"t":"build","s":["Apply the second waterproof coat — this time to the ENTIRE hull surface, inside and outside.","Outside coat: marine paint or sealant coat over the entire outer hull. No bare wood visible.","Inside coat: important — the inside of the hull (bilge area) must also be sealed. Water that enters through any gap will sit in the bilge. An unsealed bilge rots and weakens the hull from inside.","Pay particular attention to: (1) keel line, (2) stem and stern posts, (3) every fastener or nail hole.","Allow 20 minutes to set before water trial."]},{"n":"Test — Buoyancy Trial 1","m":20,"t":"test","s":["Weigh the empty hull. Record weight.","Lower the hull gently into the water tank. Observe: does it float immediately? Which side is low?","Let it settle for 2 minutes without touching it.","Mark the waterline on all 4 sides with a waterproof marker.","Measure freeboard (sheer line to waterline) at bow, amidships, and stern. Record.","Trim check: are bow and stern freeboards equal? Is the hull level port-to-starboard?","Calculate: using the displacement principle, verify that the displaced water weight equals the hull weight (measured at the start)."]},{"n":"Analysis — Trim Correction Plan","m":7,"t":"test","s":["If the hull has positive freeboard (waterline below sheer line) with space for 3 kg cargo — proceed.","If the hull is listing to one side: identify why (asymmetric planking, heavy section). Plan: add ballast to the high side in the cargo hold.","If bow or stern is low: plan to redistribute the cargo space to balance the hull.","Record all findings. The trim correction will be applied in Week 11 (weight distribution session)."]},{"n":"Clean-Up & Close","m":6,"t":"close","s":["Hull removed from tank and dried gently. Mark any new leak locations that appeared during the trial.","Facilitator: 'Your vessel floated. That is not guaranteed — it is earned. The waterline you marked today is the most important line on the vessel. Everything above it stays dry. Everything below it must stay watertight. For the rest of the build, protect that line.'"]}],"diff":{"sup":"Facilitator assists with the waterline marking and trim measurements.","ext":"Calculate the vessel's prismatic coefficient (ratio of displaced volume to the volume of the surrounding prism) — a naval architecture measure of hull efficiency."},"ass":"Does the hull float with positive freeboard? Is the waterline marked at all 4 points? Is the trim analysis (bow/stern/port/starboard) recorded?","note":"The tank must be large enough that the hull can float freely without touching the sides — any sidewall contact distorts the trim observation. Minimum tank size: hull length + 30 cm each side, hull beam + 30 cm each side."},{"w":9,"f":"Cargo Hold Construction","bi":"A cargo hold is not just a space — it is an engineered compartment designed to prevent a single catastrophic failure from sinking the vessel. The watertight bulkhead is the single most important safety invention in maritime history.","obj":"Groups build an internal cargo hold with sealed bulkheads, fitted into the hull amidships, that holds a 3 kg cargo load without water ingress for 20 minutes.","dur":"60 minutes","grp":"Groups of 4","mat":["Hull from Week 8","Marine plywood 4 mm (scraps and offcuts)","Waterproof adhesive","Marine sealant","Clamps","Jig saw (facilitator only)","Sandpaper","3 kg test load (waterproof bag of sand)","Water tray"],"voc":[["Bulkhead","A vertical partition that divides a vessel's interior into separate compartments — watertight bulkheads prevent flooding from spreading through the whole vessel"],["Bilge","The lowest interior space of the hull — where any water that enters the vessel collects"],["Compartmentalisation","Dividing a vessel into separate watertight spaces — if one compartment floods, the others remain intact and the vessel continues to float"]],"ph":[{"n":"Warm-Up — Why Bulkheads Saved Ships","m":7,"t":"intro","s":["Introduce the Titanic: no watertight bulkheads above a certain height — when the compartments filled beyond that height, water flowed over the tops and flooded the next compartment sequentially.","Contrast with modern vessels: full-height watertight bulkheads. If one compartment floods, the vessel can still float on the remaining buoyancy.","Chola vessels: the ancient Tamil seafarers used bamboo or timber bulkheads in their cargo vessels — this is one reason they could survive the open ocean routes to Southeast Asia.","Grade 9 specification: the cargo hold has 2 bulkheads (fore and aft) creating a sealed central cargo compartment. If the bow or stern section floods, the cargo hold remains dry."]},{"n":"Skill Demo — Bulkhead Installation","m":10,"t":"demo","s":["Cut two bulkhead panels from 4 mm marine ply. Each fits snugly between the port and starboard hull sides at the cargo hold boundary.","Fit dry: the panel must sit against the rib at its position and press flush against the hull sides. Mark any gaps.","Seal the perimeter: run a bead of marine sealant around the perimeter of the bulkhead panel where it meets the hull sides and the bottom planking.","Press panel into position while sealant is wet. Hold with spring clips. Let set 20 minutes.","Cargo deck: a flat panel of 4 mm ply fitted above the bilge inside the cargo hold — cargo sits on this deck, not directly on the hull bottom. Allows bilge water to collect below without wetting the cargo."]},{"n":"Build Challenge — Cargo Hold Assembly","m":28,"t":"build","s":["Step 1 (6 min): cut 2 bulkhead panels and the cargo deck panel to fit.","Step 2 (8 min): seal and install forward bulkhead. Spring clip and leave to set.","Step 3 (8 min): seal and install aft bulkhead. Spring clip.","Step 4 (6 min): install cargo deck panel — seal all edges to bulkheads and hull sides.","While steps are setting: apply a second sealant bead to the first bulkhead.","Facilitator: check that the cargo deck is level — tilt it and any cargo will slide to one end."]},{"n":"Test — 20-Minute Cargo Load Test","m":7,"t":"test","s":["Float the hull in the water tray. Place the 3 kg test load in the cargo hold.","Observe trim: does the hull remain level with the cargo load?","After 20 minutes: remove test load and inspect cargo hold interior. Any water ingress through the bulkheads?","Freeboard with 3 kg cargo: measure at bow, amidships, stern. Is there still positive freeboard (above-water deck edge)?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Hulls stored on flat surface. Cargo hold left to dry completely.","Facilitator: 'Your vessel now has a purpose: it carries cargo. The cargo hold is sealed by two bulkheads — a structural and safety innovation that the ancient Chola mariners used to cross the Bay of Bengal. Today it carried 3 kg of sand. In Week 13 it will be tested under real wa…"]}],"diff":{"sup":"Pre-cut both bulkhead panels. Group focuses on sealing, installation, and testing.","ext":"Install a drain plug in each bulkhead — a removable plug that allows the bilge to be drained when the vessel is out of water. Design the plug to be watertight under water pressure."},"ass":"Are both bulkheads watertight after 20 minutes? Is the cargo deck level? Does the hull maintain positive freeboard with 3 kg cargo?","note":"The sealant sets in 20–30 minutes — timing is critical. If the cargo hold test begins before the sealant is fully set, the bulkheads will leak. Plan the session so the bulkhead sealing happens in the first half and the test happens after the minimum setting time."},{"w":10,"f":"Weight Distribution and Cargo Testing","bi":"A fully loaded vessel that lists or trims incorrectly is more dangerous than an empty vessel. The cargo master on a Chola trade ship was as important as the navigator — because wrong loading could sink the ship without any storm.","obj":"Groups systematically test cargo placement positions and determine the optimal loading arrangement for maximum carrying capacity with stable trim.","dur":"60 minutes","grp":"Groups of 4","mat":["Hulls with cargo holds from Week 9","Test weights (50 g increments to 3 kg, waterproof)","Water tray / tank","Ruler","Waterproof marker","Spirit level","Recording chart"],"voc":[["Centre of buoyancy","The centroid of the submerged volume — the point through which the buoyancy force acts upward"],["Loading plan","A document specifying where each cargo item is placed in the vessel — essential for maintaining safe trim and stability"],["Stability curve","A graph showing the vessel's righting moment (ability to return to upright after being tilted) against the angle of heel — the most important safety document for any vessel"]],"ph":[{"n":"Warm-Up — The Science of Loading","m":7,"t":"intro","s":["Show a loaded model vessel with all weight at one end: it trims bow-down dramatically.","Move the weight to the other end: trim reverses.","Move the weight to the exact centre: level trim.","Ask: 'What if the cargo is not all the same weight? What if the heavy items are at the bottom and light items on top?' (Heavy low = good stability. Heavy high = poor stability, greater risk of capsize.)","Today: systematic testing. Measure trim and stability at 5 different cargo arrangements. Find the optimal."]},{"n":"Build Challenge — Systematic Loading Tests","m":30,"t":"build","s":["Test 5 cargo arrangements (each uses the same total 3 kg cargo weight):","Arrangement A: all weight forward of amidships.","Arrangement B: all weight aft of amidships.","Arrangement C: all weight amidships.","Arrangement D: weight spread evenly fore and aft.","Arrangement E: heavy weights low (in bilge area), light weights on deck.","For each arrangement: (1) float vessel, (2) measure bow, amidships, stern freeboard, (3) note trim angle (use spirit level across deck), (4) tilt the vessel 10° by pressing one side — does it return to level? How fast?","Record all data in the comparison table."]},{"n":"Test — Optimal Loading Plan","m":10,"t":"test","s":["From the data, identify the optimal loading arrangement: (1) level trim, (2) maximum freeboard, (3) fastest return to upright after a tilt test.","Record the optimal arrangement as the vessel's official Loading Plan.","Calculate: with the optimal arrangement, what is the maximum cargo weight before the freeboard reaches zero?","This maximum is the vessel's rated cargo capacity — record it on the vessel's build record."]},{"n":"Clean-Up & Close","m":13,"t":"close","s":["Hull dried and stored. Loading plan recorded in the vessel's build record.","Facilitator: 'The Chola trade vessels carried spices, cloth, gold, and pottery across the Indian Ocean. The cargo master loaded them according to rules developed over generations: heavy items amidships and low, light items forward and aft, never load to more than 80% of capacity.…"]}],"diff":{"sup":"Provide a pre-formatted recording chart. Group focuses on the loading tests and reading the data.","ext":"Plot the stability curve: for each loading arrangement, tilt the vessel to 10°, 20°, and 30° and record whether it returns to upright. Plot angle vs return-to-upright time. Identify the arrangement wi…"},"ass":"Are all 5 arrangements tested with all measurements recorded? Is an optimal loading plan identified with justification? Is the rated cargo capacity calculated?","note":"The 10° tilt test is the most important safety test in this session. A vessel that does not return to upright from 10° is not safe for water trials regardless of its cargo capacity. If any arrangement fails this test, it must be excluded from the loading plan options."},{"w":11,"f":"Sail Construction and Paddle Propulsion — Sewing Machine and Embroidery","bi":"The Chola trade fleet used lateen sails — triangular sails on a long yard — to sail close to the wind. The sail is not decoration. It is a power system. A well-sewn sail that captures wind gives the vessel range beyond human paddle endurance.","obj":"One pair designs and sews a lateen-style sail prototype on the sewing machine; the other pair builds the paddle system. Both are tested on the vessel. The embroidery machine adds a Chola maritime motif to the sail.","dur":"60 minutes","grp":"Groups of 4 (2 pairs — one pair sails, one pair paddles)","mat":["Hull from Week 10","Cotton canvas fabric (0.5 m per group)","Sewing thread (heavy-duty)","Embroidery thread (Chola heritage — terracotta, gold)","Embroidery stabiliser","Lightweight wood 25×10×90 cm (4 shafts — paddles)","Marine plywood 4 mm scraps (paddle blades)","Rope for sail rigging (2 m)","Waterproof adhesive","Sandpaper","Clamps"],"voc":[["Blade","The flat working surface of a paddle — converts the paddler's stroke into thrust through the water"],["Shaft","The handle/pole of the paddle — transmits the paddler's force from the grip to the blade"],["Lateen sail","A triangular sail set on a long yard angled across the mast — the sail type used by Chola trade vessels; efficient for sailing close to the wind"],["Running stitch","The most basic sewing machine stitch — a straight line of stitches used for seams and hems on the sail panels"]],"ph":[{"n":"Warm-Up — Chola Propulsion Systems","m":7,"t":"intro","s":["The Chola trade fleet used two propulsion systems: oar power for harbour manoeuvring and light wind, and lateen sails for open-ocean passage. Today your group produces both.","Pair allocation: Pair A builds 2 paddles (same process as previous programme years). Pair B sews the lateen sail on the sewing machine and then adds a heritage motif on the embroidery machine.","Both pairs work simultaneously for the first 40 minutes. Final 15 minutes: integration and combined test.","Sewing machine safety: (1) fingers never under the presser foot, (2) always cut thread with the machine's cutter — not scissors near the needle, (3) lower the needle into the fabric before starting — never start with the needle in mid-air."]},{"n":"Pair A — Paddle Build","m":38,"t":"build","s":["Shaft: 90 cm lightweight wood strip. Sand the grip end smooth. Rope wrapping (4 turns at the grip zone).","Blade: 15 × 10 cm oval from 4 mm marine ply. Facilitator cuts with jig saw. Sand all edges.","Connection: slot in shaft end (10 mm wide, 3 cm deep). Waterproof adhesive. Clamp.","Reinforcement: rope wrap + adhesive coat over joint.","Build both paddles and water-test each blade while the other cures."]},{"n":"Pair B — Sail Sewing and Embroidery","m":38,"t":"build","s":["Sail design (5 min): draw a 40 × 30 cm right-triangle lateen sail shape on the canvas with pencil. Mark the hem allowance (1.5 cm on all edges).","Cutting (3 min): cut canvas to the marked outline with fabric scissors. Cut 3 strips of canvas (1.5 cm wide) for rope channels at the sail edges.","Sewing machine — hem (10 min): fold each edge 1.5 cm and sew a running stitch hem on all 3 sides. Thread colour: natural or terracotta.","Sewing machine — rope channels (8 min): sew the three canvas strips over each hemmed edge to create a channel through which the rigging rope will thread.","Embroidery machine — Chola motif (12 min): load a pre-prepared DST/PES file of a Chola ship prow motif or a simplified kolam pattern. Hoop a 10 × 10 cm section of the sail. Stitch the motif in gold and terracotta thread on the sail face. Remove from hoop. Trim stabiliser.","Rigging (5 min): thread the rigging rope through the rope channels. Attach to a mast (a 50 cm bamboo stick) at the appropriate angle for a lateen configuration."]},{"n":"Integration Test — Sail + Paddle Combined","m":8,"t":"test","s":["Mount the mast in the vessel's cargo hold (lashed to a central rib with rope). Rig the sail.","Place the vessel in the water tray. Does the sail change the trim? (A mast offset from centre may tilt the vessel.)","Paddle test: with sail furled (tied back), propel with paddles. Record straight-line tracking.","Sail test: in a gentle current from a fan (if available) or manual breath, unfurl the sail. Does the vessel move under sail power alone?","Combined: paddle + sail. Note any interference between the two systems."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Sewing machine: remove fabric, cut and tie thread ends, cover machine.","Embroidery machine: remove hoop, save DST file, cover machine.","Paddles stored. Hulls dried. Sail rolled and stored separately (do not wet — the embroidery thread is water-sensitive until sealed).","Facilitator: 'The sail your pair just sewed is the same shape as the Chola lateen sail depicted in temple sculptures at Thanjavur. The embroidery machine stitched a motif in gold thread that those sailors would have recognised. Engineering and craft are not opposites — both were …"]}],"diff":{"sup":"Pair A: pre-cut blade ovals. Pair B: use a pre-drawn sail template and a pre-loaded embroidery file.","ext":"Calculate the sail area and estimate the force (thrust) it generates at a wind speed of 5 knots (approximate Beaufort 2). Compare to the estimated paddle thrust."},"ass":"Are both paddle blade joints rigid? Is the sail hemmed on all 3 sides with rope channels? Is the embroidery motif placed on the sail? Does the vessel move under sail power in the test?","note":"The sewing machine and embroidery machine must be pre-set up and tested before the session. The embroidery motif file should be prepared in advance (a simple 10×10 cm design in 2 colours — approximately 5,000 stitches — takes 8–10 minutes to embroider). If the embroidery machine is not available in …"},{"w":12,"f":"Balance Optimisation and mBlock Stability Testing","bi":"A vessel ready for water trials must have passed every test in the harbour before it ever leaves. The purpose of preparation is to ensure that surprises happen in controlled conditions — not in open water.","obj":"Groups apply the optimal loading plan from Week 10, verify stability using the mBot sensor, and address any remaining waterproofing issues before the water trial.","dur":"60 minutes","grp":"Groups of 4","mat":["Complete vessel from Week 11","mBot kit","Laptop with mBlock","USB cable","Test cargo (3 kg)","Water tray","Marine sealant (for final sealing)","Sandpaper"],"voc":[["Roll period","The time it takes for a vessel to complete one sideways oscillation — a longer roll period indicates a more stable vessel"],["Metacentric height (GM)","A measure of initial stability — larger GM means greater stability but a stiffer (quicker) roll. Chola trade vessels had moderate GM for comfort on long voyages"],["Waterline beam","The width of the vessel at the waterline — a primary stability parameter"]],"ph":[{"n":"Warm-Up — Final Pre-Trial Checklist","m":8,"t":"intro","s":["Groups conduct a final pre-trial inspection using this checklist:","□ All seams sealed — inside and outside?","□ All fastener holes sealed?","□ Cargo hold bulkheads watertight?","□ Paddles attached and blade joints rigid?","□ Sail rigged and embroidery motif sealed with a light waterproof coat?","□ Optimal loading plan recorded and ready?","□ Hull weight recorded?","□ Waterline marking still visible?","Any unchecked item: address before water trial."]},{"n":"mBot Stability Sensor Setup","m":12,"t":"demo","s":["Mount the mBot on a small waterproof platform inside the cargo hold, sensor facing upward.","The mBot's accelerometer (tilt sensor) will measure the vessel's roll angle in real time.","mBlock code: continuous tilt reading loop. Display tilt angle. When tilt exceeds 15°: LED flashes red (stability warning).","Calibrate: with vessel level in still water, confirm tilt reading = 0°.","Test: tilt vessel 10° manually. Does the sensor register? Does the LED warning activate at 15°?"]},{"n":"Build Challenge — Load, Float, Monitor","m":24,"t":"build","s":["Apply the optimal loading plan (from Week 10) to load the vessel with 3 kg cargo.","Float vessel in the water tray. Confirm trim: bow, amidships, and stern freeboards all within 5 mm of each other.","Run the mBot tilt monitor. Observe the tilt reading in calm water: should be near 0°.","Induced stability test: tilt vessel to 10° by pressing on one side. Release. Measure: (1) time to return to level (roll period), (2) maximum tilt the vessel recovers from before capsizing.","Record: roll period, maximum stable tilt angle, mBot tilt reading at all stages.","Apply final sealant to any leak points identified during the test."]},{"n":"Test — Water Trial Go/No-Go Assessment","m":8,"t":"test","s":["Go criteria for Week 13 water trial: (1) hull passes 30-minute immersion with cargo — no leaks, (2) vessel returns to level from 15° tilt in < 3 seconds, (3) freeboard with 3 kg cargo ≥ 2 cm at all points, (4) paddles are functional.","Each group assesses their vessel against the go criteria. Go or no-go?","No-go vessels: identify the specific failing criterion and the repair plan. Can it be fixed in the next 24 hours before the trial?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Go vessels stored ready. No-go vessels repaired with priority on the failing criterion.","Facilitator: 'A vessel that passes the harbour tests and then fails at sea is a preventable tragedy. A vessel that fails the harbour tests and is repaired before going to sea is engineering at its best. Which category is your vessel?'"]}],"diff":{"sup":"Facilitator sets up the mBot system. Group focuses on loading, floating, and recording the stability test data.","ext":"Calculate the vessel's metacentric height (GM) from the roll period test data using the formula: GM = (2π/T)² × k² / g, where T is the roll period and k is the radius of gyration."},"ass":"Is the pre-trial checklist fully signed off? Does the vessel meet all 4 go criteria? Is the mBot stability monitor functional and calibrated?","note":"The go/no-go assessment is the most important quality gate in the project. Be clear: a vessel that doesn't meet the criteria will not enter the pool in Week 13. This rule exists for safety, not as punishment. Students who must repair overnight should be given every possible support to do so."},{"w":13,"f":"Water Trials — The Chola Voyage","bi":"The water trial is the moment all the engineering becomes real. The vessel either sails or it doesn't. The cargo either arrives or it doesn't. There is no approximation.","obj":"Vessels complete the water trial sequence: (1) float test with cargo, (2) manual paddle propulsion across the pool, (3) cargo delivery demonstration, (4) mBot stability monitoring throughout.","dur":"60 minutes","grp":"Groups of 4 + class audience","mat":["Complete vessels from Week 12","Pool or large water tank (minimum 3 m × 2 m)","Life safety equipment: buoyant throwrope","3 kg test cargo items (waterproof)","mBot and laptop (live display)","Timing device","Log sheet"],"voc":[["Water trial","A formal test of a vessel's performance under real operating conditions — the definitive qualification test for any vessel"],["Voyage","A complete journey from origin to destination — for the water trial, from one end of the pool to the other and back"],["Cargo delivery","Carrying a load from one place to another — the primary commercial function of the Chola trade vessels"]],"ph":[{"n":"Safety Briefing and Pool Protocol","m":8,"t":"intro","s":["MANDATORY pool safety: (1) no student enters the water, (2) vessels are propelled from the pool edge using paddles on long handles or by wading barefoot in shallow water (maximum 20 cm depth), (3) a buoyant throwrope is at the pool edge at all times, (4) an adult supervisor is pr…","Trial sequence: (1) unloaded float test, (2) cargo loading and trim check, (3) paddled voyage across the pool, (4) cargo unloaded at destination, (5) return voyage, (6) mBot stability data reviewed.","Recording team: 2 students record data while 2 operate the vessel."]},{"n":"Water Trial Sequence","m":32,"t":"test","s":["Stage 1 — Float test (5 min): place vessel in pool unloaded. Note any new leaks. Confirm trim.","Stage 2 — Cargo loading (3 min): apply optimal loading plan. Place 3 kg cargo. Confirm trim with cargo.","Stage 3 — Outward voyage (8 min): paddle vessel from one end of the pool to the other (minimum 2 m). Record time. Note: does vessel track straight? Does it drift? Is it stable?","Stage 4 — Cargo delivery (2 min): 'unload' cargo at destination (move cargo to a box at pool edge). Note: does the vessel remain stable during unloading?","Stage 5 — Return voyage (8 min): paddle empty vessel back. Compare speed to loaded voyage.","Stage 6 — mBot review (6 min): review the stability tilt data recorded throughout the trial. Maximum tilt angle reached? Stability warnings triggered?"]},{"n":"Post-Trial Assessment","m":10,"t":"test","s":["Record: (1) loaded voyage time, (2) empty voyage time, (3) any leak volume (inspect bilge after trial), (4) maximum tilt angle recorded by mBot, (5) any stability incidents.","Certification check: (1) vessel floated with 3 kg cargo — PASS/FAIL, (2) vessel completed outward and return voyage — PASS/FAIL, (3) cargo delivered — PASS/FAIL, (4) no sinking or capsize — PASS/FAIL.","Issue: Water Trial Certificate if all 4 criteria pass."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Vessels removed from pool. Thoroughly dried — water in the bilge will promote rot if left.","mBot removed from vessel — dry immediately.","Facilitator: 'A Chola trade vessel took 2–3 years to build and was expected to serve for 20–30 years. You built yours in 13 weeks. It crossed the pool carrying cargo under human power — just as the Chola vessels crossed the Bay of Bengal. The scale is different. The achievement i…"]}],"diff":{"sup":"Assign the recording role — the most structured and achievable contribution. Facilitator assists with paddle operation.","ext":"Calculate the vessel's speed in m/s and compare to the theoretical hull speed (1.34 × √waterline length in feet, in knots). Is the vessel performing at expected efficiency?"},"ass":"Did the vessel complete both voyages? Was 3 kg cargo delivered? Were all 4 certification criteria passed? Is the Water Trial Certificate issued?","note":"Pool safety is non-negotiable. The pool must be shallow enough that no student is at risk if they reach in to retrieve a vessel. For deep pools, use a hook or net to retrieve vessels rather than allowing students to lean over. An adult must be at the pool edge — not across the room — for the entire …"},{"w":14,"f":"Vessel Showcase and Maritime Engineering Portfolio","bi":"The Chola Empire's trade fleet made Tamil Nadu one of the wealthiest kingdoms in the medieval world. Your vessel, modelled on that tradition, is a physical record of engineering knowledge passed forward. Present it accordingly.","obj":"Groups present their Chola trade vessels to the school community, demonstrate live mBot stability monitoring, and each student produces a 1-page maritime engineering portfolio.","dur":"60 minutes","grp":"Groups of 4 + widest audience","mat":["Complete vessels with Water Trial Certificates","mBot and laptop","Portfolio paper A3","Pencil","Camera","Water tray for demonstration","Test cargo","Audience seating"],"voc":[["Maritime engineering","The branch of engineering concerned with vessels and ocean structures — the oldest engineering discipline in existence"],["Hull efficiency","The ratio of cargo carried to the total displacement — a highly efficient hull carries more cargo relative to its own weight"],["Seaworthiness","The quality of a vessel being fit to face the expected conditions at sea — the highest standard in maritime evaluation"]],"ph":[{"n":"Exhibition Setup and Vessel Display","m":10,"t":"intro","s":["Vessels displayed on a long table with Water Trial Certificates in front of each.","mBots active inside vessels. Water tray filled for the demonstration.","Audience invited: parents, principal, all grades, maritime-interested community members.","Facilitator opens: 'These vessels were built by Grade 9 students following the design traditions of the Chola maritime empire. Each has been constructed from marine plywood, waterproofed, fitted with a cargo hold, and tested on water with a 3 kg cargo. Each has been certified. Th…"]},{"n":"Group Presentations","m":16,"t":"build","s":["Each group presents for 90 seconds: (1) Chola heritage connection, (2) hull form and why it was chosen, (3) waterproofing system, (4) cargo hold design, (5) water trial results.","During presentation: vessel is placed in the water tray with cargo. mBot tilt reading displayed live.","The vessel is paddled manually across the tray."]},{"n":"Portfolio Construction","m":18,"t":"build","s":["Each student produces a 1-page portfolio on A3 paper. 5 sections:","1 — The vessel (sketch with key dimensions and waterline marked)","2 — Technical specification (LOA, beam, depth, cargo capacity, hull form, displacement)","3 — Water trial results (loaded voyage time, freeboard with cargo, max tilt angle)","4 — What I would change (1 specific, technically justified improvement)","5 — Grade 11 prediction (what will be the biggest engineering challenge in Grade 11 advanced maritime construction?)"]},{"n":"Close — The Maritime Engineering Circle","m":10,"t":"close","s":["Students stand in a circle around their vessels.","Each student completes: 'My vessel taught me that maritime engineering means ___.'","Facilitator: 'Grade 11 is the advanced Chola maritime vessel — larger, more complex, crew-capable. Everything you learned in Grade 9 — hull form, lofting, planking, waterproofing, stability, loading, propulsion — scales directly to Grade 11. The only difference is size. And in en…"]}],"diff":{"sup":"Portfolio template provided with section headings. Student fills in the content.","ext":"Produce a full 2-page maritime engineering report including lines drawings, stability curves, and a formal vessel specification sheet in the format of Lloyd's Register of Shipping."},"ass":"Did the vessel demonstrate successfully in front of the audience? Is the portfolio specific and technically complete? Can each student explain their design decisions?","note":"The presentation should feel like a maritime review — formal, technical, and proud. A Grade 9 student who can explain hull form, displacement, stability, and buoyancy in front of an audience of parents and staff has achieved something rare. Celebrate it."}],"g11lessons":[{"w":1,"f":"Vessel Design — Engineering Plan at Full Scale","bi":"A large vessel is not a small vessel scaled up. It introduces new challenges that do not exist at small scale: structural hogging (the hull bending along its length), crew weight management, and material quantities that make every design decision consequential.","obj":"The class produces a complete engineering plan for a large maritime vessel: LOA ≥ 200 cm, beam ≥ 80 cm, capable of carrying 10 kg cargo and being paddled by a crew of 2.","dur":"90 minutes","grp":"Class team (groups of 5)","mat":["A1 paper (4 sheets)","Steel ruler 1 m","Set square","Flexible batten (1.5 m)","Pencil","Calculator","Reference: Grade 9 vessel drawings + water trial data"],"voc":[["Hogging","A hull deformation where the midships section droops downward relative to the bow and stern — caused by the hull's own weight unsupported by water in the middle. Prevented by longitudinal structural members"],["Longitudinal framing","Hull structural members running the length of the vessel (keel, stringers, chines) — resist hogging and provide the hull's length-wise strength"],["Transverse framing","Hull structural members running across the vessel (ribs/frames) — resist the water pressure trying to collapse the hull sides inward"]],"ph":[{"n":"Grade 9 Review — What We Know","m":10,"t":"intro","s":["Students retrieve their Grade 9 maritime engineering portfolios. Review: hull form selection, key dimensions, water trial results.","Introduce Grade 11 specification: LOA ≥ 200 cm, beam ≥ 80 cm, depth ≥ 30 cm, cargo ≥ 10 kg, crew of 2 paddlers, must be water-trialled in a pool.","Calculate the displacement increase: if Grade 9 vessel was 1.2 m × 0.5 m × 0.2 m and carried 3 kg, Grade 11 vessel is approximately 2.0 m × 0.8 m × 0.3 m. What is the scale increase? (Volume ratio = (2×0.8×0.3)/(1.2×0.5×0.2) = 0.48/0.12 = 4×.) So approximately 4 times the displac…","Introduce hogging: 'At small scale, the hull's own weight relative to its buoyancy is small. At Grade 11 scale, the hull is heavy — it can sag amidships if the keel and longitudinal framing are not strong enough. This is the primary new structural challenge of Grade 11.'"]},{"n":"Skill Demo — Grade 11 Lines Drawing","m":15,"t":"demo","s":["Scale: 1:5 for the A1 paper. 200 cm vessel = 40 cm on paper.","Loft the side profile: sheer line, keel line, stem and stern posts.","Loft the plan view: beam at all stations (marked every 20 cm).","Loft 5 cross-sections (body plan): at 0, 50, 100, 150, 200 cm from bow. Each cross-section shows the hull shape at that station.","Introduce the stringer: a longitudinal member running along the inside of the hull, partway up the topsides — provides longitudinal strength and a plank landing.","Show the structural frame: keel + ribs + stringers (longitudinal) = the complete Grade 11 framing system."]},{"n":"Build Challenge — Class Design Session","m":45,"t":"build","s":["The class works as one team (groups of 5 work on different sections simultaneously):","Group A: side profile (2 sheets — starboard is lofted, mirrored to port)","Group B: plan view (top-down view showing beam at each station)","Group C: body plan (5 cross-section drawings, one per 40 cm)","Group D: structural arrangement (where every rib, stringer, and bulkhead goes)","Group E: cut list and materials calculation (from the completed drawings)","All groups present to the class. Teacher-led discussion to reconcile any conflicts between drawings.","Final plan approved by facilitator. Cut list locked."]},{"n":"Test — Plan Review and Approval","m":10,"t":"test","s":["Facilitator reviews: (1) are all 3 view types present? (2) do dimensions agree between views? (3) is the cut list complete and materials quantities calculated? (4) is the structural arrangement sufficient to prevent hogging?","Approved plans stored. Unapproved revised immediately in class."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Approved plans mounted on the classroom wall for reference throughout the build.","Facilitator: 'You have designed a vessel. In professional shipbuilding, the design phase takes longer than the construction phase. You did it in 90 minutes. That is possible only because you have 9 years of making behind you. Every decision you made today — hull form, rib spacing…"]}],"diff":{"sup":"Group D (structural arrangement) provided with a reference showing a typical framing arrangement for a vessel of this scale.","ext":"Produce a stability calculation: estimate the vessel's initial metacentric height (GM) from the planned dimensions and confirm it exceeds 5 cm — the minimum safe value for a small paddled vessel."},"ass":"Are all 3 view types completed and dimensionally consistent? Is the cut list complete? Does the structural arrangement include hogging prevention (longitudinal members)?","note":"Grade 11 sessions are 90 minutes rather than 60 — the project scale requires it. This session is entirely design — no tools, no materials. Treat it with the seriousness of a professional design review. The facilitator's approval is not a rubber stamp — plans with dimensional inconsistencies or struc…"},{"w":2,"f":"Material Selection, Procurement Planning, and Keel Construction","bi":"At Grade 11 scale, material waste is real cost. Every piece cut too short must be replaced. Every piece cut too long wastes material. Precise material management is a Grade 11 engineering competency.","obj":"Groups verify material quantities against the cut list, take delivery of all materials, and complete the keel and keel-adjacent structural members to the full 200 cm vessel length.","dur":"90 minutes","grp":"Groups of 5","mat":["Marine plywood 9 mm (3 sheets per group)","Marine plywood 6 mm (2 sheets per group)","Lightweight wood for keel 40×40×220 cm (1 per group)","Waterproof adhesive (4 bottles)","Marine sealant (3 tubes)","M6 bolts (40 per group)","Jig saw (facilitator only)","Hand saw","Bench vise","Power drill","Eye protection","Work gloves"],"voc":[["Stock","The raw material purchased for a build — before any cuts are made"],["Yield","The proportion of stock that ends up in the finished vessel — waste reduces yield"],["Scarf joint","A long angled splice used to join two pieces of wood end-to-end — used when the available stock is shorter than the required member length"]],"ph":[{"n":"Material Check-In","m":10,"t":"intro","s":["Groups check all materials against the cut list: are all quantities present? Any damage in transit?","Introduce Grade 11 material management rule: 'Every scrap of plywood is labelled with the piece it came from. Nothing goes in the bin without facilitator sign-off.
