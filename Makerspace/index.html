rom Week 4","Wood strips 2 × 2 × 35 cm (5 cross beams per group, cut in advance)","Wood glue","C-clamps (4 per group)","Hand saw","Bench vise","Eye protection","10 kg test weight"],"voc":[["Cross beam","A structural member running perpendicular to the main span — connects the two truss side frames and carries the deck load to the trusses"],["Assembly sequence","The planned order of connecting components — wrong sequence can make later connections inaccessible"],["Squareness","When a structure's corners are at exactly 90° — a non-square bridge will rack sideways under load"]],"ph":[{"n":"Warm-Up — The Assembly Sequence","m":7,"t":"intro","s":["Lay out all the bridge components on the table: 2 truss panels, 5 cross beams, 8 deck boards.","Ask: 'In what order do we assemble these? What goes first?'","Work through the logic together: 'The two truss panels must be parallel and the correct distance apart before the cross beams are glued. Once the cross beams are glued, the spacing is fixed — you cannot adjust it.'","Key measurement: the cross beam length must exactly equal the planned bridge width. Check all 5 cross beams against the plan. If any is wrong — now is the time to recut, before assembly begins."]},{"n":"Skill Demo — Assembling the Bridge Frame","m":10,"t":"demo","s":["Lay both truss panels flat on the bench, parallel to each other, separated by the target bridge width (30 cm).","Mark the 5 cross beam positions on both trusses — at 0, 15, 30, 45, and 60 cm from one end.","Glue the first cross beam: apply glue to the end face, press firmly against the truss face at the marked position, clamp. Hold for 5 minutes.","Squareness check: after the first cross beam is clamped, use a set square to check the angle between the cross beam and the truss chord is 90°. Any error here multiplies across the full bridge.","After the first and last cross beams are set: the frame spacing is locked. Add the remaining 3 cross beams. Fewer clamps needed — the frame holds its shape."]},{"n":"Build Challenge — Bridge Frame Assembly","m":28,"t":"build","s":["Groups assemble their bridge frames.","Step 1 (5 min): Lay both trusses parallel at 30 cm spacing. Verify with ruler at 3 points along the span — spacing must be consistent.","Step 2 (8 min): Glue and clamp first cross beam (at one end). Check squareness. Wait.","Step 3 (8 min): Glue and clamp last cross beam (at other end). Check squareness. Frame spacing now locked.","Step 4 (7 min): Add remaining 3 cross beams at measured positions. Glue and clamp each.","Facilitator: the 5-minute wait between each cross beam is non-negotiable. Groups that rush will find joints that failed under assembly stress — they look fine but move under load."]},{"n":"Test — Frame Rigidity Test","m":7,"t":"test","s":["Place the assembled bridge frame across two supports 60 cm apart.","Load 10 kg at midspan (balanced across the cross beams). Does the frame hold?","Squareness check: measure both diagonals of the bridge plan view. Are they equal? (Equal diagonals = square frame.)","Rack test: push one truss sideways gently at mid-span. Does the frame resist? Or does it rack into a parallelogram?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge frames stored flat, undisturbed while glue sets overnight.","Facilitator: 'You assembled a bridge frame today. Two trusses, 5 cross beams, one rigid skeleton. Next week: the deck — the surface a person will walk on. The week after: rope handrails. Two weeks after that: you test the bridge with one of you standing on it. You are close.'"]}],"diff":{"sup":"Mark all 10 cross beam positions on both trusses before assembly begins. Group assembles only.","ext":"Add intermediate truss web members between the primary truss panels to form a 3D space frame rather than two parallel 2D trusses."},"ass":"Are all 5 cross beams at their marked positions (within 3 mm)? Are both diagonals of the bridge plan view equal (squareness check)? Does the frame hold 10 kg at midspan?","note":"This session has the tightest time budget of the year — 5 cross beams each needing 5 minutes of setting time. Have groups work in parallel: while one cross beam sets, the next is being glued. Use the waiting time for squareness checking and planning the next step."},{"w":9,"f":"Bridge Deck Installation","bi":"The deck is the only part of the bridge the user touches — it must be flat, splinter-free, securely fixed, and strong. The deck is how the bridge communicates its quality to the person who walks on it.","obj":"Groups install all 8 deck boards across the bridge cross beams, producing a flat, gap-minimised walking surface that holds a static 30 kg load.","dur":"60 minutes","grp":"Groups of 3","mat":["Bridge frames from Week 8","8 deck boards from Week 6","Nails (lost-head, 30 mm, 16 per group)","Mallet","Eye protection","Sandpaper 80 grit","30 kg test weight (sandbag or water container)","Ruler"],"voc":[["Nail toe-nailing","Nailing at an angle through one member into another — gives greater withdrawal resistance than straight nailing"],["Deck gap","The space between adjacent deck boards — must be small enough to prevent a foot from catching (maximum 5 mm for a walking surface)"],["Flush","When two surfaces are exactly level with each other — all deck boards must be flush at their ends where they meet the cross beams"]],"ph":[{"n":"Warm-Up — What Makes a Good Walking Surface?","m":7,"t":"intro","s":["Ask: 'What would be unsafe about a bridge deck with large gaps between boards? Rough splinters on the surface? Boards that flex when stepped on? One board higher than its neighbours?'","Establish the four deck quality standards for today: (1) gaps ≤ 5 mm, (2) no splinters (sanded), (3) no flex under 30 kg, (4) all boards flush at cross beam positions.","Show a pre-installed deck on the demo bridge — point out each standard being met.","Tamil causeways: 'Ancient Tamil causeway decks were typically stone flags or dressed timber boards laid tight together — no gaps, smooth surface, nailed or mortised to the supporting beams.'"]},{"n":"Skill Demo — Installing Deck Boards","m":10,"t":"demo","s":["Lay the first deck board across the cross beams at one end of the bridge. Check: is it flush with the truss end?","Nail it: hold the nail perpendicular to the deck board surface, directly above the cross beam below. Strike with the mallet — 3 firm strokes, then a final setting stroke.","Show the correct mallet technique: grasp the handle near the end (not near the head), use arm swing not wrist snap. Look at the nail, not the mallet.","Space the second board: use a 3 mm spacer (a pencil is ~7 mm — use a piece of 3 mm card as a gap gauge). Press next board against the spacer, nail.","At cross beam positions, nail twice per board (once on each cross beam face that the board crosses)."]},{"n":"Build Challenge — Full Deck Installation","m":26,"t":"build","s":["Groups install all 8 deck boards sequentially.","Board 1 (5 min): position flush with end. Nail at every cross beam (5 nails). Check squareness.","Boards 2–7 (3 min each): spacer → position → nail at each cross beam.","Board 8 (4 min): position flush with opposite end. Nail.","Sanding (4 min): light sand of all board surfaces and edges with 80 grit sandpaper. Remove all rough edges.","Facilitator: check gap consistency — walk around the bridge and press a pencil into each gap. Gaps wider than 7 mm should be flagged."]},{"n":"Test — The 30 kg Static Load Test","m":9,"t":"test","s":["Place the 30 kg test weight (sandbag or water container) on the centre of the deck.","Observe for 60 seconds: any board flexing? Any nail pulling? Any board separating from cross beam?","Measure midpoint deflection under 30 kg load.","Walk a finger across all deck board surfaces: any splinters? Any raised nail heads?","Record: pass or fail. Note any issue to address in Week 10 before the student load test."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridges stored on their supports — do not lay flat (the deck boards will stress the joints).","Facilitator: 'The deck you installed today will carry a person next week. The nails you drove today will hold that person above the ground. The sandpaper you used today will keep that person's hands safe. Every step of this session had a direct consequence for a human being stand…"]}],"diff":{"sup":"Pre-nail the first and last board. Group installs the 6 intermediate boards.","ext":"Install the deck boards using toe-nailing at 45° rather than face-nailing. Compare withdrawal resistance."},"ass":"Are all gaps ≤ 5 mm? Are all board surfaces free of splinters (hand test)? Did the deck hold 30 kg for 60 seconds without any joint failure?","note":"First-time mallets: most students will miss the nail head. Emphasise looking at the nail tip, not the mallet head. Have students start with the mallet flat (no backswing) until they find the nail head consistently, then introduce the arm-swing stroke. A bent nail is better than a smashed finger — go…"},{"w":10,"f":"Handrail System and Sewn Canvas Fender Pads","bi":"A handrail says this bridge was designed for people. A fender pad says this bridge was designed to last — protecting the exposed end grain of the timber beams from impact and weathering. Both are safety engineering. One is structural; one is material protection.","obj":"Groups install a full rope and bamboo post handrail on both sides of the bridge, and simultaneously sew a pair of canvas fender pads for the bridge ends — introducing the enclosed seam as the first 3D fabric form.","dur":"60 minutes","grp":"Groups of 3","mat":["Bridge with deck from Week 9","Bamboo posts 30 cm (8 per group)","Rope 6 mm (4 m per group)","Hand drill (supervised)","Wood screws (16 per group)","Eye protection","Ruler","Canvas fabric scraps (2 pieces, each 12 × 10 cm — for fender pads)","Foam scraps (small pieces for stuffing)","Sewing thread (heavy-duty)","50 kg person (live test)","Sewing machine (school shared)","Fabric scissors"],"voc":[["Handrail","A rail at accessible height that provides lateral support to a person on a bridge — critical safety element that makes a structural test into a safe structure"],["Fender pad","A padded buffer at the end of a bridge or boat — absorbs impact, protects exposed timber end grain from moisture and physical damage"],["Enclosed seam","A seam sewn on the inside of a fabric piece, which is then turned right-side out — the stitching is hidden inside and the outer surface is smooth. Used for any 3D fabric form: pouches, cushions, pads"]],"ph":[{"n":"Warm-Up — Two Parallel Tasks","m":7,"t":"intro","s":["Explain the parallel structure: the group splits into two pairs. Pair A installs the handrail system (same approach as previous years). Pair B sews the canvas fender pads at the sewing machine.","Handrail brief: 4 bamboo posts per side, rope threaded and tensioned at consistent height. Same method as demonstrated.","Fender pad brief: 'A fender pad protects the exposed end of the bridge — the cut wood end grain. End grain absorbs water and splits. A canvas pad over the end takes the impact and weather instead of the wood. Boats use them. Docks use them. Your bridge will have two.'","Show a real fender pad (or a photograph): a small stuffed canvas rectangle lashed to a structure end. Robust, simple, functional.","Sewing machine safety: (1) presser foot down before starting, (2) start slowly, (3) fingers away from the needle path, (4) backstitch at start and end of every seam."]},{"n":"Pair A — Handrail Installation","m":30,"t":"build","s":["Side 1 (15 min): drill pilot hole at each of 4 post positions. Insert bamboo posts through deck to cross beam. Screw each post to the cross beam from underneath. Thread rope from post 1 to post 4 with clove hitch + half-hitch at each post. Tension.","Side 2 (15 min): repeat on the opposite side. Check both rope lines are at the same height — sight along the bridge from the end.","Facilitator check: each post must be screwed to the cross beam — not just set in the hole. A post that can be pulled out by hand is not safely installed."]},{"n":"Pair B — Sewing Machine Fender Pads","m":30,"t":"build","s":["The group needs 2 fender pads (one per bridge end). Each pad takes approximately 12–15 minutes.","PAD 1 (12 min):","Step 1 (2 min): fold one 12 × 10 cm canvas piece in half (to 12 × 5 cm), fabric faces touching on the inside.","Step 2 (6 min): sewing machine — sew a running stitch along the two short sides (the open ends of the folded piece), 8 mm from the edge. Backstitch at start and end. Leave the fold edge as-is (it will be the closed end of the pad).","Step 3 (2 min): trim the corners diagonally (45° cut, 3 mm from stitch) — reduces bulk when turned right-side out.","Step 4 (2 min): turn the pouch right-side out through the remaining open long edge. The stitching is now inside. Poke the corners fully out with a pencil tip.","Step 5 — filling and closing (during Pad 2 or after): stuff with foam scraps until firm. Fold the open edge inward 1 cm and sew closed with a running stitch (by machine or by hand).","PAD 2 (12 min): repeat the same sequence for the second canvas piece.","Final 6 min: lash both completed fender pads to the bridge end posts using rope — one at each end."]},{"n":"Integration Test — Full Bridge Inspection","m":9,"t":"test","s":["Handrail test: lean with approximately 50 kg lateral force on one side rope. Does the system resist? Push one post sideways — does it flex or stay rigid? Pluck the rope — does it ring (taut) or thud (slack)?","Fender pad test: press firmly on each pad — is it firmly stuffed? Does it compress and spring back? Is it lashed securely to the bridge end?","Bridge completeness check: look along the bridge from one end. Deck flat? Handrails parallel? Fender pads centred on both ends? Does the bridge look structurally complete and purposefully finished?"]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Sewing machine: remove fabric, cut and tie thread ends, cover machine.","Bridges stored on trestle supports.","Facilitator: 'Your bridge now has a walking surface, a structural frame, rope handrails, and canvas fender pads sewn on this machine. Every element has a function. The handrail holds the person. The fender pad holds the bridge — protecting it from the impact and water that would …"]}],"diff":{"sup":"Pair B: pre-fold and pin the canvas before the session. Student operates the machine — sewing the seams only, no folding or pinning required.","ext":"Design a fender pad with two compartments (a centre dividing seam sewn before stuffing) — a more complex form that requires planning the stitch sequence before starting."},"ass":"Are all 8 posts rigidly screwed to cross beams (not just set in holes)? Does the rope system resist 50 kg lateral force? Are both fender pads stuffed, closed, and lashed to the bridge ends?","note":"The enclosed seam requires the fabric to be sewn inside-out and then turned — this is the conceptual step that students find hardest. Demonstrate the turn-out step with an exaggerated motion before students attempt it. The most common error is sewing all 4 edges and then having no way to turn the po…"},{"w":11,"f":"mBlock Load Monitoring","bi":"Monitoring a structure in real-time transforms it from a passive object into a system that reports its own condition. Every modern bridge, dam, and building does this — with sensors, not eyes.","obj":"Groups install an mBot deflection sensor under the bridge midspan and calibrate it to register a measurable response for each 5 kg load increment.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge with handrail from Week 10","mBot kit (1 per group)","USB cable / wireless dongle","Laptop with mBlock","Small platform for mBot sensor positioning","Cable ties","Test weights 5 kg increments"],"voc":[["Sensor","A device that detects a physical quantity and converts it to a signal — the mBot's light or distance sensor can detect bridge deflection"],["Calibration","Adjusting a sensor's readings against known values — a calibrated sensor gives meaningful measurements, not just numbers"],["Structural health monitoring","The practice of measuring a structure's response to load over time — used on all major bridges and buildings"]],"ph":[{"n":"Warm-Up — How Modern Bridges Are Monitored","m":7,"t":"intro","s":["Introduce: 'The Bandra-Worli Sea Link in Mumbai has 24 structural sensors embedded in its cables and deck. They measure tension, temperature, and vibration continuously. If a sensor reading goes outside a safe range, an alarm sounds.'","Ask: 'What would you measure on a bridge to know if it is safe?'","Key measurements: deflection (how much the bridge sags under load), vibration frequency (a bridge that vibrates at a different frequency than designed may have structural damage), temperature (thermal expansion changes cable tension).","Today's goal: position an mBot sensor under the bridge so it can register changes in gap distance as the bridge deflects under load."]},{"n":"Skill Demo — Sensor Setup and Calibration","m":12,"t":"demo","s":["Place the mBot under the bridge midspan on a flat platform. The mBot's distance or light sensor faces upward toward the underside of the bridge deck.","Zero reading: with no load on the bridge, note the sensor value. This is the baseline.","Add 5 kg. The bridge deflects slightly. Does the sensor value change? If not — the sensor is too far from the deck. Move it closer until the deflection causes a measurable change.","mBlock code: continuous distance monitoring loop. [Forever: read sensor → display value → wait 0.5s].","Calibration: add weights in 5 kg increments. Record sensor value at each step. This is the calibration curve."]},{"n":"Build Challenge — Install and Calibrate the Sensor","m":26,"t":"build","s":["Step 1 (6 min): Position mBot under bridge midspan. Cable tie it to the trestle supports to prevent it moving. Ensure sensor faces upward toward the deck.","Step 2 (8 min): Load the mBlock monitoring program. Test: does the sensor read a consistent value with no load?","Step 3 (8 min): Calibrate — add 5 kg, record reading; add 10 kg, record; add 15 kg, record; add 20 kg, record. Build the calibration table.","Step 4 (4 min): Is the calibration curve consistent (linear or smoothly increasing)? If a data point is wildly out — recheck the weight and re-read.","Facilitator: the mBot must not move during calibration — any movement between readings invalidates the calibration."]},{"n":"Test — Live Load Monitoring Demo","m":7,"t":"test","s":["Run the monitoring loop. Slowly add weights while the class watches the sensor display.","Call out each reading: 'Load 5 kg, reading 42. Load 10 kg, reading 47. Load 15 kg, reading 53.'","Ask: 'Is the sensor reading increasing linearly with load, or is it accelerating? What does acceleration mean structurally?' (Stiffness is decreasing — the bridge is getting closer to a failure condition.)","Disconnect weights. Reading should return to baseline. Does it? (Full recovery = no permanent deformation. Incomplete recovery = some plastic deformation has occurred.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["mBot left in position for Week 12 (student crossing test). Ensure laptop is charged.","Facilitator: 'You built a structural health monitoring system today. It uses an mBot instead of a fibre optic strain gauge — but the principle is identical. Every measurement you took today had a meaning: how much is the bridge deflecting, how stiff is it, and is it recovering af…"]}],"diff":{"sup":"Provide pre-written mBlock monitoring code. Group focuses on positioning, calibration readings, and data recording.","ext":"Plot the calibration data as a graph: load (x-axis) vs sensor reading (y-axis). Fit a trend line and use it to predict the sensor reading when a student (known weight) stands on the bridge."},"ass":"Is the mBot stable and fixed in position? Is the calibration table complete (readings at 4+ load levels)? Does the sensor reading increase with load and recover when load is removed?","note":"The mBot sensor type matters — the ultrasonic distance sensor gives the most reliable readings for this application. The light sensor can work but is affected by ambient light changes. Use the distance sensor wherever possible."},{"w":12,"f":"Student Load Test","bi":"A bridge is not proven by its builder's confidence. It is proven by the first person who crosses it. Today, that person is one of you.","obj":"One student from each group crosses the bridge while the mBot sensor logs the live deflection — the bridge is load-certified for human use.","dur":"60 minutes","grp":"Groups of 3 + whole class","mat":["Complete bridge with mBlock sensor","Safety mat under and beside bridge","Weigh scale (to record student's weight)","mBlock laptop running live sensor display","Log book for crossing records"],"voc":[["Live load","A load that moves — a person walking across a bridge is a live load, as opposed to the bridge's own weight (dead load)"],["Dynamic load","A load that changes with time — when a person walks (not stands still) on a bridge, the load has a dynamic component from the impact of each step"],["Load certification","The formal confirmation that a structure has been tested to a specified load and found safe — required before any structure is opened to users"]],"ph":[{"n":"Preparation — Safety and Protocol","m":8,"t":"intro","s":["Before any student approaches the bridge: safety briefing. (1) Only one person on the bridge at a time. (2) Facilitator stands adjacent throughout. (3) Safety mat is in place under the bridge. (4) All students stand back from the bridge except the crossing student.","Weigh the crossing student (they volunteer or are selected by the group). Record the weight. Predict the sensor reading using the Week 11 calibration curve.","Set the mBlock live display running. Note the baseline sensor reading with no load.","Announce to the class: 'The bridge has been tested to 30 kg static load. The student who will cross weighs ___. The bridge has been designed and tested for this crossing.'"]},{"n":"The Student Crossing Test","m":22,"t":"test","s":["Student stands at one end of the bridge.","Facilitator: 'Step on the bridge. Stand still. Watch the sensor reading change.'","Class watches the mBlock display: the reading changes as the student's weight is applied.","Facilitator: 'Cross slowly — one step at a time.'","Class and facilitator observe: does the bridge flex? Any sounds? Any handrail movement?","Student reaches the other end. Crosses back. Two crossings total.","After each crossing: measure midpoint deflection with a ruler. Record.","All groups test in succession. Record each group's crossing student weight and sensor reading."]},{"n":"Post-Crossing Analysis","m":12,"t":"test","s":["For each bridge: compare the live load sensor reading to the calibration prediction. How close was the prediction?","Record the actual vs predicted reading. Calculate the % error.","Ask: 'Why is the live load reading different from the static load reading at the same weight?' (Dynamic loading from walking adds impact force beyond the static weight.)","The bridge with the best prediction accuracy wins the 'engineering precision' award."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridges stored safely. mBot turned off.","Facilitator: 'Someone just walked across something you built. Their weight was carried by your joints, your trusses, your deck boards, and your handrails. They were safe. That is not a small thing. That is what bridge engineers work for. Next week: refinement. The week after: the…"]}],"diff":{"sup":"Student who is uncertain about crossing can observe and record sensor readings while a willing peer completes the crossing.","ext":"Calculate the actual peak dynamic load during the crossing (from the sensor reading, using the calibration curve) and compare to the static weight. Calculate the dynamic amplification factor."},"ass":"Did at least one student from each group cross the bridge safely? Is the measured sensor reading recorded and compared to the calibration prediction? Is the midpoint deflection recorded post-crossing?","note":"The student crossing is the emotional peak of Grade 6. It must be treated with appropriate seriousness and celebration simultaneously. Do not rush it. The class should be completely quiet during each crossing — this is a structural test, not a party. After a successful crossing: celebrate."},{"w":13,"f":"Structural Refinement","bi":"A crossing that goes well is not permission to stop. Real bridge maintenance happens most intensively after the first major load event — because that is when hidden weaknesses become visible.","obj":"Groups perform a complete post-crossing structural audit, address all identified weaknesses, and ensure the bridge is fully safe and presentable for the Week 14 exhibition.","dur":"60 minutes","grp":"Groups of 3","mat":["Bridges from Week 12","Repair materials: wood strips, glue, rope, sandpaper","Paint or wood stain","Label cards","Load certificate card stock"],"voc":[["Post-load inspection","An inspection conducted after a significant load event — checks for permanent deformation, joint separation, or cracking that wasn't visible before loading"],["Remediation","The corrective action taken after a defect is found in a structure — must address the root cause, not just the visible symptom"],["Certification","The formal confirmation that a structure meets all required standards — issued after all inspections are complete"]],"ph":[{"n":"Warm-Up — Post-Crossing Audit","m":8,"t":"intro","s":["Groups inspect their bridge after the Week 12 crossing test using the following checklist (written on board):","□ All deck boards still nailed flat? Any lifting or splitting?","□ All cross beam glue joints intact? Any separation visible?","□ Truss joint integrity: any separation at chord/web intersections?","□ Handrail posts plumb? Any movement during crossing?","□ Midpoint deflection after crossing vs. before: any permanent deformation?","□ Any splinters or rough surfaces introduced by the crossing?","Flag each issue on the bridge with a small sticky note before beginning any repairs."]},{"n":"Repair and Refinement","m":30,"t":"build","s":["Groups address all flagged items:","Structural repairs first (joints, deck boards): re-glue, re-nail, re-rope as needed.","Surface refinement: sandpaper all surfaces once more to remove any new splinters.","Heritage finish: apply a light coat of wood stain or terracotta paint to the deck surface — referencing Tamil causeway stone colour.","Labels: add cards at key structural elements (truss, cross beam, deck, handrail, tension member if present).","Load certificate: prepare a small card reading 'Max crossing load tested: ___ kg. Sensor-monitored crossing: PASSED. Certified by: [group names].'","Facilitator: walk each group's bridge and sign off each item on the audit checklist."]},{"n":"Presentation Rehearsal","m":12,"t":"test","s":["Each group rehearses their 90-second presentation: (1) heritage context (Tamil causeways), (2) engineering features used (truss, beam depth, tension member, deck, handrail), (3) test results (static load, crossing test, sensor readings).","Rehearsal in front of 1 other group. Feedback: one thing they explained clearly, one thing to improve.","Run the live sensor one more time during rehearsal — the live mBlock display should be part of the presentation."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Bridges stored at their trestle positions for the exhibition.","Facilitator: 'The Pamban Rail Bridge — which you will use as a model in Grade 8 — has been inspected, repaired, and recertified every year since 1914. The inspectors use exactly the checklist you completed today. You are doing real structural maintenance. This is the work that ke…"]}],"diff":{"sup":"Facilitator completes the audit checklist with the student. Student addresses specific assigned repair items.","ext":"Write a formal post-crossing structural inspection report with photographs (sketches), defect descriptions, repair actions, and certification statement."},"ass":"Is the audit checklist fully completed and signed off? Is the load certificate accurate? Can each student describe the primary structural system of their bridge in 30 seconds?","note":"The load certificate must be accurate — it must state the actual tested crossing weight, not an aspirational weight. Issue it only after the audit checklist is complete."},{"w":14,"f":"Bridge Exhibition and Student Crossing Showcase","bi":"A bridge opens when the community decides to trust it. That trust is earned by the engineer's transparency — showing the load tests, the sensor readings, and the real person who crossed it.","obj":"Groups present their bridge to an invited audience, demonstrate the mBlock live monitoring, and conduct a live student crossing — certifying the bridge in public.","dur":"60 minutes","grp":"Groups of 3 + whole class","mat":["All complete bridges on display","Load certificates","mBot and laptop (live display)","Audience seating","Camera for documentation","Attendance card for all crossings"],"voc":[["Opening ceremony","The formal event that marks the first public crossing of a bridge — one of the most important moments in any bridge engineer's career"],["Public trust","The confidence of a community that a structure is safe — earned through transparent engineering and verified testing"],["Legacy","What a structure leaves behind after it is gone — the knowledge, skills, and standards it established"]],"ph":[{"n":"Exhibition Setup and Audience Welcome","m":10,"t":"intro","s":["All bridges displayed on a long table in the classroom, load certificates in front of each.","mBots positioned and monitoring programs running (sensor baseline readings visible on laptops).","Audience invited: parents, principal, class teacher, other grade.","Facilitator opens: 'Each bridge before you was designed and built by Grade 6 students over 13 weeks. Each has been tested to hold at least 30 kg static load and has been crossed by a student. Each has a structural health monitoring system. They are certified bridges.'"]},{"n":"Group Presentations","m":22,"t":"build","s":["Each group presents for 90 seconds. During the presentation: mBot is activated to show a live sensor reading as a weight is placed on the deck.","Audience can ask one question per group.","After all presentations: facilitator invites the audience to examine the bridges up close. Groups stand by to explain their structural choices."]},{"n":"Live Crossing Showcase","m":12,"t":"test","s":["One student from each group volunteers to cross their bridge in front of the audience.","Before each crossing: the facilitator announces the student's weight and the sensor calibration prediction.","During each crossing: the class and audience watch the mBlock display. The facilitator reads the peak sensor value aloud.","After each crossing: compare predicted to actual sensor reading. Calculate % error — announce to the audience.","After all crossings: class applause. The bridges have been opened."]},{"n":"Reflection — The Engineers' Circle","m":10,"t":"close","s":["Students stand in a circle (audience can stay to hear).","Round 1: each student says the structural term they understand best now that they didn't know in September.","Round 2: each student completes 'The most important thing I learned about engineering this year was ___.'","Facilitator closes: 'Grade 6 you built a bridge that held a person. Grade 7 you build a bridge that holds the whole class — a walkable bridge. Grade 8 you build a bridge with a moving span — a bridge that can open and close. Everything you learned this year — trusses, deck, tensi…"]}],"diff":{"sup":"Student's role is the mBot operator during the crossing — they read the sensor values aloud. Clear, achievable, and important.","ext":"After the exhibition, write a press release about the bridge in the style of a newspaper article: the opening ceremony, the sensor readings, the student crossing, and what the bridge represents."},"ass":"Did the group complete the 90-second presentation? Was the live mBot demonstration successful? Did the student crossing occur in front of the audience?","note":"The live crossing in front of an audience is the most powerful moment in 6 years of making. Make it formal. Count down. Read the sensor values aloud. Celebrate. This is why everything before it mattered."}],"g7lessons":[{"w":1,"f":"Advanced Wood Joints — Mortise and Tenon","bi":"The mortise-and-tenon joint is 7,000 years old. It is still used in every timber bridge, furniture piece, and wooden boat built today. Mastery of this joint is the entry point to real woodworking.","obj":"Each student cuts a clean mortise-and-tenon joint that holds 10 kg tensile load without glue.","dur":"60 minutes","grp":"Individual","mat":["Wood strips 4×4×30 cm (2 per student)","Hand saw","Bench vise","Chisel set (6 mm, 12 mm)","Mallet","Pencil","Steel ruler","Set square","Eye protection","Work gloves"],"voc":[["Mortise","The rectangular slot cut into one piece of wood — it receives the tenon"],["Tenon","The rectangular tongue left projecting from the end of one piece of wood — it fits into the mortise"],["Shoulder","The flat face on the tenon piece that seats against the mortise piece when the joint is closed — ensures accurate depth control"]],"ph":[{"n":"Workshop Rules for Grade 7","m":7,"t":"intro","s":["Welcome to Grade 7 — the first year of real woodworking with chisels and power drills. Review the tool hierarchy: Grade 6 introduced the hand saw. Grade 7 adds the chisel. Each new tool requires a specific technique and respect.","Chisel rules: (1) always cut away from the body, (2) never hold the workpiece in your free hand when chiseling — it must be clamped or vised, (3) keep both hands behind the cutting edge at all times, (4) chisels are kept sharp — a sharp chisel is safer than a blunt one because it…","Introduce the mortise-and-tenon joint: show a pre-made example. Pull it apart — it holds itself by geometry alone. Push it back together — it locks.","Tamil river crossing structures: 'Tamil Nadu's ancient river crossings — particularly the Vaigai and Kaveri river bridges — used mortise-and-tenon joinery in their timber superstructures. These joints allowed the bridges to flex with seasonal floods without fracturing.'"]},{"n":"Skill Demo — Cutting the Tenon","m":12,"t":"demo","s":["Mark the tenon: using pencil, ruler, and set square, mark a 3 cm × 1.5 cm × 1.5 cm tenon on the end of one strip. Mark the shoulder line (where the joint face will be) 3 cm from the end. Mark the tenon width (half the strip width, centred) on the end face.","Saw the shoulder cuts: clamp the strip in the vise at 45° for the angled approach cut. Cut down to the shoulder line on all 4 faces of the tenon. These are cross-grain cuts.","Saw the cheek cuts: rip-cut along the grain on both sides of the tenon, down to the shoulder line.","Remove the waste cheeks: they should snap off cleanly at the shoulder line. If not, pare with a chisel.","Test fit: the tenon should be 3 cm long and 1.5 × 1.5 cm in cross-section."]},{"n":"Skill Demo — Cutting the Mortise","m":8,"t":"demo","s":["Mark the mortise: on the second strip, mark a 1.5 × 1.5 cm rectangle centred on the face, 3 cm from the end.","Drill out waste: use a hand drill with a 12 mm bit to remove most of the waste inside the mortise. Multiple overlapping holes.","Pare the walls: use the 12 mm chisel to pare the long walls of the mortise to the pencil lines. Use the 6 mm chisel to clean the corners.","Test fit: insert the tenon. It should enter the mortise with firm hand pressure — not so tight it needs hammering, not so loose it rattles.","Adjustment: if too tight, pare a thin shaving from the tenon cheeks. If too loose, that tenon must be remade."]},{"n":"Build Challenge — Cut and Fit","m":22,"t":"build","s":["Each student cuts one complete mortise-and-tenon joint.","Step 1 (10 min): Mark and cut the tenon. Check dimensions with ruler.","Step 2 (12 min): Mark, drill, and chisel the mortise. Test fit progressively — do not remove too much material at once.","Facilitator circulates continuously — chisel supervision is required at all times. No student chisels without a facilitator in direct line of sight."]},{"n":"Test — The 10 kg Tensile Pull","m":5,"t":"test","s":["Assemble the joint (no glue). Clamp one piece to the bench. Pull the other piece steadily — try to separate the joint with approximately 10 kg of pull force.","Does the joint hold? If it separates easily, the tenon is too small or the mortise walls are not tight enough.","Record: pass or fail. Note which surface was loose.","Students who passed: the joint goes to the project folder for reference during bridge beam jointing."]},{"n":"Clean-Up & Close","m":6,"t":"close","s":["Chisels cleaned, placed in the tool roll with cutting edges pointing inward. NEVER leave a chisel loose on the bench.","Sawdust swept. Bench cleared.","Facilitator: 'The mortise-and-tenon joint you cut today is the same joint in every traditional Tamil wooden temple chariot (Ther), every wooden door frame in a Tamil heritage home, and every historic timber bridge in South India. It is also the joint you will use to connect your …"]}],"diff":{"sup":"Cut the tenon only — use a pre-chiselled mortise from the facilitator. Student practices fit and adjustment.","ext":"Cut a haunched mortise-and-tenon joint (the tenon has a step at the shoulder that fills the top of the mortise groove — used in door frame construction)."},"ass":"Does the joint hold 10 kg without glue? Are the tenon shoulders flush against the mortise piece? Is the tenon square in cross-section (set square check)?","note":"Maximum 2 students at the chisel bench at any time. Intervene immediately if a student's body is in the cutting path. The most common injury point is not the initial chisel cut — it is the slip when the chisel suddenly frees the wood and the student was not braced for the release. Teach: always know…"},{"w":2,"f":"Bolt Connection Systems","bi":"A bolt through wood creates a connection that is both strong and reversible — it can be tightened, inspected, and replaced. This is why every major timber bridge uses bolted connections.","obj":"Each group bolts 4 wood members into a rigid frame using nuts and bolts, demonstrating that the bolted frame resists 20 kg lateral force without racking.","dur":"60 minutes","grp":"Groups of 3","mat":["Wood strips 4×4×30 cm (8 per group)","M8 bolts 60 mm (8 bolts per group)","M8 nuts (16 per group)","M8 washers (16 per group)","Power drill with 8.5 mm bit (supervised)","Spanner 13 mm (2 per group)","Bench vise","Eye protection","Work gloves","20 kg test weight"],"voc":[["Bolt","A metal fastener with a thread — used with a nut to clamp two or more pieces of material together"],["Bearing stress","The compressive stress that acts on the wood surface around a bolt hole — too high and the wood crushes, enlarging the hole and allowing movement"],["Pre-tension","Deliberately tightening a nut beyond 'finger-tight' to clamp the joint members together — creates friction that resists joint slip"]],"ph":[{"n":"Warm-Up — Why Bolts Beat Nails for Bridges","m":7,"t":"intro","s":["Hold up a nail and a bolt. Ask: 'Both can join two pieces of wood. What is the difference?'","Key differences: (1) A nail relies on friction with the wood fibres — it can be pulled out. A bolt clamps the wood and resists pull-out by sheer mechanical force. (2) A bolt can be tightened if it loosens. A nail cannot. (3) A bolt can be removed and the joint inspected. A nail c…","Bridge context: 'When a bridge is loaded and unloaded thousands of times, the joints flex slightly. A nailed joint will loosen over time. A bolted joint can be inspected and re-tightened. Every timber road bridge in Tamil Nadu uses bolted connections for this reason.'","Introduce the power drill safety rules: (1) Drill bit direction must be confirmed before starting. (2) Workpiece clamped before any drilling — no hand-holding. (3) Drill started slowly — full speed only when the bit is established in the material. (4) Withdraw the bit while still…"]},{"n":"Skill Demo — Drilling and Bolting","m":10,"t":"demo","s":["Mark bolt positions: mark the hole centre with a pencil cross on both pieces to be joined. Punch a small dent with a nail tip to guide the drill bit.","Clamp the workpiece: both pieces clamped together in the vise — the drill passes through both at once (this ensures perfect alignment).","Drill: 8.5 mm bit (slightly larger than the M8 bolt to allow easy assembly). Start slowly, increase speed, withdraw while rotating.","Assemble: push the bolt through both pieces. Add washer on nut side. Add nut. Tighten with spanner — firm, not excessive (over-tightening crushes wood fibres).","Show the pre-tensioned joint: snug tight, then one quarter turn more. This is standard practice for timber bolted connections."]},{"n":"Build Challenge — Bolted Rectangular Frame","m":28,"t":"build","s":["Groups build a rectangular frame: 4 members forming a 30 cm × 20 cm rectangle, bolted at all 4 corners.","Step 1 (8 min): Mark all 8 bolt positions (2 per corner). All marks checked with ruler before drilling.","Step 2 (10 min): Drill all 8 holes — both pieces clamped together for each hole. Power drill supervised.","Step 3 (10 min): Assemble all 4 corners with bolts, washers, and nuts. Tighten to pre-tensioned standard.","Facilitator: maximum 1 student at the drill at a time. All others preparing the next joint while waiting."]},{"n":"Test — 20 kg Lateral Force","m":7,"t":"test","s":["Place the completed frame on the bench. Push one corner sideways with an estimated 20 kg force (hang a 20 kg weight from one corner with a string, supported on a peg, and let the weight apply lateral force).","Does the frame rack? By how much?","Check all 4 corners: any bolt movement? Any wood crushing around the hole?","Comparison: how does this compare to the cardboard bolt-frame from Grade 4? How does it compare to the glued wood frame?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Drill returned to its storage position — bit removed, stored separately. Spanner returned.","Bolted frames stored — these will be referenced in the bridge side panel assembly.","Facilitator: 'The walkable bridge you will build this year has bolted connections at every main joint. The bolts can be tightened before each crossing test. The power drill you used today is the same tool that will make every bolt hole in that bridge. You know it now. Respect it …"]}],"diff":{"sup":"Pre-drill all holes. Group focuses on assembly, bolt tightening, and the load test.","ext":"Calculate the bearing stress at each bolt hole under the 20 kg lateral force. Does it exceed the approximate bearing strength of soft wood (approximately 5 MPa)?"},"ass":"Are all 8 holes drilled through both pieces simultaneously (alignment check)? Are all bolts pre-tensioned (not just hand-tight)? Does the frame resist 20 kg lateral force without racking?","note":"Power drill supervision is the critical safety point of this session. Establish a clear queuing system at the drill station before the session begins. Students not at the drill station must be actively working on marking or assembly at their bench — no one standing idle near the drill."},{"w":3,"f":"Bridge Span Planning and Beam Preparation","bi":"At Grade 7, the tolerance tightens. Grade 6 was ±3 mm. Grade 7 is ±2 mm. The bridge must hold a class of students — every millimetre of inaccuracy compounds across the full structure.","obj":"Groups produce a complete dimensioned bridge plan and cut all main longitudinal beams to the target span length within ±2 mm tolerance.","dur":"60 minutes","grp":"Groups of 4","mat":["A3 graph paper (2 sheets per group)","Wood strips 4×4×150 cm (4 per group — main beams, cut from long stock)","Hand saw","Bench vise","Steel ruler 1 m","Set square","Pencil","Eye protection","Work gloves"],"voc":[["Longitudinal beam","A beam running along the main span direction — carries load from the deck to the supports"],["Datum line","A reference line from which all measurements are taken — establishes consistency across the full bridge"],["Camber","A deliberate upward curve pre-built into a beam — when loaded, the beam deflects downward and ends up flat. Used in long-span bridges"]],"ph":[{"n":"Warm-Up — The Grade 7 Bridge Specification","m":8,"t":"intro","s":["Reveal the Grade 7 bridge specification: (1) span = 120 cm, (2) deck width = 50 cm, (3) must support the full class walking across, (4) handrails required on both sides, (5) bolted connections at all main joints.","Compare to Grade 6: 'Grade 6 bridge — 60 cm span, 30 cm wide, 1 student. Grade 7 bridge — 120 cm span, 50 cm wide, multiple students. The span doubles. The width increases. The material must scale with it.'","Introduce camber: 'A 120 cm beam loaded in the centre will sag visibly. To compensate, we pre-camber the beam — build in a slight upward curve. When loaded, the sag brings the beam to level. Show a pre-cambered beam: slightly curved upward at the midpoint.'","Groups measure their timber stock and confirm the available lengths before planning."]},{"n":"Skill Demo — Scale Drawing and Beam Marking","m":10,"t":"demo","s":["Scale: 1:5. A 120 cm beam appears as 24 cm on paper. A 50 cm width appears as 10 cm.","Draw the full bridge plan view at 1:5 scale on A3 paper: 2 longitudinal beams, 5 cross beams, deck boards.","Draw the side elevation: shows the truss profile or solid beam depth.","Cut list from the plan: main beams (4 × 120 cm), cross beams (5 × 54 cm, accounting for the beam width on each side), deck boards (12 × 52 cm).","Marking for cutting: mark one beam. Transfer the mark to all others using the first beam as a template — this ensures all are the same length."]},{"n":"Build Challenge — Plan and Cut Main Beams","m":28,"t":"build","s":["Step 1 (10 min): Groups draw the complete bridge plan and elevation on A3 paper. Both drawings must be to scale with all dimensions labelled. Facilitator approves before any cutting.","Step 2 (18 min): Cut all 4 main longitudinal beams to 120 cm ± 2 mm.","Process: mark on the first beam → saw → measure → adjust → use first beam as template for beams 2–4.","After cutting all 4: lay them side by side. Measure each end. All within 2 mm of 120 cm?","Facilitator: 1 m steel ruler is necessary for this cut — a 30 cm ruler requires multiple mark transfers and introduces cumulative error."]},{"n":"Test — Stack and Square","m":6,"t":"test","s":["Stack all 4 beams. Sight along the end — is the stack even (all ends flush)?","Lay beams on the bench. Place a set square against the cut end of each — is the end face perpendicular to the beam face?","Length check: measure widest and narrowest beam. Range must be ≤ 2 mm.","Plan check: are all dimensions labelled on the drawing? Is the cut list complete and accurate?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Beams bundled and labelled. Plans stored in project folders.","Facilitator: 'You have a plan and you have your main beams. Every other piece of this bridge is derived from these four beams. If they are accurate, every other piece will fit. If they are not, every mistake they contain will be amplified at every joint across the bridge. Check t…"]}],"diff":{"sup":"Provide a pre-drawn plan template for the group to dimension. Pre-cut beam 1 — group uses it as the template for beams 2–4.","ext":"Calculate the theoretical midpoint deflection of a 120 cm long 4×4 cm timber beam under 80 kg central load (use the beam formula δ = PL³/48EI with E = 12 GPa for softwood)."},"ass":"Is the plan drawn to 1:5 scale with all dimensions labelled? Are all 4 beams within ±2 mm of 120 cm? Are all cut ends square?","note":"The 1 m steel ruler is essential for this session — order these in advance if not already in stock. Marking with a 30 cm ruler over 120 cm requires 4 marks and introduces accumulated error that will exceed the 2 mm tolerance. One continuous mark with a 1 m rule is far more accurate."},{"w":4,"f":"Truss Side Panel Construction with Laser CNC Gusset Plates","bi":"A gusset plate is a flat connector at a truss node that ties multiple members together. Hand-cut, it's ±3 mm. Laser-cut, it's ±0.3 mm — and the bolt holes land exactly where they should. The laser CNC does not replace the joinery; it makes every joint more precise.","obj":"Two teams simultaneously build two full-height truss side panels using glue-and-bolt joints; gusset plates at every node joint are laser CNC-cut to exact dimensions — producing panels that each hold 30 kg without visible deflection.","dur":"60 minutes","grp":"Groups of 4 (2 teams of 2)","mat":["4×4×120 cm main beams from Week 3","Wood strips 4×4×25 cm (12 per group — vertical members)","Wood strips 4×2×35 cm (10 per group — diagonal members)","Laser-cut plywood 12 mm gusset plates (8 per group — pre-cut before session or cut at session start)","Wood glue","C-clamps (8 per group)","M8 bolts (12 per group) + nuts + washers","Power drill (supervised)","Laptop with LightBurn/xTool software","Eye protection","Work gloves","30 kg test weight"],"voc":[["Panel","One complete truss side frame — the fundamental structural unit of a through-truss or pony-truss bridge"],["Gusset plate","A flat connector plate bolted or glued at a truss node — distributes the joint load across a larger surface area than a single bolt through two members"],["Parallel chord truss","A truss where top and bottom chords are horizontal and parallel — the simplest and most common truss form for flat bridges"]],"ph":[{"n":"Warm-Up — Why Gusset Plates and Why Laser CNC","m":7,"t":"intro","s":["Review the truss design from the Week 3 plan. Show both side panels. Confirm dimensions: 120 cm long × 25 cm deep.","Introduce gusset plates: at every node (where vertical and diagonal members meet the chord), a small plywood plate is glued and bolted across the joint. It distributes the load over more wood surface than a single bolt.","Show the gusset plate drawing: a 60 × 40 mm rectangle of 12 mm plywood with 3 pre-drilled bolt holes. All 8 gussets are identical — perfect for laser CNC batch cutting.","Laser CNC advantage: all 8 gusset plates cut in one 4-minute run. Every bolt hole is at exactly the same position on every plate — so bolts always align without marking and drilling each one by hand.","Assign teams: Team A = left panel. Team B = right panel. One student per team is designated Laser Operator at the start of the session."]},{"n":"Laser CNC — Gusset Plate Batch Cut","m":10,"t":"demo","s":["Laser Operator (one student, facilitator-supervised) opens the laser software on the laptop. The gusset plate file is pre-prepared: 8 × (60 × 40 mm rectangles) with 3 × 8.5 mm holes each, nested on one 12 mm plywood sheet.","Facilitator confirms the laser settings for 12 mm plywood: typically power 85–90%, speed 8–12 mm/s. Run a test cut on a corner of the sheet first.","All other students step back 0.5 m. Ventilation fan confirmed running.","Laser Operator presses Start. Facilitator watches for any smoke accumulation or flame. The 8-plate batch cut takes approximately 5–6 minutes.","After cut: open lid only when head has fully stopped. Remove all 8 gusset plates. Sand any charred edges lightly.","Each plate is checked: 3 bolt holes present and aligned? Dimensions within ±0.3 mm of specification?"]},{"n":"Build Challenge — Parallel Panel Build with Gussets","m":30,"t":"build","s":["Team A and Team B work in parallel at adjacent benches while the laser cut runs (or immediately after).","Step 1 (8 min): lay bottom chord on the bench. Mark all 4 vertical member positions at 25, 60, 95, and 120 cm. Mark all diagonal positions.","Step 2 (10 min): glue-and-bolt all vertical members to the bottom chord. At each node, position a laser-cut gusset plate over the joint. Bolt through gusset, vertical, and chord simultaneously.","Step 3 (8 min): add diagonal web members. Gusset plate at each diagonal-to-chord node. Glue-and-bolt.","Step 4 (4 min): lay top chord across all verticals. Gusset plates at all top chord nodes. Height check at both ends and centre before tightening.","Facilitator: at Step 4, both teams pause and compare panel heights. The gussets ensure bolt holes align without independent marking — this is the visible benefit of the laser cut."]},{"n":"Test — 30 kg Panel Load Test","m":5,"t":"test","s":["Each panel supported at both ends on trestles. 30 kg test weight applied at midspan.","Observe: any visible deflection? Any joint movement at gusset plates? Any glue creaking?","Height comparison: lay both panels side by side. Same height at both ends and midspan? Acceptable difference: ≤ 3 mm.","Gusset inspection: do any gusset plates show rotation or pull-away from the wood surface? A plate that has rotated under load indicates insufficient bolt pre-tension."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Panels stored flat with C-clamps on any joints still setting. Laser CNC covered.","Facilitator: 'Two structural walls, built simultaneously, with laser-cut gusset plates at every node. The gussets did two things: they made the joint stronger, and they made the bolt holes land exactly where they needed to — without measuring each one. That is the value of precis…"]}],"diff":{"sup":"Each team builds only half a panel (one chord + 2 verticals + 1 diagonal). Gusset plates are pre-cut and ready to install.","ext":"Calculate the bearing stress under each gusset plate bolt under the 30 kg test load. Does distributing the load across the gusset plate area reduce the bearing stress to an acceptable level for 12 mm …"},"ass":"Does each panel hold 30 kg without visible deflection? Are both panels the same height (within 3 mm)? Is a gusset plate present and bolted at every node joint?","note":"The laser gusset plate file should be prepared and test-cut before the session. Keep the file saved on the laptop so the cut can begin immediately when students arrive — time in the lesson is tight. If the laser CNC is unavailable, pre-cut the gussets by hand in the previous session and store them r…"},{"w":5,"f":"Cross Beam System","bi":"The cross beams do not just connect two panels — they lock in the bridge width, prevent the panels from rotating inward, and transfer deck load from the centre of the bridge to the structural panels on both sides.","obj":"Groups install 5 cross beams connecting the two truss panels, achieving a bridge skeleton that is plumb, square, and holds 30 kg at midspan without movement.","dur":"60 minutes","grp":"Groups of 4","mat":["Both truss panels from Week 4","Wood strips 4×4×54 cm (5 cross beams per group, pre-cut)","M8 bolts (10 per group) + nuts + washers","Power drill (supervised)","Spanner","Set square","Steel ruler","C-clamps","Eye protection","Work gloves","30 kg test weight"],"voc":[["Cross beam","A beam running perpendicular to the main span — connects the two truss panels and distributes load across the bridge width"],["Squareness","When all bridge plan-view corners are 90° — verified by equal diagonals"],["Lateral stability","The resistance of the bridge to tipping sideways — provided by cross beams and their connections to the truss panels"]],"ph":[{"n":"Warm-Up — The Squareness Test Preview","m":7,"t":"intro","s":["Show the formula for squareness: 'When a rectangle is square, its two diagonals are equal. If the diagonals are not equal, it is a parallelogram — and a parallelogram bridge will sway sideways under load.'","Show a tilted parallelogram frame: it racks easily. Show a square frame: it resists racking.","Explain today's assembly strategy: 'We will install cross beams at both ends first, check the diagonals, adjust before gluing, then lock the ends in place. Only then do we add the middle cross beams.'","Cross beam length: 54 cm — this is 50 cm (deck width) + 2 × 2 cm (the beam width on each side). Check your pre-cut cross beams against this. Any that are not 54 cm ± 2 mm must be re-cut now."]},{"n":"Skill Demo — Cross Beam Installation Sequence","m":10,"t":"demo","s":["Stand both truss panels on their bottom chords, parallel to each other, 50 cm apart (inside face to inside face).","Install end cross beam 1: hold it against both panels at one end. Mark the bolt positions. Clamp. Drill. Bolt.","Install end cross beam 2: repeat at the other end.","Check diagonals: measure from corner 1 to corner 3, and corner 2 to corner 4. Are they equal? Adjust if not — push one end panel in or out until diagonals are equal, then tighten.","Install the remaining 3 cross beams at equal intervals (at 25, 60, and 95 cm from one end)."]},{"n":"Build Challenge — Cross Beam Installation","m":28,"t":"build","s":["Groups assemble the full bridge skeleton following the demo sequence.","Step 1 (10 min): Stand both panels. Install end cross beams. Do NOT fully tighten — leave adjustable.","Step 2 (6 min): Check diagonals. Adjust until both diagonals are equal (within 3 mm). Only then fully tighten end cross beam bolts.","Step 3 (12 min): Mark, drill, and bolt the 3 intermediate cross beams at 25, 60, and 95 cm.","Facilitator: the diagonal check is the critical quality gate. No group proceeds to Step 3 until diagonals are verified."]},{"n":"Test — Squareness, Plumb, 30 kg Load","m":7,"t":"test","s":["Diagonal measurement: both diagonals within 3 mm of each other?","Plumb check: set square against each panel face — are both panels vertical?","Load test: place 30 kg at midspan of the bridge skeleton (across the cross beams). Hold for 60 seconds. Any movement? Any bolt yielding?","Preview: 'The skeleton is complete. Next week: deck boarding — the surface you will eventually walk on.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge skeleton stored upright on trestles — it is now a real 3D structure and must not be laid flat.","Facilitator: 'The bridge has a skeleton. Every ancient Tamil causeway, Roman stone bridge, and modern steel bridge has the same three-dimensional skeleton: two structural faces, connected by transverse members. You built that skeleton today, in wood, to hold people. Next week you…"]}],"diff":{"sup":"Pre-drill one hole per cross beam connection. Group tightens bolts and performs the squareness check.","ext":"Calculate the required cross beam section modulus to carry the expected deck load without deflecting more than 5 mm at midspan."},"ass":"Are the two plan-view diagonals equal within 3 mm? Are both panels plumb? Does the skeleton hold 30 kg at midspan for 60 seconds?","note":"The diagonal check is non-negotiable — make it a ceremony. Have both team members hold tape measures simultaneously and call out both diagonal readings. The numbers must agree before tightening. A 10 mm diagonal error looks small but produces a 5 mm deck misalignment and visible rack under load."},{"w":6,"f":"Deck Boarding","bi":"The deck is the only part of the bridge that experiences every single load event. Every person who ever crosses will touch the deck. It must be flat, strong, safe, and splinter-free — every time.","obj":"Groups install all deck boards across the bridge cross beams using bolted connections, producing a walking surface that holds 60 kg at midspan with ≤ 5 mm deflection.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge skeleton from Week 5","Plywood deck boards 12 mm × 50 cm × 10 cm (10 boards per group)","M6 bolts 30 mm (20 per group) + nuts + washers","Power drill 6.5 mm bit (supervised)","Spanner","Sandpaper 80 grit","Eye protection","Work gloves","60 kg test weight (or person)"],"voc":[["Plywood","A manufactured wood panel made from cross-laminated veneers — stronger and more dimensionally stable than solid timber of the same thickness"],["Decking gap","The space between adjacent deck boards — allows water to drain but must be ≤ 5 mm for a safe walking surface"],["Anti-slip","Surface treatment or texture that increases friction for pedestrian safety — especially critical on a bridge deck"]],"ph":[{"n":"Warm-Up — Plywood vs Solid Timber for Decks","m":7,"t":"intro","s":["Show a 12 mm plywood deck board and a 12 mm solid timber board of the same size. Place both across a 50 cm span. Load 20 kg at midpoint.","The plywood deflects less. Ask: 'Why? They are the same thickness.'","Guide: 'Plywood is cross-laminated — every other layer has its grain running perpendicular. This means the panel is stiff in ALL directions, not just along the grain. Solid timber is stiff along the grain but weak across it.'","Safety implication: 'A person walks in every direction across a deck. Directional weakness in the deck boards is unacceptable. Plywood eliminates that weakness.'"]},{"n":"Skill Demo — Deck Board Installation","m":10,"t":"demo","s":["Position the first deck board at one end of the bridge, resting on the two end cross beams. Check: is it flush with the bridge ends?","Mark bolt positions: one bolt through the deck board into each cross beam it crosses (2 bolts per board where it crosses 2 cross beams).","Drill: 6.5 mm hole through deck board and into the cross beam below (not all the way through — just deep enough to engage the bolt).","Bolt: M6 bolt, washer, nut. Tighten until deck board is pulled firmly down onto the cross beam — no gap.","Spacing: use a 5 mm card spacer between boards as a gap gauge. Lay the next board against the spacer. Drill and bolt.","Sand: after all boards are installed, sand all board surfaces with 80 grit. Remove all arris (sharp edges) at the ends."]},{"n":"Build Challenge — Full Deck Installation","m":28,"t":"build","s":["Groups install all 10 deck boards sequentially.","Board 1 (5 min): position, drill, bolt. Check flush with bridge end.","Boards 2–9 (2.5 min each): spacer → position → 2 bolts → next.","Board 10 (4 min): position flush with opposite end. Bolt.","Sanding (4 min): 80 grit across all board surfaces. Focus on the end arris of each board — this is where splinters catch.","Facilitator: walk the deck after installation. Press each board with a palm — any movement means a bolt is loose. Tighten."]},{"n":"Test — 60 kg Static Deck Load","m":7,"t":"test","s":["Place 60 kg at the bridge midpoint (sandbag, water container, or a student — with facilitator alongside).","Measure midpoint deflection with a ruler.","Gap check: push a 6 mm card spacer into each board gap — any gap that accepts 6 mm or more is too wide and must be investigated.","Surface check: run a palm along all deck board surfaces — any splinters or raised bolt heads?","Record: midpoint deflection, any gaps exceeding specification, any surface issues."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge returned to trestle storage.","Facilitator: 'The bridge has a floor. It is bolted, sanded, gap-checked, and load-tested. Next week: handrails — and then a crossing test with multiple students simultaneously. You are 3 weeks from building something that a group of people can walk across.'"]}],"diff":{"sup":"Pre-drill holes in all deck boards. Group positions, bolts, and sands.","ext":"Calculate the allowable span between cross beams for the 12 mm plywood deck boards under 80 kg/m² distributed load. Does the current cross beam spacing satisfy this?"},"ass":"Are all board gaps ≤ 5 mm (card spacer check)? Is midpoint deflection ≤ 5 mm under 60 kg? Are all board surfaces free of splinters (palm check)?","note":"The arris sanding step is often rushed — but a sharp edge on a deck board is a genuine injury risk during the crossing test. Make this step explicit and inspect each board end after sanding. A sharp edge that catches a hand during a crossing is a failure of the session, not the bridge."},{"w":7,"f":"Rope Handrail System","bi":"A handrail on a bridge is a life-safety element. Every engineering decision about it — post height, post spacing, rope tension, post base connection — has a direct consequence for the person who grabs it in an emergency.","obj":"Groups install a complete bolted post and tensioned rope handrail system on both sides of the bridge, rated to hold 50 kg lateral force per post without post movement.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge with deck from Week 6","Round dowels 25 mm × 40 cm (8 posts per group)","Rope 8 mm (5 m per group)","M8 bolts 80 mm (16 per group) + nuts + washers","Power drill 26 mm bit (supervised)","Spanner","Eye protection","Work gloves","Rope tensioner or Spanish windlass (1 per group)"],"voc":[["Post spacing","The horizontal distance between handrail posts — closer spacing = stiffer handrail, more posts required"],["Intermediate rail","A rope or rail at mid-height between the top rail and the deck — prevents a person from falling through a large gap"],["Kickboard","A low board at deck level along the edge — prevents feet from slipping off the edge of the bridge"]],"ph":[{"n":"Warm-Up — Handrail Standards","m":7,"t":"intro","s":["Introduce basic handrail standards: (1) top rail height 900–1100 mm above deck for adults (scaled to 30–40 cm in the model bridge), (2) maximum post spacing 1800 mm full scale (60 cm model scale), (3) intermediate rail or filling required so no gap exceeds 100 mm full scale (35 m…","Ask: 'Why is there a maximum gap standard? What happens if the gap is too large?'","Guide: 'A gap exceeding 100 mm in a full-scale handrail allows a child to fall through. At model scale, 35 mm gap prevents a model figure from passing through. The principle is identical.'","Today's specification: 4 posts per side at equal spacing, top rope at 35 cm height, intermediate rope at 17 cm height, post bases bolted through deck to cross beam."]},{"n":"Skill Demo — Post Installation","m":10,"t":"demo","s":["Post base connection: drill a 26 mm hole through the deck board at the post position, down into the cross beam below. The 25 mm post dowel inserts through the deck and into the cross beam — a tight fit that resists both lateral load and pull-out.","Bolt the post: an M8 bolt passes horizontally through the cross beam and the post at the cross beam level — the bolt prevents the post from being pulled up out of the deck.","Rope installation: drill a 10 mm hole through each post at the top rail height. Thread rope through all 4 posts on one side. Knot at both ends. Tension using a rope tensioner or Spanish windlass.","Intermediate rope: repeat at mid-height. Use a different rope colour to differentiate top and intermediate rails."]},{"n":"Build Challenge — Full Handrail","m":28,"t":"build","s":["Side 1 (14 min): mark 4 post positions at equal spacing. Drill 26 mm holes. Insert and bolt all 4 posts. Thread and tension top and intermediate ropes.","Side 2 (14 min): repeat on the opposite side. Check that both sides have posts at the same positions along the span — use a ruler to compare across the deck.","Facilitator: check post plumb (set square against each post) before tightening bolts. An out-of-plumb post makes the rope sag and looks structurally unreliable."]},{"n":"Test — Post Lateral Load Test","m":7,"t":"test","s":["Push each post sideways with 50 kg estimated force (grip firmly and push). Does the post move?","Check rope tension: pluck each rope section. Does it ring with a clear tone or thud?","Gap check: push a 40 mm card spacer through the largest opening in the handrail system. Does it pass through? If yes, the gap is too large.","Height check: measure the top rope height above the deck at each post — consistent within 5 mm across all posts?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge returned to trestle storage.","Facilitator: 'The bridge now has a handrail. Every joint you made has been for structural performance. This joint — the handrail — is different. It is the joint that a person grabs when they feel unsafe. It is the joint that catches someone who stumbles. Get this joint wrong, and…"]}],"diff":{"sup":"Pre-drill all 26 mm post holes. Group inserts posts, bolts, and installs rope.","ext":"Add a kickboard (a 4 cm wide plywood strip bolted along both deck edges at the post bases) — prevents feet from slipping off the deck edge."},"ass":"Does each post resist 50 kg lateral push without movement? Is the rope gap less than 40 mm at all points? Are post heights consistent within 5 mm?","note":"The 26 mm spade bit requires the most powerful mode on the hand drill and must be held firmly — kickback when the bit exits the cross beam below can be significant. Always drill slowly through the final 5 mm of material to avoid violent breakthrough. Supervise every post hole."},{"w":8,"f":"Structural Testing — Multi-Student Walk Test","bi":"A walkable bridge is not certified by its builders — it is certified by the community who walks on it. Today the community walks on yours.","obj":"The bridge undergoes a staged multi-student crossing test: 1 student, then 2, then 3, monitoring deflection at each stage, with the full class walking across as the final certification test.","dur":"60 minutes","grp":"Groups of 4 + class","mat":["Complete bridge with handrail from Week 7","Safety mats under bridge","Scale (to record student weights)","Ruler for deflection measurement","mBot sensor (optional — if available from previous set-up)","Log sheet"],"voc":[["Progressive loading","Increasing the number of people on a structure gradually — allows the structure's response to be monitored at each stage before increasing to the next"],["Human load","A live load that changes position, generates dynamic impact forces, and cannot be precisely predicted — the most complex load a pedestrian bridge must carry"],["Redundancy","Having more structural capacity than the minimum required — means the bridge can sustain an unexpected overload without failure"]],"ph":[{"n":"Pre-Test Safety Protocol","m":8,"t":"intro","s":["All students stand back 1 m from the bridge. Only the facilitator and the crossing students are in the test zone.","Facilitator walks the bridge first — both sides inspected: deck surface, post stability, rope tension, all bolt connections.","Weigh all students who will cross. Record. Predict deflection using the Week 6 single-student result scaled by number of students.","Announce the test protocol: '1 student → measure deflection → add 1 more → measure → add 1 more → measure → full class crossing if all stages pass.'"]},{"n":"Progressive Load Test","m":32,"t":"test","s":["Stage 1 (8 min): 1 student walks across slowly. Measure midpoint deflection. Record.","Stage 2 (8 min): 2 students walk simultaneously, spaced equally across the span. Measure deflection at midspan and at each quarter-span. Record.","Stage 3 (8 min): 3 students simultaneously. Measure. Record.","Analysis (4 min): does deflection increase linearly? Any unusual sounds or joint movement? Any rope handrail movement when a student leans on it?","Go/No-go decision (4 min): facilitator reviews all data. If all stages pass — full class crossing approved. If any stage shows abnormal deflection, joint movement, or rope slip — STOP. Investigate and repair before proceeding."]},{"n":"Full Class Crossing","m":10,"t":"test","s":["If approved: the full class crosses the bridge, 2 at a time, continuously.","Facilitator monitors: deflection at midspan for the maximum simultaneous load.","Class observer team: 2 students stand at the end of the bridge watching the midspan from the side and calling out observations.","After the class has crossed: measure permanent deflection (if any). A bridge with permanent deformation has experienced plastic yielding — structural investigation needed.","Record: maximum simultaneous load on bridge, maximum midspan deflection measured, any structural observations."]},{"n":"Post-Test Analysis","m":4,"t":"test","s":["Was deflection linear with load up to the maximum tested?","Did any joint show movement?","Was permanent deflection found after the full class crossing?","What was the maximum load the bridge carried successfully?"]},{"n":"Clean-Up & Close","m":6,"t":"close","s":["Bridge secured on trestles — do not move until post-test inspection in Week 9.","Facilitator: 'Your class just walked across a bridge you built. The combined weight of everyone who crossed it — hundreds of kilograms — was held by wood, bolts, and rope that you selected, cut, drilled, and assembled. That structure worked because you made it work. I am proud of…"]}],"diff":{"sup":"Assign a student as the deflection measurement recorder — a clear, achievable, and critical role.","ext":"Calculate the measured structural redundancy of the bridge: max tested load ÷ design load. Express as a safety factor. What safety factor should a public bridge carry?"},"ass":"Did the bridge pass all 3 progressive stages? Was deflection measured and recorded at each stage? Did the full class crossing proceed (or was a justified stop decision made)?","note":"The full class crossing is the emotional climax of Grade 7. Treat it with solemnity — quiet the class, make the crossing deliberate and slow. After the last student crosses: celebration. If the bridge fails during progressive testing, do not force the full crossing. A controlled test failure followe…"},{"w":9,"f":"Failure Analysis and Reinforcement","bi":"A bridge that has been loaded reveals its actual behaviour — which may differ from its designed behaviour. Post-test analysis is how engineers close the gap between design intent and real performance.","obj":"Groups analyse the post-crossing structural condition of the bridge, identify all permanent deformation or joint movement, and execute a targeted reinforcement plan.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 8","Ruler","Straight edge (1 m)","Chalk line","Reinforcement materials: extra wood, bolts, rope","Power drill (supervised)","Eye protection","Work gloves"],"voc":[["Permanent set","The residual deformation that remains after a load is removed — indicates plastic yielding has occurred in the structure or its joints"],["Critical member","The structural element whose failure would cause immediate total collapse — must be reinforced first if any degradation is found"],["Stiffening","Adding material or connections to reduce deflection — different from repair, which addresses existing damage"]],"ph":[{"n":"Warm-Up — The Post-Crossing Inspection","m":8,"t":"intro","s":["Ask: 'What happened to the bridge while the class crossed it? What might have changed structurally?'","Guide: pre-load vs post-load comparison. Check: (1) midspan deflection at rest (is it higher than before the crossing? = permanent set), (2) all bolt tightness (dynamic loading loosens bolts), (3) all joint faces (any separation in glue lines?), (4) deck board alignment (any boar…","Each group receives a post-test inspection checklist. They have 5 minutes to complete it before any repairs begin."]},{"n":"Analysis — Prioritised Repair List","m":8,"t":"demo","s":["From the inspection checklist, groups create a prioritised repair list: (1) safety-critical first — any joint or element that poses a risk in a repeat crossing, (2) structural performance second — anything that increased deflection, (3) cosmetic last — surface issues, rope retens…","Show how to use a straight edge to measure permanent set: lay a 1 m straight edge across the bridge deck. Any daylight beneath the straight edge indicates a permanent downward set.","Show a chalk line test: snap a chalk line along the top of each truss panel. Are they straight? Any kink indicates a joint has yielded."]},{"n":"Build Challenge — Targeted Reinforcement","m":28,"t":"build","s":["Groups address all items on their prioritised repair list:","Bolt re-tightening (all bolts — 5 min): re-tighten every bolt on the bridge one quarter-turn. Record if any were significantly loose.","Joint face repair (as needed): apply wood glue to any separated glue lines. Re-clamp.","Stiffening (as needed): add sister members alongside any beam that showed permanent set. Bolt-attach alongside the original member.","Post re-plumbing (as needed): re-drill or shim post bases that have developed lean. Retension handrail ropes.","Facilitator: confirm that safety-critical items are addressed before cosmetic items."]},{"n":"Post-Reinforcement Test","m":8,"t":"test","s":["Repeat the Stage 3 test from Week 8 (3 students simultaneously). Compare deflection to the Week 8 Stage 3 reading.","Has deflection improved? Stayed the same? Worsened?","Record: reinforcement effectiveness. Calculate % change in deflection.","Ask: 'Is the bridge now in better condition than it was after the Week 6 deck installation?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge returned to trestle storage in its reinforced condition.","Facilitator: 'You have now closed the full engineering loop: design, build, test, analyse, improve, retest. That loop repeats indefinitely for every real structure in the world. The Golden Gate Bridge has been reinforced 4 times since its opening in 1937. The Pamban bridge — your…"]}],"diff":{"sup":"Facilitator completes the inspection checklist with the student. Student addresses specific assigned repair items.","ext":"Write a formal post-crossing structural assessment report with tables of pre-crossing vs post-crossing measurements and a reinforcement effectiveness analysis."},"ass":"Is the inspection checklist complete? Are safety-critical items addressed before cosmetic items? Does the post-reinforcement Stage 3 test show equal or reduced deflection?","note":"The chalk line test is one of the most useful structural inspection tools available with simple equipment — but it requires a perfectly taut line. Have students pull the line as tight as possible and snap it in one motion. Any kink in the chalk mark is a structural finding."},{"w":10,"f":"Suspension Element Addition","bi":"Adding a cable above the bridge that pulls the midspan upward changes the entire force distribution. This is the principle of the suspension bridge — and it can be added to any existing beam bridge to dramatically increase its performance.","obj":"Groups add a rope suspension element from an overhead frame that reduces midspan deflection by at least 30% compared to the unreinforced bridge.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 9","Bamboo or timber uprights 60 cm (2 per group)","Rope 8 mm (3 m per group)","M8 bolts (4 per group)","Power drill (supervised)","Spanner","Eye protection","Work gloves","Ruler for deflection comparison"],"voc":[["Suspension element","A cable or rope hung from a point above the bridge and connected to the bridge deck — it provides upward support at the connection point"],["Pylon","The vertical tower from which the suspension cables are hung — the most recognisable element of a suspension bridge"],["Hanger","A vertical cable connecting the main suspension cable to the bridge deck — transfers the cable's upward pull to the deck at multiple points"]],"ph":[{"n":"Warm-Up — The Suspension Principle","m":7,"t":"intro","s":["Hold a rope at both ends, hanging freely in a catenary curve. Now attach a small weight to the midpoint — the rope sags more.","Now hold the rope tight above the weight — pull the midpoint up. The rope tightens and the weight is partially supported.","This is the suspension bridge principle: a cable above the roadway is attached to hangers that support the deck at multiple points. The deck load is transferred up into the cable and then outward and downward to the anchorage.","Today: add two upright pylons to the bridge truss panels and a rope suspension cable from the top of each pylon to the bridge midspan. Measure deflection before and after."]},{"n":"Skill Demo — Pylon and Cable Installation","m":10,"t":"demo","s":["Pylon installation: bolt a 60 cm upright to the top of each truss panel at the quarter-span position. The pylon extends 40 cm above the truss top chord."
