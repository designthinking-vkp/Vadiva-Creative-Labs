,"Main cable: a rope from the top of the left pylon, down to the bridge midspan (attach to the midspan cross beam), and back up to the top of the right pylon. The rope makes an inverted V or catenary shape above the bridge.","Pretension the cable: the cable must be pulled tight — this is what makes it effective. Use a rope tensioner or apply tension by hand while an assistant ties the knot.","Hanger: a short vertical rope from the main cable midpoint down to the deck cross beam at midspan. This transfers the cable's upward pull directly to the deck where deflection is greatest."]},{"n":"Build Challenge — Suspension System","m":26,"t":"build","s":["Step 1 (8 min): bolt pylons to both truss top chords. Check plumb. Tighten bolts.","Step 2 (8 min): thread main suspension rope from pylon 1 top → midspan cross beam → pylon 2 top. Pretension firmly. Tie off.","Step 3 (6 min): attach hanger rope from main cable midpoint to midspan cross beam directly below. Tighten.","Step 4 (4 min): measure resting midspan deflection before adding any live load. Compare to Week 9 resting measurement — the pretensioning may have already lifted the midspan slightly.","Facilitator: the pylon bolt connection must be strong — it carries both the cable tension and its own weight at height. 2 bolts per pylon minimum."]},{"n":"Test — Before and After Comparison","m":9,"t":"test","s":["Load the bridge with 3 students simultaneously (same as Week 9 Stage 3 test).","Measure midspan deflection. Compare to Week 9 Stage 3 result.","Calculate: % reduction in deflection = (Week 9 result − Week 10 result) ÷ Week 9 result × 100.","Target: at least 30% reduction.","Ask: 'Where does the load go now that the suspension cable carries part of it? Trace the force path from the student's feet all the way to the ground.'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge with suspension system stored on trestles.","Facilitator: 'In Grade 8 you will design and build a Pamban-inspired bridge with a movable span and human load rating. The suspension principle you added today is not just an experiment — it is a technique you now know that reduces deflection under human loads without adding heav…"]}],"diff":{"sup":"Pre-install one pylon. Group installs the second pylon and all cable elements.","ext":"Add secondary hangers at the quarter-span points to distribute the cable's support over more deck points. Compare the deflection profile (midspan vs quarter-span) before and after the additional hange…"},"ass":"Is the % deflection reduction ≥ 30%? Are pylon bolts secured with at least 2 bolts each? Can the student trace the complete load path from deck to ground?","note":"The cable pretensioning step is where groups most commonly fail — an insufficiently tensioned cable adds nothing until the bridge deflects enough to take it up. After tensioning, the cable should feel like a taut guitar string, not a loose rope. Pluck it — it should ring."},{"w":11,"f":"mBlock Structural Sensor and Vibration Monitoring","bi":"Modern bridges are not just watched — they are heard. Changes in vibration frequency are early warning signals of structural degradation. A bridge that vibrates at the right frequency is a healthy bridge.","obj":"Groups mount an mBot vibration/distance sensor under the bridge and establish a calibrated monitoring system that reads both deflection and vibration frequency during a crossing.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge with suspension system from Week 10","mBot kit (1 per group)","Laptop with mBlock","Cable ties","USB cable","Flat platform for mBot","Test weights 5 kg increments","Log sheet"],"voc":[["Vibration frequency","The number of times a structure oscillates back and forth per second — a structurally degraded bridge has a lower natural frequency than a healthy one"],["Natural frequency","The frequency at which a structure naturally vibrates when disturbed — depends only on the structure's stiffness and mass"],["Resonance","When an applied vibration matches the structure's natural frequency — can amplify deflections dramatically. Bridges have been destroyed by resonance (Tacoma Narrows, 1940)"]],"ph":[{"n":"Warm-Up — The Tacoma Narrows Story","m":8,"t":"intro","s":["Briefly describe the Tacoma Narrows Bridge collapse of 1940: a bridge that resonated with the wind frequency, oscillated with increasing amplitude, and collapsed within hours of first opening to traffic.","Ask: 'How do you prevent resonance? How do you know if your bridge is approaching its natural frequency?'","Guide: 'You measure. Modern bridges are continuously monitored for vibration frequency. If the frequency changes, the bridge has changed structurally. Today you build that monitoring system — at miniature scale.'","Introduce the monitoring approach: mBot's light sensor detects the minute changes in distance to the underside of the bridge deck as it vibrates. A continuous reading loop gives a frequency signal."]},{"n":"Skill Demo — Sensor Setup and Frequency Reading","m":12,"t":"demo","s":["Position mBot under the bridge midspan, sensor facing upward toward the deck. Cable-tie to trestle supports.","mBlock code: high-frequency sampling loop [Forever: read sensor → append to list → wait 0.05s (20 Hz sample rate)].","Tap the bridge deck sharply once — this sets the bridge vibrating at its natural frequency. Watch the sensor readings oscillate up and down.","Count oscillations per second: the number of up-down cycles in 1 second is the natural frequency in Hz.","Calibration: add 5 kg, read frequency. Add 10 kg, read frequency. Natural frequency decreases as mass increases — confirm this.","Health monitoring insight: 'If the frequency at a known load is lower tomorrow than today, the bridge's stiffness has decreased — a structural change has occurred.'"]},{"n":"Build Challenge — Monitoring System Setup","m":24,"t":"build","s":["Step 1 (8 min): mount mBot under the bridge. Load the monitoring code. Confirm baseline reading is stable.","Step 2 (8 min): tap the bridge and count the vibration frequency. Repeat 3 times. Record average frequency with no load.","Step 3 (8 min): add 20 kg load to the bridge. Tap and measure frequency. Record. Remove load. Tap and measure again. Does the frequency return to baseline?","Facilitator: the tap must be a single sharp impact — not a continuous push. The impact excites the natural frequency."]},{"n":"Test — The Pre-Crossing Baseline","m":8,"t":"test","s":["Record the bridge's natural frequency at 3 load levels: 0 kg, 20 kg, 40 kg.","Plot: load vs natural frequency (a downward curve — more mass = lower frequency).","This is the bridge's structural health baseline — it will be compared to post-crossing measurements in Week 12.","Ask: 'If after the Week 12 class crossing, the natural frequency at 0 kg is lower than today's reading — what has happened to the bridge?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["mBot left in position under the bridge — do not move. Laptop charged for next week.","Facilitator: 'You just built a structural health monitoring system. Every major bridge in India — Bandra-Worli Sea Link, Pamban Rail Bridge, Howrah Bridge — has sensor systems similar to what you built today, except with fibre optic strain gauges and accelerometers instead of a s…"]}],"diff":{"sup":"Provide the mBlock frequency monitoring code pre-written. Group focuses on mounting, baseline measurement, and data recording.","ext":"Record the frequency data to a CSV file and plot the time-domain vibration trace on a graph. Identify the damping coefficient (how quickly the oscillations decay)."},"ass":"Is the natural frequency measured at 3 load levels? Is the calibration curve plotted? Can the student explain what a decrease in baseline frequency would indicate?","note":"The 20 Hz sample rate is important — lower sample rates miss the fast vibration cycles of the bridge. If the mBot's sensor loop is too slow, the vibration appears flat. Build the code on the laptop before the session and test it on a sample surface to confirm the sample rate is adequate."},{"w":12,"f":"Refinement and Finishing","bi":"A bridge opens to the public once. First impressions are permanent. The quality of the finishing communicates the quality of the engineering to everyone who sees it — before they ever step on it.","obj":"Groups complete a full structural audit, sand and seal all exposed surfaces, add Tamil heritage decorative elements, and rehearse the presentation for the Week 13 bridge exhibition.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 11","Sandpaper 80 and 120 grit","Wood stain (terracotta/teak)","Paint brushes","Label cards","Craft materials for decorative elements","Heritage reference sketches"],"voc":[["Surface finish","The quality of the final surface of a structure — determines both aesthetics and safety (rough surfaces cause splinters)"],["Heritage motif","A decorative pattern drawn from a historical tradition — in Tamil Nadu, common motifs include kolam patterns, temple friezes, and boat prow carvings"],["Commissioning","The process of formally accepting a completed structure as fit for its intended use — includes all inspections, tests, and sign-offs"]],"ph":[{"n":"Final Structural Audit","m":8,"t":"intro","s":["Complete the final checklist: □ All bolts re-tightened to pre-tension? □ No deck board gaps > 5 mm? □ Both handrails at consistent height? □ All rope sections tensioned? □ Suspension cables taut? □ mBot sensor in position? □ Natural frequency baseline recorded? □ All joints visua…","Flag any outstanding items with sticky notes. Assign each item to a group member.","Spanner check: every single nut on the bridge is re-tightened one quarter-turn. Record the total nut count."]},{"n":"Surface Finishing","m":20,"t":"build","s":["Full sand: 80 grit on all rough surfaces, then 120 grit for final smoothness. Focus on deck board edges, post tops, and any arris.","Stain: apply a single coat of teak or terracotta wood stain to all timber surfaces — this seals the wood against moisture and gives the bridge its finished appearance.","Coloured rope: if available, dye or replace handrail ropes with coloured rope — deep red or saffron, referencing the colours of traditional Tamil temple structures.","Facilitator: check that stain is applied uniformly — drips and uneven coverage are visible from a distance and undermine the structure's presentation."]},{"n":"Heritage Decoration","m":10,"t":"build","s":["Each group adds 1–2 Tamil heritage decorative elements to the bridge:","Option A: Kolam pattern (a geometric dot-and-line pattern) engraved or painted onto the bridge end posts.","Option B: Boat prow carving (a carved or applied card piece at the bridge ends, in the shape of a traditional Tamil fishing boat prow — connecting to the Tamil Nadu boat-building tradition).","Option C: Temple pillar motif (scored and painted vertical bands on the bridge posts, referencing the carved temple pillars of Tamil Nadu).","Scale and proportion: decorative elements must not compromise structural connections."]},{"n":"Presentation Rehearsal","m":14,"t":"test","s":["Each group rehearses their 2-minute presentation: (1) heritage connection (Tamil river crossings), (2) structural systems used (truss, bolted connections, deck, handrail, suspension element), (3) load test results (Stage 1, 2, 3, and full class), (4) mBlock monitoring results (na…","Demonstration component: during the presentation, the group activates the mBot, taps the bridge, and reads the natural frequency live — 'This is the structural health of our bridge right now.'","Rehearsal in front of 1 other group. Feedback."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge stored on trestles, stain drying overnight. Do not move until stain is fully dry.","Facilitator: 'Your bridge is now complete. It has been tested to full class load. It has been reinforced and retested. It has a suspension element that reduces its deflection. It has a sensor that tells you its structural health in real time. It has Tamil heritage decoration that…"]}],"diff":{"sup":"Assign staining responsibility for 1 specific section. Provide the heritage motif as a template.","ext":"Produce a full engineering technical drawing of the bridge (plan, elevation, and cross-section) to professional drawing standards including title block, scale bar, and dimensions."},"ass":"Is the bolt check complete? Is the surface finish even (no drips or uneven patches)? Is the heritage element applied without compromising structural connections? Can each student deliver their 30-seco…","note":"The staining session requires good ventilation. Open windows and doors. Stain fumes are low-level but persistent. If ventilation is inadequate, use water-based stain rather than oil-based."},{"w":13,"f":"Bridge Exhibition and Class Crossing Ceremony","bi":"A bridge that is only crossed by its builders is a prototype. A bridge that is crossed by a community is infrastructure. Today your bridge becomes infrastructure.","obj":"Groups present their walkable bridges to an invited audience, demonstrate live mBlock structural monitoring, and conduct a ceremonial class crossing.","dur":"60 minutes","grp":"Groups of 4 + whole class","mat":["All complete bridges on display","Load certificates","mBot and laptops (live displays)","Audience seating","Camera for documentation","Crossing register (all names of students who cross)"],"voc":[["Infrastructure","Structures built for community use — bridges, roads, water systems. Infrastructure serves people beyond its builders"],["Technical presentation","A structured explanation of an engineering project that communicates design decisions, test results, and conclusions to an audience"],["Community certification","The act of a community accepting a structure as theirs — what happens when a bridge is publicly opened"]],"ph":[{"n":"Exhibition Setup and Audience Welcome","m":10,"t":"intro","s":["Bridges displayed on trestles in a line, load certificates in front of each. mBots active, frequency baseline running.","Audience invited: parents, principal, Grade 6 students (they will build in this tradition next year), class teacher.","Facilitator opens: 'The bridges you see were designed, cut, drilled, bolted, decked, railed, tested, analysed, reinforced, and certified by Grade 7 students. Each has been crossed by its builders, then by the full class. Each is monitored by a real sensor system. They are certifi…"]},{"n":"Group Presentations","m":22,"t":"build","s":["Each group presents for 2 minutes. During the presentation: (1) mBot is tapped to show live frequency reading, (2) the suspension cable is pointed out and the deflection improvement explained.","Audience questions: 2 questions per group.","Audience invited to examine the bridges up close between presentations."]},{"n":"Ceremonial Class Crossing","m":14,"t":"test","s":["Each group's bridge is crossed by a selected audience member (parent, principal) first — the 'inaugural crossing'.","Then the class crosses each bridge.","mBot readings called out live during each crossing: 'Natural frequency under current load: ___ Hz.'","Post-crossing: natural frequency at 0 load compared to Week 11 baseline. Any change?","Crossing register: every person who crosses each bridge signs the register."]},{"n":"Reflection — The Bridge Builder's Circle","m":6,"t":"close","s":["Students stand in a circle around the displayed bridges.","Each student completes: 'The bridge taught me that engineering means ___.'","Facilitator closes: 'In Grade 8 you move from a walkable bridge to a bridge with a movable span — inspired by the Pamban Rail Bridge, one of the engineering wonders of Tamil Nadu. Everything you learned this year — mortise-and-tenon, bolted connections, truss panels, deck boardin…"]}],"diff":{"sup":"Assign the role of crossing register keeper — records every name. Clear, important, achievable.","ext":"After the exhibition, write a press release about the bridge opening in the format of a formal engineering project completion notice."},"ass":"Did the group complete the 2-minute presentation? Was live mBlock monitoring demonstrated? Were audience crossings completed?","note":"The crossing register is a powerful document — save it. It lists every person who trusted a structure these students built. Share it with the class at the start of Grade 8 as a reminder of what they achieved."},{"w":14,"f":"Grade 7 Portfolio Review and Grade 8 Preview","bi":"An engineer who cannot explain what they built learned only craft. An engineer who can explain why they made every decision, what the data showed, and what they would do differently — that is an engineer.","obj":"Students compile a 1-page structural portfolio summarising their Grade 7 engineering learning, and participate in a structured preview of the Grade 8 Pamban bridge challenge.","dur":"60 minutes","grp":"Individual then whole class","mat":["Graph paper A3","Pencil","Ruler","Photographs from the year (facilitator-printed)","Reference image of Pamban Rail Bridge","List of Grade 8 tools and materials"],"voc":[["Portfolio","A structured collection of a person's best work — demonstrates skills, decisions, and growth over time"],["Reflection","Thinking critically about your own work — what went well, what failed, what you would change"],["Design evolution","The documented changes a design goes through from first concept to final build — shows the engineering thinking process"]],"ph":[{"n":"Portfolio Construction","m":25,"t":"build","s":["Each student produces a 1-page portfolio summary on A3 paper.","Section 1 — Structural systems I can build: list every joint type, every structural form, every testing method learned in Grade 7.","Section 2 — My bridge data: span, width, maximum load tested, midspan deflection, natural frequency. Draw a small sketch of the bridge with key dimensions labelled.","Section 3 — What I would change: one specific engineering decision that, if made differently, would have improved the bridge.","Section 4 — Grade 8 prediction: what do I think will be the hardest engineering challenge in Grade 8?","Facilitator: circulate and encourage specificity — 'I would change the beam depth to 6 cm' is better than 'I would make it stronger'."]},{"n":"The Grade 8 Preview","m":15,"t":"intro","s":["Show an image of the Pamban Rail Bridge: the swing span, the two fixed approach spans, the bascule mechanism.","Explain: 'The Grade 8 final project is a Pamban-inspired human-load bridge with a movable span. The bridge must: (1) hold adult weight on the fixed spans, (2) have a span section that can be opened and closed, (3) be monitored by an mBot sensor system, (4) be presented and demons…","Introduce Grade 8 new tools: angle grinder (supervised), full bolt-and-plate connection systems, metal hardware connections.","Ask: 'What from Grade 7 is directly relevant to Grade 8?' Students brainstorm on a shared class list."]},{"n":"Sharing Portfolios","m":10,"t":"test","s":["Students share their portfolios in groups of 3: each explains Section 3 (what they would change) to the group.","Group discusses: if they were building the Grade 7 bridge again as a team, what would the single most important change be?","Class collects 3 'best ideas for Grade 8' from the group discussions."]},{"n":"Close — The Grade 7 Engineering Record","m":10,"t":"close","s":["Portfolios collected and stored — they will be returned at the start of Grade 8 as a reference.","Crossing registers mounted on the classroom wall.","Facilitator: 'In Grade 1 you built a cardboard village. In Grade 7 you built a bridge your class walked across. In between, you learned how to cut, join, brace, load, test, fail, repair, and certify. In Grade 8 you add mechanism to that list. The bridge will move. You will make i…"]}],"diff":{"sup":"Provide a portfolio template with section headings. Student fills in the content.","ext":"Produce a full A3 technical drawing of their bridge including all dimensions, materials list, load test results, and a written engineering justification for the truss design chosen."},"ass":"Is the portfolio specific (actual numbers, actual dimensions, actual decisions — not vague generalisations)? Does Section 3 identify a specific, technically justified improvement?","note":"The portfolio is a genuine assessment tool — not a decoration exercise. The key differentiator is specificity: a student who writes 'I would change the beam depth from 4 cm to 6 cm because the measured deflection of 8 mm exceeded the 5 mm target, and beam depth increases stiffness by the cube' has d…"}],"g8lessons":[{"w":1,"f":"Pamban Study and Precision Planning","bi":"Grade 8 engineering begins with a number: the weight of the people who will cross. Every dimension in the plan is derived from that number. This is structural engineering thinking.","obj":"Groups produce a complete dimensioned engineering plan for a Pamban-inspired bridge with a movable span, with all dimensions derived from the structural analysis of a 3-adult load.","dur":"60 minutes","grp":"Groups of 4","mat":["A3 graph paper (2 sheets per group)","Reference images of Pamban Rail Bridge","Pencil","Steel ruler 1 m","Calculator","Set square","Scale rule (or divide ruler for 1:5 scale)"],"voc":[["Design load","The maximum load a structure is designed to carry — for Grade 8, this is the combined weight of 3 adults (approximately 240 kg)"],["Factor of safety","The ratio of the structure's actual capacity to the design load — a factor of 2 means the bridge can hold twice the design load before failure"],["Bascule span","A movable bridge span that rotates upward around a horizontal axis — the type used in the Pamban Rail Bridge's movable section"]],"ph":[{"n":"Warm-Up — The Pamban Bridge","m":8,"t":"intro","s":["Show the Pamban Rail Bridge reference images: the fixed approach spans (simply supported beam bridges), and the movable Scherzer rolling lift span at the centre.","Key facts: 2.06 km total length, opened 1914, crosses the Palk Strait between mainland Tamil Nadu and Rameswaram island, the movable span opens to allow ship traffic through.","The Grade 8 specification: a bridge with 2 fixed approach spans (each 60 cm) flanking a 30 cm movable centre span. Total bridge length: 150 cm. Must support 3 adults on the fixed spans. The movable span must open and close reliably.","Ask: 'What are the 3 biggest engineering challenges in this project?' (Strength of fixed spans for adult load, mechanism for the movable span, continuity — the whole structure must work as one unit.)"]},{"n":"Skill Demo — Deriving Dimensions from Load","m":12,"t":"demo","s":["Design load: 3 adults × 80 kg average = 240 kg on the fixed spans.","Factor of safety target: 2 (bridge must hold 480 kg before failure — ensures it is safe under 240 kg).","Beam depth: from Grade 7 learnings, deflection decreases with the cube of depth. Target deflection ≤ 8 mm at midspan. Solve for required beam depth at 60 cm span under 240 kg.","Cross beam spacing: from Grade 7 deck loading, derive the minimum cross beam spacing to keep deck board deflection ≤ 3 mm under 80 kg/m².","Movable span dimensions: 30 cm long, same width as fixed spans (60 cm), lightweight construction — the movable span must open easily by hand.","Produce a complete cut list from the plan."]},{"n":"Build Challenge — Engineering Plan","m":28,"t":"build","s":["Groups produce a 2-drawing plan set on A3 paper:","Drawing 1 — Plan view (top): both fixed spans + movable span in closed position. Label all cross beam and deck board positions. Scale 1:5.","Drawing 2 — Side elevation: show the truss profile on both fixed spans, the movable span mechanism, the hinge axis, and the approach span to approach span continuity.","Cut list: derived from the plan. Materials categorised: main beams, cross beams, deck boards, truss members, movable span members, hardware.","Facilitator reviews and approves every plan before any material is cut next week."]},{"n":"Test — Plan Review","m":5,"t":"test","s":["Facilitator reviews each plan: are all dimensions labelled? Is the scale stated? Is the movable span clearly shown? Is the cut list complete?","Issue: a stamp of 'Approved for Construction' on plans that pass. Plans that need revision are returned with specific notes."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Approved plans stored in project folders. Unapproved plans revised for next week.","Facilitator: 'The Pamban Rail Bridge was designed by engineers who spent months on the drawings before a single piece of steel was ordered. Your plan — made in 28 minutes — captures the same essential information: span, load, mechanism, and connections. Week 2 is precision cuttin…"]}],"diff":{"sup":"Provide a partially completed plan template showing span lengths and scale. Group adds truss profiles, cross beams, and cut list.","ext":"Complete a moment diagram for one fixed span under the 240 kg design load — show bending moment at every cross beam position."},"ass":"Is the plan drawn to 1:5 scale? Are all dimensions labelled? Is the movable span mechanism indicated? Is the cut list complete and derived from the plan?","note":"The 'Approved for Construction' stamp is a real engineering tool — in professional practice, no construction work begins without an approved drawing. The gravity of this step should be communicated. A group whose plan contains dimensional errors will spend all year fixing those errors in wood."},{"w":2,"f":"Precision Cutting — All Structural Members","bi":"Grade 8 tolerance is ±1 mm. Grade 7 was ±2 mm. Grade 6 was ±3 mm. Tolerance tightens because consequence grows: a 1 mm error in a human-load bridge compounds into a 5 mm alignment error at the joint and a 15 mm gap at the span connection.","obj":"Groups cut every structural member for both fixed spans to ±1 mm tolerance — the tightest tolerance in the programme — and verify all cuts against the approved plan.","dur":"60 minutes","grp":"Groups of 4","mat":["Timber stock 4×6×200 cm (4 lengths per group — main beams)","Wood strips 4×4×70 cm (cross beams, 10 per group)","Plywood 12 mm (1 sheet per group — deck boards)","Hand saw (fine-toothed 12 tpi)","Bench vise","Mitre box","Steel ruler 1 m","Set square","Pencil","Eye protection","Work gloves"],"voc":[["Mitre box","A guide that holds the saw at a precise angle (0°, 45°, or 90°) during cutting — removes the possibility of an angled cut when a square cut is needed"],["Fine-toothed saw","A saw with more teeth per inch — produces a smoother cut at the cost of slower cutting. Required for precision cuts in structural timber"],["Cumulative error","The total error produced when multiple small errors add together across a series of cuts — even 0.5 mm per cut becomes 5 mm across 10 cuts"]],"ph":[{"n":"Warm-Up — The 1 mm Standard","m":7,"t":"intro","s":["Hold up 2 timber pieces: one cut with the standard hand saw (±2 mm), one cut with the fine mitre box technique (±0.5 mm). Ask students to measure both.","Ask: 'The mitre box cut takes longer. The standard saw cut is faster. Why does the mitre box cut matter for this project?'","Guide: 'The Pamban bridge has a movable span that must align perfectly with the fixed span when it closes. A 2 mm error in the main beam length creates a 4 mm misalignment when two beams meet at the hinge — and a 4 mm gap in a bridge deck is a safety issue and a mechanism problem…","Introduce the mitre box: a channel guide that holds the saw at precisely 90° to the workpiece. No angled cuts possible when the saw is in the mitre box correctly."]},{"n":"Skill Demo — Mitre Box Precision Cutting","m":10,"t":"demo","s":["Mark the cut line: pencil mark, confirmed with a set square across all 4 faces of the timber.","Position in mitre box: the cut line is aligned with the mitre box saw channel. The timber is pressed firmly against the mitre box back fence.","Saw: slow, full-length strokes. The mitre box guides the saw — do not force it sideways. Let the weight of the saw do the work.","Measure immediately after each cut: compare to the plan dimension. Within 1 mm? Proceed. Outside 1 mm? Identify whether the error was in the marking or the cutting.","Template method for repeated cuts: use the first successfully cut piece as a template for all subsequent pieces of the same length."]},{"n":"Build Challenge — Full Cut List Execution","m":30,"t":"build","s":["Groups cut all members from the approved plan cut list.","Priority 1: main longitudinal beams (most critical — any error here propagates everywhere).","Priority 2: cross beams for both fixed spans.","Priority 3: deck board blanks (plywood, cut slightly oversized — will be trimmed to final width during installation).","After every 5 cuts: stack all same-length pieces and measure the stack. Any piece outside ±1 mm must be replaced.","Facilitator: walk the group at each 5-cut check. Do not wait for end-of-session to find errors."]},{"n":"Test — The Full Cut List Verification","m":6,"t":"test","s":["Lay all cut pieces beside the plan cut list. Every piece measured and recorded.","Any piece outside ±1 mm: identify it, mark it with an X, and replace it now. Do not proceed to assembly with out-of-tolerance pieces.","Stack test: all pieces of the same length stacked. No overhang when sighted along the stack end.","Record: how many pieces required replacement? What was the most common error — marking or cutting?"]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["All pieces labelled and bundled by type. Plans stored in project folders.","Facilitator: 'Every piece you cut today is ±1 mm. You will never cut more precisely by hand. That precision was earned by learning the mitre box, slowing down the stroke, and checking after every 5 cuts. Next week: the main beam assembly. The accuracy of every joint depends on wh…"]}],"diff":{"sup":"Reduce cut list to main beams and cross beams only. Deck boards pre-cut by facilitator.","ext":"Calculate the maximum allowable tolerance for the movable span hinge pin hole centres, given that the mechanism must align within 2 mm when the span closes."},"ass":"Is every piece within ±1 mm of the plan dimension? Is the full cut list accounted for? Were replacement pieces made for any out-of-tolerance cuts?","note":"The mitre box must be bolted or clamped to the bench — a mitre box that shifts during cutting defeats its purpose. Check every group's mitre box is secure before the build phase begins."},{"w":3,"f":"Base Beam Assembly","bi":"The main beams are the spine of the bridge. Every other element connects to them. If the spine is straight and parallel, the bridge will be straight. If the spine is not, nothing else can be.","obj":"Groups assemble the main longitudinal beam pairs for both fixed spans, achieving a paired beam set that is parallel within 2 mm across the full 60 cm length.","dur":"60 minutes","grp":"Groups of 4","mat":["Main beams from Week 2","Wood glue","M8 bolts (16 per group) + nuts + washers","Power drill (supervised)","Spanner","C-clamps (8 per group)","Steel ruler 1 m","Eye protection","Work gloves"],"voc":[["Flitch beam","Two or more beams bolted together face-to-face — stronger than one beam of the same total size because the interface between them is stiff and transfers shear"],["Parallel","Two beams are parallel when the gap between them is the same at every measured point — confirmed by measuring at 3 or more positions along the span"],["Splice","A connection that joins two shorter beams end-to-end to create one longer beam — requires careful lap or scarf joint technique"]],"ph":[{"n":"Warm-Up — Flitch Beam vs Single Beam","m":7,"t":"intro","s":["Show a single 4×6 cm beam spanning 60 cm under 50 kg: measure deflection.","Show two 4×6 cm beams bolted face-to-face (a 8×6 cm flitch beam) under the same 50 kg: measure deflection.","The flitch beam deflects approximately half as much. Ask: 'Why? It's the same amount of wood.'","Guide: 'In a single beam, the two halves can slide past each other slightly at the neutral axis. Bolting them together prevents this sliding — the interface carries shear, making the composite beam stiffer than two separate beams.'","Grade 8 main beams are flitch beams: 2 × 4×6 cm beams bolted face-to-face for each main beam line."]},{"n":"Skill Demo — Flitch Beam Assembly","m":10,"t":"demo","s":["Apply wood glue to the full face of one beam — glue enhances the interface shear transfer.","Clamp both beams face-to-face. Mark 4 bolt positions along the length (at 10, 25, 45, and 55 cm from one end — not at the ends where the cross beam bolts will be).","Drill through both beams simultaneously while clamped. M8 bolt, washer both sides, nut. Pre-tension.","Check parallelism: with the flitch beam lying flat, measure the width at 4 points along its length. All measurements should be identical — the glue and bolts prevent any bow or twist.","Show the finished flitch beam: twice as stiff as a single beam. This is the main beam for the Grade 8 bridge."]},{"n":"Build Challenge — All Main Beams","m":30,"t":"build","s":["Groups build 4 flitch beams (2 per fixed span — left and right side).","All 4 are identical in length and cross-section. Use the first completed flitch beam as the template for the others.","Step 1 (8 min): Glue + clamp all 4 pairs simultaneously.","Step 2 (10 min): While clamped, drill all bolt holes (4 per beam × 4 beams = 16 holes).","Step 3 (8 min): Insert and tighten all bolts. Remove clamps.","Step 4 (4 min): Parallelism check on all 4 beams.","Facilitator: confirm every bolt hole is drilled with the beams clamped together — any hole drilled in separate pieces will not align."]},{"n":"Test — Parallelism and Stiffness","m":5,"t":"test","s":["Width measurement at 4 points along each beam: all within 0.5 mm of nominal width?","Load test: place all 4 completed flitch beams side by side. Apply 50 kg to one. Compare deflection to the Grade 7 single beam. Is it approximately half the Grade 7 deflection?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Flitch beams stored flat, C-clamps removed. Bolts checked for pre-tension.","Facilitator: 'The Pamban Bridge's main girders are I-section steel members. You've just built the timber equivalent — a flitch beam that transfers shear through its interface, just as the steel web does in an I-section. Different materials, identical structural principle. Grade 8…"]}],"diff":{"sup":"Pre-drill the bolt holes in one beam pair. Group drills the remaining 3 pairs.","ext":"Calculate the composite section modulus of the 8×6 cm flitch beam and compare to the theoretical section modulus of a single 8×6 cm solid beam. Why are they not the same?"},"ass":"Are all 4 flitch beams within ±0.5 mm of nominal width? Does each flitch beam hold 50 kg with approximately half the Grade 7 single-beam deflection?","note":"The simultaneous drilling of both beam faces while clamped is the most important quality step — enforce it. Groups that un-clamp and drill separately will create offset holes that prevent bolt insertion or create an angled clamp path that twists the joint under load."},{"w":4,"f":"Truss Side Panels — Both Spans","bi":"The Grade 8 truss carries twice the load of the Grade 7 truss. The panel is taller, the members are bigger, and the connections are all bolted. Everything is the same principle — scaled to a new consequence.","obj":"Two teams build the truss side panels for the two fixed spans, achieving panels strong enough to carry 120 kg each without visible deflection.","dur":"60 minutes","grp":"Groups of 4 (2 teams of 2)","mat":["Flitch beams from Week 3","Wood strips 4×4×30 cm verticals (12 per group)","Wood strips 4×4×40 cm diagonals (10 per group)","M8 bolts (24 per group) + nuts + washers","Wood glue","Power drill (supervised)","Spanner","C-clamps (8 per group)","Eye protection","Work gloves","120 kg test weight"],"voc":[["Panel depth","The vertical distance between the top and bottom chords of a truss panel — larger panel depth means greater moment of resistance and lower chord forces for the same span and load"],["Through truss","A bridge where the deck is at the bottom chord level — the structural trusses extend above the deck and the load path goes from deck up into the truss and back down to the supports"],["Half-through truss","The Grade 8 configuration — the deck is partway up the panel height, handrails extend above deck level within the trusses"]],"ph":[{"n":"Warm-Up — Through Truss vs Half-Through Truss","m":7,"t":"intro","s":["Draw both configurations on the board: through truss (overhead portal bracing above the deck), half-through truss (deck at bottom chord, trusses extend above as handrail).","Grade 8 bridge uses half-through configuration — the deck sits on the bottom chords of the truss panels. The truss members above the deck level serve as the handrail structure.","Advantage: no overhead portal bracing needed, which saves weight and material. Disadvantage: the top chord is unsupported laterally — requires more careful attention to top chord buckling.","Ask: 'What does the lack of overhead bracing mean for the top chord of the truss?' (It can buckle sideways under compression — must be designed with sufficient depth to prevent lateral-torsional buckling.)"]},{"n":"Skill Demo — Panel Assembly at Grade 8 Standard","m":10,"t":"demo","s":["Flitch beam bottom chord laid flat on bench. Mark all 3 vertical positions.","Vertical members: end verticals (at both ends of the panel) are the most heavily loaded — these receive 2 bolts each. Interior verticals receive 1 bolt each.","Diagonal members: must be pre-cut to the correct angle (measure the angle from the panel geometry using the protractor). Diagonals that are even 2° off angle will not fit flush against the chord.","Glue-and-bolt protocol: same as Grade 7 but with an additional washer plate under the nut at heavily loaded joints — distributes the bolt bearing stress over a larger wood area."]},{"n":"Build Challenge — Truss Panels Both Spans","m":30,"t":"build","s":["Team A: left panel of Span 1. Team B: right panel of Span 1. After Span 1 complete, both teams build Span 2 panels.","Assembly follows the established sequence: bottom chord → verticals → diagonals → top chord.","Parallel check after each team's panel: compare the two panels from each span. Height at both ends and at midspan must match within 3 mm.","Facilitator: power drill rotation between teams — maximum 1 student at the drill at any time."]},{"n":"Test — 120 kg Panel Load Test","m":5,"t":"test","s":["Each panel tested with 120 kg applied at midspan.","No visible deflection criterion: use a straight edge along the top chord. Any daylight = deflection. Target: ≤ 5 mm under 120 kg.","Panel height comparison: all 4 panels in a set should match within 3 mm."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Panels stored flat.","Facilitator: 'Four truss panels, all within 3 mm of each other, all holding 120 kg each. When these four panels are connected by cross beams and deck boards, the bridge can carry 4 × 120 kg = 480 kg — which is the target factor of safety over 3 adults at 240 kg. You have designed…"]}],"diff":{"sup":"Pre-cut all diagonal members to the correct angle. Group focuses on assembly and bolting.","ext":"Determine whether the top chord of the half-through truss is at risk of lateral-torsional buckling. Calculate the chord's effective length and compare to Euler's buckling threshold."},"ass":"Does each panel hold 120 kg with ≤ 5 mm deflection? Are all 4 panels matched in height within 3 mm?","note":"The diagonal angle pre-cut is critical — a diagonal cut with the wrong angle leaves a gap between the diagonal and the chord face. This gap means the glue joint has no face contact area and the bolt is the only connection — significantly reducing joint strength. Provide a template angle guide before…"},{"w":5,"f":"Cross Beam and Deck Frame","bi":"The cross beam system is the bridge's skeleton in the third dimension. Without it, the two truss panels are just two walls. With it, they become one three-dimensional structure that distributes load in all directions.","obj":"Groups install all cross beams for both fixed spans, verify squareness, and confirm that the deck frame holds 80 kg at midspan with ≤ 3 mm deflection.","dur":"60 minutes","grp":"Groups of 4","mat":["All 4 truss panels from Week 4","Pre-cut cross beams (10 per group, cut at 64 cm — 60 cm deck width + 4 cm for beam attachment on each side)","M8 bolts (20 per group)","Power drill (supervised)","Spanner","Steel ruler 1 m","Set square","Eye protection","Work gloves","80 kg test weight"],"voc":[["Deck frame","The complete two-dimensional grid of main beams and cross beams on which the deck boards are laid"],["Bay","The rectangular cell of the deck frame between two adjacent cross beams and the two main beams — the smallest repetitive unit of the bridge structure"],["Rigid diaphragm","A cross beam assembly that is stiff enough to prevent any relative movement between the two truss panels — required for lateral stability"]],"ph":[{"n":"Warm-Up — The Two-Span Connection Challenge","m":7,"t":"intro","s":["Today the two fixed spans are assembled. But there is a challenge: the two spans must connect end-to-end, with the movable span gap between them.","Show the bridge plan: Span 1 (left) — movable span gap — Span 2 (right). The outer ends of each span connect to the abutments (supports). The inner ends face each other across the movable span gap.","The inner beam ends are the most critical — they must be at exactly the right height and position for the movable span to align when it closes.","Today's goal: assemble both fixed spans as separate complete deck frames. Next week: the movable span mechanism."]},{"n":"Skill Demo — Cross Beam Installation","m":8,"t":"demo","s":["Show the cross beam bolt-and-block connection: the cross beam is bolted through the web of the truss panel with a timber block spacer to maintain the correct deck height.","Install end cross beams first. Check squareness of each span frame (diagonal equality). Only then install intermediate cross beams.","Show the inner beam end preparation: the inner end of each span's main beams receives a metal bearing plate (a flat steel or thick MDF plate bolted to the beam end) — this is where the movable span will rest when closed."]},{"n":"Build Challenge — Full Deck Frame Assembly","m":30,"t":"build","s":["Span 1 (15 min): Install 5 cross beams. Check diagonals. Confirm squareness. Install bearing plates at inner beam ends.","Span 2 (15 min): same procedure. Confirm Span 2 cross beam positions mirror Span 1 — the two spans must be dimensionally identical for the movable span to connect both.","Critical alignment check: lay both completed span frames side by side. Inner beam ends must be at the same height (within 2 mm).","Facilitator: the bearing plate installation is new — supervise closely. Bolts must be fully tightened and plates flush with the beam end face."]},{"n":"Test — 80 kg Deck Frame Load","m":7,"t":"test","s":["Each span tested with 80 kg at midspan. Deflection measured.","Squareness check: diagonals of each span frame measured and confirmed equal.","Bearing plate alignment: slide a ruler along the bearing plate faces of both inner beam ends. Are they coplanar (in the same plane)?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Both span frames stored on trestles.","Facilitator: 'Two fixed spans, dimensionally identical, with bearing plates ready to receive the movable span. Next week is the most complex session of the year — the movable span mechanism. Come in knowing the plan. This is where the Pamban bridge becomes real.'"]}],"diff":{"sup":"Pre-mark all cross beam positions on both spans. Group drills and bolts.","ext":"Calculate the deck frame stiffness by measuring deflection at 3 different points under a fixed load. Is the stiffness uniform across the span, or does it vary? Why?"},"ass":"Are both spans square (diagonals within 3 mm)? Do both inner beam ends have bearing plates installed and coplanar? Does the deck frame hold 80 kg at midspan with ≤ 3 mm deflection?","note":"The bearing plates must be perfectly aligned — this is the critical preparation for Week 6's movable span. Have groups check this multiple times. A 2 mm height difference between the two bearing plate surfaces will cause the movable span to bind when it closes."},{"w":6,"f":"Deck Installation and Movable Span Mechanism — Laser CNC and 3D Printed Components","bi":"The movable span is the most dimensionally demanding mechanism in the programme. The piano hinge must align within 1 mm for the span to rotate freely. The locking pin holes must be coaxial within 0.5 mm or the pins won't engage. These tolerances are achievable by hand — but they are guaranteed by machine.","obj":"Groups install deck boards on both fixed spans and build a Pamban-inspired movable span using laser CNC-cut span frame parts and a 3D-printed bascule pivot housing — completing 5 reliable open/close/lock cycles.","dur":"60 minutes","grp":"Groups of 4","mat":["Both span frames from Week 5","Plywood deck boards 12 mm (20 per group)","M6 bolts (40 per group) + nuts + washers","Power drill (supervised)","Laser-cut plywood 12 mm — movable span frame panels (pre-cut: 2 side beams + 2 cross members per group)","3D-printed bascule pivot housing (PETG, printed before session — 1 per group)","Steel piano hinge full width","Barrel bolt locking pins (2 per group)","Raising rope (4 m)","Spanner","Eye protection","Work gloves"],"voc":[["Piano hinge","A continuous hinge running the full width of the movable span — distributes hinge force evenly and allows smooth rotation from 0° to 90°"],["Bascule pivot","The rotating joint at the fixed end of the movable span — in the real Pamban bridge this is a massive steel trunnion; in Grade 8 it is a 3D-printed PETG housing with a bolt axle"],["Coaxial","Two holes are coaxial when they share exactly the same centre axis — a prerequisite for a pin that must pass through both simultaneously"]],"ph":[{"n":"Warm-Up — Mechanism Precision and Why Machines Help","m":7,"t":"intro","s":["Show the Pamban movable span operation: the span opens to allow ships through. Precision matters — a span that jams halfway open is useless.","Show the 3D-printed pivot housing: a PETG plastic block with a precisely located 8.5 mm axle hole and two countersunk bolt holes for mounting. This was designed in CAD (Tinkercad or Fusion 360) and printed before the session. Ask: 'Why 3D print this piece rather than drill it by …","Show the laser-cut span frame panels: the four frame pieces — 2 side beams and 2 cross members — each with bolt holes pre-cut at the correct positions. No marking or drilling needed for assembly.","Three states: LOCKED DOWN, UNLOCKED, RAISED. Today: build the mechanism and achieve all three states reliably."]},{"n":"Skill Demo — Movable Span Assembly with Laser and 3D Parts","m":12,"t":"demo","s":["Movable span frame: assemble the 4 laser-cut parts (2 × side beams + 2 × cross members) using the pre-cut bolt holes. The holes align without marking — bolt directly through. This is the first benefit of the laser cut: assembly without layout.","3D-printed pivot housing: mount it to the hinge end of the span frame using the countersunk bolts. The axle hole faces inward toward Span 1.","Piano hinge: bolt to the inner end face of Span 1's main beam. The pivot housing on the span frame receives the piano hinge leaf — the bolt axle passes through the housing's axle hole and the hinge knuckle simultaneously.","Test rotation: does the span rotate freely from 0° to 90°? If it binds, the axle is misaligned — adjust the housing position by loosening its mounting bolts and repositioning.","Free end and locking pins: install 2 barrel bolts through the movable span free end. The laser-cut locking pin holes in the span frame align with the pre-drilled holes in the Span 2 bearing plate.","Raising rope: tie to the free end of the span at both sides."]},{"n":"Build Challenge — Deck and Movable Span","m":28,"t":"build","s":["Team A — Deck installation (14 min): install all deck boards on both fixed spans. Sand all surfaces. Check gaps ≤ 5 mm.","Team B — Movable span mechanism (14 min): assemble the laser-cut span frame (bolt holes pre-cut — direct assembly). Mount the 3D-printed pivot housing. Install piano hinge. Test rotation. Install locking pins. Install raising rope.","After 14 min: teams swap and check each other's work. Deck team inspects the mechanism; mechanism team walks the deck.","Integration: close movable span onto Span 2 bearing plate. Engage locking pins. Pull raising rope — pins must prevent movement. Disengage pins. Raise to 90°. Lower. Re-engage. Repeat × 5."]},{"n":"Test — 5 Cycle Reliability Test","m":5,"t":"test","s":["5 complete open/close/lock cycles. Record any binding, misalignment, or pin failure at each cycle.","Flush check: when locked closed, lay a ruler across movable span and fixed span deck surfaces — flush within 2 mm?","Pivot housing inspection: any cracking or deformation in the 3D-printed PETG housing after 5 cycles? PETG is the correct material for this application — it has sufficient flex toughness for a mechanism that cycles.","Pin test: with span locked, push the free end sideways with 15 kg force. Do the pins hold?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge stored with movable span locked. Laser CNC and laptop covered.","Facilitator: 'The Pamban movable span has been operating since 1914. Its bascule pivot is a precision-machined steel trunnion that costs more than this entire year's budget. Yours is a 3D-printed PETG housing that cost ₹180 and holds the axle to ±0.3 mm. The engineer who designed…"]}],"diff":{"sup":"Pre-assemble the movable span frame. Group focuses on hinge installation, pivot housing mounting, locking pins, and the 5-cycle test.","ext":"Load the 3D pivot housing CAD file in Tinkercad. Modify the axle hole diameter by 0.5 mm and explain what effect this would have on the mechanism's play and long-term wear."},"ass":"Does the movable span complete 5 open/close cycles without binding? Is the 3D-printed pivot housing mounted and undamaged? Is the deck surface flush between fixed and movable spans within 2 mm?","note":"The 3D-printed pivot housing must be printed before the session — it requires approximately 2 hours on a standard FDM printer at 0.2 mm layer height in PETG. Print 2 spares per group: PETG at 15% infill is strong enough for this use but can crack if over-tightened. Lightly oil the axle bolt before i…"},{"w":7,"f":"Handrail and Safety System","bi":"The Pamban Rail Bridge has no handrails — it is a rail bridge, not a pedestrian bridge. By adding handrails rated for 80 kg per post, the Grade 8 bridge crosses a line: it becomes a structure designed for people, not trains.","obj":"Groups install a complete bolted handrail system on all 3 spans (both fixed + movable when closed) and verify it meets the Grade 8 safety specification: 80 kg lateral force per post without movement.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 6","Dowel posts 30 mm × 50 cm (12 per group)","Rope 10 mm (8 m per group)","M10 bolts 100 mm (24 per group) + nuts + washers","Power drill 32 mm spade bit (supervised)","Spanner","Eye protection","Work gloves","Rope tensioner"],"voc":[["Post base plate","A metal or timber plate bolted to the deck that the post sits in — distributes the bending force from the post over a larger deck area"],["Lateral load rating","The maximum sideways force a handrail post can carry without movement — the Grade 8 standard is 80 kg per post"],["Continuous handrail","A handrail that runs without interruption from one end of the bridge to the other — safer than segmented sections because there are no gaps where a person could slip through"]],"ph":[{"n":"Warm-Up — The 80 kg Standard","m":7,"t":"intro","s":["Ask: 'How hard does a person push on a handrail when they are off-balance?' (Up to their full body weight laterally — approximately 80 kg for an adult.)","Grade 6 handrail rated to 50 kg. Grade 7 rated to 50 kg. Grade 8 is rated to 80 kg per post — matching adult body weight.","To achieve 80 kg per post, what must change? (Larger post diameter, bolt through cross beam not just deck, post base plate to distribute bending).","New element: post base plate. A timber block bolted to the deck at each post position before the post is installed. The post passes through the deck AND into the base plate — transferring bending force to both the deck and the cross beam below."]},{"n":"Skill Demo — 80 kg Rated Post Installation","m":10,"t":"demo","s":["Install base plate first: a 6 cm × 6 cm × 4 cm timber block bolted to the deck with 2 M8 bolts, sitting directly over a cross beam.","Drill the post hole: 32 mm hole through deck board, through base plate, into the cross beam below.","Insert post: the 30 mm dowel post passes through all three — deck, base plate, cross beam. Secured with M10 bolt through the cross beam.","Rope installation: 10 mm rope through 12 mm holes drilled through each post at 40 cm and 20 cm height. Tensioned with rope tensioner.","Load test of one post immediately: 80 kg lateral force. Does the post move?"]},{"n":"Build Challenge — Full Handrail System","m":28,"t":"build","s":["Groups install 6 posts per side (3 per fixed span = 12 posts per side × 2 sides = 24 total posts).","Side 1 (14 min): install 6 posts with base plates. Thread and tension top and intermediate ropes. Check all posts plumb.","Side 2 (14 min): repeat.","Movable span handrail: the movable span posts use the same system but must be removable — the hinge end posts must be able to clear the span 1 handrail when the span is raised. Design the post height to clear the fixed span handrail.","Facilitator: movable span handrail compatibility is a genuine design constraint — check that raising the movable span does not foul the Span 1 handrail."]},{"n":"Test — 80 kg Lateral Force All Posts","m":7,"t":"test","s":["Test every 4th post with 80 kg lateral force. Record pass/fail.","Rope tension: pluck every rope section. All should ring clearly.","Gap check: 40 mm card spacer through all handrail gaps — none should pass through.","Movable span operation with handrail: open and close the movable span with the handrail installed. Does it operate freely?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge stored with movable span locked, handrail ropes tensioned.","Facilitator: 'Every post on this bridge is rated to 80 kg. That is the weight of an adult falling sideways. Every person who crosses this bridge is protected by those posts and that rope. That is not engineering theory. That is engineering responsibility.'"]}],"diff":{"sup":"Pre-install base plates for all posts. Group drills post holes and installs posts.","ext":"Calculate the bending moment at the base of a handrail post under 80 kg lateral force at the rope height. Does the post cross-section provide sufficient resistance?"},"ass":"Do all tested posts resist 80 kg without movement? Does the movable span operate freely with the handrail installed? Is the rope gap ≤ 40 mm at all points?","note":"The 32 mm spade bit is the largest drill bit used in the programme — it requires firm two-handed control and the drill at slow speed initially. Demonstrate the transition from slow (to establish the hole) to medium speed (for clean cutting). Never use high speed with a spade bit in timber."},{"w":8,"f":"Aesthetic Finishing and Heritage Integration","bi":"The Pamban Bridge is not just a structure — it is a cultural icon of Tamil Nadu. Engineering that ignores its cultural context is engineering that has forgotten who it serves.","obj":"Students apply surface finishing, Tamil heritage decorative elements, and structural labelling to produce a bridge that is both technically complete and culturally resonant.","dur":"60 minutes","grp":"Individual working on shared bridge","mat":["Bridge from Week 7","Sandpaper 80 and 120 grit","Teak wood stain and terracotta paint","Fine brushes","Label cards","Heritage reference materials (Pamban bridge photographs, Tamil Nadu coastal motifs)","Craft tools for surface decoration"],"voc":[["Cultural resonance","When an object or structure communicates connection to a community's history, values, or identity"],["Patina","The surface colour and texture that develops on a material over time — in Tamil Nadu timber structures, teak wood naturally develops a silver-grey patina. Stain replicates the aged appearance"],["Wayfinding","Design elements that help people navigate a structure — labels, colour coding, and markings that tell users where they are and how to use the structure"]],"ph":[{"n":"Warm-Up — The Pamban Bridge as Icon","m":7,"t":"intro","s":["Show photographs of the Pamban bridge: its distinctive dark red-brown steel girders, its position between two bodies of water, the way it appears to float between Rameswaram and the mainland.","Ask: 'What makes this bridge recognisable as Tamil Nadu's bridge? What design elements are unique to it?'","Discuss: colour (the characteristic rust-red of its steel), form (the long flat approach spans flanking the central movable section), and context (surrounded by open sea).","Today: each student takes responsibility for one section of the bridge surface and finishes it to match the aesthetic of the Pamban bridge."]},{"n":"Skill Demo — Surface Finishing Techniques","m":8,"t":"demo","s":["Full sand: 80 grit first, 120 grit final. The 120 grit removes the scratches from 80 grit and leaves a surface that takes stain evenly.","Stain: teak stain applied with a cloth (not a brush) — cloth application produces a more even result than brush, especially on end grain.","Pamban colour accent: rust-red paint on the truss diagonal and vertical members — referencing the bridge's steel colour.","Heritage label: at each end of the bridge, a card label reading 'PAMBAN' in Tamil script and English. At the movable span: 'MOVABLE SPAN — OPEN FOR VESSELS' / 'MOVABLE SPAN — BRIDGE CLOSED'."]},{"n":"Build Challenge — Surface Finishing","m":28,"t":"build","s":["Each student takes 1 assigned section of the bridge (deck surface, truss panel, movable span, or post system).","Step 1 (6 min): full sand of their section — 80 then 120 grit.","Step 2 (8 min): apply teak stain to timber surfaces with cloth.","Step 3 (8 min): apply rust-red paint to truss diagonal and vertical members.","Step 4 (6 min): install labels at assigned locations.","Facilitator: walk around and check colour consistency between sections — the bridge should look like one structure, not a patchwork."]},{"n":"Final Structural Walkthrough","m":9,"t":"test","s":["The entire group walks the length of the bridge (from outside, not on it) and performs the final checklist:","□ All bolts re-tightened this week?","□ Movable span opens and locks 5 times reliably?","□ All handrail gaps ≤ 40 mm?","□ Deck surface smooth — no splinters?","□ Labels installed at all required positions?","□ mBot sensor re-calibrated after finishing?","Issue Load Certificate after checklist is complete."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bridge stored with movable span locked. Stain drying overnight.","Facilitator: 'The bridge is finished. It is stained, painted, labelled, and certified. It has a movable span, human-rated handrails, and a structural health monitor. Next week: the 3-adult load test. The week after: the public opening. You have 2 weeks.'"]}],"diff":{"sup":"Provide heritage label cards pre-printed. Student stains their section and installs labels.","ext":"Research the actual dimensions of the Pamban movable span and calculate the scale ratio of the Grade 8 bridge to the real structure. Apply this ratio to verify that the Grade 8 bridge is a geometrical…"},"ass":"Is the colour scheme consistent across the full bridge? Are labels installed at all required positions? Is the final checklist fully signed off?","note":"The rust-red paint for truss members is a deliberate heritage design choice — but it must be applied cleanly, not as a wash over everything. Mask the deck and chord surfaces before painting the truss members. Drips of red on teak-stained deck boards are difficult to remove and damage the presentatio…"},{"w":9,"f":"Human Load Qualification Test","bi":"The Pamban Rail Bridge was qualified for rail traffic in 1914 by running a test train across it. Today, the Grade 8 bridge is qualified for human traffic. The principle has not changed in 110 years.","obj":"The bridge undergoes a staged adult load test: 1 adult, then 2 adults, then 3 adults simultaneously — each stage monitored by the mBot sensor — followed by the movable span demonstration.","dur":"60 minutes","grp":"Groups of 4 + invited adults","mat":["Complete bridge","Safety mats","mBot and laptop (live monitoring)","Scale (to record adult weights)","Log sheet","Deflection ruler","3 adult volunteers"],"voc":[["Qualification test","A formal test that demonstrates a structure meets its design specification — completion of qualification allows the structure to enter service"],["Adult load","A structural loading standard based on the weight of an adult — approximately 80 kg per person — used for pedestrian bridge design"],["Structural margin","The difference between the tested capacity and the design load — the structural margin confirms the factor of safety has been achieved in practice"]],"ph":[{"n":"Pre-Test Protocol","m":8,"t":"intro","s":["Safety briefing: safety mats in position. Only the crossing adults and the facilitator in the test zone. All students observe from outside the safety perimeter.","Weigh all 3 adult volunteers. Record total weight. Confirm total is within the design load (3 × 80 kg = 240 kg).","Set mBot monitoring system running. Record baseline frequency.","Announce: 'This bridge was designed to carry a factor of safety of 2 over the design load. It has been tested through all structural stages. Today we confirm human occupancy qualification.'"]},{"n":"Staged Adult Load Test","m":28,"t":"test","s":["Stage 1 (8 min): 1 adult walks across. Measure midspan deflection. Record sensor reading. Frequency after crossing.","Stage 2 (8 min): 2 adults simultaneously. Measure deflection at midspan and quarter-span. Record sensor readings throughout.","Stage 3 (12 min): all 3 adults stand simultaneously at midspan. Hold for 60 seconds. Record maximum deflection. Record frequency. Any sounds? Any visible deformation? Any handrail movement?","Go/No-go decision: facilitator reviews all data. If all 3 stages pass — qualification confirmed. Issue the Qualification Certificate."]},{"n":"Movable Span Demonstration","m":12,"t":"test","s":["With an adult standing on the fixed span at the movable span end: disengage locking pins. Raise movable span to open position.","Demonstrate: the bridge is open — a vessel could pass through the gap.","Lower movable span. Re-engage locking pins. Adult crosses over the movable span.","Record: number of cycles, any binding, pin engagement quality.","Audience observation: what did the mBot sensor show during the movable span operation? (The gap change should be visible in the sensor reading.)"]},{"n":"Certificate and Clean-Up","m":6,"t":"test","s":["Issue the Qualification Certificate: 'This bridge has been tested to 3 adult simultaneous load (approximately ___ kg). Maximum midspan deflection under full qualification load: ___ mm. Structural frequency at qualification load: ___ Hz. Movable span operated successfully: ___ cyc…","Students sign the certificate.","Bridge returned to display position for Week 10 public opening."]},{"n":"Clean-Up & Close","m":6,"t":"close","s":["Bridge cleaned of any footprints. mBot sensor left in position.","Facilitator: 'Three adults stood on that bridge simultaneously and it held. That is what engineering means. Not the plan, not the drawing, not the calculation — the moment when real people stand on what you built and they are safe. You qualified a bridge today.'"]}],"diff":{"sup":"Assign the role of sensor reader — calls out mBot readings during each stage. Clear, important, achievable.","ext":"Calculate the structural margin: (estimated failure load from Grade 7 load test pattern) ÷ (actual qualification load). Express as a safety factor and compare to the design target of 2."},"ass":"Did the bridge pass all 3 staged adult load tests? Was deflection recorded at each stage? Did the movable span operate during the demonstration? Was the Qualification Certificate issued?","note":"The 3-adult simultaneous standing test is the most serious structural test in the entire 9-year programme. Treat it accordingly. The moment the 3 adults step back onto the safe deck after the midspan hold is the moment worth remembering. Document it on video."},{"w":10,"f":"School Bridge Showcase and Public Opening","bi":"The Pamban Bridge connects Rameswaram — an island — to the mainland of Tamil Nadu. It connects a place to a people. Your bridge today connects your engineering learning to the school community. That connection is what gives it meaning.","obj":"Groups present their Pamban-inspired bridge to the widest possible audience, demonstrate live structural monitoring and movable span operation, and conduct the ceremonial opening crossing.","dur":"60 minutes","grp":"Groups of 4 + whole school community","mat":["Completed bridge with Qualification Certificate","mBot and laptop","Movable span operating crew (2 students)","Crossing register","Camera","Tamil Nadu map showing Pamban Bridge location (for context)","Invitation cards (sent to parents last week)"],"voc":[["Opening ceremony","The formal first crossing of a bridge by the public — a cultural event as much as an engineering milestone"],["Guest of honour","The first person to cross a bridge at its opening — in Tamil Nadu tradition, this is often a respected elder, a deity's representation, or the chief engineer"],["Engineering legacy","The knowledge, skills, and standards a structure passes to the engineers who built it — what they carry forward into their future work"]],"ph":[{"n":"Exhibition Setup and Audience Welcome","m":10,"t":"intro","s":["Bridge displayed on trestles. Qualification Certificate mounted in front. mBot sensor active.","Widest possible audience: parents, principal, all teaching staff, other grades, school trustees if available.","Facilitator opens: 'The bridge before you was designed to carry 3 adults simultaneously. It has been qualified to that standard. It has a movable span that opens and closes on command. It is monitored by a real sensor system. It was designed, cut, drilled, bolted, tested, refined…","Show the Pamban Bridge photograph beside the Grade 8 bridge. 'This is the inspiration. This is the result.'"]},{"n":"Group Presentations","m":18,"t":"build","s":["Each group presents for 90 seconds: (1) Pamban heritage connection, (2) structural systems (flitch beams, truss panels, movable span mechanism, handrail), (3) qualification test results (load, deflection, frequency).","During presentation: mBot is activated. A weight is placed on the bridge. The frequency shift is read live.","Audience questions: 2 per group."]},{"n":"Movable Span Demonstration and Opening Crossing","m":18,"t":"test","s":["The movable span is operated in front of the audience: pins disengaged, span raised, held open, lowered, pins re-engaged. 3 complete cycles.","mBot readings called out during operation: 'Frequency with span open: ___ Hz. Frequency with span closed: ___ Hz. What does the difference tell us?'","Opening crossing: the guest of honour (parent, principal, or special guest) crosses the bridge first — the inaugural crossing.","Crossing register: every audience member who wishes to cross adds their name.","mBot records the frequency during each crossing — these readings form the bridge's crossing history."]},{"n":"Reflection — The Engineer's Circle","m":8,"t":"close","s":["Students stand in a circle around the bridge.","Each student completes: 'I built a bridge that ___.'","Facilitator closes: 'You came to Grade 8 knowing how to build a walkable bridge. You leave Grade 8 knowing how to build a bridge with a mechanism — a structure that changes state, that opens and closes, that serves a purpose beyond standing still. In Grade 9, you move to water. T…"]},{"n":"Documentation and Archive","m":6,"t":"close","s":["Crossing register sealed and stored in the school engineering archive.","All technical data (qualification loads, deflections, frequencies) recorded in the school's engineering record.","Photographs and video shared with students and parents.","Facilitator: the bridge remains on display for the rest of the school year as a reference for Grade 7 and as a preview for Grade 9 students."]}],"diff":{"sup":"Assign the movable span operating role — a physically engaging, publicly visible, achievable task.","ext":"Write a full technical handover document for the bridge: specification, as-built drawings, test results, maintenance schedule, and recommendations for future improvement."},"ass":"Did the group present all 3 sections of their presentation? Was the movable span demonstrated successfully in front of the audience? Was the Qualification Certificate displayed?","note":"This is the culminating session of 8 years of making. The contrast between a Grade 1 student's cardboard name tag stand and a Grade 8 student presenting a qualified, human-load bridge with a movable span and live sensor monitoring is the entire story of the Vadiva Creative Labs Makerspace Pathway. M…"},{"w":11,"f":"Post-Opening Bridge Analysis and Documentation","bi":"A structure's history does not end when it opens. The post-opening inspection is the first entry in a maintenance record that will outlast the engineers who built it.","obj":"Groups complete a comprehensive post-opening inspection, compile all test data into a final bridge engineering record, and present the record to the class as a technical summary.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 10","Inspection forms","Rulers","Straight edge","Spanner","Graph paper","All test data from Weeks 3–10"],"voc":[["Maintenance record","A log of all inspections, tests, and repairs performed on a structure over its life"],["As-built drawing","A drawing that records the structure exactly as it was built — including any variations from the original design plan"],["Engineering archive","The permanent record of a project: drawings, specifications, test data, and inspection reports — kept for the life of the structure and beyond"]],"ph":[{"n":"Post-Opening Inspection","m":15,"t":"intro","s":["The full post-opening checklist from the approved inspection form:","1. Midspan deflection at rest (compare to Week 6 baseline — any permanent set?)","2. All bolts tightness check (re-tighten all nuts one quarter-turn and record any that were measurably loose)","3. Deck surface inspection (any new splinters, raised bolt heads, or board separation?)","4. Handrail post lateral resistance (push test on every 3rd post)","5. Movable span alignment (does the free end still seat correctly on Span 2 bearing plate?)","6. mBot frequency baseline (compare to Week 11 baseline from Grade 7 — the bridge's health since last recorded)","Record all findings on the inspection form."]},{"n":"Engineering Record Compilation","m":22,"t":"build","s":["Groups compile all their project data into a single A3 engineering record sheet:","Section 1 — Bridge Specification: span, width, design load, factor of safety achieved.","Section 2 — Construction Timeline: key milestones and dates.","Section 3 — Test Data: load test results, deflection data, frequency measurements, qualification results.","Section 4 — Post-Opening Inspection Results: findings from today.","Section 5 — Recommendations: 3 specific recommendations for improvement if the bridge were rebuilt.","Section 6 — Signing: all group members sign as the responsible engineers."]},{"n":"Engineering Record Presentations","m":12,"t":"test","s":["Each group presents their engineering record to the class in 90 seconds.","Focus on Section 5 — Recommendations. Each group explains their top recommendation and the engineering justification for it.","Class discusses: which recommendation would have the most impact on the bridge's performance?"]},{"n":"Clean-Up & Close","m":11,"t":"close","s":["Engineering records stored in the school archive alongside the crossing register from Week 10.","Bridge remains on display.","Facilitator: 'The bridge has an engineering record. Every finding, every test result, every recommendation — documented. A bridge without a record cannot be maintained responsibly. A bridge with a complete record can be maintained, repaired, and improved by engineers who were not…"]}],"diff":{"sup":"Provide the engineering record template pre-formatted. Student fills in data from their section of the project.","ext":"Complete a full as-built drawing set (plan, elevation, cross-section) with all actual dimensions measured from the finished bridge — compare to the original approved plan and quantify every variation."},"ass":"Is the inspection form complete with all measurements recorded? Does the engineering record contain all 6 required sections? Are the 3 recommendations technically justified?","note":"The engineering record will be referenced by Grade 9 and 10 students as examples of professional documentation. Quality matters — these are real documents, not homework exercises. Encourage neatness, specificity, and professional language."},{"w":12,"f":"mBlock Performance Monitoring — Advanced Analysis","bi":"A bridge that has been used tells a different story than a bridge that has never been loaded. The monitoring data from real use contains information that design calculations cannot predict — this is why all major bridges are permanently monitored.","obj":"Groups set up continuous mBot data logging across 20 load events, plot the complete load-deflection-frequency response surface, and identify any non-linear behaviour in the bridge's response.","dur":"60 minutes","grp":"Groups of 4","mat":["Bridge from Week 11","mBot and laptop","Spreadsheet software or graph paper","Test weights 10 kg to 80 kg in increments","Log sheet"],"voc":[["Non-linear behaviour","When a structure's response to load is not proportional to the load — indicates that something is changing (joints yielding, material plasticity, geometry changing)"],["Response surface","A 3D representation of how a structure responds to multiple simultaneous variables — e.g. deflection as a function of both load magnitude and load position"],["Damping ratio","The rate at which a structure's vibrations decay after an impact — a higher damping ratio means vibrations die out faster. Useful for comparing structural health"]],"ph":[{"n":"Warm-Up — What the Data Can Tell Us","m":7,"t":"intro","s":["Show the Week 11 test data for the bridge: the load-deflection table and the frequency-load curve.","Ask: 'Is the deflection proportional to load? Does the slope change as load increases?'","Guide: 'In the elastic range, deflection should be exactly proportional to load (double the load = double the deflection). If the slope changes at higher loads — the structure is entering the non-linear range. That is not failure, but it is a warning that the material is approach…","Today: 20 load events across the full range from 10 to 80 kg. Plot deflection and frequency for each. Identify where (if anywhere) the response becomes non-linear."]},{"n":"Skill Demo — Systematic Data Logging","m":8,"t":"demo","s":["Set up the data logging table: columns for Load (kg), Deflection (mm), Frequency (Hz), and Notes.","Sampling protocol: place each weight, wait 10 seconds for the bridge to settle, take 3 frequency readings and average them, measure deflection precisely, record all, remove weight, wait 5 seconds, proceed to next.","mBlock code for frequency logging: high-sample rate reading loop that runs for 2 seconds and records the peak oscillation count after a tap.","Demonstration: run 3 load levels live. Show the data being recorded correctly."]},{"n":"Build Challenge — 20 Load Events","m":28,"t":"build","s":["Groups run 20 systematic load tests: 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80 kg and 5 repeat tests at 40 kg (to check repeatability).","Record all data in the log table.","Plot as 2 graphs: (1) Load vs Deflection, (2) Load vs Frequency.","Identify on each graph: (a) the linear elastic range, (b) any non-linear zone, (c) the slope change point (if present).","Facilitator: the 5 repeat tests at 40 kg are critical — if the deflection at 40 kg is not repeatable (varies by more than 0.5 mm), the bridge has internal movement (joint slip) that is not visible externally."]},{"n":"Test — Non-Linear Identification","m":9,"t":"test","s":["Groups present their 2 graphs to the class.","Key question: does the deflection vs load graph have a consistent slope, or does it change slope at a specific load level?","If a slope change is found: at what load does it occur? What does this indicate structurally?","Repeatability result: were the 5 × 40 kg readings consistent? What is the standard deviation of those 5 readings?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Data graphs stored in the engineering record.","Facilitator: 'The non-linear range you identified today is the same concept that structural engineers use to define the design load limit for every bridge, every building, every aircraft in the world: the point at which the response ceases to be predictable and proportional. You …"]}],"diff":{"sup":"Reduce to 10 load events. Pre-set up the data table. Student adds weights and records readings.","ext":"Calculate the damping ratio from the post-tap vibration decay curve. Compare the damping ratio before the full class crossing (Week 8) and after (current). Has it changed?"},"ass":"Are all 20 load events recorded? Are both graphs plotted? Is the non-linear threshold identified (or its absence confirmed)?","note":"The 5 repeat tests at 40 kg are the most revealing data in the session — students rarely expect the results to vary, and when they do, the explanation (joint slip, settling) is a genuine engineering insight. Make time for the repeatability analysis even if the 20-event series runs long."},{"w":13,"f":"Grade 8 Final Engineering Portfolio","bi":"An engineer who cannot write cannot lead. The engineering portfolio is not a school assignment — it is the document that communicates your expertise to people who were not there when you built.","obj":"Each student produces a 2-page Grade 8 engineering portfolio documenting their technical learning, the bridge's performance data, and a structured reflection on design decisions.","dur":"60 minutes","grp":"Individual","mat":["A3 paper (2 sheets per student)","All project data and graphs from Weeks 1–12","Pencil","Steel ruler","Photographs from the year (printed)"],"voc":[["Executive summary","A brief (1–3 paragraph) overview of a project — written for a non-technical reader. The most important writing skill in professional engineering"],["Technical specification","A precise, numbered description of a structure's key parameters — dimensions, loads, materials, and performance measurements"],["Critical evaluation","A structured assessment of both strengths and weaknesses — a professional engineer is honest about both"]],"ph":[{"n":"Portfolio Structure Introduction","m":8,"t":"intro","s":["The Grade 8 engineering portfolio has 5 required sections:","Page 1, Section 1 — Executive Summary (3–4 sentences, non-technical): describe the bridge to someone who has never seen it.","Page 1, Section 2 — Technical Specification: span, width, design load, factor of safety, movable span mechanism type, materials.","Page 1, Section 3 — Performance D
