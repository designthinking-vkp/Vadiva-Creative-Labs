 and measure displacement from the rest position. Inconsistent measurement (different push force each time) invalidates comparisons. Enforce the '1-finger, gentle push' standard."},{"w":6,"f":"Diagonal Bracing","bi":"Not all bracing is equal. The angle of a brace determines how much force it carries — and there is an optimal angle for every application.","obj":"Students build two tower sections — one with vertical cross-bracing and one with diagonal bracing — and compare their performance under side-load to choose the optimal bracing pattern for the Watch Tower.","dur":"60 minutes","grp":"Individual","mat":["Ice cream sticks (20 per student)","Bamboo sticks (6 per student)","String","Craft glue","Ruler","Protractor","100 g test weight"],"voc":[["Brace angle","The angle between a bracing member and the horizontal — affects how much of the bracing force is in useful compression or tension"],["Optimal angle","The brace angle that maximises structural efficiency — for simple diagonal bracing this is typically 45°"],["Tension brace","A brace that only works when pulled in tension — string is a tension brace; it goes slack under compression"]],"ph":[{"n":"Warm-Up — The 45° Question","m":7,"t":"intro","s":["Draw two braced frames on the board: Frame A has a diagonal brace at 30° from horizontal; Frame B has one at 45°.","Ask: 'If both braces are made from the same stick of the same material, which frame is stiffer under a horizontal push?'","Introduce the force resolution: a force acting along a brace at angle θ from horizontal has a useful horizontal component = Force × cos(θ). At 45°, cos(45°) = 0.707, which is the maximum before the other components start winning.","But: a 45° brace is longer than a 30° brace for the same frame height — so it uses more material. There is a real trade-off between efficiency and material use.","Tamil watchtowers: the surviving bamboo scaffolding drawings from Thanjavur temple construction records show diagonal braces at approximately 45° — the builders intuitively found the optimal angle."]},{"n":"Skill Demo — Building the Two Brace Types","m":10,"t":"demo","s":["Frame 1 — Cross-brace (X-pattern): build a rectangular ice-cream-stick frame 15 cm × 10 cm. Add 2 diagonals in an X pattern. The diagonals cross at the centre.","Frame 2 — Diagonal brace: same rectangular frame. Add 1 diagonal from bottom-left to top-right at approximately 45°. Measure the angle with a protractor.","Show the difference: Frame 2 uses 1 brace member; Frame 1 uses 2. But Frame 1 is stiff in both directions; Frame 2 is stiff only in the loaded direction.","Add a horizontal side-load test to both using a small weight on a thread. Measure displacement."]},{"n":"Build Challenge — Side-Load Comparison","m":26,"t":"build","s":["Each student builds 2 frames (same dimensions, different bracing).","Frame A (10 min): X-brace pattern. Measure brace angles with protractor.","Frame B (10 min): Single diagonal at exactly 45° (measured and confirmed with protractor before gluing).","Set-up (6 min): Stand each frame upright with base taped to the table. Attach a thread to the top. Hang 100 g weight on the thread horizontally to simulate a side load. Measure the top displacement.","Facilitator: protractor check on Frame B's diagonal angle before gluing — it must be 45° ±3°."]},{"n":"Test — Side-Load Displacement Measurement","m":9,"t":"test","s":["Measure top displacement for Frame A (X-brace) under 100 g side load.","Measure top displacement for Frame B (45° single diagonal) under the same 100 g side load.","Switch the load direction on Frame B (load from the other side). What happens? (The diagonal becomes the wrong type — if it was a tension brace, it goes slack.)","Discussion: 'For your watchtower, which bracing pattern will you choose? The X-brace is heavier but works in both directions. The single diagonal is lighter but only in one direction. What is your decision?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Frames stored in student folders alongside Week 2 Warren truss panels.","Facilitator: 'You have now tested 5 structural principles: foundations, triangulation, lashing, column buckling, cross-bracing, and diagonal bracing. Every one of these will be applied in your watchtower over the next 5 weeks. You are not collecting random facts — you are buildin…"]}],"diff":{"sup":"Pre-build Frame A. Student builds Frame B and conducts both tests.","ext":"Build a third frame with a K-brace pattern (diagonals meeting at mid-height rather than crossing full corner to corner). Compare all three."},"ass":"Is Frame B's diagonal at 45° (protractor verified)? Is side-load displacement measured for both frames? Can the student justify their bracing choice for the watchtower?","note":"The direction-dependence of the single diagonal is the most important insight from this session — many students won't anticipate that reversing the load direction changes the performance dramatically. Stage this as a surprise discovery: don't warn them in advance, let them see it happen and ask them…"},{"w":7,"f":"Tower Base Design","bi":"The base of a tower is not just a platform to stand on — it is the interface between the tower's structural system and the ground. Design it wrong and everything above is compromised.","obj":"Groups engineer a stable base for a 70 cm watchtower that doesn't slide under load and incorporates the optimal foundation type identified in Week 1.","dur":"60 minutes","grp":"Groups of 3","mat":["A2 cardboard (4 sheets per group)","Foam board (A3, 1 sheet per group)","Bamboo sticks (8 per group)","Hot-glue station","Steel ruler","Set square","Anti-slip material (sandpaper strip or rubber band pieces)","500 g test weight"],"voc":[["Plinth","A projecting base platform — the lowest horizontal element of the tower structure"],["Anti-slip","A surface treatment that increases friction between the structure and its support surface — prevents sliding under lateral load"],["Base stiffness","The rigidity of the foundation platform itself — a stiff base distributes load evenly to all legs above it"]],"ph":[{"n":"Warm-Up — Revisiting Week 1","m":7,"t":"intro","s":["Groups review their Week 1 results: which foundation type performed best on soft ground?","Discuss: 'We now know the best foundation geometry. But there is a second problem: the base must not slide when the tower sways. How do we prevent sliding?'","Show a tower base without anti-slip sliding freely on smooth card when pushed. Then show the same base with sandpaper strips underneath — it resists sliding dramatically.","Today's challenge: design the base platform for a tower that will be 70 cm tall. The base must be stiff enough not to flex under 500 g, wide enough for stability, and anti-slip treated."]},{"n":"Skill Demo — Base Platform Construction","m":10,"t":"demo","s":["Show the base as a ribbed sandwich: 2 cardboard skins separated by 4 internal ribs, forming a rigid flat platform.","Leg attachment points: 4 small blocks of foam board glued to the top of the base, positioned at the corners. The tower legs will sit in these blocks for secure attachment.","Diagonal bamboo struts: from each corner of the base to a central point just above the surface — creates a pyramidal base structure that resists both vertical load and lateral sliding.","Anti-slip treatment: glue strips of sandpaper underneath the base corners and at the centre.","Mark all base dimensions carefully — width must equal the planned leg spacing of the watchtower."]},{"n":"Build Challenge — Watchtower Base Platform","m":26,"t":"build","s":["Groups plan: decide the base size (target: 25 × 25 cm minimum, but groups can go larger for more stability).","Step 1 (8 min): Cut 2 base skins and 4 rib strips. Assemble ribbed sandwich. Press flat at glue station.","Step 2 (6 min): Glue 4 corner leg-attachment blocks to the top surface.","Step 3 (6 min): Add 4 diagonal bamboo base struts from each corner toward the centre (creating a pyramidal base reinforcement).","Step 4 (6 min): Apply anti-slip sandpaper strips underneath at all 4 corners.","Facilitator: set square check — are all 4 corners of the base at 90°? An out-of-square base will cause the tower to lean."]},{"n":"Test — The Stability Tests","m":9,"t":"test","s":["Flat test: place ruler across base in 4 directions. Does it sit flat (no rocking)?","Load test: place 500 g in the centre of the base. Does it sag? Any rib failure?","Slide test: place the base on a smooth surface. Push one edge sideways with measured force. Does the anti-slip treatment prevent movement?","Measure the attachment block positions — do they match the planned leg spacing exactly?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Bases stored flat in the project area.","Facilitator: 'You have now built every component of a structural system individually: foundation geometry (Week 1), triangulation (Week 2), lashing (Week 3), column selection (Week 4), bracing (Weeks 5–6), and now the base platform. Week 8 is the first assembly session — where al…"]}],"diff":{"sup":"Pre-cut the 2 base skins and rib strips. Group focuses on assembly, anti-slip, and leg attachment blocks.","ext":"Design the base as an octagonal footprint (8-sided) — more stable than a square base under multi-directional loading."},"ass":"Does the ruler sit flat across the base in all 4 directions? Does the base hold 500 g without sagging? Does the anti-slip treatment measurably resist sliding?","note":"The leg attachment blocks are a critical detail — they must be positioned accurately because the entire tower leg spacing depends on them. Have groups measure the block positions twice before gluing."},{"w":8,"f":"Tower Mid-Section","bi":"The lower half of a tower carries the most load and feels the most lateral force. Get the bottom 50% right, and the top 50% will follow.","obj":"Groups build the lower half (0–35 cm) of the watchtower frame with 4 corner columns and full cross-bracing, achieving a structure that resists a 1 N lateral push without measurable displacement.","dur":"60 minutes","grp":"Groups of 3","mat":["Base platforms from Week 7","Bamboo sticks (20 per group)","String","A3 cardboard strips","Hot-glue station","Ruler, set square","500 g test weight"],"voc":[["Chord","The top or bottom member of a truss — the horizontal elements that carry bending forces"],["Web member","The diagonal or vertical members inside a truss — they carry shear forces between the chords"],["Frame action","When a structure resists lateral load by bending the joints between members rather than by triangulation — less efficient than triangulation but sometimes necessary"]],"ph":[{"n":"Warm-Up — The Bottom-Half Priority","m":7,"t":"intro","s":["Show a simple diagram: a watchtower with arrows showing how wind force increases with height. The base carries the cumulative load of all wind from every level above.","Ask: 'If you had to choose where to put extra bracing — at the bottom 35 cm or the top 35 cm — which would give you more benefit per gram of material?'","Guide: 'The base carries the highest bending moment. Adding material at the base improves stiffness far more than adding it at the top.'","Today's plan: build the mid-section (bottom half, 0–35 cm) with maximum bracing density at the lower levels and reducing slightly toward the top."]},{"n":"Skill Demo — Frame Assembly Method","m":10,"t":"demo","s":["Show how the 4 corner columns attach to the base leg-attachment blocks from Week 7.","Horizontal ring beams: cut 4 bamboo horizontals to span between the corner columns at 10 cm, 20 cm, and 35 cm heights. These are the chord members.","Cross-bracing: bamboo diagonals in an X-pattern on each of the 4 faces, at the lowest level (0–20 cm). Above 20 cm, single diagonals per face.","Lashing vs glue: show that lashing is preferred for bamboo-to-bamboo joints in the frame — it's stronger and allows slight adjustment. Glue is fine for bamboo-to-card connections.","Plumb check: use a set square held against each corner column. Any lean? Correct before the lashing sets."]},{"n":"Build Challenge — Mid-Section Frame","m":28,"t":"build","s":["Groups assemble the mid-section on their base platform.","Step 1 (6 min): Insert 4 corner column bamboos into the base attachment blocks. Check plumb on all 4. Glue bases.","Step 2 (8 min): Add horizontal ring beams at 10, 20, and 35 cm. Lash to corner columns at each intersection.","Step 3 (10 min): Add cross-bracing (X-pattern) to all 4 faces at the lower level (0–20 cm). Lash.","Step 4 (4 min): Add single diagonal bracing to all 4 faces from 20–35 cm. Lash.","Facilitator: plumb check every corner column before ring beams are lashed — column lean cannot be corrected once the ring beams are in place."]},{"n":"Test — Lateral Push Test","m":7,"t":"test","s":["Apply a gentle 1-finger horizontal push to the top of the mid-section. Mark the rest position with a pencil. Measure displacement during push.","Target: less than 3 mm displacement under a gentle push.","Identify the face that allows the most displacement — which face is least braced? Add one more brace there.","Re-measure. Has displacement reduced?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers stored upright in the project area.","Facilitator: 'The bottom half of your watchtower is now standing. It holds load, resists sway, and is plumb. Next week we add the top half and the observation platform. The structural challenges will change: the top half is about height, not load. A different set of problems. Thi…"]}],"diff":{"sup":"Pre-cut all bamboo horizontal ring beams to the correct length. Group assembles and lashes.","ext":"Add a secondary diagonal bracing layer on the 2 most-loaded faces (triangles within triangles — a K-brace nested inside the existing X-brace)."},"ass":"Are all 4 corner columns plumb (set square check)? Is horizontal displacement under gentle push less than 3 mm? Are ring beams at the correct heights?","note":"The most common problem at this stage is the corner columns spreading outward at the top when the ring beams are added. This happens if the base attachment blocks are slightly wider apart than the ring beam length. Remedy: pre-cut all ring beams to the same length and check against the base spacing …"},{"w":9,"f":"Tower Upper Section, Platform, and Laser CNC Node Connectors","bi":"The higher a tower goes, the more any small misalignment at a joint matters. A 2 mm error at a 35 cm column joint becomes a 4 mm lean by 70 cm. A laser-cut node connector holds the joint geometry exactly — it is a precision tool in the service of structural accuracy.","obj":"Groups complete the upper half of the watchtower (35–70 cm), install a laser CNC-cut observation platform with precise notch joints, and use laser-cut column extension node connectors to achieve a plumb upper section.","dur":"60 minutes","grp":"Groups of 3","mat":["Mid-section towers from Week 8","Bamboo sticks (12 per group)","String","Laser-cut plywood 6 mm — platform panel (pre-cut: one 14 × 14 cm square with 4 notches matching the tower's column spacing)","Laser-cut plywood 3 mm — column extension node connectors (pre-cut: 8 small L-shaped or T-shaped clips per group)","Hot-glue station","Ruler, set square","Cardboard sentinel figure (5 cm)","A3 cardboard (for parapet)","Laptop with laser software (to show students the cut file)"],"voc":[["Observation platform","The working floor at the top of a watchtower — must be level, strong enough to support the sentinel and their equipment"],["Node connector","A precision-cut plate or clip that holds two or more structural members at an exact angle — prevents the joint from rotating under load"],["Notch joint","A joint where one member has a slot cut into it and a second member drops into that slot — the two pieces interlock without glue and cannot slide apart sideways"]],"ph":[{"n":"Warm-Up — Why Precision Matters More at the Top","m":7,"t":"intro","s":["Groups measure their mid-section towers. What height have they reached? Calculate remaining height to reach 70 cm.","Show two column extension joints side by side: (1) a hand-lashed bamboo splice — functional but with 2–3 mm positional uncertainty, (2) a laser-cut node connector slipped over the joint — the connector physically constrains the position to ±0.3 mm.","Ask: 'If the column leans by 2 mm at 35 cm and we add another 35 cm, how much total lean do we have at the top?' (Answer: approximately 4 mm — the lean doubles.)","Show the laser-cut platform panel on the laptop screen: a 14 × 14 cm plywood square with 4 notches at each corner. The notches are cut to match the exact spacing of the tower's corner columns. When the platform drops onto the columns, the notches locate it perfectly — no measurin…","Today: the laser cut runs at the start of the session (or parts are pre-cut). Upper section is built with node connectors at every column extension joint. Platform is installed using the notch system."]},{"n":"Laser CNC — Platform and Node Connectors","m":8,"t":"demo","s":["Show the pre-prepared laser file on the laptop: 1 × platform square (14 × 14 cm, 4 notches to match column spacing), 8 × node connector clips (L-shaped, 25 × 25 mm each, with a 10 mm slot to grip bamboo).","Facilitator runs the cut on 6 mm plywood (platform) and 3 mm plywood (connectors) — one student as designated Laser Operator stands at the laptop, all others 0.5 m back.","Ventilation fan confirmed running. Cut takes approximately 3 minutes total.","After cut: remove all pieces. Students test each notch against their actual column spacing — does the platform drop onto the columns? If a notch is too narrow (bamboo varies slightly), open it gently with sandpaper.","Node connector demo: slip a connector clip over two bamboo ends at a joint. The slot grips the bamboo; hot glue bonds the clip to the bamboo surface. The joint is now both held by geometry (the clip) and adhesion (the glue)."]},{"n":"Build Challenge — Upper Section and Platform","m":30,"t":"build","s":["Step 1 (8 min): Extend corner columns from Week 8 mid-section to 70 cm. At each column extension joint, slip on a laser-cut node connector clip before lashing — the clip constrains the angle, the lashing holds the connection.","Step 2 (6 min): Add horizontal ring beams at 50 cm and 65 cm. Diagonal bracing: single diagonal per face from 35–50 cm only. Above 50 cm — ring beams only.","Step 3 (8 min): Platform installation. Drop the laser-cut plywood platform panel onto the four 65 cm column tops — the notches locate it on the columns. Hot-glue the notch edges to bond platform to columns. Level check immediately (before glue sets) using a ruler across all 4 pla…","Step 4 (8 min): Add parapet walls (4 short cardboard strips, 5 cm tall) hot-glued around the platform perimeter.","Facilitator: plumb check of the full tower at all 4 faces. The laser-cut connectors should have reduced lean compared to previous years — verify this by measuring the column top position against the base footprint."]},{"n":"Test — Height, Level, and Sentinel","m":7,"t":"test","s":["Measure total tower height. Does it reach 70 cm?","Level test: place the cardboard sentinel on the platform. Does it stand without leaning?","Notch joint inspection: can the platform be lifted by pressing it from below? The notch joints should resist this (friction + hot glue). A platform that lifts off easily has insufficiently bonded notch joints.","Plumb check: hold ruler at the base and top of each corner column — is each within 3° of vertical? Compare to previous towers without node connectors — is there a visible improvement?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers stored upright and carefully — 70 cm tall with a heavy-for-its-size platform at the top.","Facilitator: 'Your watchtower now has two laser-cut components: notched node connectors at the column joints, and a notch-jointed platform that locates itself exactly. The laser cutter did not build the tower — you did. But the parts it made were more accurate than any hand-cut p…"]}],"diff":{"sup":"Pre-cut and pre-test all node connectors and the platform notch fit. Group focuses on assembly, lashing, and checking plumb at each step.","ext":"In the laser software, calculate the correct notch width for the specific bamboo diameter being used (measure bamboo with a calliper, set notch to bamboo diameter + 0.3 mm clearance). This is precisio…"},"ass":"Does the tower reach 70 cm? Is the platform level (ruler test in 4 directions)? Are laser-cut node connectors present at all column extension joints? Are all corner columns plumb within 3°?","note":"Bamboo diameter varies — measure your actual bamboo before setting the node connector slot width in the laser file. A slot 0.3 mm wider than the bamboo diameter gives a snug fit; 1 mm wider is too loose and the connector adds no positional benefit. The platform panel notches should be measured from …"},{"w":10,"f":"Load Testing Phase 1","bi":"A structure that has never been tested has never been proven. Testing is not destruction — it is knowledge.","obj":"Groups conduct a systematic incremental load test on their completed watchtower, recording load and deflection at each increment to identify the failure load and failure mode.","dur":"60 minutes","grp":"Groups of 3","mat":["Completed watchtowers from Week 9","Test weights: 100 g, 200 g, 500 g, 1 kg increments","Ruler","Graph paper","Pencil","Cardboard platform on top of watchtower for load distribution"],"voc":[["Incremental loading","Adding load gradually in equal steps — allows the structure's response to each increment to be measured before the next is added"],["Deflection","The displacement of a structure under load — measured at the most flexible point (usually the top or mid-span)"],["Failure mode","The specific way a structure fails — column buckling, joint failure, platform collapse, or foundation sliding — each has different repair implications"]],"ph":[{"n":"Warm-Up — Test Protocol","m":8,"t":"intro","s":["Introduce the test protocol before any weights are touched.","Protocol: (1) Place cardboard load-distribution plate on platform. (2) Add each weight increment one at a time. (3) After each addition, mark the top position and measure deflection from the base. (4) Record. (5) Note any sounds, movements, or joint failures at each stage. (6) St…","Ask: 'Why do we stop at first failure? Why not keep going until it completely collapses?'","Guide: 'In a real structure, first failure is the alert signal. Continuing to load after first failure is dangerous and masks the useful information about where and how the structure begins to fail.'","Set up results tables on graph paper before loading begins."]},{"n":"Test Phase — Incremental Loading","m":32,"t":"test","s":["Start with zero load. Mark the top position. Record position as 0 mm deflection.","Add 100 g. Wait 30 seconds. Measure top deflection. Record.","Add another 100 g (total 200 g). Wait. Measure. Record.","Continue in 100 g increments to 500 g. At 500 g, switch to 200 g increments.","At each stage: listen for cracking sounds, observe joints for movement, check base for sliding.","Record the load at which first failure occurs and identify the failure mode.","STOP at first failure. Do not load beyond first failure.","Facilitator: walk between groups at each load increment — be present at the moment of first failure to help students identify the exact failure mode."]},{"n":"Analysis — Plotting the Load-Deflection Curve","m":10,"t":"test","s":["On graph paper: x-axis = load (g), y-axis = deflection (mm). Plot all data points.","Draw the best-fit curve through the points.","Identify: the linear elastic region (straight part of the curve), and the first failure point.","Ask: 'What does the shape of the curve tell you? Does deflection increase linearly with load, or does it accelerate at higher loads?'"]},{"n":"Failure Analysis Discussion","m":5,"t":"intro","s":["Each group identifies and names their failure mode from this list: (a) column buckling, (b) joint lashing slip, (c) platform separation, (d) foundation slide, (e) diagonal brace failure.","Record the failure mode and the failed element.","Preview: 'Next week, you fix the failure — and retest. The goal is a tower that holds more than its first test load.'"]},{"n":"Clean-Up & Close","m":5,"t":"close","s":["Towers carefully stored in their post-test state. Do NOT repair yet — save that for Week 11.","Facilitator: 'Your load-deflection curve is a structural fingerprint. It tells you everything about your tower's behaviour under load. Engineers use this curve to certify bridges, aircraft, and buildings. You just generated your watchtower's structural fingerprint. Week 11: the r…"]}],"diff":{"sup":"Assist with load placement and measurement. Student records and plots the graph.","ext":"Calculate the theoretical maximum load for a bamboo column using the Euler buckling formula and compare to the measured first failure load."},"ass":"Is the load-deflection graph complete and accurately plotted? Is the failure mode correctly identified? Did the group follow the stop-at-first-failure protocol?","note":"The dramatic moment of first failure — a joint slipping, a column buckling — is a powerful teaching moment. Pause the class, ask everyone to look, and discuss what happened before anyone moves anything. The failure mode is the most valuable data point in the entire test."},{"w":11,"f":"Failure Analysis and Structural Optimisation","bi":"Failure is not the end of the engineering process — it is the most important data point. What you do after failure separates an engineer from a builder.","obj":"Groups analyse their Week 10 failure mode, repair the specific failure point, and retest to demonstrate improved load capacity beyond the first failure load.","dur":"60 minutes","grp":"Groups of 3","mat":["Watchtowers from Week 10","Repair materials: bamboo, string, glue, cardboard strips","Ruler","Graph paper from Week 10","Test weights","Pencil"],"voc":[["Repair","Restoring a damaged structural element to its original or greater strength"],["Reinforcement","Adding material to strengthen an element before or after failure — may be a new member, a larger joint, or a secondary brace"],["Iteration","The engineering cycle of build → test → analyse → improve → retest — the process that converts a first attempt into a refined solution"]],"ph":[{"n":"Warm-Up — The Failure Report","m":8,"t":"intro","s":["Each group presents their failure analysis from Week 10 to the class (30 seconds each): 'Our tower failed at ___ g. The failure mode was ___. The specific element that failed was ___.'","Class discusses: are there common failure modes? Do most towers fail in the same way, or differently?","Introduce the repair strategy: 'The repair must address the root cause — not just patch the symptom. If a lashing slipped, the repair is not just re-lashing the same joint. The repair is understanding WHY the lashing slipped (not enough turns? No frapping? Wrong lashing type?) an…","Each group plans their repair on paper before touching the tower."]},{"n":"Skill Demo — Repair Techniques","m":8,"t":"demo","s":["Lashing slip repair: remove the failed lashing. Add 2 more wrapping turns and 2 more frapping turns. Apply glue to the finished lashing for additional security.","Column buckle repair: the buckled column cannot be straightened — it must be replaced or reinforced. Show how to add a sister column (a second bamboo lashed alongside the failed one). This doubles the load capacity at that point.","Platform separation: re-lash the platform to the ring beam at all 4 corners. Add corner straps of card for additional shear resistance.","Foundation slide repair: additional anti-slip material and a peripheral skirt of card around the base."]},{"n":"Build Challenge — Repair and Reinforce","m":26,"t":"build","s":["Groups carry out their planned repair, addressing the root cause identified in the failure analysis.","Mandatory minimum: fix the specific element that failed (not just cosmetic repair).","Optional upgrade: add reinforcement beyond the repair — extra bracing, additional lashing turns, second column, platform strengthening.","Pre-retest check: each group's repair is reviewed by the facilitator before retesting begins. Question: 'Have you addressed the root cause, or just the symptom?'","Facilitator: be direct with groups who have patched without understanding — send them back to analyse more carefully."]},{"n":"Retest — Beat the First Test Load","m":10,"t":"test","s":["Retest using the same protocol as Week 10.","Target: first failure load must be higher than Week 10 first failure load.","Record: new first failure load, new failure mode (if different), deflection curve.","Add the new data points to the Week 10 graph in a different colour — the improvement is visually clear.","Calculate improvement %: (new failure load − original failure load) ÷ original failure load × 100."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Towers returned to storage in their improved state.","Facilitator: 'Every one of you just made your structure stronger by understanding its failure. This is called structural optimisation. The Golden Gate Bridge was optimised 3 times between its first design and its final build. The Sydney Opera House roof structure was redesigned c…"]}],"diff":{"sup":"Facilitator guides the root cause analysis step by step. Student carries out the repair.","ext":"Write a formal failure analysis report: (1) failure load, (2) failure mode, (3) root cause, (4) repair action, (5) retest result, (6) % improvement."},"ass":"Did the retest load exceed the original failure load? Was the root cause (not just the symptom) addressed in the repair? Is the improvement % calculated?","note":"Groups whose repair did not improve the load should not be allowed to 'try adding more weights until something works' — they must re-analyse and re-plan. Reward honest analysis over lucky outcomes."},{"w":12,"f":"mBlock Motion Demo","bi":"Ancient Tamil watchtower sentinels used rope and pulley systems to hoist signals, supplies, and messages. An mBot motor is a modern version of the same mechanical principle.","obj":"Groups use an mBot to simulate a watchtower crane mechanism that lifts a 50 g payload 5 cm above the observation platform.","dur":"60 minutes","grp":"Groups of 4","mat":["mBot kit (1 per group)","USB cable or wireless dongle","Laptop with mBlock","Watchtower from Week 11","String 50 cm","Small payload (50 g bag or folded card weight)","Cardboard for crane arm"],"voc":[["Pulley","A wheel with a grooved rim around which a rope runs — changes the direction of force and can provide mechanical advantage"],["Torque","The rotational force produced by a motor — a motor with high torque can lift heavier loads"],["Payload","The useful load being carried or lifted — as opposed to the structural weight of the carrier itself"]],"ph":[{"n":"Warm-Up — The Watchtower Signal System","m":6,"t":"intro","s":["Introduce: Tamil watchtower sentinels communicated across distances using signal fires, flags, and mirror flashes. The rope and pulley system was used to hoist supplies and messages up to the observation platform.","Show the mBot motor mechanism: a motor shaft rotating winds a string and lifts a weight. This is the same basic principle as any hoist or crane.","Today's challenge: mount a simple crane arm on the watchtower observation platform. The mBot motor winds the string to lift a 50 g payload from ground level to the platform level.","This is a support task — the watchtower is the primary structure. The mBot demonstrates a mechanical principle."]},{"n":"Skill Demo — mBot Crane Setup","m":12,"t":"demo","s":["Crane arm: a bamboo stick mounted horizontally at the platform edge, extending 10 cm beyond the platform. String hangs from the tip of the arm.","mBot connection: the string runs from the payload, up to the crane arm tip, then back to a small cardboard spool on one of the mBot's wheel axles.","When the mBot drives forward, the axle winds the string and lifts the payload.","mBlock code: [When button pressed] → [Move forward at speed 40] → [Wait 1.5 seconds] → [Stop motors]. Test: does the payload rise?","Adjustment: if the payload doesn't rise, is the string too long? Is the axle winding correctly? Is the motor speed enough?"]},{"n":"Build Challenge — Crane and Payload System","m":26,"t":"build","s":["Step 1 (6 min): Attach the crane arm bamboo to the platform edge. Ensure it is horizontal and firmly lashed.","Step 2 (6 min): String the system — from payload, over crane arm tip, down to mBot axle spool.","Step 3 (8 min): Program mBot in mBlock: button press → forward → wait → stop. Test and adjust wait time until payload rises exactly 5 cm.","Step 4 (6 min): Add a second button press sequence for lowering: forward (1.5s) then reverse (1.5s) — full up/down cycle.","Facilitator: if mBot keeps rolling forward after lifting (dragging the payload sideways), fix the mBot position by anchoring it with card rails on either side."]},{"n":"Test — The 5 cm Lift Test","m":8,"t":"test","s":["Test 3 full up/down cycles. Does the payload rise and lower consistently?","Measure lift height: does it reach at least 5 cm?","Check: does the watchtower structure move or flex when the mBot runs? (If yes, the pulling force from the string is too high — reduce mBot speed.)","Demonstration prep: rehearse the sequence for the presentation next week."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["mBot turned off. String untied from axle (to prevent overnight tension on the axle).","Facilitator: 'Ancient Tamil watchtower keepers used rope hoists just like this to bring their daily rations and communication materials up to the platform. You built a functional version of the same system — powered by an electric motor rather than a soldier's arm. The mechanical…"]}],"diff":{"sup":"Pre-write the mBlock code. Group focuses on the crane arm construction and string system setup.","ext":"Add a second payload basket that descends as the first rises — a counterweight system that reduces motor load by 50%."},"ass":"Does the payload lift at least 5 cm? Does it complete 3 full up/down cycles? Does the watchtower structure remain stable during mBot operation?","note":"The most common failure is the string slipping off the axle spool rather than winding around it. A small card spool (2 layers of card ring) taped to the axle shaft creates a groove that prevents slipping. Make a few of these before the session and have them available."},{"w":13,"f":"Refinement, Final Preparation, and Sewn Signal Flag","bi":"A structure ready for occupation must meet two standards simultaneously: engineering (it is safe) and communication (it can be understood and used by the people it serves). The signal flag is not decoration — it is the watchtower's communication system. The sentinel waves it to send a message. It must be light, visible, and durably sewn.","obj":"Groups perform a final structural audit, address all remaining issues, sew a signal flag for the watchtower platform using the sewing machine, and prepare the load certificate and presentation script for Week 14.","dur":"60 minutes","grp":"Groups of 3","mat":["Watchtowers from Week 12","Repair materials","Paint or markers","Label cards","Load certificate card stock","Cardboard sentinel figure","Cotton fabric (20 × 15 cm per group — saffron, red, or terracotta)","Sewing thread (matching or contrasting)","Bamboo stick 20 cm (flag pole)","Sewing machine (school shared)"],"voc":[["Signal flag","A flag used to communicate a visual message over a distance — the most ancient long-range communication technology. Tamil watchtower sentinels used flags and fire signals to relay messages across the fort network"],["Running stitch","The most basic sewing machine stitch — a straight line of equally-spaced stitches used for seams and hems. The first stitch every sewing student learns"],["Rod sleeve","A folded and stitched channel along one edge of a flag — the flag pole passes through it, holding the flag in the correct orientation for waving"]],"ph":[{"n":"Warm-Up — Final Audit + Signal Flag Brief","m":8,"t":"intro","s":["Groups conduct a 5-minute final structural audit using the checklist:","□ Tower height: 70 cm or above?  □ All corner columns plumb (within 3°)?","□ Observation platform level?  □ Parapet walls attached?","□ Sentinel figure standing on platform?  □ mBot crane system functional?","□ Laser-cut node connectors at all column joints?  □ Load certificate prepared?","Any unchecked structural item is addressed first.","Introduce the signal flag: 'Tamil watchtower sentinels communicated using fire at night and coloured flags by day. The saffron or red flag signalled danger. Today each group sews a flag — first time using a sewing machine. One student sews the flag while the other two handle stru…","Sewing machine safety brief: (1) fingers never under the needle or presser foot, (2) always lower the presser foot onto the fabric before pressing the foot pedal, (3) start slowly — this machine can go fast; begin at half speed, (4) if the fabric jams: stop the machine, lift the …"]},{"n":"Parallel Task — Flag Sewing + Structural Finishing","m":28,"t":"build","s":["Divide group roles: Student A = sewing machine (flag); Students B & C = structural snag repairs + labels + load certificate.","STUDENT A — FLAG SEWING (28 min total at the machine):","Step 1 (3 min): cut fabric to 20 × 14 cm with fabric scissors. Fold all 4 edges inward by 1 cm and pin.","Step 2 (8 min): sewing machine — sew a running stitch hem along the top, bottom, and free (right) edge of the flag. Stitch 5 mm from the folded edge. Backstitch 3 stitches at the start and end of each seam to lock.","Step 3 (8 min): rod sleeve — fold the left edge of the flag inward by 1.5 cm (enough to pass the bamboo stick through). Sew a running stitch close to the fold, leaving both ends of the sleeve open.","Step 4 (4 min): cut and tie all thread ends. Thread the 20 cm bamboo pole through the sleeve. Test: does the flag hang correctly and wave freely?","Step 5 (5 min): attach flag pole base to the watchtower platform parapet with hot glue. Check the flag stands vertically and waves without touching the parapet.","STUDENTS B & C — STRUCTURAL FINISHING (28 min):","Address all unchecked audit items. Apply labels to each structural zone. Complete the load certificate card.","Prepare the 90-second presentation script: (1) heritage connection — Tamil watchtower signal flags, (2) engineering features — foundation, lashing, node connectors, laser-cut platform, (3) load test result and improvement."]},{"n":"Full Rehearsal","m":12,"t":"test","s":["Each group runs a full 90-second presentation rehearsal in front of the class.","During rehearsal: mBot crane is activated, load certificate is shown, sentinel figure placed on platform, signal flag waved by the student who sewed it.","Class feedback: one positive comment and one specific improvement suggestion per group.","Flag quality check: does the rod sleeve hold the pole without the flag slipping off? Is the hem stitch visible and consistent (not skipped stitches)? Is the flag the right colour for a Tamil watchtower signal?"]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Sewing machine: cut and tie all thread ends, cover machine.","Watchtowers carefully stored for their final night.","Facilitator: 'Thirteen weeks ago this class started with a cardboard base. Today you have a 70 cm bamboo watchtower with laser-cut joints, a certified load rating, a working crane, and a signal flag sewn by hand on a machine. The Tamil sentinels who stood in towers like these car…"]}],"diff":{"sup":"Pre-fold and pin the flag hem. Student focuses on sewing the 3 sides and the rod sleeve — machine operation only.","ext":"Sew a second flag in a different colour (white = peace, red = danger) and design a simple 2-flag signal code — which combination means which message?"},"ass":"Is the audit checklist fully signed off? Is the load certificate complete? Does the flag hem have consistent running stitches (no skipped stitches)? Does the rod sleeve hold the bamboo pole securely?","note":"This is the first sewing machine session for Grade 5. Set the machine to a medium-slow speed before the session begins. The most common first error is starting the stitch without lowering the presser foot — the fabric slides sideways. Demonstrate this failure mode deliberately so students know to ch…"},{"w":14,"f":"Final Watch Tower Showcase","bi":"A structure earns its place in the world not when it is built, but when it is trusted. Today, the audience decides whether to trust your tower.","obj":"Groups present their completed Watch Tower to an invited audience, demonstrate the mBot crane system, and display the load certificate as proof of engineering performance.","dur":"60 minutes","grp":"Groups of 3 + whole class","mat":["Completed watchtowers","Load certificates","mBot and cable","Audience seating arrangement","Camera for documentation","Class competition judging cards (optional)"],"voc":[["Showcase","A formal presentation of completed work to an audience — combines demonstration, explanation, and evaluation"],["Structural integrity","The ability of a structure to perform its intended function under all expected loads without failure"],["Engineering record","The documented history of a structure — its design, build, tests, failures, repairs, and performance"]],"ph":[{"n":"Preparation and Audience Welcome","m":10,"t":"intro","s":["Watchtowers displayed on a long table in a row. Load certificates placed in front of each tower.","mBots positioned and tested (1 quick cycle each) before audience enters.","Audience invited: class teacher, parents, principal, other class, or facilitator panel.","Facilitator opens: 'What you are about to see are watchtowers built by Grade 5 students using bamboo, card, and string. Each has been load-tested, failed, repaired, and re-certified. Each has a working mechanical system. They represent 14 weeks of engineering work.'"]},{"n":"Group Presentations","m":22,"t":"build","s":["Each group presents for 90 seconds: (1) heritage connection, (2) engineering features, (3) load test result and improvement %.","During each presentation: sentinel figure is placed on the platform and the mBot crane runs a full payload lift.","Audience can ask one question per group after the presentation."]},{"n":"Class Competition — Load Test","m":10,"t":"test","s":["Optional: class-wide load competition. Each tower is loaded with weights until first failure. The tower with the highest first failure load wins.","This is a celebration, not a penalty — every tower that holds more than 500 g is remarkable.","Record: highest failure load in the class. Note the tower design features that contributed to this result.","Class discussion: 'What one change would have made every tower stronger?'"]},{"n":"Reflection — The Maker Circle","m":10,"t":"close","s":["Students form a circle around the displayed towers.","Round 1: each student says 1 word that describes the engineering skill they feel most confident about.","Round 2: each student completes 'In Grade 6, the thing I am most ready for is ___.'","Facilitator closes: 'In Grade 6 you move from bamboo and cardboard to real wood, real saws, and real bolts. The first thing you will build is a bridge that must hold a person. Everything you learned about foundations, triangulation, cross-bracing, load testing, failure analysis, …"]}],"diff":{"sup":"Pre-write the student's portion of the group presentation. Student reads and activates the mBot.","ext":"After the showcase, write a peer engineering review of another group's tower: what was strongest, what would you change, and why."},"ass":"Did the group complete a full 90-second presentation? Did the mBot crane operate successfully in front of the audience? Is the load certificate accurate?","note":"Document everything. This is the most technically sophisticated showcase in Grades 1–5. The contrast between Grade 1 (a cardboard name tag stand) and Grade 5 (a load-tested, bamboo-framed, mBot-equipped watchtower) is dramatic — make that contrast explicit to the audience and to the students."}],"g6lessons":[{"w":1,"f":"Workshop Safety and Tool Introduction","bi":"A new material demands new respect. Wood is not cardboard. The tools that shape wood can also injure the hands that hold them. Mastery of safety is the first engineering skill.","obj":"Students learn and demonstrate correct use of a hand saw and bench vise by cutting 5 equal wood strips, all within 3 mm of the target length.","dur":"60 minutes","grp":"Individual","mat":["Wood strips 2 cm × 2 cm × 50 cm (5 per student)","Bench vise (1 per 2 students)","Hand saw (1 per 2 students)","30 cm steel ruler","Pencil","Eye protection (1 per student)"],"voc":[["Kerf","The width of the cut made by a saw blade — approximately 2–3 mm for a standard hand saw. Always cut on the waste side of the line, not through it"],["Bench vise","A clamping device fixed to the workbench — it holds the workpiece firmly so both hands can operate the saw safely"],["Grain","The direction of the wood fibres — cutting across the grain (cross-cut) is harder and produces a rougher surface than cutting along the grain (rip cut)"]],"ph":[{"n":"Warm-Up — Wood vs Cardboard","m":7,"t":"intro","s":["Hold a piece of wood strip in one hand and a cardboard strip in the other. Ask: 'What is different about these two materials?' (Weight, stiffness, smell, grain direction, surface texture.)","Show the grain: split a piece of wood along the grain — it splinters cleanly. Then try to split it against the grain — it resists.","Introduce: 'Wood is one of the oldest engineering materials in the world. Tamil temple builders used wood for roof structures, doors, and boat hulls for over 2,000 years. They respected it. Today you learn to work with it safely.'","Walk through the workshop safety rules: (1) Eye protection on before any cutting. (2) Workpiece clamped in vise before sawing — never hand-held. (3) Saw cuts away from the body. (4) No running. (5) Saw returned to rack immediately after use."]},{"n":"Skill Demo — Clamping and Cross-Cutting","m":12,"t":"demo","s":["Step 1 — Mark: place the wood strip on the bench. Hold ruler firmly. Mark the cut line (30 cm from one end) with a clear pencil line across the full width of the strip.","Step 2 — Clamp: open the bench vise. Place the strip so the cut line is about 2 cm above the vise jaw (never clamp right at the cut line — the vise blocks the saw). Tighten firmly.","Step 3 — Start cut: place saw on the waste side of the line. Pull the saw back slowly to start the kerf — do not push first. A pull stroke initiates the cut cleanly.","Step 4 — Saw rhythm: long, slow, full-length strokes. Let the saw do the work — do not force it. Keep the saw perpendicular to the workpiece.","Step 5 — Finish: as the last few strokes approach, slow down and support the waste piece with your free hand to prevent splitting.","Measure the cut piece: is it 30 cm? Is the end square (perpendicular)?"]},{"n":"Build Challenge — 5 Equal Strips","m":26,"t":"build","s":["Each student cuts 5 strips, all 30 cm long from the 50 cm blanks.","Process: mark → clamp → saw → measure → compare.","Cut 1 (6 min): take extra care. This strip sets the quality benchmark.","Cut 2 (5 min): maintain same process. Compare length against cut 1 immediately.","Cuts 3–5 (5 min each): build speed while maintaining accuracy. Measure after each cut.","Facilitator: walk between students. Check saw grip (not a choking grip), vise tightness, and eye protection compliance. Correct errors immediately and specifically."]},{"n":"Test — The Stack and Square Test","m":7,"t":"test","s":["Stack all 5 strips. Looking along the stack from the end, are all ends flush?","Measure the widest and shortest piece in the stack. Is the range within 3 mm?","Square test: hold a set square against the cut end. Is it 90° to the face?","Class comparison: who has the most consistent stack? What technique did they use?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Saw returned to rack immediately. Vise opened. Sawdust swept from bench.","Eye protection returned to rack.","Facilitator: 'Today you learned the first of the real tools — the hand saw. Every bridge you will ever build starts with a cut like the ones you just made. In 13 weeks, the same saw you used today will be part of the reason a person can walk across a bridge you built. Remember th…"]}],"diff":{"sup":"Facilitator clamps the vise for the student initially. Student focuses on the saw grip and stroke rhythm.","ext":"Practice a mitre cut: cut one strip at a 45° angle using a hand-made card mitre guide."},"ass":"Are all 5 strips within 3 mm of the target length? Are cut ends square (set square check)? Was the saw always used with the vise clamped (not hand-held)?","note":"Eye protection must be worn throughout the cutting session — no exceptions. Establish this as an automatic reflex in Week 1. A student who removes their eye protection must stop immediately and put it back before sawing resumes. This rule, enforced in Week 1, prevents future incidents."},{"w":2,"f":"Wood Joining Techniques","bi":"The joint is the most critical element in any timber structure. A beam can be strong, but a weak joint means the beam never reaches its potential.","obj":"Students cut and assemble 3 types of wood joints (butt, lap, and half-lap) and test their tensile strength by hand-pull to identify which is strongest.","dur":"60 minutes","grp":"Individual","mat":["Wood strips 2 × 2 × 30 cm (6 per student)","Wood glue","C-clamps (1 per student)","Hand saw","Bench vise","Eye protection","Pencil","Steel ruler","Sandpaper 120 grit"],"voc":[["Butt joint","The simplest timber joint — two pieces of wood with their ends or faces pressed flat together. Strong in compression, weak in tension"],["Lap joint","A joint where each piece has half its thickness removed at the overlap zone, so the two pieces interlock to form a joint with the same thickness as one piece"],["Half-lap joint","Identical to a lap joint — two pieces overlapping with equal material removed from each. Also called a halving joint"]],"ph":[{"n":"Warm-Up — Why Joints Fail","m":7,"t":"intro","s":["Show a butt-jointed wood pair held with glue. Pull slowly — it separates easily at the glue line.","Show a half-lap joint — try to pull it apart. Much more resistant.","Ask: 'What is the difference? Both have the same glue. Why does the half-lap hold more?'","Guide: 'The half-lap has mechanical interlocking — the wood stops the pieces from separating even before the glue is involved. The glue is a backup. In the butt joint, the glue is the only thing holding it.'","Tamil causeways: 'Timber bridge beams in ancient Tamil Nadu were connected using half-lap and mortise-and-tenon joints, not nails. They were built to be taken apart in flood season and reassembled. The joint made that possible.'"]},{"n":"Skill Demo — Three Joints","m":12,"t":"demo","s":["Joint 1 — Butt joint: cut two strips to 15 cm. Squeeze wood glue on one end face. Press together. Clamp for 5 minutes.","Joint 2 — Lap joint: on two 20 cm strips, mark a 5 cm overlap zone at one end of each. Apply glue to both faces at the overlap. Press together. Clamp.","Joint 3 — Half-lap joint: on two 20 cm strips, mark a 5 cm zone at one end. Saw two cuts: one across the face (to half depth) and one along the face (at half depth). Remove the waste cheek of wood. The resulting notch interlocks with the notch on the matching piece. Glue and clam…","Show the half-lap saw cuts: 2 cuts per piece, both must be at exactly half the strip's 20 mm depth (10 mm each). Use a pencil depth mark on the saw."]},{"n":"Build Challenge — Three Joints","m":26,"t":"build","s":["Students build all 3 joints simultaneously (each pair gluing while the other is being prepared).","Joint 1 — Butt (5 min): cut, glue, clamp.","Joint 2 — Lap (5 min): mark overlap, glue, clamp. No cutting required.","Joint 3 — Half-lap (16 min): mark → 2 saw cuts per piece → chisel out waste → test fit → glue → clamp.","While joints set under clamps: sandpaper the rough cut faces of the half-lap until the notch faces are flat and clean (better glue surface).","Facilitator: the half-lap saw cuts must be at exactly half depth. Provide a depth gauge (a pencil line drawn around the strip at 10 mm depth as a visual stop guide for the saw)."]},{"n":"Test — The Pull Test","m":7,"t":"test","s":["Remove all joints from clamps (minimum 10 min after gluing — adjust session timing if needed).","Pull test each joint: hold one piece in each hand, pull slowly. Rate resistance: 1 (failed before testing) → 5 (no separation at all).","Record ratings for all 3 joints. Which was strongest?","Failure mode: where did it fail? At the glue line? In the wood itself? At the joint edge?","Discussion: 'For a bridge beam, which joint type would you use? Why?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Joints stored in student folders.","C-clamps cleaned of excess glue. Saws returned to rack. Bench swept.","Facilitator: 'The half-lap joint you made today is the most common joint in traditional timber bridge construction across Asia and Europe. In Grade 7 you will use it to join the main beams of a bridge. You just learned the joint that will hold a person's weight next year.'"]}],"diff":{"sup":"Pre-cut the half-lap notch depth (one saw cut pre-made). Student completes the second cut and chisels the waste.","ext":"Build a T-half-lap joint (joining a cross member to a main beam mid-span — used in bridge deck construction)."},"ass":"Are all 3 joint types present? Does the half-lap interlock with no visible gap? Is the pull test resistance rating recorded for all 3?","note":"The half-lap chisel step is the first time students use a chisel. Demonstrate explicitly: chisel bevel-down for the initial break, then bevel-up to pare flat. Grip the chisel with both hands (never a single-hand forward push). Work slowly toward the guide line — don't go past it."},{"w":3,"f":"Beam Behaviour Under Load","bi":"A beam twice as deep deflects eight times less. This is not a rough estimate — it is an exact engineering relationship. Understanding it changes every structural decision you will ever make.","obj":"Groups test 3 beam configurations (different depths) under midpoint load and produce a graph showing the relationship between beam depth and deflection.","dur":"60 minutes","grp":"Groups of 3","mat":["Wood strips 2 × 1 × 50 cm (6 per group)","Wood strips 2 × 2 × 50 cm (3 per group)","2 support blocks (trestles from scrap wood or MDF, 10 cm tall each)","Test weights: 200 g, 500 g, 1 kg","Ruler","Graph paper","Pencil"],"voc":[["Span","The unsupported distance between two supports — for a bridge, the gap between the two banks"],["Deflection","How much a beam bends under load, measured at its midpoint — the key indicator of beam stiffness"],["Depth","The vertical dimension of a beam cross-section — doubling the depth multiplies stiffness by 8 (the cube relationship)"]],"ph":[{"n":"Warm-Up — The Depth Demonstration","m":8,"t":"intro","s":["Hold a 2 × 1 cm wood strip flat across a 40 cm span. Place 200 g at midpoint. Measure deflection.","Rotate the same strip to stand on its 1 cm edge (now 2 cm deep). Place the same 200 g load. Measure deflection.","Ask: 'Same strip, same span, same load. Why is the deflection different?'","Introduce the cube relationship: 'When you rotate the strip, you doubled its depth from 1 cm to 2 cm. The stiffness increases by 2³ = 8. So the deflection should be 8 times less. Let's check if our measurement confirms this.'","Tamil causeways: 'Ancient Tamil bridge beams were always oriented with the longest dimension vertical — the builders had discovered this cube relationship empirically, without the mathematics. You are about to discover it with data.'"]},{"n":"Skill Demo — Setting Up the Test","m":8,"t":"demo","s":["Set up the test rig: two support blocks 40 cm apart. The test span is 40 cm.","Three beam configurations: (1) single strip, flat (1 cm deep), (2) single strip, on edge (2 cm deep), (3) two strips glued together on edge (4 cm deep — requires 24 hours if glued, or held in a clamp during testing).","Load application: place a flat card plate across the beam midpoint. Load the plate — do not place the weight directly on a thin beam.","Measurement: mark the midpoint of the beam with a pencil. Measure from the bench surface to the underside of the beam at midpoint, before and after loading. Deflection = the difference."]},{"n":"Build Challenge — Beam Tests","m":26,"t":"build","s":["Groups test all 3 beam configurations with 3 load levels: 200 g, 500 g, 1 kg.","Configuration 1 (8 min): flat strip. Measure deflection at each load. Record in table.","Configuration 2 (8 min): same strip on edge. Measure at each load. Record.","Configuration 3 (10 min): double-layer strip (hold the 2 strips together with a clamp at the test time). Measure at each load.","For each configuration: plot the load vs deflection data on graph paper.","Facilitator: ensure the support blocks are exactly 40 cm apart for all tests — any change in span changes the deflection."]},{"n":"Test — Checking the Cube Relationship","m":10,"t":"test","s":["Compare: Config 1 (1 cm deep) vs Config 2 (2 cm deep) under 500 g. Deflection ratio measured vs 8× theoretical.","Compare: Config 2 (2 cm deep) vs Config 3 (4 cm deep) under 500 g. Does the measured ratio approach 8×?","Why the discrepancy? (Wood variability, measurement error, loading plate position.) This is real experimental science — perfect agreement is not expected.","Key question: 'For your bridge — which beam configuration will you use for the main beams?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Test results graphs kept in student folders.","Facilitator: 'Every structural engineer in the world uses the relationship you just measured. It's called the formula for flexural rigidity: EI, where I is the second moment of area — which scales with the cube of the depth. You have just done the experiment that Galileo first de…"]}],"diff":{"sup":"Provide pre-completed graph axes. Student plots data points and draws the curve.","ext":"Calculate the theoretical deflection for Config 1 using the beam deflection formula (δ = PL³/48EI) using estimated E for wood, and compare to the measured result."},"ass":"Are all 3 configurations tested at all 3 load levels? Is the load-deflection graph plotted accurately? Does the student correctly identify the optimal beam orientation?","note":"The cube relationship is the single most important numerical result in this session. If students' measurements don't confirm it, don't move past it — ask them to re-run the comparison test once more carefully before accepting the discrepancy as measurement error."},{"w":4,"f":"Triangular Truss Units with Laser CNC Gusset Plates","bi":"A gusset plate multiplies the glue surface area at a truss node by 3–4×. The laser cutter makes every gusset identical and positions every bolt or nail hole at exactly the same point on every plate — so the joint geometry is consistent across all 3 trusses. Consistency is what allows trusses to be combined into a bridge.","obj":"Each student builds 3 triangular truss panels; laser CNC-cut gusset plates are glued at every chord-to-web joint — producing trusses that resist 5 kg without visible flex and introducing the principle of precision joint reinforcement.","dur":"60 minutes","grp":"Individual","mat":["Wood strips 2 × 2 × 30 cm (10 per student)","Wood glue","C-clamps (2 per student)","Hand saw","Bench vise","Eye protection","Pencil","Steel ruler","5 kg test weight","Laser-cut plywood 3 mm gusset plates (18 per student — 6 nodes per truss × 3 trusses; pre-cut batch before session or at session start)","Laptop with laser software"],"voc":[["Truss","A structural frame made entirely of triangles — each member is in pure tension or pure compression, never bending"],["Gusset plate","A flat reinforcing plate glued or bolted at a truss node — increases the glue surface area and prevents the joint from rotating under load"],["Node","The point in a truss where two or more members meet — the most structurally critical location because all forces converge here"],["Web member","The diagonal and vertical members connecting top and bottom chords — carry shear forces as pure tension or compression"]],"ph":[{"n":"Warm-Up — Beam vs Truss vs Gusseted Truss","m":8,"t":"intro","s":["Show a solid wood strip spanning 40 cm. Load to 2 kg: visible deflection.","Show a pre-made triangular truss (no gussets) spanning the same 40 cm. Load to 5 kg: much less deflection.","Show a third panel — same truss with laser-cut gusset plates at all 6 nodes. Load to 5 kg: even less deflection. Push one node sideways — it does not rotate.","Ask: 'The third truss has extra plywood at the nodes. Why does that make it stiffer?' Guide: 'Without a gusset, the glue joint at a node is only as wide as the wood strip (2 mm of glue surface per member face). The gusset plate spreads that connection over a 25 × 25 mm area — 12×…","Ancient Tamil causeways: 'The 9th century Chola period timber trusses in temple roofs used iron strap plates at the nodes — the historical equivalent of today's gusset plate. You are using the same structural principle, cut by a laser rather than forged by a blacksmith.'"]},{"n":"Laser CNC — Gusset Plate Batch Cut","m":10,"t":"demo","s":["Show the gusset plate file on the laptop: 18 × (25 × 25 mm squares) of 3 mm plywood nested on one small sheet. Each plate has a small centre mark for positioning on the node.","One student designated as Laser Operator. All others stand 0.5 m back. Ventilation fan confirmed running.","Facilitator supervises the cut: approximately 2–3 minutes for 18 small plates.","After cut: each student receives 6 gusset plates (enough for one truss). Check: are all plates the same size? Are edges clean? Light sanding if any char remains.","Gusset positioning demo: lay a completed truss node flat. Position the gusset plate centred over the node, covering at least 8 mm of each member. Apply wood glue to the gusset face. Press onto node. Clamp.","Why the laser? 'If each gusset were hand-cut with scissors, they would all be slightly different sizes and shapes. A slightly small gusset covers less of the member — less glue area — weaker joint. The laser cuts all 18 identically in under 3 minutes.'"]},{"n":"Build Challenge — 3 Truss Panels with Gussets","m":28,"t":"build","s":["Students build 3 identical truss panels, applying laser-cut gusset plates at all 6 nodes of each truss.","Truss 1 (10 min): cut all members. Assemble bottom chord + verticals + diagonals + top chord. While each joint is still wet, position a gusset plate over the node. Clamp.","While Truss 1 sets: cut all members for Truss 2.","Truss 2 (10 min): assemble with gussets at all 6 nodes.","Truss 3 (8 min): cut and begin assembly. Complete gusset application. Will finish setting overnight.","Facilitator: verify each gusset is centred on its node and covers at least 8 mm of each meeting member. A gusset that only covers one member at a joint provides no reinforcement to the other."]},{"n":"Test — 5 kg Resistance + Node Rotation Test","m":4,"t":"test","s":["Test Truss 1 and Truss 2 with the 5 kg weight at midspan. Any visible deflection? Any joint creaking?","Node rotation test (gusset quality check): grip one diagonal member near a gusseted node and try to rotate it. A well-gusseted node should resist rotation — the gusset prevents the joint from 'opening'. An un-gusseted node rotates easily.","Compare to a non-gusseted truss from the warm-up demo. The gusseted truss should show both less midspan deflection and less node rotation.","Record: both trusses held 5 kg without flex? Node rotation resisted at all tested nodes?"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Trusses stored flat — gusset plates still curing overnight. Do not stack trusses on top of each other.","Facilitator: 'A bridge consists of two truss panels held apart by cross-beams and covered with a deck. You now have 3 panels — all gusseted, all consistent in size. Next week: compression and tension. Understanding which force acts in each member tells you where to add material a…"]}],"diff":{"sup":"Pre-cut all wood members for the first truss. Student focuses on assembly, gusset positioning, and clamping.","ext":"Build a second truss type — the Warren truss (alternating diagonals, no verticals) also with laser-cut gussets. Compare stiffness and node rotation resistance against the Pratt truss under equal load."},"ass":"Are gusset plates present and centred at all 6 nodes of each truss? Do trusses 1 and 2 hold 5 kg without visible deflection? Does the node rotation test confirm gussets are resisting joint rotation?","note":"The gusset plate file should use your actual truss node geometry — a 25 × 25 mm square works for 2 × 2 cm wood strips. If strips are wider, scale the gusset accordingly (gusset side = 2 × strip width + 5 mm overlap). Pre-test the file on one plate before cutting the full batch of 18. The node rotati…"},{"w":5,"f":"Compression and Tension Members","bi":"In a truss, every member is either being squeezed (compression) or stretched (tension). Knowing which force acts in each member tells you exactly where to add material.","obj":"Groups identify compression and tension members in a pre-built truss by attempting to remove individual members, and reinforce the most critical compression members with paired strips.","dur":"60 minutes","grp":"Groups of 3","mat":["Truss panels from Week 4","Spare wood strips (2 × 2 cm)","Wood glue","C-clamps","5 kg test weight","Pencil for labelling (red = compression, blue = tension)","Eye protection"],"voc":[["Compression","A pushing or squeezing force — the material wants to shorten. Too much compression causes buckling"],["Tension","A pulling or stretching force — the material wants to lengthen. Too much tension causes rupture"],["Neutral axis","The line through a beam's cross-section where neither compression nor tension acts — bending stress is zero here"]],"ph":[{"n":"Warm-Up — Feel the Force","m":8,"t":"intro","s":["Take a bamboo stick. Hold both ends and push them toward each other — you feel compression. The stick wants to bow outward. This is buckling under compression.","Now hold one end fixed, tie a string to the other end, and pull. The stick carries tension — it doesn't buckle, it just stretches slightly.","Hold up a truss. Ask: 'Which members are being compressed right now, just from the truss's own weight? Which are being tensioned?'","Guide using load direction: 'Load pushes down. The top chord is being squashed (compression). The bottom chord is being stretched (tension). The diagonals are in tension or compression depending on their angle.'"]},{"n":"Skill Demo — Identifying Members by Removal Test","m":10,"t":"demo","s":["Take a truss panel. Clamp it at both ends across a 40 cm span. Load 5 kg at midpoint.","Now add a weight incrementally and observe: which members flex first? Those are the most highly loaded.","Simulate removal: without actually removing glued members, place a thin card alongside one web member and observe how the truss changes shape if that member were absent.","Compression identification: tap each member with a fingernail. Compression members ring with a lower, duller tone than tension members (a vibration technique used in real structural inspection).","Label the demo truss: red marks on top chord and selected web members (compression), blue marks on bottom chord and other web members (tension)."]},{"n":"Build Challenge — Label and Reinforce","m":28,"t":"build","s":["Groups take their 3 truss panels from Week 4.","Step 1 (8 min): Load each truss at midpoint and observe. Label every member: red pencil = compression, blue pencil = tension. Check by comparing to the facilitator's demo truss labelling.","Step 2 (10 min): Identify the two most critical compression members (the ones most likely to buckle under load — typically the top chord and the longest diagonal).","Step 3 (10 min): Reinforce the 2 most critical compression members by gluing a second wood strip alongside each (sister strip reinforcement). Clamp.","Facilitator: check that the sister strips are glued along the full length, not just at the ends."]},{"n":"Test — Reinforced vs Original","m":6,"t":"test","s":["Load one original (unreinforced) truss and one reinforced truss to 5 kg. Compare deflection.","Increase to 8 kg if available. Does the reinforced truss hold longer?","Identify: did the reinforcement delay the first failure? At what load?","Ask: 'If you could only reinforce one member, which would give the most improvement? Why?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Trusses stored flat.","Facilitator: 'Every structural member in every structure in the world is either in compression or tension. An engineer's job is to identify which, design the right material for each (concrete for compression, steel for tension), and connect them correctly. You have done all three…"]}],"diff":{"sup":"Provide a pre-labelled diagram of the truss. Student compares the diagram to their truss and adds the labels.","ext":"Draw a force diagram for the truss under a central 5 kg load, with arrows showing the direction and type of force in each member."},"ass":"Are all members correctly labelled compression or tension? Are the two most critical compression members reinforced with sister strips? Does the reinforced truss outperform the original?","note":"The 'ring test' (tapping with a fingernail) is a genuine non-destructive testing technique — it works because tension members are under pre-stress that raises their vibration frequency. Students find this engaging and surprising. Take time with it."},{"w":6,"f":"Bridge Deck Planning","bi":"Before the first cut, every professional engineer draws the plan. The plan is the structure — drawn with precision, it becomes possible; drawn carelessly, it becomes a failure.","obj":"Groups plan their bridge layout, draw a dimensioned plan view, and cut all deck boards to a consistent length for a 60 cm span bridge.","dur":"60 minutes","grp":"Groups of 3","mat":["Graph paper (A3)","Pencil","Steel ruler","Plywood strips (6 mm × 4 cm × 70 cm, 8 per group)","Hand saw","Bench vise","Eye protection","C-clamps"],"voc":[["Plan view","A drawing of a structure viewed from directly above — shows the layout and spacing of all elements"],["Scale drawing","A drawing where every dimension is proportionally reduced — e.g. 1 cm on paper = 10 cm on the actual structure"],["Deck","The walking surface of a bridge — must span between the supporting beams and carry load without flexing"]],"ph":[{"n":"Warm-Up — The Value of a Plan","m":7,"t":"intro","s":["Show a pre-drawn bridge plan view on graph paper (facilitator-prepared example): top view showing the two truss frames, the cross beams, and the deck boards, all with dimensions labelled.","Ask: 'What decisions has the engineer made before cutting the first piece?' (Span, width, beam spacing, deck board width, number of cross beams.)","Show what happens without a plan: show a 'cut and discover' bridge with pieces that almost fit but don't quite connect cleanly.","Introduce the bridge specification for this project: (a) span = 60 cm, (b) width between truss frames = 30 cm, (c) deck boards = 4 cm wide, (d) cross beams at 15 cm intervals, (e) bridge must hold one student safely."]},{"n":"Skill Demo — Drawing the Plan","m":10,"t":"demo","s":["Scale: 1 cm on paper = 4 cm on the bridge (1:4 scale).","Draw the plan view live: (1) two parallel lines 7.5 cm apart (representing the 30 cm gap between truss frames — 30 ÷ 4 = 7.5 cm at scale). (2) Mark the 60 cm span: 15 cm on paper. (3) Mark cross beams at 3.75 cm intervals (= 15 cm at scale). (4) Sketch deck boards as parallel lin…","Dimension the plan: write the ACTUAL size at each element (not the drawing size).","Cut list derivation: count the elements from the plan: 2 truss frames, 5 cross beams, 8 deck boards. Write the cut list.","Groups then draw their own plan — slightly different bridge width is allowed if they justify the decision."]},{"n":"Build Challenge — Plan and Cut Deck Boards","m":26,"t":"build","s":["Step 1 (10 min): each group draws their bridge plan view on A3 graph paper, dimensions labelled, cut list completed. Facilitator reviews and approves before any cutting begins.","Step 2 (16 min): groups cut all 8 deck boards to the specified length (equal to the bridge width, typically 30–35 cm).","Cut process: mark → clamp → saw → measure → compare. All boards must be within 3 mm of the same length.","Stack test at the end: stack all 8 boards and check the stack is even.","Facilitator: no group moves to cutting until the plan is drawn AND approved."]},{"n":"Test — Dimensional Accuracy","m":9,"t":"test","s":["Measure all 8 deck boards. Range (longest − shortest): must be within 3 mm.","Check the plan: are all dimensions labelled? Is the cut list complete?","Preview check: do the cut boards match the planned bridge width dimension?","Ask: 'If one of your deck boards was 5 mm shorter than the others, what problem would that create when you install it between the truss frames?'"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Plans stored flat in project folders. Deck boards bundled with rubber band.","Facilitator: 'Today you drew the bridge before you built it. In professional engineering, this phase is called design development — and it typically takes longer than the construction. The plan you drew today will guide every cut for the next 4 weeks. If the plan is right, the br…"]}],"diff":{"sup":"Provide a partially completed plan template. Group fills in dimensions and derives the cut list.","ext":"Draw the bridge in three views: plan (top), elevation (side), and cross-section (end). All three views must be consistent."},"ass":"Is the plan drawn to scale with all dimensions labelled? Is the cut list complete and accurate? Are all 8 deck boards within 3 mm of the target length?","note":"The plan approval step is non-negotiable — no group cuts material without an approved plan. Groups that skip this step (or produce an inaccurate plan) will encounter problems during assembly that are hard to fix. Time invested in plan approval is repaid many times over during construction."},{"w":7,"f":"Rope and Cable Tension Members","bi":"Rope cannot be compressed — it buckles immediately. But rope in tension is one of the most efficient structural materials in existence. Knowing which members to make from rope and which to make from wood is engineering thinking.","obj":"Groups add rope tension members to a pre-built truss and test whether the tension member reduces midpoint deflection under a 10 kg load.","dur":"60 minutes","grp":"Groups of 3","mat":["Truss panels from Week 4","Rope 6 mm diameter (2 m per group)","Cable ties (10 per group)","Wood screws (4 per student)","Hand drill (supervised)","Ruler","10 kg test weight","Eye protection"],"voc":[["Tension member","A structural member that is loaded in tension only — rope is the ideal tension member"],["Cable","A tension member made from twisted wires or fibres — used in suspension bridges, cable-stayed bridges, and guy wires"],["Prestress","Deliberately applying tension to a structural member before it carries its intended load — this can dramatically improve performance"]],"ph":[{"n":"Warm-Up — Can Rope Push?","m":7,"t":"intro","s":["Hold a piece of rope horizontally by both ends. Ask a student to push the rope from below. It sags — rope cannot resist compression.","Now pull the rope tight. Ask the student to push again — it resists much more. Under tension, rope behaves like a stiff member.","Introduce: 'The design principle for rope is simple: only put rope where the force is tension. Never put rope where the force is compression — it will buckle and go slack immediately.'","Tamil causeways: 'Ancient Tamil river causeways used rope tension members as king post ties — a vertical rope pulling the midpoint of the bottom chord upward, providing additional load capacity without adding weight.'"]},{"n":"Skill Demo — Adding Rope to a Truss","m":10,"t":"demo","s":["Show the king post tension arrangement: a rope running from the midpoint of the bottom chord, up and over a central post, and connecting to the top chord at each end.","Drill a small pilot hole through the wood at the attachment points (hand drill, supervised). Thread rope through. Tie a clove hitch on each side.","Tighten the rope: wrap it around a wooden peg (or pencil) once before tying off — this pretensions the rope slightly.","Show the effect: place 5 kg on the truss before and after the rope. Measure midpoint deflection. The pretensioned rope should halve the deflection."]},{"n":"Build Challenge — Tension Member Addition","m":26,"t":"build","s":["Groups select one of their Week 4 trusses to retrofit with rope tension.","Step 1 (6 min): mark the 3 attachment points (bottom chord midpoint, and top chord at each quarter-span). Drill pilot holes at all 3 points.","Step 2 (8 min): thread the rope through the bottom chord midpoint hole. Route up to the two top chord holes. Tie off at each end.","Step 3 (8 min): Tension the rope by carefully tightening the ties at the top chord while someone holds the midpoint rope taut.","Step 4 (4 min): Secure the tension with cable ties at each connection point for additional security.","Facilitator: the rope must be genuinely pretensioned — a slack rope adds nothing until the truss deflects enough to take it up."]},{"n":"Test — Deflection Comparison","m":9,"t":"test","s":["Test the original truss (no rope) under 10 kg. Measure midpoint deflection.","Test the rope-reinforced truss under the same 10 kg. Measure midpoint deflection.","Calculate % reduction in deflection.","Ask: 'The rope adds very little weight. But it dramatically changes the stiffness. Why?' (It introduces a force pathway that bypasses the bending moment at the midpoint.)","Ask: 'What type of bridge uses this tension member principle at a very large scale?' (Suspension bridge, cable-stayed bridge.)"]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Trusses stored. Drill returned to rack. Eye protection returned.","Facilitator: 'You added a rope today and the bridge got stronger — dramatically stronger per gram of material added. This is why suspension bridges use cables. The Bosphorus Bridge, the Golden Gate, the Pamban bridge's approach spans — all use the same principle you applied today…"]}],"diff":{"sup":"Pre-drill all pilot holes. Group focuses on threading, tying, and tensioning the rope.","ext":"Design a double-rope tension system — ropes on both sides of the truss, creating a symmetrical king post arrangement."},"ass":"Is the rope genuinely pretensioned (not slack)? Is the midpoint deflection reduction measured and compared? Did the group calculate the % improvement?","note":"Drilling pilot holes must be supervised — the hand drill is the first power tool students use in Grade 6. Demonstrate the two-handed grip (one hand on the handle, one on the crank) before any student picks up the drill. The pilot hole prevents splitting — emphasise this."},{"w":8,"f":"Truss Bridge Assembly","bi":"Assembly is the moment of truth. Individual components that passed their tests must now work together as a system. If the planning was good, the assembly will be fast. If it wasn't, the assembly will show every error.","obj":"Groups assemble the two truss side panels into a complete bridge frame with cross beams, producing a rigid bridge skeleton 60 cm long that holds 10 kg at midspan.","dur":"60 minutes","grp":"Groups of 3","mat":["3 truss panels f
