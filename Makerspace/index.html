 We cannot order more mid-project.'","Review the keel construction plan: the keel is a solid 40×40 mm wooden member, 200+ cm long. It is the most structurally critical piece in the vessel — any weakness here produces hogging."]},{"n":"Build Challenge — Keel and Longitudinal Structure","m":60,"t":"build","s":["Step 1 (15 min): measure, mark, and cut the keel to 210 cm (10 cm allowance for bow and stern post attachments).","Step 2 (20 min): mark all rib notch positions on the keel (from the approved plan). Cut all notches — facilitator operates jig saw, students mark and clamp.","Step 3 (15 min): cut bow post (30 cm, angled to match the planned bow entry angle) and stern post (25 cm). Join to keel ends with waterproof adhesive and M6 bolts.","Step 4 (10 min): mark all stringer positions on the ribs (for later installation). Cut the 2 longitudinal stringers (4 mm marine ply, 200 cm long each).","At each step: check against the plan. Dimension match within ±2 mm."]},{"n":"Test — Keel Straightness","m":12,"t":"test","s":["Lay the completed keel assembly on a flat surface.","Snap a chalk line along its full length. Any deviation from the chalk line indicates a kink or bend — the keel must be straight within 3 mm over its full length.","Check the rib notch positions against the plan: measure from bow post to each notch. All within ±2 mm."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["All labelled material stored. Keel stored flat.","Facilitator: 'The keel is the vessel's spine. Every Chola teak-framed vessel began with the laying of the keel — a ceremony that marked the official start of construction. Today you laid your keel. The vessel has begun.'"]}],"diff":{"sup":"Pre-marked rib notch positions on the keel. Group cuts notches and assembles bow/stern posts.","ext":"Calculate the keel's second moment of area and verify it provides sufficient anti-hogging stiffness for the planned vessel weight."},"ass":"Is the keel straight within 3 mm over its full length? Are all rib notch positions within ±2 mm of the plan? Are bow and stern posts securely bolted and aligned?","note":"The jig saw volume in this session is high — the facilitator will make many cuts. Queue management is essential. Brief all groups: mark and clamp ALL pieces for the session at the start, so the jig saw queue runs continuously without waiting for marking."},{"w":3,"f":"Rib Construction and Frame Assembly","bi":"At 200 cm length, hull symmetry is harder to achieve and more consequential than at 120 cm. A 5 mm asymmetry at 120 cm is barely visible. At 200 cm it is significant — and at water trials, it will be obvious.","obj":"Groups cut all 8 ribs from marine plywood, assemble the full rib-and-keel skeleton, and verify symmetry and squareness at full 200 cm length.","dur":"90 minutes","grp":"Groups of 5","mat":["Keel assembly from Week 2","Marine plywood 9 mm (for ribs)","Hull templates from Week 1 plan","Waterproof adhesive","C-clamps (12 per group)","Jig saw (facilitator only)","Sandpaper","Set square","Steel ruler 1 m","Spirit level (1 m length)","Eye protection","Work gloves"],"voc":[["Station","A reference cross-section position along the hull — ribs are installed at each station. Grade 11 uses 8 stations at 25 cm intervals"],["Fairness check","Verifying that a batten laid along the rib tops follows a smooth curve — no kinks or flat spots that would produce an unfair hull"],["Stanchion","A vertical support post — used to hold the hull frame upright during construction before the hull sides are planked and the structure becomes self-supporting"]],"ph":[{"n":"Rib Template Transfer and Cutting","m":30,"t":"build","s":["Transfer all 8 rib cross-sections from the body plan drawings to marine plywood.","Cut protocol: students trace, mark, and clamp. Facilitator cuts. Students sand all cut edges immediately after cutting.","Label each rib with its station number immediately after cutting.","Queue management: while facilitator cuts rib N, students prepare rib N+1 for cutting."]},{"n":"Dry Fit and Adjustment","m":20,"t":"build","s":["Dry fit all 8 ribs into the keel notches.","Set square check: each rib perpendicular to the keel. Adjust notch if rib leans.","Spirit level across pairs of ribs: rib tops at consistent heights? All within 5 mm.","Fairness check: lay a 1.5 m flexible batten along the rib tops on each side. Does it follow a smooth curve? Any kinks?","Adjust all ribs before any gluing begins."]},{"n":"Glued Assembly","m":25,"t":"build","s":["Glue and clamp all 8 ribs into keel notches following the Grade 9 sequence (amidships first, working outward).","Facilitator confirms squareness of each rib before moving to the next.","Spirit level check after every 2 ribs: maintain running accuracy.","Install stanchions (temporary vertical supports) at 4 rib positions to hold the frame upright while the hull is planked."]},{"n":"Symmetry Assessment","m":9,"t":"test","s":["Measure beam at every rib: does each match the body plan dimension within ±5 mm?","Fairness check after gluing: batten on rib tops. Any kinks post-gluing?","Diagonal check across the frame: equal diagonals confirm the frame is not twisted."]},{"n":"Clean-Up & Close","m":6,"t":"close","s":["Frame secured on stanchions. Stored on flat surface.","Facilitator: 'Eight ribs on a 200 cm keel. A skeleton 2 metres long. At this scale the engineering becomes visible — you can see whether it is fair, whether it is level, whether it is symmetrical. The water will confirm it absolutely. Two more sessions and the hull begins to clos…"]}],"diff":{"sup":"Pre-mark the first 2 rib outlines. Group traces, cuts, and assembles the remaining 6.","ext":"Produce a photographic fairness record: photograph the frame from bow, stern, and amidships, and annotate any fairness issues identified and corrected."},"ass":"Are all 8 ribs square to the keel (set square check)? Are rib tops within ±5 mm height consistency? Is the fairness batten test passed?","note":"At 200 cm, the spirit level used in Grade 9 (30 cm) is too short to span between ribs reliably. Use a 1 m spirit level for this session. If a 1 m spirit level is not available, use a long straight edge with a short spirit level placed on top of it."},{"w":4,"f":"Hull Planking — Full Vessel with Laser CNC Bulkhead Pre-Cut","bi":"A 200 cm hull has more planks, more curves, and more clamp requirements than a 120 cm hull. While two students manage the planking at the bench, a third is at the laptop preparing the laser CNC file for the bulkheads — parallel production is professional construction.","obj":"Groups plank the full hull in one extended session; simultaneously the laser CNC machine cuts all bulkhead panels and cargo deck blanks to the precise dimensions from the approved plan, ready for Week 6 interior installation.","dur":"90 minutes","grp":"Groups of 5","mat":["Frame from Week 3","Marine plywood 4 mm (2 sheets per group)","Marine plywood 6 mm (1 sheet — for laser-cut bulkheads)","Waterproof adhesive","Jig saw (facilitator only)","Laser CNC machine (school shared)","Laptop with LightBurn/xTool software","C-clamps and spring clips (20 per group)","Masking tape","Sandpaper","Waterproof marker","Eye protection","Work gloves"],"voc":[["Stringer landing","The position on the hull planks where the longitudinal stringer is glued on the inside — the stringer ties all planks together longitudinally"],["Chine","A sharp angle in the hull cross-section — simplifies planking but creates more hydrodynamic drag than a round-bilge hull. Grade 11 may use a soft chine (slightly rounded) as a compromise"],["Plank sequence","The order in which hull planks are applied — must maintain hull symmetry and allow adequate clamping at each step"]],"ph":[{"n":"Team Role Assignment — Including Laser CNC Operator","m":8,"t":"intro","s":["Assign roles for the 90-minute session:","Role A (Marker): traces plank outlines on plywood — 2 students.","Role B (Clamper): applies adhesive and installs clamps — 2 students.","Role C (Laser CNC Operator): prepares and runs the bulkhead cut files on the laptop + laser CNC — 1 student, supported by facilitator.","Roles rotate after 45 minutes.","Planking protocol: lower hull port, lower hull starboard, upper hull port, upper hull starboard — symmetrical pairs throughout."]},{"n":"Parallel Operation — Planking + Laser CNC Bulkheads","m":65,"t":"build","s":["BENCH TEAM (Roles A + B): plank the hull.","Lower hull port (15 min): mark, cut, apply, clamp all lower port planks.","Lower hull starboard (15 min): mirror of port using the cut port plank as template.","Upper hull port (15 min): extend planking to sheer line. Note the stringer landing position.","Upper hull starboard (15 min): mirror. Stringer installation (5 min): glue and clamp both longitudinal stringers.","LASER CNC TEAM (Role C): in parallel with planking:","Step 1 (10 min): open the approved plan on the laptop. Extract the 2 bulkhead dimensions and the 2 cargo deck dimensions. Draw each as a closed rectangle/curve in the laser software.","Step 2 (5 min): nest all 4 parts on one 6 mm marine ply sheet. Set laser parameters (power 70–80%, speed 10–15 mm/s for 6 mm marine ply — confirm with a test cut first).","Step 3 (20 min): run the laser cut. Facilitator supervises. All others maintain 0.5 m distance from machine during cutting.","Step 4 (10 min): remove all 4 pieces. Test fit each against the hull at its intended position — adjust with sandpaper if needed.","Laser note: ventilation fan must run throughout. If smoke becomes visible inside the lab, pause and increase ventilation before continuing."]},{"n":"Test — Fairness and Plank Contact","m":10,"t":"test","s":["Run a hand along the outside of the hull. Any ridges where planks meet? These indicate a gap that must be sanded flush before sealing.","Inside inspection: any plank lifted off a rib? Spring clip and clamp immediately.","Symmetry check: measure beam at amidships from inside — port and starboard plank extensions should be identical."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Hull in frame secured on stanchions. All clamps left on overnight.","Facilitator: 'The hull is closed. It looks like a vessel now. The next two sessions are the most important in the build: waterproofing. Everything you have done creates the structure. Waterproofing determines whether it sails or sinks.'"]}],"diff":{"sup":"Pre-mark the port-side plank outlines. Group mirrors to starboard and handles clamping.","ext":"Measure the actual prismatic coefficient of the completed hull form and compare to the Grade 9 vessel. How does the hull efficiency compare?"},"ass":"Is the full hull planked on all 4 zones (lower/upper × port/starboard)? Are stringers installed? Is every plank in contact with every rib it crosses?","note":"The symmetric pairing rule (port then immediate mirror to starboard) is the single most important production management decision. It prevents the common failure mode where one side is fully planked and the other is half-done — creating a rigid asymmetric hull that is very difficult to correct."},{"w":5,"f":"Comprehensive Waterproofing System — Three Layers","bi":"Three layers is not triple redundancy — each layer serves a different purpose. Layer 1 fills gaps. Layer 2 creates a continuous surface. Layer 3 provides abrasion resistance. Remove any layer and the system fails.","obj":"Groups apply a 3-layer waterproofing system to the entire hull and pass a full 60-minute immersion test.","dur":"90 minutes","grp":"Groups of 5","mat":["Hull from Week 4","Marine sealant (6 tubes per group)","Waterproof adhesive coat (1 tin per group)","Marine paint (2 tins per group)","Caulking guns (2 per group)","Brushes and rollers","Gloves","Water test tank","Sandpaper 120 grit"],"voc":[["Seam compound","A flexible sealant applied to plank-to-plank seams — must be flexible enough to accommodate hull flexing without cracking"],["Epoxy coat","A thin layer of waterproof epoxy resin applied over the entire hull surface — fills all micro-pores in the wood and plywood surface"],["Anti-fouling","A paint applied to the underwater hull that discourages marine growth — not applicable at pool scale but relevant to real vessel operation"]],"ph":[{"n":"Waterproofing Safety","m":8,"t":"intro","s":["Grade 11 uses more powerful waterproofing chemicals than Grade 9. Safety requirements:","Gloves mandatory throughout.","Maximum ventilation — all windows and doors open.","No eating or drinking during application.","Dispose of used applicators immediately in closed bin.","Skin contact: wash immediately with soap and water.","Clothing: wear old clothes. Marine sealant is permanent on fabric."]},{"n":"Layer 1 — Seam Sealing (All Seams)","m":20,"t":"build","s":["Apply marine sealant to every plank-to-plank seam, inside and outside.","Method: run the caulking gun bead along the entire seam length. Push the bead into the seam with a spatula. Smooth flush with the hull surface.","Also seal: all rib-to-plank contact lines inside the hull, both ends of every plank (cut edges), all stringer junctions.","Inspect: no unsealed seam anywhere on the hull."]},{"n":"Layer 2 — Full Surface Coat (Outside Hull)","m":20,"t":"build","s":["Apply waterproof adhesive coat to the entire outer hull surface below the waterline.","Method: roller application for large areas, brush for corners and ribs.","Target: continuous film with no pinholes. The hull surface should look uniformly coated — no bare wood visible.","Allow 15 minutes to tack before applying Layer 3."]},{"n":"Layer 3 — Marine Paint (Complete Hull)","m":20,"t":"build","s":["Apply marine paint to the entire outer hull — above and below the waterline.","2 coat sequence: first coat applied now, second coat after 30 minutes.","Paint colour reference: Chola trade vessels were sometimes painted with herbal-based dark red or black pitch coatings — apply a deep red-brown.","Inside hull: apply a single coat of waterproof paint to the bilge area and lower hull interior."]},{"n":"Test — 60-Minute Immersion","m":15,"t":"test","s":["Place the painted hull in the water test tank. Fill to near the sheer line. Wait 60 minutes.","After 60 minutes: remove. Inspect inside. Any water ingress? Mark all leak points.","Accept: zero visible water ingress. Fail: any drip or damp patch inside the hull.","If fail: identify the leak source and re-seal before Week 6."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Brushes and rollers cleaned. Gloves disposed of.","Facilitator: 'Your hull has received the same 3-layer waterproofing system used on wooden small craft across Tamil Nadu. It either passed the 60-minute test or it didn't. If it passed: the waterproofing is complete. If it didn't: you know exactly where the failure is and you have…"]}],"diff":{"sup":"Assign specific zones of the hull to each student. No student is responsible for the full hull.","ext":"Research the historical Chola waterproofing materials (teak oil, fish oil, coconut coir, resin) and write a comparison with the modern materials used today."},"ass":"Does the hull pass the 60-minute immersion test with zero water ingress? Have all 3 layers been applied?","note":"The 60-minute immersion runs during the clean-up and post-session period — it does not occupy the lesson time. Set the hull in the tank during Layer 3 application and check at the end of the session. Any leaks identified are repaired in the first 10 minutes of Week 6."},{"w":6,"f":"Internal Structure — Bulkheads, Cargo Deck, and Crew Area","bi":"The interior of a vessel is where function lives. The outside of the hull makes the vessel float. The inside makes it work — and makes it safe for the people in it.","obj":"Groups install the full internal structure: forward and aft cargo bulkheads, main cargo deck, crew paddling area, and a ballast provision.","dur":"90 minutes","grp":"Groups of 5","mat":["Waterproofed hull from Week 5","Marine plywood 4 mm and 6 mm (offcuts and scraps)","Waterproof adhesive","Marine sealant","C-clamps","Jig saw (facilitator only)","Sandpaper","Spirit level"],"voc":[["Sole","The floor of the vessel — the walking/working surface inside the hull. Must be flat, sealed, and strong enough to support the crew"],["Gunwale","The top edge of the hull sides — the structural element that ties the tops of all ribs together and provides the lateral stiffness to the upper hull"],["Thwart","A transverse seat board across the vessel interior — provides crew seating for paddlers and also serves as a structural cross-tie that prevents the hull sides from spreading"]],"ph":[{"n":"Internal Structure Plan Review","m":10,"t":"intro","s":["Review the structural arrangement drawing from Week 1: where do the bulkheads go? Where is the cargo deck? Where do the crew sit?","Grade 11 interior layout: (1) forward cargo hold — 50 cm, forward of amidships, (2) crew area — 60 cm amidships, with 2 thwart seats, (3) aft cargo hold — 50 cm aft of amidships.","Total: 160 cm of usable interior space in a 200 cm hull.","Today: install both bulkheads, the cargo deck in each hold, and both crew thwarts."]},{"n":"Bulkhead and Deck Installation","m":50,"t":"build","s":["Forward bulkhead (15 min): cut, seal perimeter, install at station 2 (40 cm from bow). Clamp.","Aft bulkhead (15 min): cut, seal, install at station 6 (40 cm from stern). Clamp.","Forward cargo deck (10 min): flat panel of 6 mm ply installed at bilge level inside forward hold. Sealed edges.","Aft cargo deck (10 min): same in aft hold.","Sealing: all bulkhead perimeters receive a full sealant bead on both faces."]},{"n":"Crew Area — Thwarts and Sole","m":20,"t":"build","s":["Sole: a 6 mm ply panel covering the bottom of the crew area (between the two bulkheads). This is the floor the crew stands or kneels on.","Thwart 1 (forward crew seat): a 80 cm × 15 cm panel, spanning the full beam, sitting on small ledger blocks glued to the hull sides at 35 cm height. Also serves as a structural cross-tie.","Thwart 2 (aft crew seat): identical, 50 cm further aft.","Install and glue both thwarts. Spirit level check: both thwarts horizontal.","Gunwale strip: a 20 mm × 10 mm wood strip glued along the inside of the sheer line on both port and starboard sides — ties all rib tops together and stiffens the upper hull."]},{"n":"Test — Interior Level and Leak Check","m":8,"t":"test","s":["Spirit level on both thwarts: horizontal?","Fill each cargo hold with 500 ml of water and leave for 5 minutes — does water appear in the crew area? (Indicates bulkhead leak.)","Sole flatness: place a straight edge across the sole. Any high spots (rib tops protruding above the sole)?"]},{"n":"Clean-Up & Close","m":2,"t":"close","s":["Facilitator: 'Your vessel now has interior space fit for a crew and a cargo. In Week 13 it will carry both. Two sessions to complete the external hardware and propulsion system.'"]}],"diff":{"sup":"Pre-cut bulkhead panels. Group focuses on sealing, installation, and interior fittings.","ext":"Design and install a removable floorboard system in the crew area — individual boards that can be lifted for bilge access and cleaning."},"ass":"Are bulkhead perimeters fully sealed? Are thwarts horizontal (spirit level check)? Does the bulkhead leak test pass?","note":"The gunwale strip is often skipped when time is tight — resist the temptation. It is a genuine structural element that prevents the hull sides from spreading under load. Without it, the vessel may show an increasing beam measurement after each use."},{"w":7,"f":"Cargo System and Lashing Points","bi":"A vessel that carries cargo but cannot secure it is an accident waiting to happen. In open water, unsecured cargo shifts with every wave — and shifting cargo changes the trim, then the stability, then the vessel's ability to return to upright after a wave.","obj":"Groups install a complete cargo management system: lashing points, cargo net attachment hardware, and a 10 kg cargo capacity test in the water.","dur":"90 minutes","grp":"Groups of 5","mat":["Hull from Week 6","Rope hardware (D-rings, cleats — 8 per group)","Marine-grade screws 30 mm (30 per group)","Rope 8 mm (5 m per group)","Cargo net or strong mesh bag","10 kg test cargo (waterproofed sand bags)","Power drill","Eye protection","Work gloves","Water test tank"],"voc":[["Lashing point","A structural fitting bolted through the hull or deck structure to which cargo securing ropes are attached — must be load-rated"],["Cargo manifest","A list of all cargo aboard a vessel with its weight, position, and securing method — a legal and safety document for real vessels"],["Centre of gravity (cargo)","The position of the combined weight of all cargo — must be kept low and centred for vessel stability"]],"ph":[{"n":"Cargo Security Design","m":10,"t":"intro","s":["Ask: 'If the vessel is carrying 10 kg of cargo in 2 bags of 5 kg each, and a wave rocks the vessel 15°, what happens to the cargo if it is not secured?'","Guide: the cargo slides to the low side, increasing the list, which increases the slide, which may capsize the vessel.","Introduce lashing points: (1) in each cargo hold, 4 D-ring lashing points bolted through the cargo deck into the structural member below, (2) cargo is secured with a rope lashing from one side to the other, over the cargo.","Chola trade vessels: the cargo holds used bamboo lashing systems to secure ceramic pots and spice containers. The principle is unchanged — prevent cargo movement under all conditions."]},{"n":"Build Challenge — Lashing System","m":55,"t":"build","s":["Step 1 (15 min): mark 4 lashing point positions in each cargo hold (8 total). Drill pilot holes through cargo deck and underlying structure.","Step 2 (15 min): install D-ring hardware with marine screws. Each D-ring receives 2 screws minimum.","Step 3 (10 min): install 2 cleats on the inner hull sides at the crew area — these are the control points for the paddles.","Step 4 (10 min): rig a rope lashing from forward D-rings over a test cargo bag to aft D-rings. Tighten. Attempt to slide the bag sideways — it must resist.","Step 5 (5 min): produce the cargo manifest card — a small card listing both cargo bags, their weight, position, and securing method. Place inside the vessel."]},{"n":"Test — 10 kg Cargo Water Trial","m":17,"t":"test","s":["Float vessel in the water tank.","Load 10 kg cargo (2 × 5 kg bags, one in each hold) using the optimal loading plan from Grade 9 principles.","Apply lashings.","Tilt vessel to 15° by pressing on one side. Does cargo move? Does it return to level?","Freeboard with 10 kg cargo: measure at all 4 points. Minimum 3 cm freeboard required.","Record: cargo test pass/fail, freeboard measurements, trim angles."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Cargo system secured. Hull dried.","Facilitator: 'Your vessel can carry 10 kg of cargo, secured against movement. Two sessions remain before water trials. Week 8 is the propulsion system. Week 9 is safety systems and final waterproofing. Then: the water.'"]}],"diff":{"sup":"Pre-drill all lashing point holes. Group installs hardware, rigs lashings, and conducts the test.","ext":"Calculate the lashing forces under a 30° tilt event and verify that the D-rings and screws can sustain those forces without pull-out."},"ass":"Do all 8 D-rings resist the pull-out test? Does the 10 kg cargo remain secured during the 15° tilt test? Is the freeboard ≥ 3 cm with full cargo?","note":"The cargo manifest card is a small but significant detail — it communicates that this is a real vessel with a real cargo management system. Facilitate students taking it seriously: the manifest is filled in with actual weights and signed by the 'cargo master' (one group member)."},{"w":8,"f":"Multi-Oar Paddle Propulsion System","bi":"A 2-person crew operating 4 paddles in a 200 cm vessel is not twice as complex as a 1-person crew in a 120 cm vessel — it is categorically different. Coordination, timing, and system design are as important as paddle efficiency.","obj":"Groups design and build a 4-oar paddle system (2 per crew member) that allows the vessel to be propelled in a straight line under crew power at usable speed.","dur":"90 minutes","grp":"Groups of 5","mat":["Hull from Week 7","Lightweight wood 25×25 mm × 120 cm (4 shafts)","Marine plywood 4 mm scraps (blades)","Rope for grip wrapping","Oarlock hardware or rope oarlock (if using side-mounted oars)","Waterproof adhesive","Jig saw (facilitator only)","Sandpaper","Clamps"],"voc":[["Oarlock (rowlock)","A U-shaped fitting on the gunwale that holds the oar in position during rowing — transmits the oar's force to the vessel structure"],["Stroke rate","The number of oar strokes per minute — higher stroke rate increases speed up to the physical limit of the crew"],["Catch","The moment the paddle blade enters the water at the beginning of the stroke — the most force-critical moment of the paddle cycle"]],"ph":[{"n":"Propulsion Design Review","m":12,"t":"intro","s":["Grade 9 used 2 paddles operated from outside the vessel.","Grade 11 uses 4 paddles — 2 operated by each crew member from the thwart seats.","Show 2 paddle configurations: (1) kayak-style double paddles (one shaft, blades at each end, paddler alternates sides), (2) canoe-style single paddles (one blade per shaft, paddler uses one side per stroke).","Grade 11 choice: kayak-style double paddle — 2 shafts of 120 cm each, blades at both ends. Each crew member holds one shaft and alternates sides. This produces the straightest tracking with least effort.","Oarlock: each thwart position has a rope oarlock (a loop of rope through the gunwale) — the shaft rests in the loop during the stroke, providing a pivot point."]},{"n":"Build Challenge — 4-Blade Kayak Paddle System","m":60,"t":"build","s":["Step 1 (15 min): cut 2 shafts × 120 cm. Sand grip zones.","Step 2 (15 min): cut 4 blade ovals from 4 mm ply (15×10 cm each). Facilitator cuts.","Step 3 (15 min): blade installation — 2 blades per shaft, one at each end. Feathered at 90° to each other (kayak configuration). Glue + clamp.","Step 4 (10 min): grip wrapping — rope wrap at 2 grip zones per shaft.","Step 5 (5 min): oarlock installation — rope loops through gunwale at both thwart positions, both sides.","Test both paddles in the water tray while hull is being dried: do blades stay rigid? Does the feathering allow clean alternate strokes?"]},{"n":"Test — Crew Propulsion Trial","m":12,"t":"test","s":["Float vessel in water tank (unloaded). Crew of 2 students position at thwart seats.","Note: pool edge operation only — crew does not sit IN the vessel; they reach in to paddle from the pool edge.","Paddle the vessel 2 metres forward and back. Observe: straight tracking? Both crew in sync? Any blade flex?","Adjust: if vessel turns, which crew member's stroke is dominant? How do they correct?","Record: propulsion test pass/fail, any blade joint issues, tracking quality."]},{"n":"Clean-Up & Close","m":8,"t":"close","s":["Paddles stored. Hull dried.","Facilitator: 'A Chola war vessel had 50 oarsmen. A trade vessel had 12–20. Your crew has 2. The principle of coordinated human-powered propulsion is unchanged across every vessel in human history. Next session: safety systems and final hardware. Then: the water trial.'"]}],"diff":{"sup":"Pre-cut blades. Group focuses on shaft preparation, assembly, and the crew propulsion trial.","ext":"Calculate the theoretical vessel speed based on crew stroke rate, paddle blade area, and hull resistance. Compare to actual measured speed in the pool trial."},"ass":"Are blade joints rigid under the pull-through water test? Does the vessel track straight under 2-crew paddling?","note":"The pool-edge crew propulsion test is the first time 2 students are simultaneously operating the vessel. Brief both crew members on coordinated stroke technique before the test. A vessel that veers strongly to one side during this test needs oarlock adjustment (move the higher-force paddler's oarloc…"},{"w":9,"f":"Safety Systems and Final Hardware","bi":"Safety is not the last layer added to an engineering project. It is woven through every decision from the first cut. The safety system checklist is the final proof that every decision was made correctly.","obj":"Groups install all final safety hardware and perform the complete pre-trial checklist, issuing a build completion certificate.","dur":"90 minutes","grp":"Groups of 5","mat":["Hull from Week 8","Life vests (1 per crew member, stored at poolside)","Drain plug hardware (2 per group)","Grab lines (20 mm rope loops at bow and stern)","Buoyancy test weights (to verify positive buoyancy when inverted)","Final sealant application","Paint touch-up"],"voc":[["Positive buoyancy","When a vessel, even when filled with water, floats above the surface — achieved through sealed compartments or foam flotation blocks"],["Grab line","A rope attached to the outside of the hull that a person in the water can grip to stay near the vessel in a capsize situation"],["Capsize recovery","The ability to right an inverted vessel — small paddled vessels should be designed to be righted by the crew from the water"]],"ph":[{"n":"Safety Requirements Review","m":10,"t":"intro","s":["All Grade 11 water trial safety requirements: (1) life vests for both crew members and any student within 1 m of the pool edge, (2) grab lines at bow and stern, (3) drain plugs fitted and tested, (4) positive buoyancy verification, (5) adult pool supervisor at all times.","Review the capsize scenario: 'If the vessel capsizes during the water trial, what is the crew's action? (1) Stay with the vessel, (2) grab the grab line, (3) do not try to right it until the facilitator signals.'","Today: install grab lines, drain plugs, and verify positive buoyancy."]},{"n":"Safety Hardware Installation","m":35,"t":"build","s":["Grab lines (10 min): drill 20 mm holes at bow and stern. Thread a 40 cm loop of 20 mm rope through each hole and knot inside. The loop hangs outside the hull.","Drain plugs (10 min): drill a 20 mm hole in the lowest point of the bilge in each cargo hold. Install a threaded drain plug. Seal the thread with marine sealant.","Positive buoyancy check (15 min): fill the interior of the hull completely with water. Place in the water tank. Does the hull, even fully flooded, float with at least 3 cm above the waterline? (The sealed bulkhead compartments provide the buoyancy.)"]},{"n":"Final Pre-Trial Checklist","m":30,"t":"build","s":["Groups work through the complete 20-item pre-trial checklist:","Structure: all seams sealed, all planks flush, all bolts tightened.","Waterproofing: 60-minute immersion passed, all cut edges sealed.","Interior: bulkheads watertight, cargo decks level, thwarts horizontal.","Cargo system: all D-rings secure, lashings functional.","Propulsion: blades rigid, oarlocks installed.","Safety: grab lines installed, drain plugs tested, buoyancy check passed.","All items checked and signed by the facilitator."]},{"n":"Build Completion Certificate","m":8,"t":"test","s":["Issue Build Completion Certificate after checklist is fully signed: 'This vessel has completed the full construction programme. All structural, waterproofing, cargo, propulsion, and safety requirements have been verified. Approved for water trial.'","All group members sign the certificate."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Vessels stored ready for water trial. Drain plugs inserted.","Facilitator: 'Your vessel has a Build Completion Certificate. The next time it touches water, it will be in the pool under crew power with cargo aboard. That is what every element of this build has been working toward. Three more sessions: the water trial, the open showcase, and …"]}],"diff":{"sup":"Facilitator completes the checklist items with the group. Group installs the grab lines and drain plugs.","ext":"Design a capsize recovery procedure specific to this vessel — a step-by-step crew protocol for righting the vessel from the water."},"ass":"Is the Build Completion Certificate issued (all 20 items checked)? Does the positive buoyancy check pass?","note":"The Build Completion Certificate is a significant document. It should be printed on proper card, not handwritten on scrap paper. Prepare the certificate template in advance — groups fill in the vessel data and all members sign. The facilitator signature is the professional sign-off."},{"w":10,"f":"Heritage Finishing — Hull Painting, Sail Construction, and Embroidered Vessel Name","bi":"The Chola trade fleet was not just functional — it was magnificent. Dark teak hulls, painted eyes at the bow, billowing lateen sails, and inscribed vessel names. Engineering without identity is infrastructure. Engineering with identity is culture.","obj":"Three parallel workstreams complete the vessel's heritage identity: Pair A paints the hull heritage scheme; Pair B sews the large lateen sail on the sewing machine; Pair C embroiders the vessel name and a Chola motif using the embroidery machine.","dur":"90 minutes","grp":"Groups of 5 (3 pairs working in parallel)","mat":["Hull from Week 9","Fine brushes","Heritage red / deep ochre paint","Gold metallic paint","Clear sealant coat","Canvas sailcloth 80 cm × 60 cm (per group)","Sewing thread heavy-duty (UV-resistant)","Embroidery thread (gold, terracotta)","Embroidery stabiliser","Fusible webbing (for hem sealing)","Fabric scissors","Mast — bamboo 80 cm","Rigging rope 2 m","Stencils (Tamil script)"],"voc":[["Vessel name","The unique identity of a vessel — in the Chola period, vessels were often named after deities, rivers, or attributes of the kingdom"],["Lateen sail","A triangular sail on a long yard — the Chola trade vessel's primary propulsion in open water. The sail is sewn from panels of canvas and hemmed on all edges"],["Digitising (embroidery)","Converting a design into a stitch file (DST or PES format) that the embroidery machine reads — the digital equivalent of the hand embroiderers who decorated Chola vessels with silk thread"]],"ph":[{"n":"Vessel Naming and Workstream Briefing","m":12,"t":"intro","s":["Each group names their vessel. The name should be in Tamil and meaningful — examples: Kaveri (the sacred river), Marakata (emerald), Arumugam (a protective deity), Samudra (ocean).","Show the Chola iconography references: dark red-brown hull, bow eye, gold waterline stripe, lateen sail, Tamil script vessel name.","Assign pairs: Pair A (2 students) = hull painting. Pair B (2 students) = sail sewing. Pair C (1 student, with facilitator support) = embroidery machine for vessel name and motif.","All three workstreams run simultaneously for the first 60 minutes. Final 18 minutes: integration, rigging, and vessel identity record."]},{"n":"Pair A — Hull Heritage Painting","m":58,"t":"build","s":["Step 1 (15 min): base coat touch-up on any chipped or bare hull areas.","Step 2 (15 min): waterline stripe — a 2 cm wide gold or ochre stripe along the full waterline on both sides. Use masking tape to keep the line straight.","Step 3 (10 min): bow eye — a stylised eye painted at the bow on both sides. Large enough to be seen from 3 m.","Step 4 (10 min): interior heritage finishing — cargo decks painted burnt ochre, thwart ends marked with a darker stripe.","Step 5 (8 min): clear sealant coat over all painted decoration."]},{"n":"Pair B — Lateen Sail Sewing","m":58,"t":"build","s":["Step 1 (5 min): mark the sail shape on canvas — a right triangle, 70 cm × 55 cm base. Add 1.5 cm hem allowance on all edges. Mark 3 rope channel positions (one per edge).","Step 2 (5 min): cut canvas with fabric scissors.","Step 3 (15 min): sewing machine — hem all 3 edges. Fold 1.5 cm, pin, sew running stitch. Terracotta or natural thread.","Step 4 (15 min): sewing machine — sew canvas rope channel strips along all 3 hemmed edges.","Step 5 (10 min): apply fusible webbing along the hem interior for additional waterproof sealing. Press with a warm iron.","Step 6 (8 min): thread rigging rope through all 3 channels. Attach to 80 cm bamboo mast.","Sewing machine notes: always lower presser foot onto fabric before starting. Canvas is thick — use a heavy-duty (size 16) needle. Slow the machine down for the rope channel strip to avoid skipped stitches."]},{"n":"Pair C — Embroidery Machine — Vessel Name and Chola Motif","m":58,"t":"build","s":["Step 1 (8 min): load the pre-prepared DST/PES file on the embroidery machine. The file contains: (a) the vessel name in Tamil script, and (b) a simplified Chola ship prow motif. Total stitch count: approximately 6,000–8,000 stitches.","Step 2 (5 min): hoop a 15 × 10 cm section of canvas (cut from sail offcut) with embroidery stabiliser. Insert hoop into machine.","Step 3 (30 min): run the embroidery programme. Colours: gold thread for the vessel name; terracotta thread for the motif border. Thread changes happen automatically or are prompted by the machine.","Step 4 (5 min): remove hoop. Cut jump threads. Tear away stabiliser from the back.","Step 5 (10 min): hand-sew the finished embroidery panel onto the sail face (or glue with fabric adhesive if sewing machine time is limited).","Embroidery machine notes: if no pre-prepared DST file is available, use the machine's built-in font module to embroider the vessel name in the available Tamil character set. Most current embroidery machines include Devanagari/Tamil font packs."]},{"n":"Integration — Rig the Sail and Vessel Identity Record","m":13,"t":"test","s":["Mount the mast in the vessel. Rig the completed sail.","Test: does the sail furl and unfurl cleanly? Does the mast destabilise the vessel trim?","Vessel identity plate: a card mounted inside the hull — Vessel Name (Tamil + English), Builder (group names), Date, Cargo capacity, Hull type, Water trial status.","Final inspection: does the vessel look like a Chola trade vessel? Hull painted, bow eye present, gold waterline, embroidered sail with vessel name. This is the visual identity check."]},{"n":"Clean-Up & Close","m":7,"t":"close","s":["Sewing machines: remove fabric, cut and tie thread ends, cover machine.","Embroidery machine: remove hoop, save file, cover machine.","Hull stored with mast unstepped (remove mast for storage).","Facilitator: 'Your vessel has a name stitched in gold thread on a canvas sail sewn on a machine. It has a hull painted in the colours of the Chola maritime tradition. When it enters the pool in Week 13, every person watching will see a vessel with an identity — not just a floatin…"]}],"diff":{"sup":"Pair C uses the machine's built-in font rather than a custom DST file. Pair B uses a pre-cut sail panel.","ext":"Digitise a custom Chola design from a temple carving reference photograph using embroidery digitising software (Inkscape + Ink/Stitch, free) — a genuine professional skill."},"ass":"Is the hull painted with waterline stripe, bow eye, and sealant? Is the sail hemmed on all 3 sides with rope channels? Is the vessel name embroidered and attached to the sail?","note":"The embroidery file must be prepared and test-stitched before the session. A 6,000-stitch file takes approximately 20–25 minutes to stitch at standard speed. Pre-test on a scrap of stabiliser to confirm colour changes and stitch quality. If the Tamil script font is unavailable on the machine, print …"},{"w":11,"f":"Full Stability and Cargo Certification","bi":"Certification is not a ceremony — it is an engineering responsibility. The document that says this vessel is safe is signed by people who staked their reputation on the data behind it.","obj":"Vessels undergo a complete stability and cargo certification sequence: 10 kg cargo test, 30° tilt recovery, mBot monitoring throughout, issuing the final Water Trial Approval Certificate.","dur":"90 minutes","grp":"Groups of 5","mat":["Complete vessel from Week 10","mBot and laptop (live monitoring)","Water test tank","10 kg test cargo (secured with lashings)","Life vests","Ruler","Stopwatch","Log sheet","Certification card stock"],"voc":[["Inclining test","A formal stability test where known weights are moved to one side at a known distance — the resulting heel angle is used to calculate metacentric height (GM)"],["Righting moment","The force that returns a heeled vessel to upright — a vessel with a high righting moment is very stable but rolls stiffly"],["Reserve buoyancy","The volume of the hull above the waterline — represents the vessel's ability to absorb additional load before sinking. The higher the freeboard, the greater the reserve buoyancy"]],"ph":[{"n":"Pre-Certification Inspection","m":10,"t":"intro","s":["Final inspection against all certification criteria: (1) hull passes 60-min immersion test (from Week 5), (2) cargo hold bulkheads watertight, (3) all 4 safety hardware items installed and functional, (4) propulsion system tested and functional, (5) heritage finishing complete, (…","Any outstanding item: address in the first 15 minutes of this session."]},{"n":"Certification Sequence","m":55,"t":"test","s":["Test 1 — Empty float (5 min): float empty. Confirm trim and mark current waterline.","Test 2 — 5 kg cargo (8 min): load 5 kg in forward hold. Float. Measure trim and freeboard.","Test 3 — 10 kg cargo (8 min): add 5 kg in aft hold (total 10 kg). Float. Measure freeboard at all 4 points. Minimum 3 cm required.","Test 4 — 10° stability (5 min): with 10 kg cargo loaded, push vessel to 10°. Release. Measure return time.","Test 5 — 20° stability (5 min): same at 20°. Return in < 5 seconds required.","Test 6 — 30° stability (5 min): same at 30°. Does it return? What is the time?","Test 7 — mBot tilt monitoring (10 min): load 10 kg cargo. Run mBot monitor. Push to 15°. Record peak tilt and return time. LED warning at 15°?","Test 8 — Propulsion under cargo (9 min): propel vessel 2 m across pool with 10 kg cargo loaded. Does it maintain straight track?"]},{"n":"Certificate Issuance","m":15,"t":"test","s":["Record all 8 test results.","Go criteria for full certification: (1) freeboard with 10 kg cargo ≥ 3 cm, (2) returns from 20° in < 5 seconds, (3) completes propulsion test under cargo.","Issue Water Trial Approval Certificate if all criteria pass: 'This vessel has been certified for crewed water trials with a maximum cargo of 10 kg. All stability, buoyancy, and propulsion tests passed.'","All group members and the facilitator sign."]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Vessels stored. Certificates displayed on the vessel.","Facilitator: 'Your vessel is certified. In two sessions it will enter the pool under crew power, carrying its cargo, with its name on the bow and the Chola maritime tradition on its hull. That certification is not a piece of paper. It is the summary of everything you built.'"]}],"diff":{"sup":"Facilitator leads each stability test while students record data.","ext":"Perform an inclining test (move a 500 g weight from centreline to one side at known distance, measure heel angle, calculate GM) and compare to the estimated GM from the design phase."},"ass":"Are all 8 certification tests completed and recorded? Is the Water Trial Approval Certificate issued (all go criteria met)?","note":"The 30° tilt test is the most safety-critical test in the programme. Brief everyone: the test is done in the shallow water tank, with the facilitator holding the vessel. If the vessel does not return from 30°, the trial is STOPPED and a ballast correction is planned. A vessel that does not return fr…"},{"w":12,"f":"Refinement, Final Repairs, and Water Trial Rehearsal","bi":"Preparation is not what happens before the real work. Preparation IS the real work. Everything that goes well during the water trial will do so because someone rehearsed it until it was routine.","obj":"Groups address all outstanding snag items, rehearse the water trial sequence with crew, and prepare the full presentation for the Week 14 school showcase.","dur":"90 minutes","grp":"Groups of 5","mat":["Vessels from Week 11","Repair materials","Presentation materials","Water trial tank for rehearsal","Life vests","Log sheets"],"voc":[],"ph":[{"n":"Snag Resolution","m":25,"t":"build","s":["Groups address all items flagged in Week 11 testing.","Priority: any stability or waterproofing concern takes precedence over cosmetic issues.","Re-test any repaired item using the relevant test from Week 11.","Facilitator signs off each resolved snag."]},{"n":"Crew Water Trial Rehearsal","m":35,"t":"build","s":["Crew of 2 rehearses the full water trial sequence in the tank (without full cargo — use 5 kg for rehearsal):","Step 1: carry and launch the vessel together — proper 2-person vessel handling technique.","Step 2: load and secure cargo according to the Loading Plan.","Step 3: propel across the tank (2 m). Note: crew coordination, tracking, stroke rate.","Step 4: turn the vessel and return. Note: turning technique.","Step 5: unload cargo at destination.","Step 6: recover vessel from water — 2-person lift, drain plug removed, bilge checked.","Repeat twice. Second rehearsal should be noticeably smoother than the first."]},{"n":"Presentation Rehearsal","m":20,"t":"test","s":["Each group rehearses their 3-minute showcase presentation: (1) Chola heritage context, (2) vessel specification and design decisions, (3) key test results (stability, cargo capacity, water trial performance), (4) live mBot stability demonstration.","One group presents to another group as audience. Feedback.","Focus: is the presentation clear to a non-engineering audience (parents)?"]},{"n":"Clean-Up & Close","m":10,"t":"close","s":["Vessels stored. Life vests checked and returned.","Facilitator: 'You have rehearsed every element of next week's water trial. You know the sequence, you know the crew coordination, you know the handling. The water trial itself should feel familiar — not novel. That is what rehearsal achieves.'"]}],"diff":{"sup":"Assign crew roles with clear step-by-step instruction cards for each step of the water trial sequence.","ext":"Calculate the theoretical time for the 5 m voyage (pool length) based on the stroke rate and paddle efficiency from the rehearsal. Compare to the actual time in Week 13."},"ass":"Are all snags resolved and re-tested? Did the crew complete the rehearsal sequence smoothly on the second run? Is the presentation rehearsal complete?","note":"The second rehearsal run is the meaningful one — the first run reveals all the coordination issues. If the second run is not significantly smoother, a third run is worthwhile. A well-rehearsed crew is the biggest single factor in a successful water trial."},{"w":13,"f":"Full Water Trial — The Chola Voyage at Scale","bi":"The Bay of Bengal does not care how many lessons you had. The water trial is the truth. Everything the vessel is becomes visible in the first 30 seconds on the water.","obj":"Vessels complete a full crew-powered water trial: launch, cargo loading, 5 m voyage, cargo delivery, return voyage, recovery — with mBot live monitoring and audience observation.","dur":"90 minutes","grp":"Groups of 5 + whole school audience","mat":["Certified vessels","Life vests (all crew + any student within 1.5 m of pool)","10 kg cargo (in waterproof bags)","mBot and laptop (live display to audience)","Pool minimum 5 m × 3 m, or open water shallow area","Safety throwrope","Stopwatch","Log sheet","School audience"],"voc":[],"ph":[{"n":"Pool Safety Briefing — Full Class","m":10,"t":"intro","s":["ALL students: life vests worn for the entire pool session by crew members. All observers stay 1.5 m from the water edge.","Crew safety: if the vessel capsizes, crew stays with the vessel, grabs the grab line, waits for facilitator signal.","Facilitator + 1 adult supervisor at the pool at all times. No exceptions.","Water trial sequence announced: launch → cargo → voyage → delivery → return → recovery.","mBot display visible to all audience members: live tilt angle on screen."]},{"n":"Water Trial Sequence","m":50,"t":"test","s":["Stage 1 — Launch (5 min): 2-person carry to pool edge. Controlled launch from the deck (not dropped). Float check.","Stage 2 — Cargo loading (5 min): 10 kg cargo loaded and lashed according to loading plan. Trim confirmed.","Stage 3 — Outward voyage (10 min): crew paddles vessel from start to delivery point (5 m minimum). mBot reading called live: 'Tilt angle: ___°. Speed: ___m/min.'","Stage 4 — Cargo delivery (5 min): cargo unloaded at destination and placed on the pool edge.","Stage 5 — Return voyage (10 min): empty vessel paddled back. Comparison of loaded vs empty speed.","Stage 6 — Stability demonstration (5 min): with vessel in the pool, facilitator tilts it to 15° and releases. Audience watches the mBot reading recover.","Stage 7 — Recovery (10 min): vessel lifted from pool by crew. Drain plug removed. Bilge inspected for any water ingress."]},{"n":"Water Trial Certification","m":15,"t":"test","s":["Record all trial data: cargo carried (10 kg PASS/FAIL), voyage completed (PASS/FAIL), cargo delivered (PASS/FAIL), no sinking or capsize (PASS/FAIL).","Issue Water Trial Certificate: 'This vessel completed a crewed 5 m voyage carrying 10 kg cargo under human paddle power. All certification criteria passed.'","Audience applause.","Crossing register: all audience members invited to witness the vessel's identity plate and sign the vessel's log."]},{"n":"Clean-Up & Close","m":15,"t":"close","s":["Vessels dried. All water removed from bilge.","mBot removed and dried immediately.","Facilitator: 'A Chola trade vessel set out from the port of Nagapattinam carrying spices and cloth, crossed 3,000 km of open ocean, and returned laden with gold and silk from Southeast Asia. Your vessel crossed 5 metres of a pool carrying 10 kg of sand. The voyage is smaller. The…"]}],"diff":{"sup":"Assign data recording role. Records all trial data while the crew operates the vessel.","ext":"Calculate the vessel's cargo utilisation ratio (cargo carried ÷ vessel displacement × 100). Compare to a modern coastal cargo barge (~60%) and a Chola vessel estimate (~35–40%)."},"ass":"Were all 4 certification criteria passed? Was the water trial completed without sinking or capsize? Was the Water Trial Certificate issued?","note":"The water trial is the single most important session in the 11-year programme. Every previous lesson across Grades 1–11 has been building toward this moment. Give it the gravity it deserves. Film it. Celebrate it completely."},{"w":14,"f":"Advanced Chola Vessel Showcase and Programme Completion","bi":"The Vadiva Creative Labs Makerspace Pathway began with a Grade 1 student cutting their first piece of cardboard. It ends here — with an advanced maritime vessel, crewed, certified, and presented to the school community. This is the completion of the maker journey.","obj":"Groups present their completed vessels at the school's maritime showcase, demonstrating live monitoring, performing a pool demonstration, and completing their final engineering portfolios.","dur":"90 minutes","grp":"Groups of 5 + widest possible audience","mat":["All certified vessels","Water trial certificates","mBot and laptop","Pool","Camera and display screen","Final portfolio paper A3","Invited audience: widest possible — parents, trustees, local engineers, maritime professionals if available","Ceremonial vessel naming scroll"],"voc":[],"ph":[{"n":"Maritime Showcase Exhibition","m":15,"t":"intro","s":["Vessels displayed at the pool edge with all documentation visible: Build Completion Certificate, Water Trial Certificate, Loading Plan, Cargo Manifest, Vessel Identity Plate.","mBots active inside vessels. Pool filled.","Widest possible audience: school trustees, all parents, all staff, all students, local maritime professionals or engineers if available.","Facilitator opens: 'You are looking at vessels built by Grade 11 students who began this programme in Grade 1. They have built cardboard villages, market streets, temple towers, forts, watch towers, bridges that hold people, and bridges with moving spans. Today they present a cre…"]},{"n":"Group Presentations","m":20,"t":"build","s":["Each group presents for 3 minutes: (1) Chola heritage — the maritime empire and its vessels, (2) engineering journey — what Grade 9 taught us and what we added in Grade 11, (3) key specifications (LOA, beam, cargo capacity, stability results), (4) the vessel's name and its meanin…","Live mBot demonstration: tilt vessel in the water tray, display the tilt recovery on the audience screen."]},{"n":"Pool Demonstration — The Chola Voyage","m":20,"t":"test","s":["Each vessel completes a demonstration voyage in front of the audience: cargo loaded, crew paddles the length of the pool, cargo delivered, return voyage.","mBot live data displayed on the projector screen throughout.","Audience invited to call out the mBot readings: 'The vessel is now carrying ___ kg of cargo and has a stability tilt reading of ___ degrees.'","After all voyages: class stands at the pool edge. Vessels floating with their names visible."]},{"n":"Portfolio and Programme Reflection","m":25,"t":"build","s":["Each student produces their final A3 portfolio — the capstone document of the entire Makerspace Pathway.","Section 1: The journey (Grade 1 to Grade 11 — what did each grade teach you about making?)","Section 2: The vessel specification (full technical data)","Section 3: Water trial results","Section 4: What I would change (1 specific, justified improvement)","Section 5: What engineering means to me (written for a general reader — the most important section)","Facilitator reads aloud one exemplary Section 5. Class applause."]},{"n":"Programme Completion Ceremony","m":10,"t":"close","s":["Students stand in a circle around their vessels floating in the pool.","Each student says one sentence beginning: 'Building taught me...'","Facilitator closes: 'In Grade 1 you picked up a pair of scissors and cut a piece of cardboard. You had no idea what that first cut would lead to. It led here. To vessels that sail. To bridges that hold people. To towers that stand. To a maker's mind — one that sees a problem and …"]}],"diff":{"sup":"Portfolio Section 5 supported by 3 sentence starters. Student chooses and completes one.","ext":"Write and deliver a 5-minute engineering keynote to the school trustees: what is the value of a hands-on makerspace programme in education, and what did this one achieve?"},"ass":"Is the portfolio technically complete and personally meaningful (Section 5)? Was the pool demonstration completed? Is the Water Trial Certificate displayed?","note":"This is the last session of a programme that began in Grade 1. If possible, find a photograph of the students from their Grade 1 Tamil Village session and display it alongside the Grade 11 vessel. The visual comparison of the journey is more powerful than any words. Take the programme completion ser…"}]};

const mCol  = {'3D Printer':'#6C3483','Laser CNC':'#E8821A','Sewing':'#1B7A6E','Embroidery':'#C9A227'};
const mc    = (m) => Object.entries(mCol).find(([k])=>m.includes(k));

function phaseType(name, type) {
  if(type) return type;
  const n = name.toLowerCase();
  if(['intro','warm','brief','heritage','start','overview'].some(x=>n.includes(x))) return 'intro';
  if(['demo','skill','show','demonstration'].some(x=>n.includes(x))) return 'demo';
  if(['build','construct','sew','parallel','laser','fabricat','assem'].some(x=>n.includes(x))) return 'build';
  if(['test','load','check','verif','trial','water','certif','integrat'].some(x=>n.includes(x))) return 'test';
  return 'close';
}

function buildGradeNav() {
  document.getElementById('gnav').innerHTML = GRADES.map(g =>
    `<button class="gbtn" id="nav-${g.id}" onclick="openGrade('${g.id}')">
      <span class="gdot" style="background:${g.col}"></span>${g.lbl}
    </button>`
  ).join('');
}

function buildOverview() {
  const flowCards = GRADES.map(g => {
    const pills = g.mach.map(m => {
      const [,col] = mc(m)||['',g.col];
      return `<span class="mpill" style="background:${col}20;color:${col}">${m}</span>`;
    }).join('');
    return `<div class="fcard" style="background:${g.bg};border-color:${g.col}25" onclick="openGrade('${g.id}')">
      <div class="gl" style="color:${g.col}">${g.lbl}</div>
      <div class="gt" style="color:${g.col}">${g.theme}</div>
      <div class="gs" style="color:${g.col}">${g.proj}</div>
      ${pills?'<div class="mpills">'+pills+'</div>':''}
    </div>`;
  }).join('');

  const machRows = GRADES.map(g => {
    const has = k => g.mach.some(m=>m.includes(k));
    return `<tr>
      <td style="font-weight:600;color:${g.col};padding:6px 10px">${g.lbl}</td>
      <td style="padding:6px 10px;text-align:center">${has('3D')?`<span style="color:#6C3483;font-weight:700">✓</span>`:'—'}</td>
      <td style="padding:6px 10px;text-align:center">${has('Laser')?`<span style="color:#E8821A;font-weight:700">✓</span>`:'—'}</td>
      <td style="padding:6px 10px;text-align:center">${has('Sewing')||has('Emb')?`<span style="color:#1B7A6E;font-weight:700">✓</span>`:'—'}</td>
      <td style="padding:6px 10px;text-align:center">${has('Emb')?`<span style="color:#C9A227;font-weight:700">✓</span>`:'—'}</td>
      <td style="padding:6px 10px;color:#666;font-size:11px">${g.proj}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-overview').innerHTML = `
    <div class="hero"><h2>Makerspace Pathway — Grades 1 to 11</h2>
    <p>A complete engineering curriculum rooted in Tamil heritage. From cardboard villages to crew-powered maritime vessels — every grade builds on the last.</p></div>
    <div class="stats">
      <div class="scard"><div class="n">10</div><div class="l">Grades</div></div>
      <div class="scard"><div class="n">140</div><div class="l">Lesson plans</div></div>
      <div class="scard"><div class="n">537</div><div class="l">Session phases</div></div>
      <div class="scard"><div class="n">6</div><div class="l">Digital machines</div></div>
    </div>
    <div class="stitle">Programme flow — click any grade</div>
    <div class="flow">${flowCards}</div>
    <div class="stitle">Digital fabrication across the pathway</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:#F8F9FA">
        <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6C757D">Grade</th>
        <th style="padding:7px 10px;text-align:center;color:#6C3483;font-size:11px">3D Printer</th>
        <th style="padding:7px 10px;text-align:center;color:#E8821A;font-size:11px">Laser CNC</th>
        <th style="padding:7px 10px;text-align:center;color:#1B7A6E;font-size:11px">Sewing</th>
        <th style="padding:7px 10px;text-align:center;color:#C9A227;font-size:11px">Embroidery</th>
        <th style="padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6C757D">Final Project</th>
      </tr></thead>
      <tbody>${machRows}</tbody>
    </table>`;
}

function openGrade(id) {
  curGrade = GRADES.find(g=>g.id===id);
  curWeek = 1;
  showPage('curriculum');
  document.querySelectorAll('.gbtn').forEach(b=>b.classList.remove('on'));
  const nb = document.getElementById('nav-'+id);
  if(nb) nb.classList.add('on');
  renderGrade();
}

function renderGrade() {
  const g = curGrade;
  const lessons = LD[g.arr] || [];
  const lesson = lessons.find(l=>l.w===curWeek) || lessons[0];
  if(!lesson) return;

  const pills = g.mach.map(m=>{
    const [,col]=mc(m)||['',g.col];
    return `<span style="display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;background:${col}20;color:${col};font-weight:600;margin-right:4px">${m}</span>`;
  }).join('');

  const wbtns = lessons.map(l => {
    const on = l.w===curWeek;
    const ft = (l.f||'').replace(/—.*/,'').trim();
    return `<div class="wbtn ${on?'on':''}" style="${on?'background:'+g.col+';border-color:'+g.col:''}" onclick="selWeek(${l.w})">
      <div class="wn" style="${on?'color:rgba(255,255,255,.8)':''}">W${l.w}</div>
      <div class="wt" style="${on?'color:#fff':''}">${ft.substring(0,16)}${ft.length>16?'…':''}</div>
    </div>`;
  }).join('');

  document.getElementById('page-curriculum').innerHTML = `
    <div class="ghdr" style="background:${g.col}">
      <h2>${g.lbl} — ${g.theme}</h2>
      <p style="margin-bottom:6px">${g.proj}</p>
      <div style="font-size:11px;opacity:.75;margin-bottom:8px">Heritage: ${g.her}</div>
      <div>${pills}</div>
      <div class="meta">
        <div class="mi">⏱ ${lessons[0]&&lessons[0].dur||'60 min'}</div>
        <div class="mi">👥 ${lessons[0]&&lessons[0].grp||'Groups'}</div>
        <div class="mi">📋 14 weeks</div>
      </div>
    </div>
    <div class="stitle" style="color:${g.col}">Weekly lesson flow — click a week</div>
    <div class="wgrid">${wbtns}</div>
    <div class="stitle" style="color:${g.col}">Week ${curWeek} — ${lesson.f||''}</div>
    <div id="lesson-panel"></div>`;

  renderLesson(lesson, g);
}

function renderLesson(lesson, g) {
  const phases = lesson.ph || [];
  const phasesHtml = phases.map((p, pi) => {
    const t = phaseType(p.n, p.t);
    const col = phCol[t]||'#666';
    const bg = phBg[t]||'#F4F6F7';
    const steps = (p.s||[]).map((s,si) =>
      `<div class="step-item">
        <span class="step-num">${si+1}</span>
        <span class="step-txt">${s}</span>
      </div>`
    ).join('');
    return `<div class="phase-block" id="ph${pi}">
      <div class="phase-hdr" onclick="togglePhase(${pi})" style="background:${bg}30">
        <span class="phase-dot" style="background:${col}"></span>
        <span class="phase-name" style="color:${col}">${p.n}</span>
        <span class="phase-mins">${p.m} min</span>
        <span class="phase-chev" id="chev${pi}">▼</span>
      </div>
      <div class="phase-steps" id="steps${pi}">${steps}</div>
    </div>`;
  }).join('');

  const vocab = (lesson.voc||[]).map((v,i) =>
    `<tr><td class="vterm">${v[0]}</td><td style="color:#555;font-size:12px">${v[1]}</td></tr>`
  ).join('');

  const mats = (lesson.mat||[]).map(m =>
    `<li>${m}</li>`
  ).join('');

  const diff = lesson.diff||{};
  const ass = lesson.ass||'';
  const note = lesson.note||'';

  document.getElementById('lesson-panel').innerHTML = `
    <div class="lpanel">
      <div class="lhdr">
        <h3>${lesson.f||''}</h3>
        <div class="bigidea">${lesson.bi||''}</div>
        <div class="lmeta">
          <div class="mbadge">⏱ ${lesson.dur||'60 min'}</div>
          <div class="mbadge">👥 ${lesson.grp||''}</div>
          <div class="mbadge">📍 Week ${curWeek} of 14</div>
          ${lesson.obj?'<div class="mbadge" title="'+lesson.obj+'">📋 Objective</div>':''}
        </div>
      </div>
      <div class="ltabs">
        <div class="ltab on" onclick="switchTab('phases',this)">Session phases</div>
        <div class="ltab" onclick="switchTab('vocab',this)">Vocabulary</div>
        <div class="ltab" onclick="switchTab('materials',this)">Materials</div>
        <div class="ltab" onclick="switchTab('diff',this)">Differentiation</div>
        <div class="ltab" onclick="switchTab('notes',this)">Facilitator notes</div>
        <div class="ltab" onclick="switchTab('video',this)">&#9654; Watch</div>
      </div>
      <div class="lbody">
        <div id="tab-phases">${phasesHtml}</div>
        <div id="tab-vocab" class="hidden">
          ${vocab?'<table class="vtable"><thead><tr><th>Term</th><th>Definition</th></tr></thead><tbody>'+vocab+'</tbody></table>':'<p style="color:#999;font-size:12px">No vocabulary defined for this lesson.</p>'}
        </div>
        <div id="tab-materials" class="hidden">
          <p style="font-size:11px;color:#888;margin-bottom:8px">Shared tools come from the Common Pool. These are grade-specific consumables.</p>
          <ul class="mlist">${mats}</ul>
        </div>
        <div id="tab-diff" class="hidden">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
            <div class="dbox" style="background:#E0F5E4">
              <div class="dlbl" style="color:#1E8449">Support</div>
              <div>${diff.sup||'See lesson plan document.'}</div>
            </div>
            <div class="dbox" style="background:#FEF9E0">
              <div class="dlbl" style="color:#C9A227">Extension</div>
              <div>${diff.ext||'See lesson plan document.'}</div>
            </div>
          </div>
          <div class="assbox"><strong style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#1A3A5C;margin-bottom:4px">Assessment focus</strong>${ass}</div>
        </div>
        <div id="tab-video" class="hidden"></div>
        <div id="tab-notes" class="hidden">
          <div class="nbox">${note||'See lesson plan document for full facilitator notes.'}</div>
        </div>
      </div>
    </div>`;

  // Auto-open first phase
  togglePhase(0);
  // Populate video tab
  const vmap = VM[g.arr] || {};
  const vid = vmap[curWeek];
  const vtab = document.getElementById('tab-video');
  if(vtab) {
    if(vid) {
      vtab.innerHTML = '<div style="margin-bottom:10px">'
        + '<div style="font-size:11px;color:#888;margin-bottom:8px">Suggested reference video for Week ' + curWeek + '</div>'
        + '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:8px;border:1px solid #DEE2E6">'
        + '<iframe style="position:absolute;top:0;left:0;width:100%;height:100%"'
        + ' src="https://www.youtube.com/embed/' + vid.id + '?rel=0"'
        + ' title="' + vid.title.replace(/"/g,"'") + '"'
        + ' frameborder="0"'
        + ' allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"'
        + ' allowfullscreen></iframe>'
        + '</div>'
        + '<div style="margin-top:8px;font-size:12px;color:#555">' + vid.title + '</div>'
        + '<a href="https://www.youtube.com/watch?v=' + vid.id + '" target="_blank"'
        + ' style="font-size:11px;color:#1A5276;display:inline-block;margin-top:4px">'
        + 'Open on YouTube &#8599;</a>'
        + '</div>';
    } else {
      vtab.innerHTML = '<p style="color:#999;font-size:12px">No video suggested for this week.</p>';
    }
  }
}

function togglePhase(i) {
  const steps = document.getElementById('steps'+i);
  const chev = document.getElementById('chev'+i);
  if(!steps) return;
  const open = steps.classList.toggle('open');
  if(chev) chev.classList.toggle('open', open);
}

function switchTab(id, el) {
  ['phases','vocab','materials','diff','notes','video'].forEach(t => {
    const el2 = document.getElementById('tab-'+t);
    if(el2) el2.classList.toggle('hidden', t!==id);
  });
  document.querySelectorAll('.ltab').forEach(t=>t.classList.remove('on'));
  if(el) el.classList.add('on');
}

function selWeek(w) {
  curWeek = w;
  renderGrade();
}

function buildProcurement() {
  const grades = ['Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 11'];
  const cTotal = PROCUREMENT.common.reduce((s,r)=>s+r.uc*r.qty,0);
  const gTotals = grades.map(g=>{const items=PROCUREMENT.grades[g]||[];return items.reduce((s,r)=>s+r.c*r.q,0);});
  const gTotal = gTotals.reduce((a,b)=>a+b,0);

  const tabsHtml = ['Common Pool',...grades].map((lbl,i) =>
    `<div class="ptab ${i===0?'on':''}" onclick="showProcTab('${i===0?'common':lbl}',this)">${lbl}</div>`
  ).join('');

  document.getElementById('page-procurement').innerHTML = `
    <div class="stitle">Annual consumables procurement — 30 students per grade</div>
    <div class="sbar">
      <div class="si"><div class="sv">${INR(cTotal)}</div><div class="sl">Common Pool (Year 1)</div></div>
      <div class="si"><div class="sv">${INR(gTotal)}</div><div class="sl">Grade Consumables (all)</div></div>
      <div class="si"><div class="sv">${INR(cTotal+gTotal)}</div><div class="sl">Year 1 Total</div></div>
      <div class="si"><div class="sv">${INR(Math.round(gTotal*1.05))}</div><div class="sl">Year 2+ Annual</div></div>
    </div>
    <div class="ptabs">${tabsHtml}</div>
    <div id="proc-body"></div>`;

  showProcTab('common', document.querySelector('.ptab.on'));
}

function showProcTab(id, el) {
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('on'));
  if(el) el.classList.add('on');
  const body = document.getElementById('proc-body');
  if(id==='common') {
    const rows = PROCUREMENT.common.map((r,i) =>
      `<tr><td>${r.item}</td><td style="text-align:center">${r.unit}</td><td style="text-align:center">${INR(r.uc)}</td><td style="text-align:center">${r.qty}</td><td style="text-align:right" class="ptot">${INR(r.uc*r.qty)}</td><td style="color:#888;font-size:11px">${r.notes}</td></tr>`
    ).join('');
    const total = PROCUREMENT.common.reduce((s,r)=>s+r.uc*r.qty,0);
    body.innerHTML = `<p style="font-size:11px;color:#666;margin-bottom:10px">Purchased once for the school. Shared across all grades on a rotating schedule. Year 2+ these items are not repurchased.</p>
    <table class="ptable"><thead><tr><th>Item</th><th>Unit</th><th>Unit Cost</th><th>Qty</th><th style="text-align:right">Total</th><th>Grades Used</th></tr></thead>
    <tbody>${rows}<tr style="background:#EBF2FA"><td colspan="4" style="padding:7px 11px;font-weight:700">Common Pool Total</td><td style="padding:7px 11px;text-align:right;font-weight:700;color:#1A3A5C">${INR(total)}</td><td></td></tr></tbody></table>`;
  } else {
    const items = PROCUREMENT.grades[id]||[];
    const total = items.reduce((s,r)=>s+r.c*r.q,0);
    const rows = items.map(r =>
      `<tr class="${r.d?'dig':''}"><td>${r.i}${r.d?' <span style="font-size:10px;padding:1px 5px;background:#F2E0FF;color:#6C3483;border-radius:8px">digital</span>':''}</td><td style="text-align:center">${r.u}</td><td style="text-align:center">${INR(r.c)}</td><td style="text-align:center">${r.q}</td><td style="text-align:right" class="ptot">${INR(r.c*r.q)}</td></tr>`
    ).join('');
    body.innerHTML = `<p style="font-size:11px;color:#666;margin-bottom:10px">Annual consumables — repurchase each year. Purple rows = digital fabrication consumables. Quantities sized for group projects (1 project per group of 3–5).</p>
    <table class="ptable"><thead><tr><th>${id} Item</th><th>Unit</th><th>Unit Cost</th><th>Qty</th><th style="text-align:right">Total</th></tr></thead>
    <tbody>${rows}<tr style="background:#EBF2FA"><td colspan="4" style="padding:7px 11px;font-weight:700">${id} Annual Total</td><td style="padding:7px 11px;text-align:right;font-weight:700;color:#1A3A5C">${INR(total)}</td></tr></tbody></table>`;
  }
}

function buildCapex() {
  const total = PROCUREMENT.capex.reduce((s,r)=>s+r.cost*r.qty,0);
  const cards = PROCUREMENT.capex.map(r => `
    <div class="cxcard">
      <div><div class="cxname">${r.item}</div><div class="cxnote">${r.note}</div></div>
      <div style="text-align:right">
        <div class="cxprice">${INR(r.cost*r.qty)}</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Qty ${r.qty} × ${INR(r.cost)}</div>
      </div>
    </div>`).join('');
  document.getElementById('page-capex').innerHTML = `
    <div class="stitle">Capital equipment — one-time investment for new schools</div>
    <div style="background:#F2E0FF;border-radius:8px;padding:14px 18px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6C3483;font-weight:700">Total CAPEX</div>
        <div style="font-size:26px;font-weight:700;color:#6C3483">${INR(total)}</div>
        <div style="font-size:11px;color:#888;margin-top:2px">One-time purchase. Equipment life: 5–10 years.</div>
      </div>
    </div>
    ${cards}
    <div class="nbox" style="margin-top:14px">All prices estimated INR retail/wholesale Tamil Nadu 2024–25. Add 10–15% contingency. Bulk purchasing saves 15–25%.</div>`;
}

function showPage(page) {
  curPage = page;
  ['overview','curriculum','procurement','capex'].forEach(p => {
    document.getElementById('page-'+p).classList.toggle('hidden', p!==page);
  });
  document.querySelectorAll('.ntab').forEach((b,i) => {
    b.classList.toggle('on', ['overview','curriculum','procurement','capex'][i]===page);
  });
  document.getElementById('side').style.display = ['procurement','capex'].includes(page)?'none':'block';
  if(page==='procurement') buildProcurement();
  if(page==='capex') buildCapex();
}

buildGradeNav();
buildOverview();
</script>
</body>
</html>
