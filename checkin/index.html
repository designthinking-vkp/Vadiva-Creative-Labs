<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vadiva Tech Fest 3.0 — Check-In Operator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#071921">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <!-- QR Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #071921;
      --card-bg: #0c2b38;
      --card-border: rgba(12, 184, 192, 0.25);
      --teal: #0cb8c0;
      --teal-glow: rgba(12, 184, 192, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #ef4444;
      --gold: #f59e0b;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 12px 12px 60px;
    }

    .app-container {
      max-width: 580px;
      margin: 0 auto;
    }

    /* Header & Network Banner */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 4px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 14px;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }
    .brand-title span { color: var(--teal); }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .status-badge.online { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.4); }
    .status-badge.offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.4); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    /* Controls & Checkpoint Selector */
    .control-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 10px;
    }
    .form-group:last-child { margin-bottom: 0; }
    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .form-select, .form-input {
      width: 100%;
      background: rgba(7, 25, 33, 0.85);
      border: 1.5px solid rgba(12, 184, 192, 0.35);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-family: inherit;
    }
    .form-select:focus, .form-input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 10px var(--teal-glow);
    }

    /* Scanner Viewport */
    .scanner-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      position: relative;
      margin-bottom: 14px;
    }
    #reader {
      width: 100%;
      min-height: 280px;
      background: #000;
    }
    .scanner-controls {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(12, 43, 56, 0.95);
      justify-content: space-between;
      align-items: center;
    }
    .btn-action {
      background: var(--teal);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-action.secondary {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
    }

    /* Manual Token Fallback */
    .manual-scan-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    /* Sync Queue Pill */
    .sync-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 14px;
    }

    /* Result Card Styles */
    .result-card {
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      animation: popIn 0.25s ease-out;
      border: 1.5px solid transparent;
    }
    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 1. VERIFIED */
    .result-card.verified {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.6);
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .result-status-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .verified .result-status-title { color: #34d399; }
    
    /* 2. NOT BOOKED */
    .result-card.not-booked {
      background: rgba(239, 68, 68, 0.16);
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    .not-booked .result-status-title { color: #f87171; }

    /* 3. DUPLICATE SILENT */
    .result-card.duplicate {
      background: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
    }
    .duplicate .result-status-title { color: #60a5fa; }

    /* Participant Info Block */
    .participant-profile {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .p-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--teal);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .p-info h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      margin-bottom: 2px;
      color: #fff;
    }
    .p-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    /* Pass Journey Badge */
    .pass-tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pass-tag.GOLD { background: #d97706; color: #fff; }
    .pass-tag.RED { background: #dc2626; color: #fff; }
    .pass-tag.BLUE { background: #2563eb; color: #fff; }
    .pass-tag.GREEN { background: #059669; color: #fff; }

    /* Redirection Schedule Box (I-8) */
    .redirection-box {
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
    }
    .redirection-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #fca5a5;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .schedule-item-mini {
      background: rgba(255,255,255,0.06);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }
    .schedule-item-mini:last-child { margin-bottom: 0; }
    .schedule-item-mini strong { color: #38bdf8; }

    /* Scan History Drawer */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
    }
    .history-card h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .history-list {
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.78rem;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Bar -->
    <header class="app-header">
      <div class="brand-title">VADIVA <span>CHECK-IN</span></div>
      <div id="network-status" class="status-badge online">
        <div class="status-dot"></div>
        <span id="network-text">ONLINE</span>
      </div>
    </header>

    <!-- Offline Queue Sync Bar -->
    <div id="sync-bar" class="sync-bar" style="display: none;">
      <span>Offline Queue: <strong id="queue-count">0</strong> scans pending</span>
      <button class="btn-action" style="padding: 4px 10px; font-size: 0.75rem;" onclick="syncOfflineQueue()">Sync Now</button>
    </div>

    <!-- Checkpoint & Operator Configuration -->
    <div class="control-card">
      <div class="form-group">
        <label class="form-label" for="checkpoint-type">Scanning Checkpoint</label>
        <select id="checkpoint-type" class="form-select" onchange="onCheckpointChange()">
          <option value="GATE">🚪 Main Gate Entry</option>
          <option value="ZONE">📍 Zone Entry</option>
          <option value="WORKSHOP">🛠️ Workshop Door</option>
          <option value="THEATRE">🎭 Theatre Door</option>
          <option value="COMPETITION">🏆 Competition Marshalling</option>
        </select>
      </div>

      <div class="form-group" id="session-select-group" style="display: none;">
        <label class="form-label" for="session-target">Target Door / Session</label>
        <select id="session-target" class="form-select"></select>
      </div>

      <div class="form-group">
        <label class="form-label" for="operator-name">Operator / Marshal Name</label>
        <input type="text" id="operator-name" class="form-input" placeholder="Marshal 01" value="Gate Marshal 01">
      </div>
    </div>

    <!-- Live QR Camera Scanner Card -->
    <div class="scanner-card">
      <div id="reader"></div>
      <div class="scanner-controls">
        <span style="font-size: 0.8rem; color: #94a3b8;" id="camera-state-text">Camera Active</span>
        <button id="btn-toggle-cam" class="btn-action secondary" onclick="toggleCamera()">Pause Camera</button>
      </div>
    </div>

    <!-- Manual Token Search Fallback -->
    <div class="manual-scan-box">
      <input type="text" id="manual-token" class="form-input" placeholder="Enter Token / Participant ID..." onkeypress="if(event.key==='Enter')handleManualSubmit()">
      <button class="btn-action" onclick="handleManualSubmit()">Verify</button>
    </div>

    <!-- Scan Resolution Feedback Container -->
    <div id="result-container"></div>

    <!-- Live Scan Log History -->
    <div class="history-card">
      <h4>Recent Scans (Session Log)</h4>
      <div id="history-list" class="history-list">
        <div style="color: #64748b; text-align: center; padding: 10px;">No scans recorded yet.</div>
      </div>
    </div>
  </div>

  <script>
    const API_SCAN = '../techfest-api/checkin.php';
    let html5QrCode = null;
    let isCameraRunning = false;
    let lastScanTime = 0;
    let lastScannedToken = '';

    // Register Service Worker for 100% Offline Capability (I-7)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => {
        console.log('TechFest Checkin Service Worker Registered.');
      }).catch(err => console.warn('SW error:', err));
    }

    // Audio Feedback Synthesizers (Web Audio API)
    function playBeep(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(880, ctx.currentTime); // A5
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'duplicate') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'warning' || type === 'not-booked') {
          osc.frequency.setValueAtTime(330, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start();
          osc.frequency.setValueAtTime(220, ctx.currentTime + 0.15);
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {}
    }

    // Checkpoint catalog data
    const CHECKPOINT_OPTIONS = {
      GATE: [{ id: 'gate_main', name: 'Main Gate Entrance' }],
      ZONE: [
        { id: 'zone_maker', name: 'Zone A — Makerspace & Fabrication' },
        { id: 'zone_space', name: 'Zone B — Aerospace & Drone Arena' },
        { id: 'zone_ai', name: 'Zone C — AI & Immersive Tech' }
      ],
      WORKSHOP: [
        { id: '1', name: 'Door 1: WS-ROCKET Rocket Lab' },
        { id: '2', name: 'Door 2: WS-SATELLITE Satellite Makers' },
        { id: '3', name: 'Door 3: WS-DRONE Drone Pilot Academy' },
        { id: '4', name: 'Door 4: WS-AEROFORGE Aeroforge' },
        { id: '5', name: 'Door 5: WS-ARVR AR/VR Experience Lab' },
        { id: '6', name: 'Door 6: WS-AI AI Inventors Lab' },
        { id: '7', name: 'Door 7: WS-GAMEFORGE Game Forge' },
        { id: '8', name: 'Door 8: WS-3DMAKERS 3D Makers Lab' },
        { id: '9', name: 'Door 9: WS-ARDUINO Arduino Inventors' },
        { id: '10', name: 'Door 10: WS-ANIMATION Animation Lab' }
      ],
      THEATRE: [
        { id: '11', name: 'Theatre Alpha: Design Thinking' },
        { id: '12', name: 'Theatre Beta: Visual Sketching' },
        { id: '13', name: 'Theatre Alpha: Pitching & Speaking' },
        { id: '14', name: 'Main Stage: Science Demonstrations' },
        { id: '15', name: 'Theatre Beta: Entrepreneurship' }
      ],
      COMPETITION: [
        { id: 'comp_1', name: 'Marshalling Gate 1: Junior Innovators Hackathon' },
        { id: 'comp_2', name: 'Marshalling Gate 2: RoboSprint Challenge' },
        { id: 'comp_3', name: 'Marshalling Gate 3: Aeromodelling Glider Flight' }
      ]
    };

    function onCheckpointChange() {
      const type = document.getElementById('checkpoint-type').value;
      const grp = document.getElementById('session-select-group');
      const sel = document.getElementById('session-target');

      const opts = CHECKPOINT_OPTIONS[type] || [];
      if (type === 'GATE') {
        grp.style.display = 'none';
      } else {
        grp.style.display = 'block';
        sel.innerHTML = opts.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
      }
    }

    // Network & Queue Management (I-7)
    function updateNetworkStatus() {
      const isOnline = navigator.onLine;
      const badge = document.getElementById('network-status');
      const text = document.getElementById('network-text');

      if (isOnline) {
        badge.className = 'status-badge online';
        text.innerText = 'ONLINE';
        syncOfflineQueue();
      } else {
        badge.className = 'status-badge offline';
        text.innerText = 'OFFLINE (LOCAL QUEUE)';
      }
      updateQueueUI();
    }

    function getLocalQueue() {
      try {
        return JSON.parse(localStorage.getItem('tf_offline_scan_queue') || '[]');
      } catch (e) {
        return [];
      }
    }

    function setLocalQueue(q) {
      localStorage.setItem('tf_offline_scan_queue', JSON.stringify(q));
      updateQueueUI();
    }

    function updateQueueUI() {
      const q = getLocalQueue();
      const bar = document.getElementById('sync-bar');
      const cnt = document.getElementById('queue-count');
      if (q.length > 0) {
        bar.style.display = 'flex';
        cnt.innerText = q.length;
      } else {
        bar.style.display = 'none';
      }
    }

    async function syncOfflineQueue() {
      if (!navigator.onLine) return;
      const q = getLocalQueue();
      if (q.length === 0) return;

      try {
        const res = await fetch(`${API_SCAN}?action=batch_sync`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ scans: q })
        });
        const data = await res.json();
        if (data.success) {
          setLocalQueue([]); // Cleared upon successful batch sync
          console.log('Offline queue synced successfully:', data);
        }
      } catch (e) {
        console.warn('Sync failed, will retry later:', e);
      }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    // Scan Handling & Result Rendering (I-3, I-6, I-8)
    async function processScan(token) {
      const now = Date.now();
      // Client-side debounce check (2 seconds ignore for rapid duplicate camera frame triggers)
      if (token === lastScannedToken && (now - lastScanTime < 2000)) {
        return;
      }
      lastScanTime = now;
      lastScannedToken = token;

      const checkpointType = document.getElementById('checkpoint-type').value;
      const sessionSelect = document.getElementById('session-target');
      const sessionId = (checkpointType !== 'GATE' && sessionSelect) ? sessionSelect.value : '';
      const checkpointName = (checkpointType !== 'GATE' && sessionSelect) ? sessionSelect.options[sessionSelect.selectedIndex]?.text : 'Main Gate Entry';
      const operatorName = document.getElementById('operator-name').value || 'Marshal';

      const scanPayload = {
        qr_token: token,
        checkpoint_type: checkpointType,
        checkpoint_name: checkpointName,
        session_id: sessionId,
        operator_name: operatorName,
        device_timestamp: now
      };

      if (!navigator.onLine) {
        // Store in Offline Queue (I-7)
        const q = getLocalQueue();
        q.push(scanPayload);
        setLocalQueue(q);
        playBeep('success');
        renderResultCard({
          status: 'OFFLINE_SAVED',
          message: 'Saved to Offline Queue (Will auto-sync)',
          is_booked: true,
          participant: {
            name: 'Offline Participant',
            participant_id: token.slice(0, 16),
            school: 'Sync pending upon Wi-Fi reconnect',
            band: 'VERIFIED',
            pass_colour: 'GREEN',
            pass_colour_text: 'Explorer'
          }
        });
        logHistory(token, 'OFFLINE_SAVED', 'Stored locally');
        return;
      }

      try {
        const res = await fetch(`${API_SCAN}?action=scan`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(scanPayload)
        });
        const result = await res.json();

        if (result.success && result.data) {
          const d = result.data;
          if (d.status === 'VERIFIED') {
            playBeep('success');
          } else if (d.status === 'DUPLICATE_IGNORED') {
            playBeep('duplicate');
          } else if (d.status === 'NOT_BOOKED') {
            playBeep('not-booked');
          }
          renderResultCard(d);
          logHistory(token, d.status, d.participant?.name || token);
        } else {
          playBeep('warning');
          renderResultCard({
            status: 'INVALID_TOKEN',
            message: result.message || 'Verification Failed',
            participant: null
          });
          logHistory(token, 'DENIED', 'Invalid Token');
        }
      } catch (err) {
        console.warn('Network scan error, queueing offline:', err);
        const q = getLocalQueue();
        q.push(scanPayload);
        setLocalQueue(q);
        playBeep('success');
        renderResultCard({
          status: 'OFFLINE_SAVED',
          message: 'Network drop — Saved to Offline Queue',
          is_booked: true,
          participant: {
            name: 'Queued Offline',
            participant_id: token.slice(0, 16),
            school: 'Will sync when connection restores',
            band: 'RECORDED',
            pass_colour: 'GREEN',
            pass_colour_text: 'Explorer'
          }
        });
      }
    }

    function renderResultCard(data) {
      const container = document.getElementById('result-container');
      const p = data.participant;

      let cardClass = 'verified';
      let icon = '✅';
      let heading = 'ACCESS GRANTED — VERIFIED';

      if (data.status === 'NOT_BOOKED') {
        cardClass = 'not-booked';
        icon = '⚠️';
        heading = 'NOT BOOKED FOR THIS SESSION';
      } else if (data.status === 'DUPLICATE_IGNORED' || data.is_duplicate) {
        cardClass = 'duplicate';
        icon = 'ℹ️';
        heading = 'ALREADY CHECKED IN (< 60s AGO)';
      } else if (data.status === 'INVALID_TOKEN' || data.status === 'UNPAID_ENTRY') {
        cardClass = 'not-booked';
        icon = '❌';
        heading = data.message || 'ACCESS DENIED';
      }

      if (!p) {
        container.innerHTML = `
          <div class="result-card not-booked">
            <div class="result-header">
              <div class="result-status-title">${icon} ${heading}</div>
            </div>
            <p style="font-size:0.85rem; color:#fca5a5;">${data.message || 'Unrecognized QR token. Send participant to Helpdesk.'}</p>
          </div>
        `;
        return;
      }

      const initials = (p.name || 'U').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      const passTag = p.pass_colour || 'GREEN';
      const passText = p.pass_colour_text || 'Explorer';

      // Redirection schedule HTML (I-8)
      let redirectHtml = '';
      if (data.status === 'NOT_BOOKED') {
        const todaySessions = data.today_schedule || (p.today_schedule || []);
        redirectHtml = `
          <div class="redirection-box">
            <div class="redirection-title">🧭 Marshal Redirection: Participant's Actual Schedule</div>
            ${todaySessions.length > 0 ? todaySessions.map(s => `
              <div class="schedule-item-mini">
                <strong>${s.title}</strong><br>
                <span>Time: ${s.time} &middot; Venue: ${s.venue}</span>
              </div>
            `).join('') : '<p style="font-size:0.75rem; color:#94a3b8;">No workshops booked for today. General festival pass only.</p>'}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="result-card ${cardClass}">
          <div class="result-header">
            <div class="result-status-title">${icon} ${heading}</div>
            <span class="pass-tag ${passTag}">${passText} PASS</span>
          </div>

          <div class="participant-profile">
            <div class="p-avatar">${initials}</div>
            <div class="p-info">
              <h3>${p.name}</h3>
              <div class="p-id">${p.participant_id} &middot; ${p.school}</div>
              <div style="font-size:0.75rem; color:#67e8f9; font-weight:700; margin-top:2px;">${p.band} BAND</div>
            </div>
          </div>

          <p style="font-size:0.8rem; color:${data.status === 'NOT_BOOKED' ? '#fca5a5' : '#94a3b8'}; margin:0;">
            ${data.message || ''}
          </p>

          ${redirectHtml}
        </div>
      `;
    }

    function logHistory(token, status, title) {
      const list = document.getElementById('history-list');
      const timeStr = new Date().toLocaleTimeString();
      let badgeColor = '#34d399';
      if (status === 'NOT_BOOKED') badgeColor = '#f87171';
      else if (status === 'DUPLICATE_IGNORED') badgeColor = '#60a5fa';

      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <span><strong style="color:${badgeColor}">${status}</strong>: ${title}</span>
        <span style="color:#64748b; font-family:monospace;">${timeStr}</span>
      `;
      if (list.children[0] && list.children[0].innerText.includes('No scans')) {
        list.innerHTML = '';
      }
      list.prepend(row);
    }

    function handleManualSubmit() {
      const input = document.getElementById('manual-token');
      const val = input.value.trim();
      if (!val) return;
      processScan(val);
      input.value = '';
    }

    // Camera Lifecycle
    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          processScan(decodedText);
        },
        (errorMessage) => {}
      ).then(() => {
        isCameraRunning = true;
        document.getElementById('camera-state-text').innerText = 'Camera Active (Scanning)';
        document.getElementById('btn-toggle-cam').innerText = 'Pause Camera';
      }).catch(err => {
        console.warn('Camera failed to start:', err);
        document.getElementById('camera-state-text').innerText = 'Camera Unavailable (Use Manual Input)';
        document.getElementById('btn-toggle-cam').style.display = 'none';
      });
    }

    function toggleCamera() {
      if (!html5QrCode) return;
      if (isCameraRunning) {
        html5QrCode.stop().then(() => {
          isCameraRunning = false;
          document.getElementById('camera-state-text').innerText = 'Camera Paused';
          document.getElementById('btn-toggle-cam').innerText = 'Resume Camera';
        });
      } else {
        startCamera();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      onCheckpointChange();
      updateNetworkStatus();
      startCamera();
    });
  </script>
</body>
</html>
